  /* ----------------------------------------------------------
     Bagikan rekap (hanya membaca data, tidak mengubah apa pun)
     ---------------------------------------------------------- */
  function dataRekap(rows, st, judulPeriode){
    var hari = [];
    rows.slice().reverse().forEach(function(x){
      if(x.libur) hari.push({ tgl: x.Tanggal, libur: true, ket: x.alasan });
      else if(x.adaData) hari.push({
        tgl: x.Tanggal, omzet: Number(x.TotalOmzet) || 0,
        laba: x.lengkap === false ? null : (Number(x.LabaBersih) || 0), draft: x.final === false
      });
    });
    return {
      toko: ($('topbarTitle') && $('topbarTitle').textContent) || 'H. Mawih Sayur',
      periode: judulPeriode, st: st, hari: hari
    };
  }
  function teksRekap(r, denganRincian){
    function angka(n){ return (n < 0 ? '−' : '') + 'Rp ' + Math.abs(Math.round(n || 0)).toLocaleString('id-ID'); }
    var L = ['*Rekap Laba · ' + r.periode + '*', r.toko, ''];
    L.push('Total laba : ' + angka(r.st.laba));
    L.push('Omzet      : ' + angka(r.st.omzet));
    L.push('Hari tutup : ' + r.st.hariTutup + (r.st.draft ? ' (+' + r.st.draft + ' draft)' : ''));
    if(r.st.libur) L.push('Hari libur : ' + r.st.libur);
    if(r.st.kosong) L.push('Belum dicatat : ' + r.st.kosong + ' hari');
    if(r.st.belumLengkap) L.push('Belum lengkap : ' + r.st.belumLengkap + ' hari (tidak dihitung)');
    if(denganRincian && r.hari.length){
      L.push('', 'Rincian harian:');
      r.hari.forEach(function(h){
        var tg = new Date(h.tgl.slice(0,4), Number(h.tgl.slice(5,7)) - 1, Number(h.tgl.slice(8,10)))
          .toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
        if(h.libur) L.push('• ' + tg + ' — libur (' + h.ket + ')');
        else L.push('• ' + tg + ' — omzet ' + angka(h.omzet) + ', laba ' + (h.laba == null ? 'belum lengkap' : angka(h.laba)) + (h.draft ? ' (draft)' : ''));
      });
    } else if(!denganRincian){
      L.push('', 'Pilih satu bulan untuk melihat rincian harian.');
    }
    return L.join('\n');
  }
  function bukaRekap(rows, st, judulPeriode){
    var r = dataRekap(rows, st, judulPeriode);
    var rincian = App.filterBulan !== 'all';
    var teks = teksRekap(r, rincian);
    var ov = Shared.sheet('rekapSheet',
      '<div class="sheet-head"><h2 id="rekapSheetT">Bagikan Rekap</h2><p class="sheet-sub">' + escHtml(judulPeriode) + '</p></div>' +
      '<div class="sheet-body"><div class="rekap-preview"></div></div>' +
      '<div class="sheet-actions">' +
        '<button type="button" class="btn btn-primary" id="rkShare">Bagikan</button>' +
        '<div class="btn-row">' +

  function dataHari(x){
    var bi = x.biaya || {};
    var lengkap = x.lengkap !== false;
    return {
      toko: ($('topbarTitle') && $('topbarTitle').textContent) || 'H. Mawih Sayur',
      tanggal: x.Tanggal,
      tanggalText: fmtTglPanjang(x.Tanggal),
      final: x.final !== false,
      lengkap: lengkap,
      omzet: Number(x.TotalOmzet) || 0,
      cash: Number(x.OmzetCash) || 0,
      qris: Number(x.OmzetQris) || 0,
      laba: Number(x.LabaBersih) || 0,
      bon: Number(x.bon) || 0,
      biaya: {
        modal: Number(bi.modal) || 0,
        opsPasar: Number(bi.opsPasar) || 0,
        bensin: Number(bi.bensin) || 0,
        lainBelanja: Number(bi.lainBelanja) || 0,
        biayaUsaha: Number(bi.biayaUsaha) || 0,
        pagi: Number(bi.pagi) || 0
      }
    };
  }
  function teksHari(h){
    function angka(n){ return (n < 0 ? '−' : '') + 'Rp ' + Math.abs(Math.round(n || 0)).toLocaleString('id-ID'); }
    var L = ['*Laporan Harian*', h.tanggalText, h.toko, ''];
    L.push('Omzet   : ' + angka(h.omzet));
    L.push('  Tunai : ' + angka(h.cash));
    L.push('  QRIS  : ' + angka(h.qris));
    if(h.lengkap){
      L.push('', 'Biaya:');
      L.push('  Modal belanja    : ' + angka(h.biaya.modal));
      L.push('  Operasional      : ' + angka(h.biaya.opsPasar));
      L.push('  Bensin           : ' + angka(h.biaya.bensin));
      L.push('  Lain-lain        : ' + angka(h.biaya.lainBelanja));
      if(h.biaya.biayaUsaha) L.push('  Biaya usaha lain : ' + angka(h.biaya.biayaUsaha));
      L.push('', 'Laba bersih : ' + angka(h.laba));
    } else {
      L.push('', 'Biaya belanja hari ini belum lengkap, laba tidak dihitung.');
    }
    if(h.biaya.pagi) L.push('', 'Pengeluaran pagi : ' + angka(h.biaya.pagi));
    if(h.bon) L.push('Bon pelanggan    : ' + angka(h.bon));
    if(!h.final) L.push('', '(draft, belum tersimpan ke database)');
    return L.join('\n');
  }

    if(mutBusy) return;
    var jml = digits($('mutJml').value);

    var sal = hitungSaldo();
    var saldo = mutMetode === 'QRIS' ? sal.qris : sal.cash;
    if(mutAksi === 'Tarik' && jml > saldo){
      if(!confirm('Saldo ' + mutMetode + ' hanya ' + rp(saldo) + '. Tetap catat tarik ' + rp(jml) + '?')) return;
    }
    var rec = {
      ID: newId('m'),

      Jumlah: jml,
      Tujuan: $('mutTujuan').value,

      Sumber: 'Manual',
      _belumTerkirim: true, _coba: 0, _at: Date.now()
    };
    mutBusy = true;
    this.disabled = true;
    /* 1) simpan di HP lebih dulu supaya tidak hilang bila koneksi putus */
    var p = pendingRead(); p.mutasi.push(rec); pendingWrite(p);
    App.mutasi.unshift(rec);
    tutupSheet(mutSheet);
    renderSaldo();

    var ok = await kirimServer(API.addMutasi, payloadMutasi(rec));

    pendingWrite(p2);
    rec._belumTerkirim = !ok;
    toast(ok ? mutAksi + ' ' + rp(jml) + ' tersimpan di server'
             : mutAksi + ' ' + rp(jml) + ' disimpan di HP, dikirim saat online');

  async function catatBayarHutang(h, isPiutang, btn){
    if(htBusy) return;
    var jml = digits($('htJml').value);
    var sisa = Number(h.Sisa) || 0;
    if(jml <= 0){ toast('Isi jumlah'); return; }
    if(jml > sisa){ toast('Melebihi sisa ' + rp(sisa)); return; }
    htBusy = true; btn.disabled = true;

    var bayar = {
      id: newId('ph'), hutangId: h.ID, jumlah: jml,
      metode: $('htMetode').value || 'Cash', tanggal: todayYmd(), catatan: '',
      targetDibayar: (Number(h.JumlahDibayar) || 0) + jml,
      _belumTerkirim: true, _coba: 0, _at: Date.now()
    };
    /* 1) simpan di HP lebih dulu */
    var p = pendingRead(); p.bayar.push(bayar); pendingWrite(p);
    h.JumlahDibayar = bayar.targetDibayar;
    hitungStatusHutang(h);
    h._pending = true;
    tutupSheet(htSheet);
    renderHutang();

    /* 2) kirim ke server */
    var ok = await kirimServer(API.bayarHutang, payloadBayar(bayar));
    var p2 = pendingRead();
    p2.bayar.forEach(function(x){ if(x.id === bayar.id) x._belumTerkirim = !ok; });
    pendingWrite(p2);
    toast(ok ? (isPiutang ? 'Penerimaan ' : 'Pembayaran ') + rp(jml) + ' tersimpan di server'
             : 'Disimpan di HP, dikirim saat online');
    htBusy = false;

    /* 3) muat ulang: server juga mencatat mutasi saldo dari pembayaran ini */
    if(ok){ await Promise.all([muatHutang(), muatMutasi()]); }
    renderHutang();
    if(App.tab === 'saldo') renderSaldo();
    try{ window.dispatchEvent(new Event('sayur:sync')); }catch(e){}
  }

     ========================================================== */
  var keypad = $('keypad');
  var kpEl = null, kpWrap = null, kpFresh = false;

  function kpActivate(el, wrap){
    if(kpEl && kpEl !== el){
      if(kpWrap) kpWrap.classList.remove('kp-on');
      kpEl.classList.remove('kp-fresh');
    }
    kpEl = el; kpWrap = wrap; kpFresh = true;
    if(wrap) wrap.classList.add('kp-on');
    $('kpName').textContent = 'Jumlah';
    $('kpField').textContent = 'Nominal';
    keypad.classList.add('show');
    keypad.setAttribute('aria-hidden', 'false');
    document.body.classList.add('kp-open');
    kpSync();
  }
  function kpClose(){
    if(kpEl){
      if(kpWrap) kpWrap.classList.remove('kp-on');
      kpEl.classList.remove('kp-fresh');
    }
    kpEl = null; kpWrap = null;
    keypad.classList.remove('show');
    keypad.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('kp-open');
  }
  function kpSync(){
    if(!kpEl) return;
    kpEl.classList.toggle('kp-fresh', kpFresh && kpEl.value !== '');
  }
  function kpPress(k){
    if(!kpEl) return;
    if(k === 'next'){ kpClose(); return; }
    var raw = String(digits(kpEl.value) || '');
    if(kpFresh) raw = '';
    if(k === 'back' || k === 'back2'){ raw = kpFresh ? '' : raw.slice(0, -1); }
    else {
      if(raw === '' && /^0+$/.test(k)) return;
      if((raw + k).length > 10) return;
      raw = raw + k;
    }
    kpFresh = false;
    kpEl.value = raw ? Number(raw).toLocaleString('id-ID') : '';
    kpSync();
  }
  keypad.addEventListener('click', function(e){
    var b = e.target.closest('[data-k]');
    if(b) kpPress(b.getAttribute('data-k'));
  });
  $('kpClose').addEventListener('click', kpClose);
  document.addEventListener('click', function(e){
    if(!kpEl) return;
    if(keypad.contains(e.target)) return;
    if(e.target === kpEl) return;
    kpClose();
  });

  var mutWrap = $('mutWrap');
  if(mutWrap){
    mutWrap.addEventListener('click', function(){
      kpActivate($('mutJml'), mutWrap);
    });
  }

    lockScroll();

    if(ov._ret && ov._ret.focus){
      try{ ov._ret.focus({preventScroll: true}); }catch(e){}
    }
  }

    var ov = e.target.closest ? e.target.closest('.sheet-ov') : null;

    if(e.target === ov || e.target.closest('[data-close]')) tutupSheet(ov);
  });

  var segarBusy = false;

    else if(App.tab === 'hutang') renderHutang();
    else if(App.tab === 'riwayat') renderRiwayat();

  function pakaiCache(){
    var cm = cacheRead(MUTASI_CACHE_KEY), ch = cacheRead(HUTANG_CACHE_KEY);
    App.mutasi = gabungMutasi(cm || [], false);
    App.src.mutasi = cm ? 'cache' : 'kosong';
    App.hutang = gabungHutang(ch || [], false);
    App.src.hutang = ch ? 'cache' : 'kosong';
    App.riwayatSrv = readJSON(RIWAYAT_SRV_KEY) || null;
    App.riwayat = bacaRiwayat();
    var adaIsi = App.riwayat.some(function(x){ return x.adaData || x.libur; });
    App.src.riwayat = (App.riwayatSrv || adaIsi) ? 'cache' : 'kosong';
  }
  async function segarkan(){
    if(segarBusy) return;
    segarBusy = true;
    try{
      App.memuat.mutasi = true; App.memuat.hutang = true; App.memuat.riwayat = true;
      renderAktif();
      try{ await kirimUlangPending(); }catch(e){}
      await Promise.all([muatMutasi(), muatHutang(), muatRiwayat()]);
    }catch(e){
      console.error('[laporan] segarkan', e);
      App.memuat.mutasi = false; App.memuat.hutang = false; App.memuat.riwayat = false;
    }
    segarBusy = false;
    renderAktif();
  }

  /* ==========================================================

     ========================================================== */
  function init(){
    try{
      $('topbarDate').textContent = new Date().toLocaleDateString('id-ID',
        {weekday: 'long', day: 'numeric', month: 'long'});
    }catch(e){}

    SayurStorage.pengaturan.get().then(function(set){
      if(set && set.NamaLapak) $('topbarTitle').textContent = set.NamaLapak;
    }).catch(function(){});

    applyDarkMode(document.documentElement.classList.contains('dark'), false);
    updateStatus();

    /* Tampilkan salinan terakhir di HP dulu (cepat), lalu ambil yang terbaru dari server */
    pakaiCache();
    setTab(Router.tabParam());
    segarkan();

    window.addEventListener('online', function(){ updateStatus(); segarkan(); });
    window.addEventListener('offline', updateStatus);
    /* antrean SyncUI selesai mengirim -> data server sudah berubah */
    window.addEventListener('sayur:sync', function(){ segarkan(); });
    /* kembali dari bfcache */
    window.addEventListener('pageshow', function(e){ if(e.persisted) segarkan(); });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

}};
</script>
</body>
</html>
