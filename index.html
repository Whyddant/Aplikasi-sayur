<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayur App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#1B2E1C; --green-700:#2F5233; --green-500:#4A7A4E; --green-100:#E4EBDD;
  --rust-600:#BF4E30; --rust-700:#973B24;
  --paper:#F6F5EF; --card:#FFFEFB;
  --ink-900:#1F2019; --ink-700:#3F4038; --ink-600:#5B5C50; --ink-400:#8A8B7E;
  --line:#E5E2D6; --line-soft:#EFEDE2;
  --fs-xs:11px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:28px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;
  --shadow-sm:0 1px 2px rgba(31,32,25,.04);
  --shadow-md:0 2px 8px rgba(31,32,25,.06);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--paper); color:var(--ink-900);
  font-family:'Work Sans',sans-serif; font-size:var(--fs-md); line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);
  min-height:100vh;
}
h1,h2,h3{font-family:'Zilla Slab',serif; margin:0; font-weight:700; letter-spacing:-.2px;}

/* ---------- Topbar ---------- */
.topbar{
  padding:14px 18px 12px; background:var(--green-700); color:#fff;
  display:flex; align-items:baseline; justify-content:space-between;
  position:sticky; top:0; z-index:5;
}
.topbar h1{font-size:var(--fs-lg);}
.topbar span{font-size:var(--fs-xs); color:#D9E3CE;}

/* ---------- Screens ---------- */
.screen{display:none; padding:16px 16px 96px; max-width:480px; margin:0 auto;}
.screen.active{display:block;}

.section-head{
  display:flex; justify-content:space-between; align-items:baseline;
  margin:0 0 10px;
}
.section-head h2{font-size:var(--fs-lg);}
.section-head .date{font-size:var(--fs-xs); color:var(--ink-600);}

/* ---------- Cards & Hero ---------- */
.hero{
  background:linear-gradient(150deg, var(--green-700), var(--green-900));
  color:#fff; border-radius:var(--r-lg); padding:20px 20px 18px;
  box-shadow:var(--shadow-md); margin-bottom:14px;
}
.hero.neg{background:linear-gradient(150deg, var(--rust-600), var(--rust-700));}
.hero .k{
  font-size:var(--fs-xs); letter-spacing:1.6px; text-transform:uppercase;
  opacity:.72; font-weight:600;
}
.hero .v{
  font-family:'Zilla Slab',serif; font-size:var(--fs-xl); font-weight:700;
  letter-spacing:-.6px; margin-top:4px;
}

.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
.stat{
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-md); padding:11px 12px 10px;
}
.stat .k{font-size:var(--fs-xs); color:var(--ink-600); line-height:1.25;}
.stat .v{font-family:'Zilla Slab',serif; font-size:15px; font-weight:600; margin-top:3px;}

/* ---------- Fields ---------- */
.field{margin-bottom:12px;}
.field label{
  font-size:var(--fs-xs); color:var(--ink-600); display:block;
  margin-bottom:5px; font-weight:500;
}
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:var(--r-sm);
  font-family:'Work Sans',sans-serif; font-size:var(--fs-md); background:var(--card);
  color:var(--ink-900); transition:border-color .15s;
}
.field select{
  appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%235B5C50' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center; background-size:11px 8px;
  padding-right:34px;
}
.field input:focus, .field select:focus{
  outline:none; border-color:var(--green-700); box-shadow:0 0 0 3px rgba(47,82,51,.12);
}

/* ---------- Buttons ---------- */
.btn{
  width:100%; padding:13px; border:none; border-radius:var(--r-sm);
  background:var(--rust-600); color:#fff;
  font:600 var(--fs-md) 'Work Sans',sans-serif;
  cursor:pointer; transition:background .12s;
}
.btn:active{background:var(--rust-700);}
.btn.secondary{background:var(--green-700);}
.btn.secondary:active{background:var(--green-900);}
.btn-ghost{
  background:none; border:1px solid var(--line); color:var(--green-700);
  padding:9px 16px; border-radius:var(--r-full);
  font:600 var(--fs-sm) 'Work Sans',sans-serif; cursor:pointer;
}
.btn-ghost:active{background:var(--green-100);}

.btn-share{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--green-100); color:var(--green-700);
  padding:9px 13px; border:none; border-radius:var(--r-full);
  font:600 12.5px 'Work Sans',sans-serif; cursor:pointer;
}
.btn-share:active{background:#d5e0ca;}
.btn-share svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2;}

.share-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}

/* ---------- Segmented toggle ---------- */
.segmented{
  display:flex; background:var(--green-100); border-radius:var(--r-full);
  padding:3px; margin-bottom:16px;
}
.seg-btn{
  flex:1; padding:9px 12px; border:none; background:none;
  font:600 var(--fs-sm) 'Work Sans',sans-serif; color:var(--ink-600);
  border-radius:var(--r-full); cursor:pointer; transition:all .15s;
}
.seg-btn.active{background:var(--card); color:var(--green-700); box-shadow:var(--shadow-sm);}

/* ---------- Ledger items ---------- */
.ledger-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line-soft);
}
.ledger-item:last-child{border-bottom:none;}
.ledger-item .name{font-size:var(--fs-md); font-weight:500; color:var(--ink-900);}
.ledger-item .sub{font-size:var(--fs-xs); color:var(--ink-600); margin-top:2px;}
.ledger-item .amt{
  font-family:'Zilla Slab',serif; font-weight:600; font-size:15px;
  color:var(--ink-900);
}
.ledger-item .del{
  background:none; border:none; color:var(--rust-600); font-size:var(--fs-xs);
  margin-left:12px; padding:6px 8px; cursor:pointer; font-weight:600;
}

/* ---------- Catatan mode ---------- */
.catatan-list{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden;}
.catatan-item{
  padding:14px 16px; border-bottom:1px solid var(--line-soft);
}
.catatan-item:last-child{border-bottom:none;}
.catatan-item .n{
  font-size:var(--fs-lg); font-weight:600; color:var(--ink-900);
  line-height:1.25;
}
.catatan-item .q{
  font-size:var(--fs-md); color:var(--ink-600); margin-top:2px;
}

/* ---------- Harga cards ---------- */
.price-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  padding:14px 14px 12px; margin-bottom:10px;
}
.price-name{font-size:var(--fs-md); font-weight:600; margin-bottom:10px;}
.price-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.price-cell{
  background:var(--paper); border-radius:var(--r-sm); padding:8px 10px;
}
.price-cell.buy{background:var(--line-soft);}
.price-cell.sell{background:var(--green-100);}
.price-label{
  font-size:10.5px; color:var(--ink-600); text-transform:uppercase;
  letter-spacing:.8px; font-weight:600; margin-bottom:2px;
}
.price-value{
  font-family:'Zilla Slab',serif; font-size:16px; font-weight:600; color:var(--ink-900);
}

/* ---------- Baris harga minimum ---------- */
.min-row{
  margin-top:10px; padding:10px 12px;
  background:var(--rust-600); color:#fff;
  border-radius:var(--r-sm);
  display:flex; justify-content:space-between; align-items:center;
}
.min-row .lbl{
  font-size:var(--fs-xs); font-weight:600;
  text-transform:uppercase; letter-spacing:.8px;
  opacity:.85;
}
.min-row .val{
  font-family:'Zilla Slab',serif;
  font-size:18px; font-weight:700;
}

/* ---------- Total bar ---------- */
.total-bar{
  margin-top:14px; display:flex; justify-content:space-between; align-items:center;
  background:var(--green-100); border-radius:var(--r-md); padding:13px 16px;
}
.total-bar .lbl{font-size:var(--fs-sm); color:var(--ink-700); font-weight:500;}
.total-bar .val{
  font-family:'Zilla Slab',serif; font-size:19px; font-weight:700; color:var(--green-700);
}

/* ---------- Empty / error ---------- */
.empty{text-align:center; padding:36px 16px; color:var(--ink-400);}
.empty svg{width:36px; height:36px; opacity:.35; margin-bottom:10px; stroke:currentColor; fill:none; stroke-width:1.4;}
.empty p{font-size:var(--fs-sm); margin:0 0 14px; color:var(--ink-600);}
.empty-note{font-size:var(--fs-sm); color:var(--ink-600); padding:20px 0; text-align:center;}

/* ---------- Navbar ---------- */
.navbar{
  display:grid; grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--line);
  background:rgba(255,254,251,.94);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  position:fixed; bottom:0; left:0; right:0;
  max-width:480px; margin:0 auto; z-index:10;
}
.navbar button{
  background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--ink-400); padding:6px 0; min-height:52px;
  transition:color .15s; font-family:inherit;
}
.navbar button svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.navbar button span{font-size:10px; font-weight:500; letter-spacing:.1px;}
.navbar button.active{color:var(--green-700);}
.navbar button.active span{font-weight:600;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; transform:translateX(-50%) translateY(10px);
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  background:var(--ink-900); color:#fff;
  padding:10px 18px; border-radius:var(--r-full);
  font-size:var(--fs-sm); font-weight:500;
  opacity:0; transition:opacity .2s, transform .2s;
  pointer-events:none; z-index:20;
  max-width:calc(100% - 32px); text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <h1>Sayur App</h1>
  <span id="todayLabel"></span>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="screen active" id="dashboard">
  <div class="hero" id="dash_hero">
    <div class="k">Laba bersih hari ini</div>
    <div class="v" id="dash_laba">Rp 0</div>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="k">Omzet</div><div class="v" id="dash_omzet">Rp 0</div></div>
    <div class="stat"><div class="k">Modal (kemarin)</div><div class="v" id="dash_modal">Rp 0</div></div>

  </div>

</div>

<!-- ============ BELANJA ============ -->

<script>
/* ==========================================================
   KONFIGURASI
   ========================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyj3eXJV0qSa0-3HFuph0AaV1y5dft9Zjsqt-en7j_DU9mM4huxGoctMD52KTbivuN6/exec';
const NAMA_LAPAK = ''; /* isi misal 'Sayur Bu Ani' — muncul di footer share */
const SUSUT_RATE = 0.30; /* 30% — dari pengalaman lapangan */

/* ==========================================================
   HELPERS
   ========================================================== */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateShort(){
  return new Date().toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'short'});
}
function dateLong(){
  return new Date().toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function rupiah(n){
  return 'Rp ' + Number(n||0).toLocaleString('id-ID');
}

function parseNum(v){
  if(typeof v === 'number') return isFinite(v) ? v : 0;
  if(v == null || v === '') return 0;
  let s = String(v).trim().replace(/[^\d.,-]/g, '');
  if(!s) return 0;
  if(/,\d{1,2}$/.test(s)){
    s = s.replace(/\./g,'').replace(',', '.');
  }else{
    s = s.replace(/[.,]/g, '');
  }
  const n = Number(s);
  return isFinite(n) ? n : 0;
}
