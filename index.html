            <span style="color:var(--ink-600);">Tanggal</span>
            <span style="font-weight:600;">${escHtml(tglFmt)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:2px 0;">
            <span style="color:var(--ink-600);">Sumber</span>
            <span style="font-weight:600;">${escHtml(h.Sumber || '-')}</span>
          </div>
          ${h.Catatan ? `
          <div style="display:flex;justify-content:space-between;padding:2px 0;">
            <span style="color:var(--ink-600);">Catatan</span>
            <span style="font-weight:600;text-align:right;max-width:60%;">${escHtml(h.Catatan)}</span>
          </div>` : ''}
        </div>

        <div style="background:var(--paper);border-radius:var(--r-sm);
          padding:12px 14px;font-size:13px;">
          <div style="display:flex;justify-content:space-between;padding:3px 0;">
            <span style="color:var(--ink-600);">Total</span>
            <span style="font-family:'Zilla Slab',serif;font-weight:700;">
              ${rupiah(h.JumlahAwal)}
            </span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:3px 0;">
            <span style="color:var(--ink-600);">Dibayar</span>
            <span style="font-family:'Zilla Slab',serif;font-weight:700;">
              ${rupiah(h.JumlahDibayar)}
            </span>
          </div>
          <div style="display:flex;justify-content:space-between;padding:6px 0 2px;
               border-top:1px dashed var(--line);margin-top:6px;">
            <span style="font-weight:700;">${isLunas ? 'Status' : 'Sisa'}</span>
            <span style="font-family:'Zilla Slab',serif;font-weight:700;
                 font-size:15px;
                 color:${isLunas ? 'var(--green-700)' : 'var(--rust-600)'};">
              ${isLunas ? '✓ Lunas' : rupiah(sisa)}
            </span>
          </div>
        </div>`;

      const ov = Pesanan._buatModal({
        title: 'Detail ' + (h.Sumber || '') + ' — ' + h.Nama,
        body: body,
        confirmLabel: isLunas ? null : (isPiutang ? '✓ Terima Pembayaran' : '✓ Bayar Hutang'),
        cancelLabel: 'Tutup',
        onConfirm: async () => {
          if(isLunas) return true;
          try{
            await SayurStorage.post('addPembayaranHutang', {
              id: 'ph-' + Date.now(),
              hutangId: h.ID,
              jumlah: sisa,
              metode: 'Cash',
              tanggal: todayYmd()
            });
            showToast(isPiutang ? '✓ Piutang lunas' : '✓ Hutang lunas');
            ov.remove();
            this.loadHutang();
            this.loadSaldo();
            if(App.currentTab === 'beranda') loadBeranda();
          }catch(e){
            showToast('Gagal: ' + e.message);
            return false;
          }
        }
      });
    },

    /* ========== RIWAYAT ========== */
    async loadRiwayat(){
      await Libur.syncFromServer();

      const first = localStorage.getItem('sayur_first_use') || todayYmd();
      const sampai = todayYmd();
      let data = [];

      /* 1. Server dulu */
      if(navigator.onLine){
        try{
          /* Ambil semua riwayat dari server, tidak dibatasi tanggal pertama pakai di HP ini */
          const serverData = await SayurStorage.get('getRiwayatHarian',
            {dari: '2000-01-01', sampai: sampai});
          if(Array.isArray(serverData) && serverData.length > 0){
            data = serverData.map(d => ({
              tanggal: d.Tanggal,
              omzet: Number(d.Omzet) || 0,
              pengeluaran: Number(d.Pengeluaran) || 0,
              laba: Number(d.Laba) || 0,
              adaData: !!d.AdaData,
              libur: !!d.Libur,
              alasan: d.AlasanLibur || '',
              dariServer: true
            }));
          }
        }catch(e){
          console.warn('Server riwayat gagal:', e);
        }
      }

      /* 2. Fallback lokal */
      if(data.length === 0){
        data = this._riwayatDariLocalStorage();
      }

      /* 3. Tambah hari bolong */
      const adaSet = new Set(data.map(d => d.tanggal));
      const bolong = cariHariBolong();
      bolong.forEach(ymd => {
        if(!adaSet.has(ymd)){
          data.push({
            tanggal: ymd, kosong: true,
            adaData: false, dariServer: false
          });
        }
      });

      data.sort((a, b) => b.tanggal.localeCompare(a.tanggal));
      this.riwayatData = data;

      try{
        const [pes, mut, hut] = await Promise.all([
          SayurStorage.get('getPesanan').catch(() => []),
          SayurStorage.get('getMutasiSaldo', {limit: 500}).catch(() => []),
          SayurStorage.get('getHutang').catch(() => [])
        ]);
        this.apiPesanan = pes || [];
        this.apiMutasi = mut || [];
        this.apiHutang = hut || [];
      }catch(e){
        this.apiPesanan = [];
        this.apiMutasi = [];
        this.apiHutang = [];
      }

      this.renderRiwayat();
    },

    _riwayatDariLocalStorage(){
      const data = [];
      const liburSet = new Set();
      for(let i = 0; i < localStorage.length; i++){
        const key = localStorage.key(i);
        if(key && key.startsWith('sayur_libur_')){
          liburSet.add(key.replace('sayur_libur_', ''));
        }
      }
      for(let i = 0; i < localStorage.length; i++){
        const key = localStorage.key(i);
        if(key && key.startsWith('sayur_tutup_final_')){
          const ymd = key.replace('sayur_tutup_final_', '');
          try{
            const t = JSON.parse(localStorage.getItem(key));
            const biaya = JSON.parse(
              localStorage.getItem('sayur_belanja_biaya_' + ymd) || '{}'
            );
            const omzetCash = Number(t.omzetCash) || 0;
            const omzetQris = Number(t.omzetQris) || 0;
            const pagi = t.pagi || {};
            const pagiTotal = (Number(pagi.kantongKaret) || 0) +
                              (Number(pagi.iuran) || 0) +
                              ((pagi.lain || []).reduce((s,x) => s + Number(x.jumlah || 0), 0));
            const bon = (t.bon || []).reduce((s,b) => s + Number(b.jumlah || 0), 0);
            const totalOmzet = omzetCash + omzetQris + pagiTotal + bon;
            const totalPengeluaran =
              (Number(biaya.modalBelanja) || 0) +
              (Number(biaya.opsPasar) || 0) +
              (Number(biaya.bensin) || 0) +
              ((biaya.lain || []).reduce((s,x) => s + Number(x.jumlah || 0), 0)) +
              (Number(biaya.bayarHutang) || 0);
            data.push({
              tanggal: ymd,
              omzet: totalOmzet,
              pengeluaran: totalPengeluaran,
              laba: totalOmzet - totalPengeluaran,
              adaData: true, dariServer: false
            });
          }catch(e){}
        }
      }
      liburSet.forEach(ymd => {
        if(!data.find(d => d.tanggal === ymd)){
          const libur = Libur.get(ymd);
          data.push({
            tanggal: ymd, libur: true,
            alasan: libur ? libur.alasan : '',
            adaData: false, dariServer: false
          });
        }
      });
      return data;
    },

    renderRiwayat(){
      const el = document.getElementById('tabLapRiwayat');
      if(!el) return;
      const data = this.riwayatData || [];

      const bulanSet = new Set();
      data.forEach(d => {
        if(d.tanggal) bulanSet.add(d.tanggal.slice(0, 7));
      });
      const bulanList = Array.from(bulanSet).sort().reverse();

      let filtered = data;
      if(this.filterBulanRiwayat !== 'all'){
        filtered = data.filter(d => d.tanggal.startsWith(this.filterBulanRiwayat));
      }

      const yangAda = data.filter(d => d.adaData);
      const totalLabaAll = yangAda.reduce((s,d) => s + d.laba, 0);
      const totalOmzetAll = yangAda.reduce((s,d) => s + d.omzet, 0);
      const totalHari = yangAda.length;

      let html = '';

      html += `
        <div class="riwayat-rekap">
          <div class="rr-k">Total Laba Sejak Awal</div>
          <div class="rr-v">${rupiah(totalLabaAll)}</div>
          <div class="rr-sub">
            <span>Omzet: ${rupiahSingkat(totalOmzetAll)}</span>
            <span>·</span>
            <span>${totalHari} hari tutup</span>
          </div>
        </div>`;

      html += `
        <div class="riwayat-header">
          <span class="rh-title">Riwayat Harian</span>
          <div class="rh-actions">
            <button class="rh-btn" id="rhPrint" type="button">
              <svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Cetak
            </button>
            <button class="rh-btn" id="rhShare" type="button">
              <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
              Bagikan
            </button>
          </div>
        </div>`;

      if(bulanList.length > 1){
        html += `<div class="filter-bulan">
          <button class="fb ${this.filterBulanRiwayat==='all'?'active':''}" data-bulan="all">Semua</button>`;
        bulanList.forEach(b => {
          const [y,m] = b.split('-').map(Number);
          const nmBulan = new Date(y, m-1, 1).toLocaleDateString('id-ID', {
            month: 'short', year: '2-digit'
          });
          html += `<button class="fb ${this.filterBulanRiwayat===b?'active':''}" data-bulan="${b}">${nmBulan}</button>`;
        });
        html += `</div>`;
      }

      if(!filtered.length){
        html += `<div class="daftar-empty">Belum ada riwayat. Mulai catat belanja & tutup hari.</div>`;
        el.innerHTML = html;
        this.attachRiwayatHandlers();
        return;
      }

      filtered.forEach(d => { html += this.renderHariCard(d); });
      el.innerHTML = html;
      this.attachRiwayatHandlers();
    },

    renderHariCard(d){
      const tglPanjang = fmtTanggalPanjang(d.tanggal);

      if(d.libur){
        return `
          <div class="hari-card libur" data-tanggal="${d.tanggal}">
            <div class="hc-head">
              <div>
                <div class="hc-tgl">${escHtml(tglPanjang)}</div>
                <div class="hc-meta">${d.alasan ? '🌙 ' + escHtml(d.alasan) : 'Hari libur'}</div>
              </div>
              <span class="hc-badge libur">LIBUR</span>
            </div>
          </div>`;
      }

      if(d.kosong || !d.adaData){
        return `
          <div class="hari-card kosong" data-tanggal="${d.tanggal}">
            <div class="hc-head">
              <div>
                <div class="hc-tgl">${escHtml(tglPanjang)}</div>
                <div class="hc-meta">Belum ada data</div>
              </div>
              <span class="hc-badge kosong">KOSONG</span>
            </div>
            <div class="hc-actions">
              <button class="isibtn" data-aksi="isi" data-tgl="${d.tanggal}">+ Isi Data</button>
              <button class="liburbtn" data-aksi="libur" data-tgl="${d.tanggal}">Tandai Libur</button>
            </div>
          </div>`;
      }

      const labaKls = d.laba < 0 ? 'neg' : '';
      return `
        <div class="hari-card" data-tanggal="${d.tanggal}" data-aksi="detail">
          <div class="hc-head">
            <div>
              <div class="hc-tgl">${escHtml(tglPanjang)}</div>
              <div class="hc-meta">Omzet ${rupiahSingkat(d.omzet)} · Keluar ${rupiahSingkat(d.pengeluaran)}</div>
            </div>
            <div class="hc-laba ${labaKls}">${rupiahSingkat(d.laba)}</div>
          </div>
        </div>`;
    },

    attachRiwayatHandlers(){
      document.querySelectorAll('#tabLapRiwayat .fb').forEach(btn => {
        btn.addEventListener('click', () => {
          this.filterBulanRiwayat = btn.dataset.bulan;
          this.renderRiwayat();
        });
      });

      document.querySelectorAll('#tabLapRiwayat .hari-card').forEach(card => {
        const aksi = card.dataset.aksi;
        const tgl = card.dataset.tanggal;
        if(aksi === 'detail'){
          card.addEventListener('click', () => this.openDetailHari(tgl));
        }
      });

      document.querySelectorAll('#tabLapRiwayat [data-aksi="isi"]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const tgl = btn.dataset.tgl;
          const back = selisihHari(tgl, todayYmd());
          if(back > 30){
            if(!confirm(`Yakin isi data ${back} hari lalu?`)) return;
          }
          Tutup.setTanggal(tgl, true);
          goTab('tutup');
          showToast(`→ Isi data ${fmtTanggalPendek(tgl)}`);
        });
      });

      document.querySelectorAll('#tabLapRiwayat [data-aksi="libur"]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          this.openTandaiLibur(btn.dataset.tgl);
        });
      });

      const btnPrint = document.getElementById('rhPrint');
      if(btnPrint) btnPrint.addEventListener('click', () => this.openPrintRiwayat());

      const btnShare = document.getElementById('rhShare');
      if(btnShare) btnShare.addEventListener('click', () => this.bagikanRiwayat());
    },

    openTandaiLibur(tgl){
      const existing = Libur.get(tgl);
      let alasan = existing ? existing.alasan : '';

      const ov = Pesanan._buatModal({
        title: 'Tandai Libur',
        body: `
          <div class="libur-form">
            <div style="font-size:12.5px;color:var(--ink-600);
              margin-bottom:12px;line-height:1.5;">
              Tanggal: <strong style="color:var(--ink-900);">${fmtTanggalPanjang(tgl)}</strong>
            </div>
            <div class="field-pes">
              <label>Alasan Libur</label>
              <div class="alasan-grid">
                ${['Idul Fitri','Idul Adha','Sakit','Keperluan penting'].map(a => `
                  <button type="button" class="alasan-btn ${alasan===a?'on':''}"
                    data-alasan="${a}">${a}</button>
                `).join('')}
              </div>
            </div>
            <div class="field-pes">
              <label>Atau isi sendiri</label>
              <input type="text" id="liburCustom" placeholder="mis. ada hajatan keluarga"
                value="${!['Idul Fitri','Idul Adha','Sakit','Keperluan penting'].includes(alasan)?escHtml(alasan):''}">
            </div>
          </div>`,
        confirmLabel: 'Tandai Libur',
        cancelLabel: 'Batal',
        onConfirm: async () => {
          const custom = document.getElementById('liburCustom').value.trim();
          const final = custom || alasan || 'Libur';
          await Libur.tandai(tgl, final);
          showToast('✓ Ditandai libur');
          ov.remove();
          this.loadRiwayat();
          if(App.currentTab === 'beranda') loadBeranda();
          return true;
        },
        afterRender: () => {
          document.querySelectorAll('.alasan-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              alasan = btn.dataset.alasan;
              document.getElementById('liburCustom').value = '';
              document.querySelectorAll('.alasan-btn').forEach(b => {
                b.classList.toggle('on', b.dataset.alasan === alasan);
              });
            });
          });
          const inp = document.getElementById('liburCustom');
          if(inp){
            inp.addEventListener('input', () => {
              if(inp.value.trim()){
                alasan = '';
                document.querySelectorAll('.alasan-btn')
                  .forEach(b => b.classList.remove('on'));
              }
            });
          }
        }
      });
    },

    async openDetailHari(ymd){
      let detail = null;

      if(navigator.onLine){
        try{
          const serverData = await SayurStorage.get('getDetailHari', {tanggal: ymd});
          if(serverData){
            detail = this._normalizeDetailDariServer(serverData, ymd);
          }
        }catch(e){
          console.warn('getDetailHari gagal, fallback lokal:', e);
        }
      }

      if(!detail){
        detail = this._detailHariLokal(ymd);
      }

      this._renderModalDetailHari(detail, ymd);
    },

    _normalizeDetailDariServer(s, ymd){
      const r = s.Ringkasan || {};
      const biaya = s.Biaya || {};
      const lainArr = (s.LainLain || []).map(x => ({
        ket: x.Keterangan, jumlah: x.Jumlah, metode: x.Metode
      }));
      const lainTotal = lainArr.reduce((t,x) => t + (x.jumlah || 0), 0);

      const itemsBelanja = (s.Belanja || []).map(b => ({
        nama: b.NamaBarang,
        qty: b.Qty,
        satuan: b.Satuan,
        hargaBeli: b.HargaBeli,
        hargaJual: b.HargaJual || 0,
        bayarNanti: !!b.BayarNanti,
        supplier: b.Supplier || '',
        subtotal: b.Subtotal || ((b.Qty || 0) * (b.HargaBeli || 0))
      }));

      const totalBeliTunai = itemsBelanja
        .filter(x => !x.bayarNanti)
        .reduce((t,x) => t + ((Number(x.qty) || 0) * (Number(x.hargaBeli) || 0)), 0);
      const totalNanti = itemsBelanja
        .filter(x => x.bayarNanti)
        .reduce((t,x) => t + ((Number(x.qty) || 0) * (Number(x.hargaBeli) || 0)), 0);
      const potensiJual = itemsBelanja.reduce((t,x) =>
        t + ((Number(x.qty) || 0) * (Number(x.hargaJual) || 0)), 0);

      return {
        tanggal: ymd,
        dariServer: true,
        omzetCash: r.OmzetCash || 0,
        omzetQris: r.OmzetQris || 0,
        pagiKK: Number(biaya.pagiKresek) || 0,
        pagiIuran: Number(biaya.pagiIuran) || 0,
        pagiKonsumsi: Number(biaya.pagiKonsumsi) || 0,
        pagiLainArr: (Number(biaya.pagiLain) || 0) > 0
          ? [{ket: 'Lain-lain pagi', jumlah: Number(biaya.pagiLain)}] : [],
        pagiTotal: (Number(biaya.pagiKresek) || 0) +
                   (Number(biaya.pagiIuran) || 0) +
                   (Number(biaya.pagiLain) || 0) +
                   (Number(biaya.pagiKonsumsi) || 0),
        bonArr: [],
        bonTotal: 0,
        totalPendapatan: r.Omzet || 0,
        itemsBelanja,
        totalBeliTunai,
        totalNanti,
        potensiJual,
        modalBelanja: r.Belanja || 0,
        opsPasar: Number(biaya.operasionalBelanja) || 0,
        bensin: Number(biaya.bensin) || 0,
        lainArr, lainTotal,
        bayarHutang: 0,
        totalPengeluaran: r.Pengeluaran || 0,
        laba: r.Laba || 0,
        hutangBaru: (s.Hutang || []).map(h => ({
          Nama: h.Nama, JumlahAwal: h.JumlahAwal, Sumber: h.Sumber
        })),
        mutasiHari: s.Mutasi || [],
        pesananHari: s.Pesanan || []
      };
    },

    _detailHariLokal(ymd){
      const belanjaState = (() => {
        try{ return JSON.parse(localStorage.getItem('sayur_belanja_state_' + ymd) || '[]'); }
        catch(e){ return []; }
      })();
      const belanjaBiaya = (() => {
        try{ return JSON.parse(localStorage.getItem('sayur_belanja_biaya_' + ymd) || '{}'); }
        catch(e){ return {}; }
      })();
      const tutupFinal = (() => {
        try{
          return JSON.parse(localStorage.getItem('sayur_tutup_final_' + ymd) ||
            localStorage.getItem('sayur_tutup_draft_' + ymd) || '{}');
        }catch(e){ return {}; }
      })();

      const omzetCash = Number(tutupFinal.omzetCash) || 0;
      const omzetQris = Number(tutupFinal.omzetQris) || 0;
      const pagi = tutupFinal.pagi || {};
      const pagiKK = Number(pagi.kantongKaret) || 0;
      const pagiIuran = Number(pagi.iuran) || 0;
      const pagiLainArr = pagi.lain || [];
      const pagiLain = pagiLainArr.reduce((s,x) => s + Number(x.jumlah || 0), 0);
      const pagiTotal = pagiKK + pagiIuran + pagiLain;
      const bonArr = tutupFinal.bon || [];
      const bonTotal = bonArr.reduce((s,b) => s + Number(b.jumlah || 0), 0);
      const totalPendapatan = omzetCash + omzetQris;

      const modalBelanja = Number(belanjaBiaya.modalBelanja) || 0;
      const opsPasar = Number(belanjaBiaya.opsPasar) || 0;
      const bensin = Number(belanjaBiaya.bensin) || 0;
      const lainArr = (belanjaBiaya.lain || []).map(x => ({
        ket: x.ket, jumlah: x.jumlah
      }));
      const lainTotal = lainArr.reduce((s,x) => s + Number(x.jumlah || 0), 0);
      const bayarHutang = Number(belanjaBiaya.bayarHutang) || 0;
      const totalPengeluaran = modalBelanja + opsPasar + bensin + lainTotal + bayarHutang;
      const laba = totalPendapatan - totalPengeluaran;

      const itemsBelanja = (belanjaState || []).filter(x =>
        x.tersimpan && Number(String(x.qty).replace(/[^\d.]/g,'')) > 0);

      const totalBeliTunai = itemsBelanja.filter(x => !x.bayarNanti)
        .reduce((s,x) => s + (Number(String(x.qty).replace(/[^\d.]/g,'')) || 0) * (x.hargaBeli || 0), 0);
      const totalNanti = itemsBelanja.filter(x => x.bayarNanti)
        .reduce((s,x) => s + (Number(String(x.qty).replace(/[^\d.]/g,'')) || 0) * (x.hargaBeli || 0), 0);
      const potensiJual = itemsBelanja.reduce((s,x) =>
        s + (Number(String(x.qty).replace(/[^\d.]/g,'')) || 0) * (x.hargaJual || 0), 0);

      return {
        tanggal: ymd, dariServer: false,
        omzetCash, omzetQris,
        pagiKK, pagiIuran, pagiKonsumsi: 0, pagiLainArr, pagiTotal,
        bonArr, bonTotal, totalPendapatan,
        itemsBelanja, totalBeliTunai, totalNanti, potensiJual,
        modalBelanja, opsPasar, bensin, lainArr, lainTotal, bayarHutang,
        totalPengeluaran, laba,
        hutangBaru: (this.apiHutang || []).filter(h =>
          String(h.Tanggal).slice(0,10) === ymd),
        mutasiHari: (this.apiMutasi || []).filter(m =>
          String(m.Tanggal).slice(0,10) === ymd),
        pesananHari: (this.apiPesanan || []).filter(p =>
          String(p.Tanggal).slice(0,10) === ymd)
      };
    },

      const persenCapaian = App.pengaturan.BatasMinimalLaba > 0
        ? Math.round((d.laba / App.pengaturan.BatasMinimalLaba) * 100) : 0;

      let body = `<div class="detail-hari">`;

      body += `

            ' <small style="color:var(--green-700);font-weight:400;">· dari server</small>' :
            ' <small style="color:var(--amber-700);font-weight:400;">· lokal</small>'}</div>
          <div class="dh-summary-grid">
            <div class="dh-summary-item laba">
              <div class="k">Laba Bersih</div>
              <div class="v ${d.laba>=0?'positive':'neg'}">${rupiah(d.laba)}</div>
              <div style="font-size:10.5px;color:var(--ink-600);margin-top:4px;">
                Capaian: ${persenCapaian}% dari target
              </div>
            </div>
            <div class="dh-summary-item">
              <div class="k">Omzet</div>
              <div class="v">${rupiah(d.totalPendapatan)}</div>
            </div>
            <div class="dh-summary-item">
              <div class="k">Pengeluaran</div>
              <div class="v">${rupiah(d.totalPengeluaran)}</div>
            </div>
          </div>
        </div>`;

      body += `
        <div class="dh-section">
          <div class="dh-title">💰 Pendapatan</div>
          <div class="dh-row"><span class="lbl">Tunai</span><span class="amt">${rupiah(d.omzetCash)}</span></div>
          <div class="dh-row"><span class="lbl">QRIS</span><span class="amt">${rupiah(d.omzetQris)}</span></div>

    openPrintRiwayat(){

      document.getElementById('pmTitle').textContent = 'Riwayat — ' + title;
      document.getElementById('pmContent').textContent = content;
      document.getElementById('printModal').classList.add('show');
      document.getElementById('pmPrint').onclick = () => window.print();
      document.getElementById('pmCopy').onclick = () => {
        navigator.clipboard.writeText(content)
          .then(() => showToast('Disalin ke clipboard'))
          .catch(() => showToast('Gagal menyalin'));
      };
      document.getElementById('pmClose').onclick = () => {
        document.getElementById('printModal').classList.remove('show');
      };
    },

    _labelBulan(ym){
      const [y, m] = ym.split('-').map(Number);
      return new Date(y, m-1, 1).toLocaleDateString('id-ID',
        {month:'long', year:'numeric'});
    },

    _buildPrintText(data, title){
      const namaLapak = App.pengaturan.NamaLapak || 'H. Mawih Sayur';
      const tglCetak = new Date().toLocaleString('id-ID', {
        weekday:'long', day:'numeric', month:'long', year:'numeric',
        hour:'2-digit', minute:'2-digit'
      });
      const L = 46;
      const line = '='.repeat(L);
      const dash = '-'.repeat(L);
      const lines = [];

      lines.push(line);
      lines.push(this._center(namaLapak, L));
      lines.push(this._center('REKAP RIWAYAT', L));
      lines.push(this._center(title, L));
      lines.push(line);
      lines.push('');

      const yangAda = data.filter(d => d.adaData);
      const totalLaba = yangAda.reduce((s,d) => s + (d.laba || 0), 0);
      const totalOmzet = yangAda.reduce((s,d) => s + (d.omzet || 0), 0);
      const totalPengeluaran = yangAda.reduce((s,d) => s + (d.pengeluaran || 0), 0);

      lines.push('RINGKASAN');
      lines.push(dash);
      lines.push(this._pad('Total Laba', rupiah(totalLaba), L));
      lines.push(this._pad('Total Omzet', rupiah(totalOmzet), L));
      lines.push(this._pad('Total Pengeluaran', rupiah(totalPengeluaran), L));
      lines.push(this._pad('Hari Tutup', String(yangAda.length) + ' hari', L));
      lines.push(this._pad('Hari Libur', String(data.filter(d => d.libur).length) + ' hari', L));
      lines.push('');

      lines.push('RINCIAN HARIAN');
      lines.push(dash);
      lines.push(this._pad3('Tanggal', 'Omzet', 'Laba', L));
      lines.push(dash);

      const sorted = [...data].sort((a, b) => a.tanggal.localeCompare(b.tanggal));
      sorted.forEach(d => {
        const tgl = fmtTanggalPendek(d.tanggal);
        if(d.libur){
          const tglPad = this._padRight(tgl, 12);
          lines.push(`${tglPad} ${this._padRight('[LIBUR' + (d.alasan ? ' - ' + d.alasan : '') + ']', 30)}`);
        } else if(d.kosong || !d.adaData){
          const tglPad = this._padRight(tgl, 12);
          lines.push(`${tglPad} ${this._padRight('[KOSONG]', 30)}`);
        } else {
          const labaStr = d.laba < 0
            ? '-Rp ' + Math.abs(d.laba).toLocaleString('id-ID')
            : 'Rp ' + d.laba.toLocaleString('id-ID');
          const omzetStr = 'Rp ' + d.omzet.toLocaleString('id-ID');
          lines.push(this._pad3(tgl, omzetStr, labaStr, L));
        }
      });

      lines.push('');
      lines.push(line);
      lines.push(this._pad('Dicetak', tglCetak, L));
      lines.push(line);

      return lines.join('\n');
    },

    _buildDetailPrintText(d, ymd){
      const namaLapak = App.pengaturan.NamaLapak || 'H. Mawih Sayur';
      const L = 46;
      const line = '='.repeat(L);
      const dash = '-'.repeat(L);
      const lines = [];

      lines.push(line);
      lines.push(this._center(namaLapak, L));
      lines.push(this._center('DETAIL HARI', L));
      lines.push(this._center(fmtTanggalPanjang(ymd), L));
      lines.push(line);
      lines.push('');

      lines.push('RINGKASAN');
      lines.push(dash);
      lines.push(this._pad('Laba Bersih', rupiah(d.laba), L));
      lines.push(this._pad('Omzet', rupiah(d.totalPendapatan), L));
      lines.push(this._pad('Pengeluaran', rupiah(d.totalPengeluaran), L));
      lines.push('');

      lines.push('PENDAPATAN');
      lines.push(dash);
      lines.push(this._pad('Tunai', rupiah(d.omzetCash), L));
      lines.push(this._pad('QRIS', rupiah(d.omzetQris), L));
      lines.push(this._pad('Total', rupiah(d.totalPendapatan), L));
      if(d.bonTotal > 0) lines.push(this._pad('Bon (belum diterima)', rupiah(d.bonTotal), L));
      lines.push('');

      if(d.pagiTotal > 0){
        lines.push('PENGELUARAN PAGI');
        lines.push(dash);
        if(d.pagiKK > 0) lines.push(this._pad('Kantong & Karet', rupiah(d.pagiKK), L));
        if(d.pagiIuran > 0) lines.push(this._pad('Iuran', rupiah(d.pagiIuran), L));
        if(d.pagiKonsumsi > 0) lines.push(this._pad('Konsumsi', rupiah(d.pagiKonsumsi), L));
        (d.pagiLainArr || []).forEach(x => {
          lines.push(this._pad(String(x.ket).slice(0, 26), rupiah(x.jumlah), L));
        });
        lines.push(dash);
        lines.push(this._pad('Total Pagi', rupiah(d.pagiTotal), L));
        lines.push('(sudah dipotong dari omzet tunai)');
        lines.push('');
      }

      lines.push('BELANJA (' + d.itemsBelanja.length + ' item)');
      lines.push(dash);
      d.itemsBelanja.forEach((it, i) => {
        const qty = Number(String(it.qty).replace(/[^\d.]/g,'')) || 0;
        const sub = qty * (it.hargaBeli || 0);
        const label = (i+1) + '. ' + String(it.nama).slice(0, 20);
        const qtyStr = it.qty + ' ' + it.satuan + ' × ' + (it.hargaBeli||0).toLocaleString('id-ID');
        lines.push(this._pad(label, qtyStr, L));
        lines.push(this._pad('', rupiah(sub), L));
        if(it.bayarNanti){
          lines.push(this._pad('  (HUTANG' + (it.supplier ? ' → ' + it.supplier : '') + ')', '', L));
        }
      });
      lines.push(dash);
      lines.push(this._pad('Belanja Tunai', rupiah(d.totalBeliTunai), L));
      if(d.totalNanti > 0){
        lines.push(this._pad('Bayar Nanti', rupiah(d.totalNanti), L));
      }
      if(d.potensiJual > 0){
        lines.push(this._pad('Potensi Jual', rupiah(d.potensiJual), L));
      }
      lines.push('');

      lines.push('PENGELUARAN');
      lines.push(dash);
      lines.push(this._pad('Modal Belanja', rupiah(d.modalBelanja), L));
      lines.push(this._pad('Operasional', rupiah(d.opsPasar), L));
      lines.push(this._pad('Bensin', rupiah(d.bensin), L));
      if(d.lainTotal > 0) lines.push(this._pad('Lain-lain', rupiah(d.lainTotal), L));
      if(d.bayarHutang > 0) lines.push(this._pad('Bayar Hutang', rupiah(d.bayarHutang), L));
      lines.push(dash);
      lines.push(this._pad('Total Pengeluaran', rupiah(d.totalPengeluaran), L));
      lines.push('');

      if(d.hutangBaru && d.hutangBaru.length){
        lines.push('HUTANG BARU');
        lines.push(dash);
        d.hutangBaru.forEach(h => {
          lines.push(this._pad(
            String(h.Nama).slice(0, 24) + ' (' + (h.Sumber || '-') + ')',
            rupiah(h.JumlahAwal), L
          ));
        });
        lines.push('');
      }

      if(d.pesananHari && d.pesananHari.length){
        lines.push('PESANAN');
        lines.push(dash);
        d.pesananHari.forEach(p => {
          lines.push(this._pad(String(p.Nama).slice(0, 28), rupiah(p.Total), L));
        });
        lines.push('');
      }

      lines.push('');
      lines.push(line);
      lines.push(this._pad('Dicetak',
        new Date().toLocaleString('id-ID', {
          day:'numeric', month:'short', year:'numeric',
          hour:'2-digit', minute:'2-digit'
        }), L));
      lines.push(line);

      return lines.join('\n');
    },

    _center(str, w){
      str = String(str);
      if(str.length >= w) return str;
      const pad = Math.floor((w - str.length) / 2);
      return ' '.repeat(pad) + str;
    },
    _pad(left, right, w){
      left = String(left); right = String(right);
      const space = w - left.length - right.length;
      if(space <= 0) return left + ' ' + right;
      return left + ' '.repeat(space) + right;
    },
    _pad3(c1, c2, c3, w){
      const w1 = 12, w2 = 17, w3 = 17;
      return this._padRight(String(c1), w1) +
        this._padRight(String(c2), w2) +
        this._padLeft(String(c3), w3);
    },
    _padRight(s, w){
      s = String(s);
      if(s.length >= w) return s.slice(0, w);
      return s + ' '.repeat(w - s.length);
    },
    _padLeft(s, w){
      s = String(s);
      if(s.length >= w) return s.slice(0, w);
      return ' '.repeat(w - s.length) + s;
    },

    /* Bagikan */
    bagikanRiwayat(){
      const data = this.riwayatData || [];
      const filtered = this.filterBulanRiwayat === 'all'
        ? data
        : data.filter(d => d.tanggal.startsWith(this.filterBulanRiwayat));
      const title = this.filterBulanRiwayat === 'all'
        ? 'Semua Riwayat'
        : this._labelBulan(this.filterBulanRiwayat);
      const text = this._buildShareText(filtered, title);

      if(navigator.share){
        navigator.share({title: 'Riwayat — ' + title, text})
          .then(() => showToast('✓ Dikirim'))
          .catch(err => {
            if(err.name !== 'AbortError'){
              navigator.clipboard.writeText(text)
                .then(() => showToast('Disalin ke clipboard'))
                .catch(() => showToast('Gagal'));
            }
          });
      } else {
        navigator.clipboard.writeText(text)
          .then(() => showToast('Disalin ke clipboard'))
          .catch(() => showToast('Gagal'));
      }
    },

    _buildShareText(data, title){
      const namaLapak = App.pengaturan.NamaLapak || 'H. Mawih Sayur';
      const yangAda = data.filter(d => d.adaData);
      const totalLaba = yangAda.reduce((s,d) => s + (d.laba || 0), 0);
      const totalOmzet = yangAda.reduce((s,d) => s + (d.omzet || 0), 0);
      const lines = [];
      lines.push(`*${namaLapak}*`);
      lines.push(`*${title}*`);
      lines.push('');
      lines.push(`📊 *Ringkasan*`);
      lines.push(`Laba: ${rupiah(totalLaba)}`);
      lines.push(`Omzet: ${rupiah(totalOmzet)}`);
      lines.push(`Hari Tutup: ${yangAda.length}`);
      lines.push('');
      lines.push(`*Detail per Hari*`);
      lines.push('─────────────────');
      const sorted = [...data].sort((a, b) => a.tanggal.localeCompare(b.tanggal));
      sorted.forEach(d => {
        const tgl = fmtTanggalPendek(d.tanggal);
        if(d.libur){
          lines.push(`🌙 ${tgl} — LIBUR${d.alasan ? ' (' + d.alasan + ')' : ''}`);
        } else if(d.kosong || !d.adaData){
          lines.push(`⚠️ ${tgl} — Kosong`);
        } else {
          lines.push(`${tgl}`);
          lines.push(`   Omzet: ${rupiah(d.omzet)} · Laba: ${rupiah(d.laba)}`);
        }
      });
      return lines.join('\n');
    }
  };

  /* ==========================================================
     ROUTING
     ========================================================== */
  const TABS = ['beranda', 'belanja', 'tutup', 'laporan'];

  function goTab(name){
    if(TABS.indexOf(name) < 0) return;
    App.currentTab = name;
    try{ localStorage.setItem('sayur_last_tab', name); }catch(e){}

    document.querySelectorAll('.navbar button').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === name);
    });
    document.querySelectorAll('.screen').forEach(s => {
      s.classList.toggle('active',
        s.id === 'view' + name.charAt(0).toUpperCase() + name.slice(1));
    });
    window.scrollTo({top: 0, behavior: 'instant'});

    if(name === 'beranda') loadBeranda();
    if(name === 'belanja'){ Belanja.load(); Pesanan.load(); }
    if(name === 'tutup') Tutup.load();
    if(name === 'laporan') Laporan.load();
  }

  /* ==========================================================
     BERANDA
     ========================================================== */
  async function loadBeranda(){
    const container = document.getElementById('berandaContent');
    const cached = SayurStorage.cache.load('dashboard');
    if(cached){
      App.dashboard = cached;
      renderBeranda();
    } else {
      container.innerHTML = `<div class="placeholder">
        <span class="em">⏳</span>Memuat dashboard…
      </div>`;
    }
    try{
      const fresh = await SayurStorage.get('getDashboard', {tanggal: todayYmd()});
      App.dashboard = fresh;
      renderBeranda();
    }catch(e){
      if(!cached){
        container.innerHTML = `<div class="placeholder">
          <span class="em">📡</span>
          Gagal memuat dashboard.<br>
          <span style="font-size:11.5px;margin-top:4px;display:inline-block;">
            Periksa koneksi atau coba lagi nanti.
          </span>
        </div>`;
      }
    }
  }

  function renderBeranda(){
    const container = document.getElementById('berandaContent');
    const d = App.dashboard;
    const batas = Number(App.pengaturan.BatasMinimalLaba) || 250000;

    if(!d || !d.lap){
      container.innerHTML = `<div class="placeholder">
        <span class="em">📊</span>Belum ada data
      </div>`;
      return;
    }

    const lap = d.lap || {};
    const saldo = d.saldo || {saldoCash:0, saldoQris:0, total:0};
    const hutang = d.hutang || {hutangSaya:0, piutangSaya:0};
    const rows = d.rows || [];

    const laba = Number(lap.labaBersih) || 0;
    const totalOmzet = Number(lap.totalOmzet) || 0;
    const belumTutup = totalOmzet <= 0;

    let html = '';

    const bolong = cariHariBolong();
    if(bolong.length){
      const sample = bolong.slice(-5);
      const txtSample = sample.map(b => fmtTanggalPendek(b)).join(', ');
      const lebih = bolong.length > 5 ? ` (+${bolong.length - 5} lagi)` : '';
      html += `
        <div class="bolong-banner">
          <div class="bb-head">
            <span class="bb-icon">📅</span>
            <span class="bb-title">${bolong.length} hari belum dicatat</span>
          </div>
          <div class="bb-list">${escHtml(txtSample)}${escHtml(lebih)}</div>
          <div class="bb-actions">
            <button class="bb-primary" id="bbIsi">Isi Satu per Satu</button>
            <button class="bb-ghost" id="bbLibur">Tandai Semua Libur</button>
          </div>
        </div>`;
    }

    if(!belumTutup){
      const pt = persenBatasMinimal(laba, batas);
      const neg = laba < 0;
      const totalBelanja = Number(lap.belanjaHariIni) || 0;

      html += `
        <section class="section">

            <div class="hero-main">
              <div class="hero-k">Laba hari ini</div>
              <div class="hero-v">${rupiah(laba)}</div>

                  <div class="flow-v">${rupiahSingkat(totalPengeluaran)}</div>
                  <div class="flow-sub">Belanja ${rupiahSingkat(totalBelanja)} · Biaya ${rupiahSingkat(totalBiaya)}</div>
                </div>
              </div>
            </div>
          </div>
        </section>`;
    } else {
      html += `
        <section class="section">
          <div class="hero hero-empty">
            <div class="hero-k">Hari ini</div>
            <div class="hero-v">Belum ada catatan.<br>Mulai dari mana?</div>

              <button class="ghost" data-go="tutup">Tutup Hari</button>
            </div>

        </section>`;
    }

    const hasDebt = (hutang.hutangSaya > 0) || (hutang.piutangSaya > 0);
    html += `
      <section class="section">
        <div class="uang-stack">
          <button class="saldo-zone" id="zoneSaldo" type="button">

            <div class="saldo-sub">

              <span class="item"><span class="dot qris"></span>QRIS ${rupiahSingkat(saldo.saldoQris)}</span>
            </div>
          </button>`;

    if(hasDebt){
      const parts = [];
      if(hutang.hutangSaya > 0) parts.push('Hutang <strong>' + rupiah(hutang.hutangSaya) + '</strong>');
      if(hutang.piutangSaya > 0) parts.push('Piutang <strong>' + rupiah(hutang.piutangSaya) + '</strong>');
      html += `
          <button class="debt-zone" id="zoneDebt" type="button">
            <span class="debt-icon">⚠️</span>
            <span class="debt-body">
              <span class="debt-title">Perlu perhatian</span>
              <span class="debt-detail">${parts.join(' · ')}</span>
            </span>
            <span class="debt-arrow">›</span>
          </button>`;
    }
    html += `</div></section>`;

    html += renderChart(rows, batas, lap);
    container.innerHTML = html;
    attachBerandaHandlers();
  }

function showChartTooltip(targetEl, ymd, row){
  /* Hapus tooltip lama */
  document.querySelectorAll('.chart-tooltip').forEach(t => t.remove());

  const card = targetEl.closest('.chart-card');
  if(!card) return;
  card.style.position = 'relative';

  const cardRect = card.getBoundingClientRect();
  const targetRect = targetEl.getBoundingClientRect();

  const tooltip = document.createElement('div');
  tooltip.className = 'chart-tooltip';

  const [y,m,d] = ymd.split('-').map(Number);
  const tgl = new Date(y, m-1, d).toLocaleDateString('id-ID',
    {weekday:'short', day:'numeric', month:'short'});

  if(row){
    const omzet = Number(row.TotalOmzet) || 0;
    const cash  = Number(row.OmzetCash) || 0;
    const qris  = Number(row.OmzetQris) || 0;
    const laba  = Number(row.LabaBersih) || 0;
    tooltip.innerHTML = `
      <div class="ct-date">${tgl}</div>
      <div class="ct-row"><span>Omzet</span><b>${rupiah(omzet)}</b></div>
      <div class="ct-row"><span>· Cash</span><b>${rupiah(cash)}</b></div>
      <div class="ct-row"><span>· QRIS</span><b>${rupiah(qris)}</b></div>
      <div class="ct-row" style="margin-top:4px;padding-top:4px;
           border-top:1px solid rgba(255,255,255,.15);">
        <span>Laba</span>
        <b style="color:${laba < 0 ? '#FFB29E' : '#B8E39B'};">
          ${rupiah(laba)}
        </b>
      </div>`;
  } else {
    tooltip.innerHTML = `
      <div class="ct-date">${tgl}</div>
      <div style="font-size:10.5px;opacity:.7;">Tidak ada data</div>`;
  }

  /* Posisi: relatif ke card */
  const left = targetRect.left - cardRect.left + (targetRect.width / 2);
  tooltip.style.left = left + 'px';
  tooltip.style.top = '34px';

  card.appendChild(tooltip);

  /* Auto close */
  const close = () => tooltip.remove();
  setTimeout(close, 3200);

  /* Klik di luar → tutup */
  const closeOnce = (ev) => {
    if(!tooltip.contains(ev.target) && ev.target !== targetEl){
      close();
      document.removeEventListener('click', closeOnce);
    }
  };
  setTimeout(() => document.addEventListener('click', closeOnce), 80);
}

  function renderChart(rows, batas, lap){
  const HARI = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const today = new Date();
  const days = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ymd = d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
    days.push({ymd, dow: d.getDay(), label: HARI[d.getDay()]});
  }
  const byDate = {};
  (rows || []).forEach(r => {
    if(!r.Tanggal) return;
    const t = String(r.Tanggal).slice(0, 10);
    if(Number(r.TotalOmzet) > 0) byDate[t] = r;
  });

  let maxVal = 0;
  days.forEach(d => {
    const r = byDate[d.ymd];
    if(!r) return;
    const omzet = Number(r.TotalOmzet) || 0;
    const laba = Math.abs(Number(r.LabaBersih) || 0);
    if(omzet > maxVal) maxVal = omzet;
    if(laba > maxVal) maxVal = laba;
  });

  if(maxVal === 0){
    return `
      <section class="section">
        <div class="chart-card">
          <div class="chart-head">
            <div class="title">Rekap 7 Hari</div>
            <div class="sub">—</div>
          </div>
          <div class="chart-empty">Belum ada data</div>
        </div>
      </section>`;
  }

  /* === Hitung agregat untuk statistik === */
  let totalOmzet7 = 0, totalCash7 = 0, totalQris7 = 0;
  let totalLaba7 = 0, totalBelanja7 = 0, totalOps7 = 0;
  let countHari = 0;

  let barsHtml = '', labelsHtml = '';
  days.forEach(d => {
    const r = byDate[d.ymd];
    const omzet = r ? (Number(r.TotalOmzet) || 0) : 0;
    const cash  = r ? (Number(r.OmzetCash) || 0) : 0;
    const qris  = r ? (Number(r.OmzetQris) || 0) : 0;
    const labaRaw = r ? (Number(r.LabaBersih) || 0) : 0;
    const laba = Math.abs(labaRaw);
    const belanja = r ? (Number(r.BelanjaHarilni) || 0) : 0;
    const ops = r ? (Number(r.TotalBiaya) || 0) : 0;
    const isToday = d.ymd === todayYmd();
    const isNeg = labaRaw < 0;
    const hOmzet = r ? Math.max(2, (omzet / maxVal) * 100) : 0;
    const hLaba  = r ? Math.max(2, (laba / maxVal) * 100) : 0;

    const cls = ['chart-col'];
    if(isToday) cls.push('today');
    if(isNeg) cls.push('neg');

    barsHtml += `<div class="${cls.join(' ')}" data-ymd="${d.ymd}">
      <div class="bar-wrap">
        ${r ? `<div class="bar omzet" style="height:${hOmzet}%"></div>` : ''}
        ${r ? `<div class="bar laba" style="height:${hLaba}%"></div>` : ''}
      </div>
    </div>`;
    labelsHtml += `<span class="${isToday ? 'today' : ''}">${d.label}</span>`;

    if(r){
      totalOmzet7 += omzet;
      totalCash7 += cash;
      totalQris7 += qris;
      totalLaba7 += labaRaw;
      totalBelanja7 += belanja;
      totalOps7 += ops;
      countHari++;
    }
  });

  /* === Statistik baru === */
  const avgOmzet  = countHari > 0 ? Math.round(totalOmzet7 / countHari) : 0;
  const avgCash   = countHari > 0 ? Math.round(totalCash7 / countHari) : 0;
  const avgQris   = countHari > 0 ? Math.round(totalQris7 / countHari) : 0;
  const avgLaba   = countHari > 0 ? Math.round(totalLaba7 / countHari) : 0;
  const rasioLaba = totalOmzet7 > 0 ? Math.round((totalLaba7 / totalOmzet7) * 100) : 0;
  const marginPct = totalOmzet7 > 0
    ? Math.round(((totalBelanja7 + totalOps7) / totalOmzet7) * 100) : 0;

  /* Status sehat/waspada pakai laba bersih HARI INI */
  const labaHariIni = Number(lap && lap.labaBersih || 0);
  const sehat = labaHariIni >= batas;
  const statusKls = sehat ? 'positive' : 'warn';
  const statusTxt = sehat ? '✓ Sehat' : '⚠ Waspada';

  const tglAwal = days[0].ymd, tglAkhir = days[6].ymd;
  const fmtTgl = ymd => {
    const [y,m,d] = ymd.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString('id-ID',
      {day:'numeric', month:'short'});
  };

  return `
    <section class="section">
      <div class="chart-card">
        <div class="chart-head">
          <div class="title">Rekap 7 Hari</div>
          <div class="sub">${fmtTgl(tglAwal)} — ${fmtTgl(tglAkhir)}</div>
        </div>
        <div class="chart-bars" id="chartBarsWrap">${barsHtml}</div>
        <div class="chart-labels">${labelsHtml}</div>
        <div class="chart-legend">
          <div class="item"><span class="dot omzet"></span>Omzet</div>
          <div class="item"><span class="dot laba"></span>Laba</div>
        </div>
        <div style="text-align:center;font-size:10px;color:var(--ink-400);
             margin-top:8px;">Tap batang untuk lihat nominal</div>
        <div class="chart-summary">
          <div class="summary-item">
            <div class="summary-k">Rata² Omzet</div>
            <div class="summary-v">${rupiahSingkat(avgOmzet)}</div>
            <div class="summary-sub">Cash ${rupiahSingkat(avgCash)} · QRIS ${rupiahSingkat(avgQris)}</div>
          </div>
          <div class="summary-item">
            <div class="summary-k">Rata² Laba</div>
            <div class="summary-v positive">${rupiahSingkat(avgLaba)}</div>
            <div class="summary-sub">${rasioLaba}% dari omzet</div>
          </div>
          <div class="summary-item">
            <div class="summary-k">Margin</div>
            <div class="summary-v">${marginPct}%</div>
            <div class="summary-sub">(modal + ops) : omzet</div>
          </div>
          <div class="summary-item">
            <div class="summary-k">Uang di Tangan</div>
            <div class="summary-v ${statusKls}">${rupiahSingkat(labaHariIni)}</div>
            <div class="summary-sub">${statusTxt} · target ${rupiahSingkat(batas)}</div>
          </div>
        </div>
      </div>
    </section>`;
}

  function updateConnectionStatus(status){
    const dot = document.getElementById('connDot');
    const banner = document.getElementById('connBanner');
    const bannerIc = document.getElementById('connBannerIc');
    const bannerTxt = document.getElementById('connBannerTxt');
    const btnSync = document.getElementById('btnForceSync');
    const btnDiscard = document.getElementById('btnDiscardFailed');
    dot.className = 'conn-dot ' + status.status;
    const hasFailed = status.status === 'failed' || (status.failed || 0) > 0;
    btnSync.textContent = hasFailed ? 'Coba lagi' : 'Sync';
    btnDiscard.style.display = hasFailed ? '' : 'none';
    if(status.status === 'failed'){
      banner.classList.add('show', 'offline');
      bannerIc.textContent = '⚠️';
      bannerTxt.innerHTML = `<strong>${status.failed}</strong> item gagal tersinkron` +
        (status.lastError ? ` (${String(status.lastError).replace(/</g,'&lt;')})` : '') +
        `. Coba lagi atau buang.`;
    } else if(status.status === 'offline'){
      banner.classList.add('show', 'offline');
      bannerIc.textContent = '📵';
      bannerTxt.innerHTML = 'Tidak ada sinyal. Data tetap tersimpan di HP.';
    } else if(status.status === 'pending'){
      banner.classList.add('show');
      banner.classList.remove('offline');
      bannerIc.textContent = '📡';
      bannerTxt.innerHTML = `<strong>${status.pending}</strong> item menunggu sinkron. Akan otomatis terkirim saat online.` +
        (status.failed ? ` <strong>${status.failed}</strong> item gagal.` : '');
    } else {
      banner.classList.remove('show', 'offline');
    }
  }

  function initStorageEvents(){
    window.addEventListener('sayur:status', e => {
      updateConnectionStatus(e.detail);
    });
    window.addEventListener('sayur:sync-done', e => {
      const {ok, skip, newlyFailed} = e.detail;
      if(ok > 0 || skip > 0){
        showToast('✓ Tersinkron: ' + (ok + skip) + ' item');
        if(App.currentTab === 'beranda') loadBeranda();
      }
      /* Toast gagal hanya sekali, saat item baru ditandai gagal permanen */
      if(newlyFailed > 0){
        showToast('⚠️ ' + newlyFailed + ' item gagal tersinkron');
      }
    });
    window.addEventListener('sayur:sync-error', e => {
      showToast('Sync error: ' + e.detail.error);
    });
    document.getElementById('btnForceSync').addEventListener('click', async () => {
      if(!navigator.onLine){ showToast('Tidak ada koneksi'); return; }
      showToast('Menyinkron…');
      try{
        /* Item gagal di-reset dulu supaya dicoba kirim lagi */
        SayurStorage.queue.resetFailed();
        const r = await SayurStorage.processQueue();
        if(r.skipped && r.reason === 'empty'){
          showToast('Semua sudah tersinkron');
        }
      }catch(e){
        showToast('Gagal sinkron');
      }
    });
    document.getElementById('btnDiscardFailed').addEventListener('click', () => {
      const n = SayurStorage.queue.failedCount();
      if(n === 0) return;
      if(!confirm('Buang ' + n + ' item yang gagal? Data ini tidak akan masuk ke Google Sheets.')) return;
      SayurStorage.discardFailed();
      showToast('Item gagal dibuang');
      if(App.currentTab === 'laporan' && Laporan.currentTab === 'saldo') Laporan.loadSaldo().catch(() => {});
    });

    /* Auto-refresh Laporan saat tab aktif */
    document.addEventListener('visibilitychange', () => {
      if(document.hidden) return;
      if(App.currentTab === 'laporan' && navigator.onLine){
        if(Laporan.currentTab === 'saldo') Laporan.loadSaldo().catch(() => {});
        if(Laporan.currentTab === 'riwayat') Laporan.loadRiwayat().catch(() => {});
      }
    });
  }

  async function init(){

    try{
      if(!localStorage.getItem('sayur_first_use')){
        localStorage.setItem('sayur_first_use', todayYmd());
      }
    }catch(e){}

    initDarkMode();
    initKebab();
    initNotaBtn();

    document.querySelectorAll('.navbar button').forEach(btn => {
      btn.addEventListener('click', () => goTab(btn.dataset.tab));
    });

    const updateDate = () => {
      document.getElementById('topbarDate').textContent =
        new Date().toLocaleDateString('id-ID',
          {weekday:'short', day:'numeric', month:'short'});
    };
    updateDate();
    setInterval(updateDate, 60000);

    try{
      const set = await SayurStorage.pengaturan.get();
      App.pengaturan = {...App.pengaturan, ...set};
      if(set.NamaLapak){
        document.getElementById('topbarTitle').textContent = set.NamaLapak;
      }
    }catch(e){}

    initStorageEvents();

    /* Sync hari libur dari server di background */
    Libur.syncFromServer().catch(() => {});

    const belSubTab = document.querySelectorAll('.subtabs-bel button[data-beltab]');
    belSubTab.forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.subtabs-bel button').forEach(b =>
          b.classList.toggle('active', b === btn));
        document.querySelectorAll('.tab-bel').forEach(t => t.classList.remove('active'));
        const el = document.getElementById('tabBel' +
          btn.dataset.beltab.charAt(0).toUpperCase() +
          btn.dataset.beltab.slice(1));
        if(el) el.classList.add('active');
      });
    });

    const VALID_TABS = ['beranda','belanja','tutup','laporan'];
    let startTab = null;

    try{
      const urlParams = new URLSearchParams(window.location.search);
      const t = urlParams.get('tab');
      if(t && VALID_TABS.indexOf(t) >= 0) startTab = t;
    }catch(e){}

    if(!startTab){
      try{
        const saved = localStorage.getItem('sayur_last_tab');
        if(saved && VALID_TABS.indexOf(saved) >= 0) startTab = saved;
      }catch(e){}
    }
    if(!startTab) startTab = 'beranda';

    if(window.history && window.history.replaceState && startTab !== 'beranda'){
      const isFromParam = (function(){
        try{
          return new URLSearchParams(window.location.search).has('tab');
        }catch(e){ return false; }
      })();
      if(isFromParam){
        try{ window.history.replaceState({}, '', window.location.pathname); }catch(e){}
      }
    }

    goTab(startTab);

    if('serviceWorker' in navigator){
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .catch(err => console.warn('SW gagal:', err));
      });
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
<script>
(function(){
  var vv = window.visualViewport;
  function cur(){ return Math.min(window.innerHeight, vv ? vv.height : window.innerHeight); }
  var base = cur();
  function isField(el){
    return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
  }
  function check(){
    var ae = document.activeElement;
    if(!isField(ae)) base = cur();
    var open = cur() < base * 0.75;
    var inRencana = !!(ae && ae.closest && ae.closest('#tabBelRencana'));
    document.body.classList.toggle('kb-rencana', open && inRencana);
  }
  window.addEventListener('resize', check);
  if(vv) vv.addEventListener('resize', check);
  document.addEventListener('focusin', function(){ setTimeout(check, 50); });
  document.addEventListener('focusout', function(){ setTimeout(check, 100); });
})();
</script>
</body>
</html>
