  /* ==========================================================
     KEYPAD
     ========================================================== */
  var keypad = $('keypad');
  var kpAct = $('kpAct');
  var kpEl = null;
  var kpFresh = false;
  var KP_ORDER = ['qty', 'harga-beli', 'harga-jual'];
  var SET_ORDER = ['ops', 'biayaBensin', 'biayaLain', 'bayarHutang', 'tambahModal'];

  function kpLift(on){
    var f = $('appFooter');
    f.classList.toggle('kp-edit', on);
    f.style.bottom = on ? keypad.offsetHeight + 'px' : '';
    f.style.setProperty('--kp-h', keypad.offsetHeight + 'px');
  }
  function kpIsRp(el){ return !el.classList.contains('qty'); }
  function kpWrap(el){ return el.closest('.qty-stepper, .rp-field'); }

  var KP_B2 = keypad.querySelector('[data-k="back2"]');
  var KP_B2_HTML = KP_B2 ? KP_B2.innerHTML : '';

  function kpList(el){
    var it = el.closest('.item');
    if(it) return Array.prototype.slice.call(it.querySelectorAll('.item-detail input[readonly]'));
    var box = el.closest('.sheet-body, .fm-card, .fk-page');
    return box ? Array.prototype.slice.call(box.querySelectorAll('input[data-kp]')) : [];
  }
  function kpNextEl(){
    if(!kpEl) return null;
    if(!kpEl.closest('.item') && kpEl.closest('.settings-panel')){
      var si = SET_ORDER.indexOf(kpEl.id);
      return (si >= 0 && si < SET_ORDER.length - 1) ? $(SET_ORDER[si + 1]) : null;
    }
    var l = kpList(kpEl), i = l.indexOf(kpEl);
    return (i >= 0 && i < l.length - 1) ? l[i + 1] : null;
  }

  function kpSync(){
    if(!kpEl) return;
    var rpMode = kpIsRp(kpEl);
    if(KP_B2){
      if(rpMode){
        KP_B2.setAttribute('data-k', 'back2'); KP_B2.innerHTML = KP_B2_HTML;
        KP_B2.setAttribute('aria-label', 'Hapus');
      } else {
        KP_B2.setAttribute('data-k', ','); KP_B2.textContent = ',';
        KP_B2.setAttribute('aria-label', 'Koma');
      }
    }
    Array.prototype.forEach.call(keypad.querySelectorAll('[data-k]'), function(b){
      var k = b.getAttribute('data-k');
      b.disabled = (rpMode && k === ',') || (!rpMode && (k === '00' || k === '000'));
    });
    kpAct.textContent = kpNextEl() ? 'Lanjut' : 'Selesai';
    kpEl.classList.toggle('kp-fresh', kpFresh && kpEl.value !== '');
  }

  function kpActivate(el){
    if(kpEl && kpEl !== el){
      var w0 = kpWrap(kpEl);
      if(w0) w0.classList.remove('kp-on');
      kpEl.classList.remove('kp-fresh');
    }
    kpEl = el;
    kpFresh = true;
    kpWrap(el).classList.add('kp-on');

    var it = el.closest('.item');
    var inSettings = !it && !!el.closest('.settings-panel');
    var nm, fld;
    if(it){
      var nEl = it.querySelector('.item-name');
      nm = it.dataset.nama || (nEl ? nEl.textContent : '');
      var uEl = it.querySelector('.qty-unit');
      var u = uEl ? uEl.textContent : unitOf(nm);
      fld = el.classList.contains('qty') ? 'Qty (' + u + ')'
        : (el.classList.contains('harga-beli') ? 'Harga Beli /' : 'Harga Jual /') + u;
    } else if(inSettings){
      var lab = document.querySelector('label[for="' + el.id + '"]');
      nm = 'Biaya Belanja';
      fld = lab ? lab.textContent : '';
    } else {
      var sh = el.closest('.sheet');
      var h2 = sh && sh.querySelector('.sheet-head h2');
      nm = h2 ? h2.textContent : (el.closest('#tabNota') ? 'Nota' : 'Pesanan');
      var lb = el.closest('.field, .df');
      lb = lb && lb.querySelector('label, .df-label');
      fld = lb ? lb.textContent.replace(/\s+/g, ' ').trim() : 'Jumlah';
    }
    $('kpName').textContent = nm;
    $('kpField').textContent = fld;

    keypad.classList.add('show');
    keypad.setAttribute('aria-hidden', 'false');
    document.body.classList.add('kp-open');
    updateFab();
    kpSync();
    if(it){
      kpLift(false);
      ensureVisible(it);
    } else if(inSettings){
      kpLift(true);
      setTimeout(function(){
        var w = kpWrap(el);
        if(w && kpEl === el && w.scrollIntoView) w.scrollIntoView({block: 'nearest', behavior: 'smooth'});
      }, 260);
    } else {
      kpLift(false);
      setTimeout(function(){
        var w = kpWrap(el);
        if(!w || kpEl !== el) return;
        if(w.closest('.sheet')){
          w.scrollIntoView({block: 'center', behavior: 'smooth'});
        } else {
          var lim = keypad.getBoundingClientRect().top - 12;
          var r = w.getBoundingClientRect();
          if(r.bottom > lim) window.scrollBy({top: r.bottom - lim, behavior: 'smooth'});
        }
      }, 300);
    }
  }

  function kpClose(){
    if(kpEl){
      var w = kpWrap(kpEl);
      if(w) w.classList.remove('kp-on');
      kpEl.classList.remove('kp-fresh');
      kpEl.blur();
    }
    kpEl = null;
    kpLift(false);
    keypad.classList.remove('show');
    keypad.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('kp-open');
    updateFab();
  }

  function kpNext(){
    var n = kpNextEl();
    if(!n){ kpClose(); return; }
    kpActivate(n);
  }

  function kpPress(k){
    if(!kpEl) return;
    if(k === 'next'){ kpNext(); return; }
    var el = kpEl;
    var rpMode = kpIsRp(el);
    var raw = rpMode ? String(digits(el.value) || '') : el.value;
    if(kpFresh) raw = '';

    if(k === 'back' || k === 'back2'){
      raw = kpFresh ? '' : raw.slice(0, -1);
    } else if(k === ','){
      if(rpMode) return;
      if(raw.indexOf(',') === -1) raw = (raw === '' ? '0' : raw) + ',';
    } else if(rpMode){
      if(raw === '' && /^0+$/.test(k)) return;
      if((raw + k).length > 9) return;
      raw = raw + k;
    } else {
      if(k.length > 1) return;
      if(raw === '0') raw = '';
      var ci = raw.indexOf(',');
      if(ci !== -1 && raw.length - ci > 2) return;
      if(raw.length >= 6) return;
      raw = raw + k;
    }

    kpFresh = false;
    el.value = rpMode ? fmtNum(parseInt(raw || '0', 10)) : raw;
    el.dispatchEvent(new Event('input', {bubbles: true}));
    kpSync();
  }

  keypad.addEventListener('click', function(e){
    var b = e.target.closest('[data-k]');
    if(b) kpPress(b.getAttribute('data-k'));
  });
  $('kpClose').addEventListener('click', kpClose);

  $('settingsPanel').addEventListener('click', function(e){
    var f = e.target.closest('.rp-field');
    if(!f) return;
    var inp = f.querySelector('input');
    if(inp) kpActivate(inp);
  });
  document.addEventListener('click', function(e){

        e.target.closest('.settings-panel') || e.target.closest('.rp-field, .qty-stepper')) return;

  function doSend(){
    fab.classList.add('busy');
    var tanggal = todayYmd();
    var names = selectedNames();
    var s = state.set;
    var jobs = [];

    names.forEach(function(n){
      var d = state.items[n];
      var payload = {
        id: 'b-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        tanggal: tanggal,
        namaBarang: n,
        qty: d.qty,
        satuan: unitOf(n),
        hargaBeli: d.beli,
        hargaJual: d.jual,
        metode: 'Cash',
        bayarNanti: d.nanti === true,
        supplier: d.nanti ? (d.supplier || '') : ''
      };
      jobs.push({action: 'addBelanja', data: payload});

      /* Rencana adalah acuan harga: setiap item yang disimpan juga memperbarui
         harga master, supaya Pesanan & Nota memakai harga beli/jual terbaru. */
      if(d.beli > 0 || d.jual > 0){
        jobs.push({
          action: 'updateHargaMaster',
          data: {
            namaBarang: n,
            satuan: unitOf(n),
            hargaBeli: d.beli,
            hargaJual: d.jual,
            qty: d.qty
          }
        });
      }

      if(d.nanti && d.supplier){
        jobs.push({
          action: 'addHutang',
          data: {
            id: 'ht-' + payload.id,
            tipe: 'HutangSaya',
            nama: d.supplier,
            jumlah: d.qty * d.beli,
            catatan: n + ' ' + fmtQty(d.qty) + ' ' + unitOf(n),
            sumber: 'Supplier',
            tanggal: tanggal
          }
        });
      }
    });

    jobs.push({
      action: 'setBiayaOperasional',
      data: {
        tanggal: tanggal,
        operasionalBelanja: s.ops,
        operasionalMetode: 'Cash',
        bensin: s.biayaBensin,
        bensinMetode: 'Cash',
        konsumsi: s.biayaLain,
        konsumsiMetode: 'Cash'
      }
    });

    if(s.bayarHutang > 0){
      jobs.push({
        action: 'addPembayaranHutang',
        data: {
          id: 'ph-' + tanggal + '-' + Date.now(),
          hutangId: '', jumlah: s.bayarHutang,
          metode: 'Cash', tanggal: tanggal
        }
      });
    }

    if(s.tambahModal > 0){
      jobs.push({
        action: 'tambahMutasi',
        data: {
          id: 'm-modal-' + tanggal,
          tipe: 'Tarik', metode: 'Cash',
          jumlah: s.tambahModal, tujuan: 'Modal',
          catatan: 'Tambah modal belanja', sumber: 'Modal',
          tanggal: tanggal
        }
      });
    }

    var idx = 0;
    function runNext(){
      if(idx >= jobs.length){
        fab.classList.remove('busy');
        toast('✓ Tersimpan ke database');
        var last = readLast();
        names.forEach(function(n){
          var d = state.items[n], m = masterOf(n);
          /* Qty & harga yang baru dibeli jadi default belanja berikutnya */
          if(d.qty > 0) m.defQty = String(d.qty);
          if(d.beli > 0) m.beli = d.beli;
          if(d.jual > 0) m.jual = d.jual;
          last[n] = { qty: d.qty, beli: d.beli, jual: d.jual, tgl: tanggal };
          d.chk = false; d.qty = 0; d.beli = 0; d.jual = 0;
        });
        writeLast(last);
        save();
        render();
        return;
      }
      var job = jobs[idx++];
      SayurStorage.post(job.action, job.data)
        .then(runNext)
        .catch(function(){ runNext(); });
    }
    runNext();
  }

  function tglPanjang(){

      return new Date().toLocaleDateString('id-ID',
        {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
    }catch(e){ return ''; }

  function buildShare(mode){
    var names = selectedNames(), lines = [], count = 0, missing = 0;
    if(mode === 'beli'){
      names.forEach(function(n){
        var d = state.items[n], u = unitOf(n);
        if(!d.qty) missing++;
        count++;
        var line = count + '. ' + n + ' — ' + (d.qty ? fmtQty(d.qty) + ' ' + u : '(qty belum diisi)');
        if(incHargaBeli && d.beli) line += ' @' + rp(d.beli);
        if(d.nanti) line += d.supplier ? ' (nanti → ' + d.supplier + ')' : ' (nanti)';
        lines.push(line);
      });
      if(!count) return {text: '', count: 0, missing: 0};
      return {
        text: '*Daftar Belanja*\n' + tglPanjang() + '\n\n' + lines.join('\n') + '\n\n' + count + ' barang',
        count: count, missing: missing
      };
    }
    names.forEach(function(n){
      var d = state.items[n];
      if(d.jual > 0){ count++; lines.push(n + ' — ' + rp(d.jual) + '/' + unitOf(n)); }
      else missing++;
    });
    if(!count) return {text: '', count: 0, missing: 0};
    return {
      text: '*Daftar Harga Jual*\n' + tglPanjang() + '\n\n' + lines.join('\n'),
      count: count, missing: missing
    };
  }

  function copyText(text, done){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      ta.remove();
      done();
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  function renderShare(){
    Array.prototype.forEach.call($('shareSeg').querySelectorAll('[data-mode]'), function(b){
      b.classList.toggle('on', b.getAttribute('data-mode') === shareMode);
    });
    $('optBeliRow').hidden = shareMode !== 'beli';
    $('optHargaBeli').checked = incHargaBeli;
    var r = buildShare(shareMode);
    $('sharePreview').textContent = r.count ? r.text
      : (shareMode === 'beli' ? 'Belum ada barang terpilih.' : 'Belum ada barang terpilih yang punya harga jual.');
    $('sharePreview').classList.toggle('empty', !r.count);
    if(r.missing){

        ? r.missing + ' barang belum diisi qty.'

    } else {
      $('shareWarn').hidden = true;

    $('shareGo').disabled = !r.count;
    $('shareCopy').disabled = !r.count;

     ========================================================== */
  var NotaKit = (function(){
    function angka(n){ return Number(n || 0).toLocaleString('id-ID'); }
    function normItems(items, hitungSub){
      return (items || []).map(function(it){
        var harga = Number(it.HargaJual) || 0;
        var sub = Number(it.Subtotal);
        if(!sub && hitungSub) sub = (parseFloat(String(it.Qty).replace(',', '.')) || 0) * harga;
        return {nama: String(it.NamaBarang || ''), qty: it.Qty, satuan: it.Satuan || '', harga: harga, sub: sub || 0};
      });
    }
    function fromPesanan(p){
      var total = Number(p.Total) || 0, dibayar = Number(p.Dibayar) || 0;
      var sisa = Number(p.Sisa);
      if(isNaN(sisa)) sisa = Math.max(0, total - dibayar);
      return {judul: 'Nota Pesanan', nama: p.Nama || '', noHP: p.NoHP || '', ket: p.Keterangan || '',
        tanggal: p.Tanggal, items: normItems(p.Items, false), total: total, dibayar: dibayar,
        sisa: sisa, lunas: sisa <= 0};
    }
    function fromNota(n){
      var items = normItems(n.Items, true);
      var total = Number(n.Total) || items.reduce(function(s, it){ return s + it.sub; }, 0);
      var dibayar = Number(n.Dibayar) || 0;
      var sisa = Math.max(0, total - dibayar);
      return {judul: 'Nota', nama: n.Nama || '', noHP: n.NoHP || '', ket: '',
        tanggal: n.Tanggal, items: items, total: total, dibayar: dibayar, sisa: sisa, lunas: sisa <= 0};
    }
    function text(n, opsi){
      var L = [];
      L.push(SETTINGS.NamaLapak || 'H. Mawih Sayur');
      if(SETTINGS.NoHP) L.push('HP: ' + SETTINGS.NoHP);
      L.push('');
      L.push(n.judul);
      L.push('─────────────────────────────');
      if(n.nama) L.push('Nama    : ' + n.nama);
      if(opsi.tampilHP && n.noHP) L.push('HP      : ' + n.noHP);
      L.push('Tanggal : ' + fmtTglPanjang(n.tanggal));
      if(opsi.tampilCatatan && n.ket) L.push('Catatan : ' + n.ket);
      L.push('');
      var maxNama = Math.max.apply(null, n.items.map(function(it){ return it.nama.length; }).concat([6]));
      n.items.forEach(function(it){
        var nm = it.nama; while(nm.length < maxNama) nm += ' ';
        var qty = it.qty + ' ' + it.satuan; while(qty.length < 10) qty += ' ';
        var hrg = '×' + angka(it.harga); while(hrg.length < 9) hrg = ' ' + hrg;
        var sub = '=' + angka(it.sub); while(sub.length < 10) sub = ' ' + sub;
        L.push(nm + '  ' + qty + ' ' + hrg + '  ' + sub);
      });
      L.push('─────────────────────────────');
      L.push('Total   : Rp ' + angka(n.total));
      L.push('Dibayar : Rp ' + angka(n.dibayar));
      L.push(n.lunas ? 'Status  : LUNAS' : 'Sisa    : Rp ' + angka(n.sisa));
      L.push('');
      L.push('Terima kasih');
      return L.join('\n');
    }
    function open(n, o){
      o = o || {};
      var opsi = {tampilHP: true, tampilCatatan: true};
      var rows = '';
      if(n.noHP) rows += '<div class="opsi-row on" id="nkHp"><span class="lbl">No HP pemesan <small>' +
        escHtml(n.noHP) + '</small></span><span class="sw"></span></div>';
      if(n.ket) rows += '<div class="opsi-row on" id="nkKet"><span class="lbl">Catatan pemesan <small>' +
        escHtml(n.ket) + '</small></span><span class="sw"></span></div>';
      var ov = openDynamicSheet({
        title: o.saved ? '✓ Nota Tersimpan' : 'Bagikan Nota',
        sub: escHtml(n.nama || 'Tanpa nama'),
        body:
          (rows ? '<div class="nk-label">Tampilkan di nota</div>' + rows + '<div style="height:8px"></div>' : '') +
          '<div class="nota-preview-pes" id="nkPreview"></div>',
        actions:
          '<button type="button" class="btn btn-primary" id="nkShare">Bagikan</button>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn btn-secondary" id="nkCopy">Salin teks</button>' +
            '<button type="button" class="btn btn-secondary" id="nkPrint">Cetak</button>' +
          '</div>' +
          '<button type="button" class="btn btn-ghost" data-close>Tutup</button>'
      });
      var box = ov.querySelector('#nkPreview');
      function refresh(){ box.textContent = text(n, opsi); }
      refresh();
      function toggle(id, key){
        var el = ov.querySelector(id);
        if(!el) return;
        el.addEventListener('click', function(){
          opsi[key] = !opsi[key];
          el.classList.toggle('on', opsi[key]);
          refresh();
        });
      }
      toggle('#nkHp', 'tampilHP');
      toggle('#nkKet', 'tampilCatatan');
      ov.querySelector('#nkShare').addEventListener('click', function(){
        var t = text(n, opsi);
        if(navigator.share){
          navigator.share({title: n.judul + (n.nama ? ' ' + n.nama : ''), text: t}).catch(function(){});
        } else {
          Shared.copyText(t, function(ok){ toast(ok ? 'Disalin, tempel di WhatsApp' : 'Gagal menyalin'); });
        }
      });
      ov.querySelector('#nkCopy').addEventListener('click', function(){
        Shared.copyText(text(n, opsi), function(ok){ toast(ok ? 'Teks disalin' : 'Gagal menyalin'); });
      });
      ov.querySelector('#nkPrint').addEventListener('click', function(){
        if(window.PrintKit) PrintKit.printNota(n, opsi, {toko: SETTINGS.NamaLapak || 'H. Mawih Sayur',
          hp: SETTINGS.NoHP || '', tanggal: fmtTglPanjang(n.tanggal)});
        else toast('Fitur cetak belum tersedia');
      });
      return ov;
    }
    return {fromPesanan: fromPesanan, fromNota: fromNota, text: text, open: open};

  var FormKit = {
    SEARCH_ICO: '<svg class="search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    pq: function(q){

      return isNaN(f) ? 0 : f;
    },
    sub: function(it){ return FormKit.pq(it.qty) * (Number(it.hargaJual) || 0); },

    formHead: function(backId, title, sub){

    searchBar: function(id, placeholder, addLabel, addAlways){
      return '<div class="search-sticky"><div class="search-inner">' +
        '<div class="search-field">' + FormKit.SEARCH_ICO +
          '<input type="text" id="' + id + '" placeholder="' + escHtml(placeholder) +
            '" autocomplete="off" autocorrect="off" spellcheck="false">' +
          '<button type="button" class="search-clear" id="' + id + 'Clear" hidden aria-label="Bersihkan"><span>✕</span></button>' +
        '</div>' +
        '<button type="button" class="add-btn" id="' + id + 'Add"' + (addAlways ? '' : ' hidden') + '>' +
          escHtml(addLabel) + '</button>' +
      '</div><div class="fm-ac-drop" id="' + id + 'Drop"></div></div>';
    },

    /* o: {source, onPick, onNew}  (mode pilih barang)
       o: {onFilter, onAdd, initial} (mode filter daftar) */
    bindSearch: function(id, o){
      var inp = $(id), clr = $(id + 'Clear'), add = $(id + 'Add'), drop = $(id + 'Drop');
      if(!inp) return;
      var matches = [];
      function hideDrop(){ if(drop){ drop.style.display = 'none'; drop.innerHTML = ''; } }
      function refresh(){
        var q = inp.value.trim();
        clr.hidden = !q;
        if(o.onFilter){ o.onFilter(q.toLowerCase()); return; }
        var ql = q.toLowerCase();
        if(!ql){ hideDrop(); add.hidden = true; matches = []; return; }
        var src = (o.source && o.source()) || [];
        matches = src.filter(function(m){ return m.nama.toLowerCase().indexOf(ql) !== -1; }).slice(0, 8);
        var exact = src.some(function(m){ return m.nama.toLowerCase() === ql; });
        add.hidden = exact;
        if(!matches.length){
          drop.innerHTML = '<div class="fm-ac-none">Barang tidak ditemukan. Tekan + Tambah.</div>';
        } else {
          drop.innerHTML = matches.map(function(m, i){
            var hj = m.hargaJual || (o.hargaDefault ? o.hargaDefault(m) : 0);
            return '<div class="fm-ac-item" data-ac="' + i + '">' +
              '<div class="nm">' + escHtml(m.nama) + ' <small>· ' + escHtml(m.satuan) + '</small></div>' +
              '<div class="hj">' + (hj ? rp(hj) : '') + '</div></div>';
          }).join('');
        }
        drop.style.display = 'block';
      }
      inp.addEventListener('input', refresh);
      inp.addEventListener('focus', function(){ if(!o.onFilter && inp.value.trim()) refresh(); });
      inp.addEventListener('blur', function(){ setTimeout(hideDrop, 180); });
      clr.addEventListener('click', function(){ inp.value = ''; refresh(); inp.focus(); });
      if(drop) drop.addEventListener('pointerdown', function(e){
        var el = e.target.closest('[data-ac]');
        if(!el) return;
        e.preventDefault();
        var m = matches[Number(el.dataset.ac)];
        inp.value = '';
        hideDrop(); clr.hidden = true; add.hidden = true;
        if(m && o.onPick) o.onPick(m);
      });
      add.addEventListener('click', function(){
        var raw = inp.value.trim();
        if(o.onFilter){ if(o.onAdd) o.onAdd(raw); return; }
        if(!raw) return;
        inp.value = '';
        hideDrop(); clr.hidden = true; add.hidden = true;
        if(o.onNew) o.onNew(FormKit.titleCase(raw));
      });
      if(o.initial){ inp.value = o.initial; }
      if(o.onFilter) refresh();
    },

      return '<div class="fk-page"><div class="fm-card">' +

    itemCard: function(it, i, isOpen, withBeli){

    itemsHtml: function(items, openIdx, withBeli){

    applyOpen: function(root, openIdx){
      Array.prototype.forEach.call(root.querySelectorAll('.fk-item'), function(el){
        el.classList.toggle('open', Number(el.dataset.i) === openIdx);
      });
    },
    refreshItem: function(root, items, i){
      var s = root.querySelector('[data-sub="' + i + '"]');
      if(s) s.textContent = rp(FormKit.sub(items[i]));
      var t = root.querySelector('[data-sum="' + i + '"]');
      if(t) t.innerHTML = FormKit.sumText(items[i]);
    },
    /* cb: {onChange, onDelete(i), onToggle(i)} */
    bindItems: function(root, items, cb){
      if(!root) return;
      root.addEventListener('click', function(e){
        var del = e.target.closest('[data-del]');
        if(del){ kpClose(); cb.onDelete(Number(del.dataset.del)); return; }
        var q = e.target.closest('[data-qstep]');
        if(q){
          var i = Number(q.dataset.i);
          var v = Math.max(0, Math.round((FormKit.pq(items[i].qty) + Number(q.dataset.qstep)) * 100) / 100);
          items[i].qty = String(v);
          var inp = root.querySelector('[data-f="qty"][data-i="' + i + '"]');
          if(inp) inp.value = String(v).replace('.', ',');
          FormKit.refreshItem(root, items, i);
          cb.onChange();
          return;
        }
        var tg = e.target.closest('[data-tog]');
        if(tg){ kpClose(); cb.onToggle(Number(tg.dataset.tog)); }
      });
      root.addEventListener('input', function(e){
        var t = e.target, f = t.dataset && t.dataset.f;
        if(!f) return;
        var i = Number(t.dataset.i);
        if(f === 'qty'){
          t.value = t.value.replace(/[^\d.,]/g, '');
          items[i].qty = t.value.replace(',', '.');
        } else {
          var n = digits(t.value);
          items[i][f] = n;
          t.value = n ? n.toLocaleString('id-ID') : '';
        }
        FormKit.refreshItem(root, items, i);
        cb.onChange();
      });
    },

  /* ==========================================================

  var PesananModule = {
    list: [], currentId: null, riwayatOpen: false,
    masterBarang: [], piutangList: [],
    TOLERANSI_SELISIH: 10000,
    baru: false, draft: null, openIdx: -1, q: '',

    async load(){
      await this.loadMaster();
      await this.loadList();
      await this.loadPiutang();
      this.render();
    },
    async loadMaster(){
      /* Satu sumber harga: baca langsung dari MASTER (dikelola di tab Rencana),
         bukan fetch terpisah, supaya pencarian barang selalu pakai harga terbaru. */
      try{
        this.masterBarang = Object.keys(MASTER).map(function(n){
          var m = MASTER[n] || {};
          return {
            nama: n, satuan: m.satuan || 'kg',
            hargaBeli: Number(m.beli) || 0, hargaJual: Number(m.jual) || 0
          };
        }).sort(function(a, b){ return a.nama.localeCompare(b.nama, 'id'); });
      }catch(e){ this.masterBarang = []; }
    },
    async loadList(){
      try{ this.list = await SayurStorage.get('getPesanan') || []; }
      catch(e){ this.list = []; }
    },
    async loadPiutang(){
      try{
        var list = await SayurStorage.get('getHutang', {tipe:'PiutangSaya', sumber:'Pesanan'});
        this.piutangList = (list || []).filter(function(h){ return h.Status !== 'Lunas'; });
      }catch(e){ this.piutangList = []; }
    },

    render(){
      kpClose();
      var el = $('tabPesanan');
      if(!el) return;
      el.innerHTML = this.baru ? this.renderBaru()
        : (this.currentId ? this.renderDetail() : this.renderList());
      this.attachHandlers();
    },

    statusPesanan(p){
      var lunas = (Number(p.Sisa) || 0) <= 0;
      if(p.SudahSerah && lunas) return {kode:'selesai', label:'Selesai'};
      if(p.SudahSerah && !lunas) return {kode:'belum_lunas', label:'Belum Lunas'};
      if(p.SudahBelanja) return {kode:'siap_serah', label:'Siap Diserahkan'};
      return {kode:'perlu_belanja', label:'Perlu Dibelanjakan'};
    },
    selisihHari(ymdStr){
      if(!ymdStr) return 0;
      var p = ymdStr.split('-').map(Number);
      var target = new Date(p[0], p[1]-1, p[2]);
      var now = new Date(); now.setHours(0,0,0,0);
      return Math.floor((now - target) / (1000*60*60*24));
    },

    renderList(){
      var self = this;
      var aktif = this.list.filter(function(p){ return p.Status !== 'selesai'; });
      var selesai = this.list.filter(function(p){ return p.Status === 'selesai'; });
      var html = FormKit.searchBar('plSearch', 'Cari pesanan', '+ Pesanan', true);

      if(this.piutangList.length){
        var totalSisa = this.piutangList.reduce(function(s,h){ return s + (Number(h.Sisa)||0); }, 0);
        html += '<div class="banner-piutang">' +
          '<div class="bp-title">💰 Piutang Pesanan: ' + rp(totalSisa) + '</div>' +
          this.piutangList.map(function(h){
            return '<div class="bp-item"><span>' + escHtml(h.Nama) + '</span><b>' + rp(h.Sisa) + '</b></div>';
          }).join('') +
        '</div>';
      }

      var body = '';
      if(aktif.length){
        body += '<div class="section-head-pesanan" style="padding-left:0;padding-right:0;"><span>Pesanan Aktif</span><span>' +
          aktif.length + '</span></div>';
        body += aktif.map(function(p){ return self.renderKartu(p); }).join('');
      } else {
        body += '<div class="pesanan-empty">Belum ada pesanan aktif.<br>Tekan + Pesanan untuk membuat.</div>';
      }
      if(selesai.length){
        body += '<button class="riwayat-toggle ' + (this.riwayatOpen ? 'open' : '') +
          '" id="btnRiwayat" style="width:100%;margin:8px 0;"><span>Riwayat <span class="cnt">' + selesai.length +
          '</span></span><span>' + (this.riwayatOpen ? '▲' : '▼') + '</span></button>';
        if(this.riwayatOpen){
          body += selesai.map(function(p){ return self.renderKartu(p); }).join('');
        }
      }
      html += '<div class="pesanan-list" style="padding-top:4px;">' + body + '</div>';
      return html;
    },

    renderKartu(p){
      var st = this.statusPesanan(p);
      var sisa = Number(p.Sisa) || 0;
      var total = Number(p.Total) || 0;
      var dibayar = Number(p.Dibayar) || 0;
      var items = p.Items || [];
      var lewat = !p.SudahBelanja ? this.selisihHari(p.Tanggal) : 0;
      var overdue = !p.SudahBelanja && lewat > 0;
      var cls = ['order-card'];
      if(p.Status === 'selesai') cls.push('done');
      if(overdue) cls.push('overdue');

      return '<div class="' + cls.join(' ') + '" data-id="' + escHtml(p.ID) + '" data-q="' +
        escHtml((String(p.Nama || '') + ' ' + String(p.NoHP || '') + ' ' +
          (items.map(function(it){ return it.NamaBarang; }).join(' '))).toLowerCase()) + '">' +
        '<div class="order-head">' +
          '<div style="min-width:0;flex:1;">' +
            '<div class="order-name">' + escHtml(p.Nama) + '</div>' +
            '<div class="order-meta">' +
              '<span>' + escHtml(fmtTglPendek(p.Tanggal)) + '</span>' +
              '<span>·</span><span>' + items.length + ' barang</span>' +
              (p.NoHP ? '<span>·</span><span>📱 ' + escHtml(p.NoHP) + '</span>' : '') +
              (overdue ? '<span style="color:var(--danger);font-weight:600;">⚠ ' + lewat + ' hari</span>' : '') +
            '</div>' +
          '</div>' +
          '<span class="order-badge ' + st.kode + '">' + st.label + '</span>' +
        '</div>' +
        (p.Keterangan ?
          '<div style="font-size:var(--fs-xs);color:var(--text-2);padding:6px 10px;background:var(--bg);border-radius:6px;border-left:2px solid var(--warn);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
          escHtml(p.Keterangan) + '</div>' : '') +
        '<div class="order-summary">' +
          '<span>' + rp(total) + (dibayar > 0 && sisa > 0 ? ' · DP ' + rp(dibayar) : '') + '</span>' +
          '<span class="os-right"><b class="' + (sisa <= 0 ? 'paid' : '') + '">' +
            (sisa <= 0 ? '✓ Lunas' : 'Sisa ' + rp(sisa)) +
          '</b>' + SHARE_BTN + '</span>' +
        '</div>' +
      '</div>';
    },

    renderDetail(){
      var self = this;
      var p = this.list.find(function(x){ return x.ID === self.currentId; });
      if(!p){ this.currentId = null; return this.renderList(); }
      var st = this.statusPesanan(p);
      var total = Number(p.Total) || 0;
      var dibayar = Number(p.Dibayar) || 0;
      var sisa = Number(p.Sisa) || 0;
      var lunas = sisa <= 0;
      var items = p.Items || [];
      var html = '';

      html += '<div class="detail-head-pesanan">' +
        '<button class="btn-back-pesanan" id="btnPesananBack">' +
          '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>' +
        '</button>' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="detail-title-pesanan">' + escHtml(p.Nama) + '</div>' +
          '<div class="detail-sub-pesanan">' + escHtml(fmtTglPendek(p.Tanggal)) + '</div>' +
        '</div>' +

    attachHandlers(){
      var self = this;
      if(this.baru){ this.attachBaru(); return; }

      FormKit.bindSearch('plSearch', {
        initial: this.q,
        onFilter: function(q){
          self.q = q;
          document.querySelectorAll('#tabPesanan .order-card[data-q]').forEach(function(c){
            c.hidden = !!q && c.dataset.q.indexOf(q) === -1;
          });
        },
        onAdd: function(){ self.openNewSheet(); }
      });
      var btnRiwayat = $('btnRiwayat');
      if(btnRiwayat) btnRiwayat.addEventListener('click', function(){
        self.riwayatOpen = !self.riwayatOpen; self.render();
      });
      document.querySelectorAll('#tabPesanan .oc-share').forEach(function(btn){
        btn.addEventListener('click', function(ev){
          ev.stopPropagation();
          var id = btn.closest('.order-card').dataset.id;
          var p = self.list.find(function(x){ return String(x.ID) === String(id); });
          if(p) NotaKit.open(NotaKit.fromPesanan(p));
        });
      });
      document.querySelectorAll('#tabPesanan .order-card').forEach(function(card){
        card.addEventListener('click', function(){
          self.currentId = card.dataset.id; self.render(); window.scrollTo(0, 0);
        });
      });
      var btnBack = $('btnPesananBack');
      if(btnBack) btnBack.addEventListener('click', function(){
        self.currentId = null; self.render();
      });
      var btnEdit = $('btnEditInfoPesanan');
      if(btnEdit) btnEdit.addEventListener('click', function(){ self.openEditInfoSheet(); });
      document.querySelectorAll('#tabPesanan .price-edit').forEach(function(el){
        el.addEventListener('click', function(){ self.openEditItemSheet(el.dataset.itemId); });
      });

        el.addEventListener('click', function(ev){ ev.stopPropagation(); self.hapusItem(el.dataset.itemId); });

        source: function(){ return self.masterBarang; },

      if(btnMulai) btnMulai.addEventListener('click', function(){ self.openSumberSaldoSheet(); });
      var btnSerah = $('btnTandaiSerah');

      if(btnShareHead) btnShareHead.addEventListener('click', function(){ self.openNotaSheet(); });

    /* ---------- Pesanan baru (halaman form, selaras Rencana) ---------- */
    renderBaru(){
      var d = this.draft;
      var total = d.items.reduce(function(s, it){ return s + FormKit.sub(it); }, 0);
      return FormKit.formHead('btnBaruBack', 'Pesanan Baru', 'Isi data pemesan dan barang') +
        FormKit.pemesanCard(d, 'pb', {namaWajib: true, ket: true}) +
        FormKit.searchBar('pbSearch', 'Cari barang', '+ Tambah') +
        '<div class="item-list fk-items" id="pbItems">' + FormKit.itemsHtml(d.items, this.openIdx, true) + '</div>' +
        '<div class="fk-page">' +
          '<div class="fm-card"><div class="nf-sum-row"><span style="color:var(--text-2);">Total</span>' +
            '<span class="v" id="pbTotal">' + rp(total) + '</span></div></div>' +
          '<button class="btn btn-primary" id="btnBaruSimpan" type="button">Buat Pesanan</button>' +
          '<button class="btn btn-ghost" id="btnBaruBatal" type="button">Batal</button>' +
        '</div>';
    },

    attachBaru(){
      var self = this, d = this.draft;
      function keluar(){
        if(d.items.length || d.nama.trim()){
          if(!confirm('Ada pesanan yang belum disimpan. Keluar?')) return;
        }
        self.baru = false; self.draft = null; self.render();
      }
      $('btnBaruBack').addEventListener('click', keluar);
      $('btnBaruBatal').addEventListener('click', keluar);
      FormKit.bindPemesan('pb', d, {ket: true});
      FormKit.bindSearch('pbSearch', {
        source: function(){ return self.masterBarang; },
        onPick: function(m){
          var ada = d.items.findIndex(function(it){ return it.namaBarang.toLowerCase() === m.nama.toLowerCase(); });
          if(ada !== -1){ self.openIdx = ada; self.render(); toast(m.nama + ' sudah ada, ubah qty'); return; }
          d.items.push({namaBarang: m.nama, satuan: m.satuan, qty: '1',
            hargaJual: m.hargaJual || 0, hargaBeli: m.hargaBeli || 0});
          self.openIdx = d.items.length - 1;
          self.render();
          toast(m.nama + ' ditambahkan');
        },
        onNew: function(nama){
          FormKit.openItemSheet({
            title: 'Tambah Barang Baru', withBeli: true, prefill: {nama: nama}, saveLabel: 'Tambah',
            onSave: function(it){
              self.masterBarang.push({nama: it.namaBarang, satuan: it.satuan,
                hargaBeli: it.hargaBeli, hargaJual: it.hargaJual});
              d.items.push({namaBarang: it.namaBarang, satuan: it.satuan, qty: String(it.qty),
                hargaJual: it.hargaJual, hargaBeli: it.hargaBeli});
              self.openIdx = -1;
              self.render();
              toast(it.namaBarang + ' ditambahkan');
            }
          });
        }
      });
      var root = $('pbItems');
      FormKit.bindItems(root, d.items, {
        onChange: function(){
          var t = d.items.reduce(function(s, it){ return s + FormKit.sub(it); }, 0);
          $('pbTotal').textContent = rp(t);
        },
        onDelete: function(i){ d.items.splice(i, 1); self.openIdx = -1; self.render(); },
        onToggle: function(i){
          self.openIdx = (self.openIdx === i) ? -1 : i;
          FormKit.applyOpen(root, self.openIdx);
        }
      });
      $('btnBaruSimpan').addEventListener('click', function(){ self.simpanBaru(); });
    },

    async simpanBaru(){
      var self = this, d = this.draft;
      var nama = d.nama.trim();
      if(!nama){ toast('Nama pemesan wajib diisi'); var i = $('pbNama'); if(i) i.focus(); return; }
      var kosong = d.items.filter(function(it){
        return FormKit.pq(it.qty) <= 0 || !(Number(it.hargaJual) > 0);
      });
      if(kosong.length){
        toast('Lengkapi qty & harga jual: ' + kosong[0].namaBarang); return;
      }
      var id = 'p-' + Date.now();
      try{
        await SayurStorage.post('addPesanan', {
          id: id, nama: nama, noHP: d.noHP.trim(),
          keterangan: (d.keterangan || '').trim(), tanggal: d.tanggal || todayYmd()
        });
        for(var k = 0; k < d.items.length; k++){
          var it = d.items[k];
          await SayurStorage.post('addItemPesanan', {
            id: 'ip-' + Date.now() + '-' + k, pesananId: id,
            namaBarang: it.namaBarang, qty: FormKit.pq(it.qty), satuan: it.satuan,
            hargaJual: Number(it.hargaJual) || 0, hargaBeli: Number(it.hargaBeli) || 0
          });
        }
        toast('✓ Pesanan dibuat');
        this.baru = false; this.draft = null;
        await this.loadList();
        this.currentId = id;
        this.render();
        window.scrollTo(0, 0);
      }catch(e){ toast('Gagal: ' + e.message); }
    },

    openNewSheet(){
      this.baru = true;
      this.draft = {tanggal: todayYmd(), nama: '', noHP: '', keterangan: '', items: []};
      this.openIdx = -1;
      this.render();
      window.scrollTo(0, 0);
    },

          '<div class="field"><label>Keterangan (opsional)</label><input type="text" id="ei_ket" value="' + escHtml(p.Keterangan || '') + '" autocomplete="off"></div>',

          '<button class="btn btn-primary" id="ei_save">Simpan</button>' +
          '<button class="btn btn-ghost" data-close>Batal</button>'
      });

    openAddItemSheet(prefill){
      var self = this;
      var p = this.list.find(function(x){ return x.ID === self.currentId; });
      if(!p) return;
      FormKit.openItemSheet({
        title: 'Tambah Barang', withBeli: true, saveLabel: 'Tambah',
        prefill: prefill ? {
          nama: prefill.nama, satuan: prefill.satuan, qty: '1',
          hargaJual: prefill.hargaJual, hargaBeli: prefill.hargaBeli
        } : null,

            id: 'ip-' + Date.now(), pesananId: p.ID,
            namaBarang: it.namaBarang, qty: it.qty, satuan: it.satuan,
            hargaJual: it.hargaJual, hargaBeli: it.hargaBeli
          });
          toast('✓ Ditambahkan');
          await self.loadList();
          self.render();
        }
      });
    },

    openEditItemSheet(itemId){
      var self = this;
      var p = this.list.find(function(x){ return x.ID === self.currentId; });
      if(!p) return;
      var item = (p.Items || []).find(function(x){ return x.ID === itemId; });
      if(!item) return;
      var ov = openDynamicSheet({
        title: 'Edit Barang',
        body:
          '<div class="field"><label>Qty (' + escHtml(item.Satuan || 'kg') + ')</label>' +
          qtyStepperHtml('ei_q', item.Qty) + '</div>' +
          '<div class="field"><label>Harga Jual</label>' +
          rpFieldHtml('ei_h', (Number(item.HargaJual)||0).toLocaleString('id-ID')) + '</div>' +
          '<div class="field"><label>Harga Beli (opsional)</label>' +
          rpFieldHtml('ei_hb', item.HargaBeli ? Number(item.HargaBeli).toLocaleString('id-ID') : '', '—') + '</div>',
        actions:
          '<button class="btn btn-primary" id="ei_save">Simpan</button>' +
          '<button class="btn btn-ghost" data-close>Batal</button>',
        afterRender: function(){
          bindMoneyInput('ei_h');
          bindMoneyInput('ei_hb');
          bindQtyStepper(document);
        }
      });
      $('ei_save').addEventListener('click', async function(){
        var h = digits($('ei_h').value);
        var hb = digits($('ei_hb').value);
        var q = $('ei_q').value.trim();
        if(h <= 0){ toast('Harga jual wajib'); return; }
        try{
          await SayurStorage.post('updateItemPesanan', {
            id: itemId, qty: q, hargaJual: h, hargaBeli: hb
          });
          toast('✓ Tersimpan');
          closeDynamicSheet(ov);
          await self.loadList();
          self.render();
        }catch(e){ toast('Gagal: ' + e.message); }
      });

    async hapusItem(itemId){
      if(!confirm('Hapus barang ini?')) return;
      try{
        await SayurStorage.post('deleteItemPesanan', {id: itemId});
        toast('✓ Dihapus');
        await this.loadList(); this.render();
      }catch(e){ toast('Gagal: ' + e.message); }
    },

    openSumberSaldoSheet(){
      var self = this;
      var p = this.list.find(function(x){ return x.ID === self.currentId; });
      if(!p) return;
      var items = p.Items || [];
      var jumlahItem = items.length;
      var totalEstimasi = items.reduce(function(s, it){
        return s + (Number(it.Subtotal) || 0);
      }, 0);

      var ov = openDynamicSheet({
        title: 'Mulai Belanja',
        sub: 'Pindahkan ' + jumlahItem + ' barang ke Rencana Belanja',

          '<div style="background:var(--bg);border-radius:var(--r-sm);' +
            'padding:10px 12px;margin-bottom:14px;font-size:var(--fs-sm);">' +
            '<div style="display:flex;justify-content:space-between;padding:3px 0;">' +
              '<span style="color:var(--text-2);">Jumlah barang</span>' +
              '<b>' + jumlahItem + ' item</b></div>' +
            '<div style="display:flex;justify-content:space-between;padding:3px 0;">' +
              '<span style="color:var(--text-2);">Estimasi total</span>' +
              '<b>' + rp(totalEstimasi) + '</b></div>' +
          '</div>' +

              '<span class="ssp-label">Saldo Cash</span>' +
            '</button>' +
            '<button type="button" class="sumber-saldo-pick qris" id="ss_qris">' +
              '<span class="ssp-ico">📱</span>' +
              '<span class="ssp-label">Saldo QRIS</span>' +
            '</button>' +
          '</div>' +
          '<div style="font-size:11.5px;color:var(--text-3);' +
            'line-height:1.5;margin-top:12px;padding:10px 12px;' +
            'background:var(--bg);border-radius:var(--r-sm);">' +
            '💡 Uang ditarik dari saldo saat belanja disimpan.' +
          '</div>',
        actions: '<button class="btn btn-ghost" data-close>Batal</button>'
      });

      $('ss_cash').addEventListener('click', function(){ self.mulaiBelanja('Cash', ov); });
      $('ss_qris').addEventListener('click', function(){ self.mulaiBelanja('QRIS', ov); });
    },

    async mulaiBelanja(sumberSaldo, ov){
      var self = this;
      var p = this.list.find(function(x){ return x.ID === self.currentId; });
      if(!p) return;
      try{
        await SayurStorage.post('tandaiBelanjaPesanan',
          {pesananId: p.ID, sumberSaldo: sumberSaldo || 'Cash'});

        var items = p.Items || [];
        items.forEach(function(it){
          var nm = it.NamaBarang;
          var masterKey = Object.keys(MASTER).find(function(k){
            return k.toLowerCase() === nm.toLowerCase();
          });
          if(masterKey){ nm = masterKey; }
          else if(state.custom.indexOf(nm) === -1){
            state.custom.push(nm);
          }
          var d = getItem(nm);
          d.chk = true;
          d.qty = parseQty(it.Qty);
          d.beli = Number(it.HargaBeli) || 0;
          d.jual = Number(it.HargaJual) || d.jual || 0;
          d.dariPesananID = p.ID;
          d.dariPesananItemID = it.ID;
        });
        save();
        render();

        if(ov) closeDynamicSheet(ov);
        toast('✓ Barang dipindah ke Rencana');
        self.currentId = null;
        await self.loadList();
        self.render();
        switchSubTab('rencana');
      }catch(e){ toast('Gagal: ' + e.message); }
    },

    async tandaiSerah(){
      var self = this;
      var p = this.list.find(function(x){ return x.ID === self.currentId; });
      if(!p) return;
      var sisa = Number(p.Sisa) || 0;
      var msg = 'Tandai pesanan sudah diserahkan?';
      if(sisa > 0) msg += '\n\nSisa ' + rp(sisa) + ' akan jadi piutang.';
      if(!confirm(msg)) return;
      try{
        await SayurStorage.post('tandaiSerahPesanan', {pesananId: p.ID});
        toast('✓ Sudah diserahkan');
        await self.loadList();
        await self.loadPiutang();
        self.render();
      }catch(e){ toast('Gagal: ' + e.message); }
    },

    openPaySheet(){
      var self = this;
