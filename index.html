<script src="./storage.js"></script>
<script>
/* ==========================================================
   APP — index.html SPA
   ========================================================== */
(function(){
  'use strict';

  /* ----------------------------------------------------------
     STATE
     ---------------------------------------------------------- */
  const App = {
    currentTab: 'beranda',
    pengaturan: {
      NamaLapak: 'H. Mawih Sayur',
      NamaPemilik: '',
      NoHP: '',
      OperasionalBelanja: 100000,
      Bensin: 50000,
      BatasMinimalLaba: 250000,
      SusutRate: 0.30
    },
    dashboard: null,
    loading: false
  };

  /* ----------------------------------------------------------
     KONSTANTA GLOBAL (PORT)
     ---------------------------------------------------------- */
  const SUSUT_RATE = 0.30;
  const TOLERANSI_SELISIH = 10000;

  /* ----------------------------------------------------------
     UTIL
     ---------------------------------------------------------- */
  function rupiah(n){
    return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
  }

  function rupiahSingkat(n){
    n = Math.round(Math.abs(Number(n) || 0));
    if(n >= 1000000){
      const v = n / 1000000;
      return 'Rp ' + (v >= 10 ? v.toFixed(1) : v.toFixed(2))
        .replace('.', ',').replace(/,?0+$/, '') + ' jt';
    }
    if(n >= 1000) return 'Rp ' + Math.round(n / 1000) + ' rb';
    return 'Rp ' + n;
  }

  function hariIni(){
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }

  function todayYmd(){ return hariIni(); }

  function escHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), 1900);
  }

  function persenBatasMinimal(laba, batas){
    const pct = laba < 0 ? 0 : Math.round((laba / batas) * 100);
    let kelas = 'aman';
    if(pct < 75) kelas = 'jauh';
    else if(pct < 100) kelas = 'hampir';
    return {teks: pct + '%', kelas};
  }

  /* ==========================================================
     MODUL-MODUL (Belanja, Pesanan, Tutup, Laporan)
     ========================================================== */
/* ==========================================================
   MODUL: BELANJA
   ========================================================== */
const Belanja = {
  tanggal: todayYmd(),
  currentSubTab: 'rencana',
  state: [],
  pengeluaran: null,
  tambahDariSaldo: 0,
  tambahDariSaldoMetode: 'Cash',
  infoOpen: false,
  lainOpen: false,
  hutangOpen: false,
  hutangSayaCache: [],
  bayarHutangState: [],
  masterLoaded: false,
  hutangPesananCache: [],
  expandedItems: new Set(),

  _key(tgl){ return 'sayur_belanja_state_' + tgl; },
  _pkey(tgl){ return 'sayur_belanja_biaya_' + tgl; },
  _saldoKey(tgl){ return 'sayur_belanja_saldo_' + tgl; },

  async load(){
    this.loadPengeluaran();
    this.renderRencana();
    this.renderAktual();
    this.updateSubtabCounts();
    await this.loadMaster();
    this.loadLocalState();
    this.loadPengeluaran();
    await this.loadHutangSaya();
    this.loadHutangPesanan();
    this.renderRencana();
    this.renderAktual();
    this.updateSubtabCounts();
    this.attachHandlers();
  },

  async loadMaster(){
    if(this.masterLoaded) return;
    try{
      const [names, harga] = await Promise.all([
        SayurStorage.get('getNamaBarangMaster').catch(() => []),
        SayurStorage.get('getHargaMaster').catch(() => [])
      ]);
      this.master = (harga || []).map(h => ({
        nama: h.NamaBarang,
        satuan: h.Satuan || 'kg',
        hargaBeli: Number(h.HargaBeli) || 0,
        hargaJual: Number(h.HargaJual) || 0
      }));
      if(this.master.length === 0 && names && names.length){
        this.master = names.map(n => ({
          nama: n, satuan: 'kg', hargaBeli: 0, hargaJual: 0
        }));
      }
      this.masterLoaded = true;
    }catch(e){
      console.warn('Gagal load master:', e);
      this.master = [];
      this.masterLoaded = true;
    }
  },

  loadLocalState(){
    try{
      const raw = localStorage.getItem(this._key(this.tanggal));
      const saved = raw ? JSON.parse(raw) : null;
      if(saved && Array.isArray(saved) && saved.length > 0){
        this.state = saved;
        return;
      }
    }catch(e){}
    this.state = (this.master || []).map((m, idx) => ({
      id: 'itm-' + idx + '-' + Date.now(),
      nama: m.nama,
      satuan: m.satuan,
      hargaBeli: m.hargaBeli,
      hargaJual: m.hargaJual || this.hitungHargaJual(m.hargaBeli),
      qty: '',
      checked: false,
      bayarNanti: false,
      supplier: '',
      tersimpan: false,
      dariPesananID: null,
      dariPesananItemID: null
    }));
    this.saveLocalState();
  },

  saveLocalState(){
    try{
      localStorage.setItem(this._key(this.tanggal),
        JSON.stringify(this.state));
    }catch(e){}
  },

  loadPengeluaran(){
    let defaultOps = 100000;
    let defaultBensin = 50000;
    try{
      if(App.pengaturan){
        defaultOps = Number(App.pengaturan.OperasionalBelanja) || defaultOps;
        defaultBensin = Number(App.pengaturan.Bensin) || defaultBensin;
      }
    }catch(e){}

    try{
      const raw = localStorage.getItem(this._pkey(this.tanggal));
      if(raw){
        const saved = JSON.parse(raw);
        this.pengeluaran = {
          opsPasar: Number(saved.opsPasar) || defaultOps,
          bensin: Number(saved.bensin) || defaultBensin,
          lain: Array.isArray(saved.lain) ? saved.lain : [],
          bayarHutang: Number(saved.bayarHutang) || 0,
          modalBelanja: Number(saved.modalBelanja) || 0
        };
        return;
      }
    }catch(e){}
    this.pengeluaran = {
      opsPasar: defaultOps,
      bensin: defaultBensin,
      lain: [],
      bayarHutang: 0,
      modalBelanja: 0
    };
  },

  savePengeluaran(){
    try{
      localStorage.setItem(this._pkey(this.tanggal),
        JSON.stringify(this.pengeluaran));
    }catch(e){}
  },

  async loadHutangSaya(){
    try{
      const list = await SayurStorage.get('getHutang', {tipe: 'HutangSaya'});
      this.hutangSayaCache = (list || []).filter(h => h.Status !== 'Lunas');
    }catch(e){
      this.hutangSayaCache = [];
    }
  },

  async loadHutangPesanan(){
    try{
      const list = await SayurStorage.get('getHutang', {tipe: 'PiutangSaya', sumber: 'Pesanan'});
      this.hutangPesananCache = list || [];
    }catch(e){
      this.hutangPesananCache = [];
    }
  },

  hitungHargaJual(modal){
    if(!modal || modal <= 0) return 0;
    let rate;
    if(modal <= 5000) rate = 1.00;
    else if(modal <= 10000) rate = 1.00 + (0.50 - 1.00) * ((modal - 5000) / 5000);
    else if(modal <= 30000) rate = 0.50 + (0.30 - 0.50) * ((modal - 10000) / 20000);
    else if(modal <= 100000) rate = 0.30 + (0.15 - 0.30) * ((modal - 30000) / 70000);
    else rate = 0.15;
    const raw = modal * (1 + rate);
    if(modal <= 30000) return Math.round(raw / 1000) * 1000;
    return Math.ceil(raw / 5000) * 5000;
  },

  hitungHargaMinimum(modal){
    if(!modal || modal <= 0) return 0;
    if(modal > 10000) return 0;
    const hj = this.hitungHargaJual(modal);
    const hm = hj - 2000;
    return hm > 0 ? hm : 0;
  },

  totalLain(){
    return (this.pengeluaran.lain || [])
      .reduce((s,x) => s + Number(x.jumlah || 0), 0);
  },

  totalBayarHutang(){
    return this.bayarHutangState.reduce((s,x) => s + x.jumlah, 0);
  },

  totalBiayaBelanja(){
    return this.pengeluaran.opsPasar +
           this.pengeluaran.bensin +
           this.totalLain() +
           this.totalBayarHutang();
  },

  totalBelanjaTunai(){
    return this.daftarItems()
      .filter(x => !x.bayarNanti)
      .reduce((s,x) => s + (this.parseQty(x.qty) * x.hargaBeli), 0);
  },

  totalNanti(){
    return this.daftarItems()
      .filter(x => x.bayarNanti)
      .reduce((s,x) => s + (this.parseQty(x.qty) * x.hargaBeli), 0);
  },

  parseQty(q){
    return Number(String(q || '').replace(/[^\d.]/g, '')) || 0;
  },

  daftarItems(){
    return this.state.filter(x => x.checked && this.parseQty(x.qty) > 0);
  },

  getKonteks(){
    let omzetKotor = 0;
    let pengeluaranPagi = 0;
    try{
      const raw = localStorage.getItem('sayur_tutup_draft_' + this.tanggal);
      if(raw){
        const t = JSON.parse(raw);
        const cash = Number(t.omzetCash) || 0;
        const qris = Number(t.omzetQris) || 0;
        const pagi = t.pagi || {};
        const totalPagi =
          Number(pagi.kantongKaret || 0) +
          Number(pagi.iuran || 0) +
          ((pagi.lain || []).reduce((s,x) => s + Number(x.jumlah || 0), 0));
        const bon = Array.isArray(t.bon) ? t.bon.reduce((s,b) => s + Number(b.jumlah || 0), 0) : 0;
        omzetKotor = cash + qris + totalPagi + bon;
        pengeluaranPagi = totalPagi;
      }
    }catch(e){}
    const batasMinimal = Number(App.pengaturan.BatasMinimalLaba) || 250000;
    return {omzetKotor, pengeluaranPagi, batasMinimal};
  },

  hitungBatas(){
    const k = this.getKonteks();
    const modalBersih = k.omzetKotor - k.pengeluaranPagi - this.totalBiayaBelanja();
    return {
      batasAman: modalBersih - k.batasMinimal,
      modalBersih,
      nilaiHariIni: k.omzetKotor - k.pengeluaranPagi
    };
  },

  cekStatusBatas(total){
    const b = this.hitungBatas();
    if(total <= 0) return {kode: 'aman', label: 'Belum ada item'};
    if(b.batasAman <= 0) return {kode: 'minus', label: 'Melebihi Modal'};
    if(total <= b.batasAman * 0.8) return {kode: 'aman', label: 'Aman'};
    if(total <= b.batasAman) return {kode: 'hampir', label: 'Hampir Batas'};
    if(total <= b.modalBersih) return {kode: 'kikis', label: 'Laba Terkikis'};
    return {kode: 'minus', label: 'Melebihi Modal'};
  },

  statusSisa(){
    const b = this.hitungBatas();
    const total = this.totalBelanjaTunai();
    const sisa = this.getKonteks().omzetKotor -
                 this.getKonteks().pengeluaranPagi -
                 total - this.totalBiayaBelanja() + this.tambahDariSaldo;
    const target = this.getKonteks().batasMinimal;
    if(sisa >= target) return {kode: 'aman', label: 'Aman',
      detail: `di atas target ${rupiah(sisa - target)}`};
    if(sisa >= 0) return {kode: 'kikis', label: 'Di bawah target',
      detail: `kurang ${rupiah(target - sisa)}`};
    return {kode: 'minus', label: 'Minus', detail: `rugi ${rupiah(-sisa)}`};
  },

  /* ---------- BARU: format margin singkat ---------- */
  formatMargin(n){
    n = Number(n) || 0;
    return n < 0 ? '−' + this.formatSingkat(-n) : '+' + this.formatSingkat(n);
  },

  /* ---------- BARU: panel rincian per item ---------- */
  renderDaftarPanel(item){
    const qty = this.parseQty(item.qty);
    const subBeli = item.hargaBeli * qty;
    const subJual = item.hargaJual * qty;
    const marginKotor = subJual - subBeli;
    const susut = Math.round(marginKotor * SUSUT_RATE);
    const marginBersih = marginKotor - susut;
    const min = this.hitungHargaMinimum(item.hargaBeli);

    return `
      <div class="daftar-panel">
        <div class="ttl">
          <span>Rincian: ${escHtml(item.nama)}</span>
          <span class="qty-info">${escHtml(item.qty)} ${escHtml(item.satuan)}</span>
        </div>
        <div class="line">
          <span class="lbl">Subtotal beli (${qty} × ${item.hargaBeli.toLocaleString('id-ID')})</span>
          <span class="amt">${rupiah(subBeli)}</span>
        </div>
        <div class="line">
          <span class="lbl">Subtotal jual (${qty} × ${item.hargaJual.toLocaleString('id-ID')})</span>
          <span class="amt">${rupiah(subJual)}</span>
        </div>
        <div class="line" style="padding-top:8px;margin-top:6px;border-top:1px dashed var(--line);">
          <span class="lbl">Margin kotor</span>
          <span class="amt">${rupiah(marginKotor)}</span>
        </div>
        <div class="line neg">
          <span class="lbl">Susut ${Math.round(SUSUT_RATE*100)}%</span>
          <span class="amt">− ${rupiah(susut)}</span>
        </div>
        <div class="line total ${marginBersih<0?'neg':''}">
          <span class="lbl">Margin bersih</span>
          <span class="amt">${rupiah(marginBersih)}</span>
        </div>
        ${min > 0 ? `
        <div class="line" style="padding-top:6px;margin-top:4px;border-top:1px dashed var(--line);">
          <span class="lbl">Harga minimum (nawar)</span>
          <span class="amt" style="color:var(--rust-600);">${rupiah(min)}</span>
        </div>` : ''}
      </div>`;
  },

  /* ---------- RENDER — Rencana ---------- */
  renderRencana(){
    const el = document.getElementById('tabBelRencana');
    if(!el) return;

    const k = this.getKonteks();
    const b = this.hitungBatas();
    const total = this.totalBelanjaTunai();
    const bStatus = this.cekStatusBatas(total);
    const checked = this.state.filter(x => x.checked && !x.bayarNanti).length;
    const sisa = (k.omzetKotor - k.pengeluaranPagi - total - this.totalBiayaBelanja() + this.tambahDariSaldo);
    const status = this.statusSisa();
    const banner = this.bannerPesananHtml();

    let html = '';

    html += `<div style="font-size:12px;color:var(--ink-600);
      margin-bottom:12px;padding:0 2px;line-height:1.4;">
      Susun daftar belanja untuk hari ini. Belum tersimpan.
    </div>`;

    html += banner;

    /* Banner batas — dengan handle (PORT) */
    html += `
      <div class="batas-banner toggle ${bStatus.kode} ${this.infoOpen?'open':''}"
           id="batasBanner" role="button" aria-expanded="${this.infoOpen}">
        <span class="lbl">Batas aman: <strong>${rupiah(b.batasAman)}</strong></span>
        <span class="amt">${bStatus.label}</span>

  renderCheckRow(item, idx){
    const qty = this.parseQty(item.qty);
    const sub = qty * item.hargaBeli;
    return `
      <div class="check-row ${item.checked?'checked':''}" data-idx="${idx}">
        <div class="r1">
          <div class="cb" data-action="toggle" data-idx="${idx}"></div>
          <div class="nm" data-action="toggle" data-idx="${idx}">${escHtml(item.nama)}</div>
          <div class="sub">${sub > 0 ? rupiah(sub) : '—'}</div>
        </div>
        <div class="r2">
          <div class="fld-bel qty">
            <input type="text" inputmode="decimal" class="qty-inp"
                   value="${escHtml(item.qty)}" placeholder="0"
                   data-idx="${idx}">
            <span class="u">${escHtml(item.satuan)}</span>
          </div>
          <span class="times">×</span>
          <div class="fld-bel harga">
            <span class="u">Rp</span>
            <input type="text" inputmode="numeric" class="harga-inp"
                   value="${(item.hargaBeli || 0).toLocaleString('id-ID')}"
                   data-idx="${idx}">
          </div>
        </div>
      </div>`;
  },

  renderLainList(){
    const list = this.pengeluaran.lain || [];
    if(!list.length) return '';
    return list.map((x,i) => `
      <div class="lain-item-bel">
        <span class="nm">${escHtml(x.ket)}</span>
        <span class="amt">${rupiah(x.jumlah)}</span>
        <button class="del" data-idx="${i}" data-type="lain" type="button">×</button>
      </div>
    `).join('');
  },

  renderBayarHutangList(){
    if(!this.bayarHutangState.length) return '';
    return this.bayarHutangState.map((x,i) => `
      <div class="lain-item-bel">
        <span class="nm">Bayar: ${escHtml(x.nama)}</span>
        <span class="amt">${rupiah(x.jumlah)}</span>
        <button class="del" data-idx="${i}" data-type="bayarHutang" type="button">×</button>
      </div>
    `).join('');
  },

  hutangOptionsHtml(){
    const open = this.hutangSayaCache.filter(h => h.Sisa > 0);
    if(!open.length) return '<option value="">Tidak ada hutang</option>';
    return '<option value="">Pilih supplier…</option>' + open.map(h =>
      `<option value="${h.ID}">${escHtml(h.Nama)} — sisa ${rupiah(h.Sisa)}</option>`
    ).join('');
  },

  bannerPesananHtml(){
    const pesananPerlu = this.hutangPesananCache.filter(() => false);
    return '';
  },

  /* ---------- RENDER — Aktual ---------- */
  renderAktual(){
    const el = document.getElementById('tabBelAktual');
    if(!el) return;

    const items = this.daftarItems();
    const draftItems = items.filter(x => !x.tersimpan);
    const savedItems = items.filter(x => x.tersimpan);

    const totalBeli = items.reduce((s,x) => s + this.parseQty(x.qty)*x.hargaBeli, 0);
    const totalJual = items.reduce((s,x) => s + this.parseQty(x.qty)*x.hargaJual, 0);
    const margin = totalJual - totalBeli;

    let html = '';

    html += `<div style="font-size:12px;color:var(--ink-600);
      margin-bottom:12px;padding:0 2px;line-height:1.4;">
      Sesuaikan dengan yang benar-benar dibeli. Simpan setelah belanja.
    </div>`;

    html += `
      <div class="ac-wrap-bel">
        <input type="text" class="ac-input-bel" id="belSearchAktual"
               placeholder="Cari barang" autocomplete="off"
               autocorrect="off" spellcheck="false">
        <div class="ac-drop-bel" id="belSearchDropAktual"></div>
      </div>`;

    if(!items.length){
      html += `<div class="daftar-empty">Belum ada barang di daftar.<br>
        Ketik nama barang di atas untuk menambah.</div>`;
      el.innerHTML = html;
      return;
    }

    let listHtml = '';
    if(draftItems.length){
      listHtml += `<div class="section-divider">Belum Disimpan (${draftItems.length})</div>`;
      listHtml += draftItems.map((item, idx) => this.renderItemCard(item, idx)).join('');
    }
    if(savedItems.length){
      listHtml += `<div class="section-divider saved">Sudah Disimpan (${savedItems.length})</div>`;
      listHtml += savedItems.map((item, idx) => this.renderItemCard(item, idx + draftItems.length)).join('');
    }

    html += `<div class="daftar-list">${listHtml}</div>`;

    html += `
      <div class="ringkasan">
        <div class="row beli"><span class="lbl">Total belanja</span>
          <span class="amt">${rupiah(totalBeli)}</span></div>
        <div class="row jual"><span class="lbl">Potensi jual</span>
          <span class="amt">${rupiah(totalJual)}</span></div>
        <div class="row margin"><span class="lbl">Margin kotor</span>
          <span class="amt">${rupiah(margin)}</span></div>
        ${items.some(x => x.bayarNanti) ? `
          <div class="row" style="color:var(--amber-700);">
            <span class="lbl">Bayar nanti (hutang)</span>
            <span class="amt" style="color:var(--amber-700);">${rupiah(
              items.filter(x=>x.bayarNanti)
                .reduce((s,x) => s + this.parseQty(x.qty)*x.hargaBeli, 0)
            )}</span>
          </div>` : ''}
        <div class="row" style="${this.tambahDariSaldo > 0 ? 'color:var(--blue-600);' : 'color:var(--ink-500);font-size:12px;'}">
          ${this.tambahDariSaldo > 0 ? `
            <span class="lbl">Tambah modal dari saldo ${this.tambahDariSaldoMetode}
              <button class="btn-ubah-saldo" id="belUbahSaldoAktual" type="button">Ubah</button>
            </span>
            <span class="amt" style="color:var(--blue-600);">${rupiah(this.tambahDariSaldo)}</span>
          ` : `
            <span class="lbl">Belum ada tambahan dari saldo</span>
            <button class="btn-ubah-saldo" id="belTambahSaldoAktual" type="button"
              style="background:none;border:1px dashed var(--green-700);
              color:var(--green-700);font:600 11.5px 'Work Sans',sans-serif;
              cursor:pointer;padding:5px 12px;border-radius:var(--r-full);">
              + Tambah
            </button>
          `}
        </div>
      </div>`;

    html += `
      <div class="bar-buttons">
        <button class="btn-share-beli" id="belShareBeli">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
          Bagikan Beli
        </button>
        <button class="btn-share-jual" id="belShareJual">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
          Bagikan Jual
        </button>
        <button class="btn-simpan-full" id="belSimpan">Simpan Belanja</button>
      </div>`;

    el.innerHTML = html;
  },

  /* ---------- UPDATED: item card dengan expand panel ---------- */
  renderItemCard(item, no){
    const qty = this.parseQty(item.qty);
    const margin = (item.hargaJual - item.hargaBeli) * qty;
    const min = this.hitungHargaMinimum(item.hargaBeli);
    const marginTxt = this.formatMargin(margin);
    const isOpen = this.expandedItems.has(item.id);

    return `
      <div class="item-card" data-id="${item.id}">
        <div class="line-1">
          <span class="no">${no+1}.</span>
          <span class="nm" data-expand="${item.id}">${escHtml(item.nama)}${item.bayarNanti ? '<span class="hutang-badge">HUTANG</span>' : ''}${item.tersimpan ? '<span class="saved-badge">✓ TERSIMPAN</span>' : '<span class="draft-badge">DRAFT</span>'}</span>
          <button class="del" data-del="${item.id}" type="button">×</button>
        </div>
        <div class="grid-3-bel">
          <label class="f">
            <span class="lbl">Qty (${escHtml(item.satuan)})</span>
            <div class="fld-bel">
              <input type="text" inputmode="decimal"
                     value="${escHtml(item.qty)}"
                     data-field="qty" data-id="${item.id}">
            </div>
          </label>
          <label class="f">
            <span class="lbl">Beli (Rp)</span>
            <div class="fld-bel">
              <input type="text" inputmode="numeric"
                     value="${(item.hargaBeli||0).toLocaleString('id-ID')}"
                     data-field="hargaBeli" data-id="${item.id}">
            </div>
          </label>
          <label class="f jual">
            <span class="lbl">Jual (Rp)</span>
            <div class="fld-bel">
              <input type="text" inputmode="numeric"
                     value="${(item.hargaJual||0).toLocaleString('id-ID')}"
                     data-field="hargaJual" data-id="${item.id}">
            </div>
          </label>
        </div>
        <div class="line-2">
          <span>Min jual <span class="min-tag">${min > 0 ? min.toLocaleString('id-ID') : '—'}</span></span>
          <span>Margin <span class="margin-tag ${margin<0?'neg':''}">${marginTxt}</span></span>
        </div>
        <div class="nanti-row">
          <button type="button" class="nanti-chip ${item.bayarNanti ? 'on' : ''}"
                  data-nanti="${item.id}">
            <span class="sw"></span>Bayar nanti
          </button>
          ${item.bayarNanti ? `
          <div class="supplier-fld">
            <input type="text" data-field="supplier" data-id="${item.id}"
                   value="${escHtml(item.supplier)}"
                   placeholder="Nama supplier" autocomplete="off">
          </div>` : ''}
        </div>
        ${isOpen ? this.renderDaftarPanel(item) : ''}
      </div>`;
  },

  formatSingkat(n){
    n = Math.round(Math.abs(Number(n) || 0));
    if(n >= 1000000) return (n/1000000).toFixed(1).replace('.', ',') + 'jt';
    if(n >= 1000) return Math.round(n/1000) + 'rb';
    return String(n);
  },

  /* ---------- HANDLERS ---------- */
  attachHandlers(){
    document.querySelectorAll('.subtabs-bel button[data-beltab]').forEach(btn => {
      btn.addEventListener('click', () => {
        this.currentSubTab = btn.dataset.beltab;
        document.querySelectorAll('.subtabs-bel button').forEach(b =>
          b.classList.toggle('active', b === btn));
        document.querySelectorAll('.tab-bel').forEach(t => t.classList.remove('active'));
        const el = document.getElementById('tabBel' +
          this.currentSubTab.charAt(0).toUpperCase() + this.currentSubTab.slice(1));
        if(el) el.classList.add('active');
      });
    });

    /* Banner toggle — dengan chevron + label (PORT) */
    const banner = document.getElementById('batasBanner');
    if(banner) banner.addEventListener('click', () => {
      this.infoOpen = !this.infoOpen;
      banner.classList.toggle('open', this.infoOpen);
      banner.setAttribute('aria-expanded', this.infoOpen);
      const ht = document.getElementById('handleText');
      if(ht) ht.textContent = this.infoOpen ? 'Tutup' : 'Edit & detail';
      const panel = document.getElementById('infoPanelBel');
      if(panel) panel.classList.toggle('open', this.infoOpen);
    });

    this.bindMoney('belOps', v => {
      this.pengeluaran.opsPasar = v;
      this.savePengeluaran();
    });
    this.bindMoney('belBensin', v => {
      this.pengeluaran.bensin = v;
      this.savePengeluaran();
    });

    document.querySelectorAll('.set-default').forEach(btn => {
      btn.addEventListener('click', () => {
        const tgt = btn.dataset.target;
        const val = tgt === 'ops' ?
          Number(App.pengaturan.OperasionalBelanja) :
          Number(App.pengaturan.Bensin);
        if(tgt === 'ops') this.pengeluaran.opsPasar = val;
        else this.pengeluaran.bensin = val;
        this.savePengeluaran();
        this.renderRencana();
        this.attachHandlers();
        showToast('Default disimpan');
      });
    });

    const lt = document.getElementById('belLainToggle');
    if(lt) lt.addEventListener('click', () => {
      this.lainOpen = !this.lainOpen;
      const f = document.getElementById('belLainForm');
      const k = document.getElementById('belLainKet');
      if(f) f.classList.toggle('open', this.lainOpen);
      lt.textContent = this.lainOpen ? 'Tutup' : '+ Tambah';
      if(this.lainOpen && k) k.focus();
    });

    const la = document.getElementById('belLainAdd');
    if(la) la.addEventListener('click', () => {
      const ket = document.getElementById('belLainKet').value.trim();
      const jml = Number(document.getElementById('belLainJml').value.replace(/\D/g,'')) || 0;
      if(!ket){ showToast('Isi keterangan'); return; }
      if(jml <= 0){ showToast('Isi jumlah'); return; }
      this.pengeluaran.lain.push({ket, jumlah: jml});
      this.savePengeluaran();
      this.renderRencana();
      this.attachHandlers();
    });

    const ht = document.getElementById('belHutangToggle');
    if(ht) ht.addEventListener('click', () => {
      this.hutangOpen = !this.hutangOpen;
      const f = document.getElementById('belHutangForm');
      if(f) f.classList.toggle('open', this.hutangOpen);
      ht.textContent = this.hutangOpen ? 'Tutup' : '+ Bayar';
    });

    const hs = document.getElementById('belHutangSup');
    if(hs){
      hs.addEventListener('change', () => {
        const h = this.hutangSayaCache.find(x => x.ID === hs.value);
        const hint = document.getElementById('belHutangHint');
        const jml = document.getElementById('belHutangJml');
        if(!h){
          if(hint) hint.textContent = '';
          if(jml) jml.value = '';
          return;
        }
        if(hint) hint.textContent = `Total ${rupiah(h.JumlahAwal)} · sisa ${rupiah(h.Sisa)}`;
        if(jml) jml.value = h.Sisa.toLocaleString('id-ID');
      });
    }

    const ha = document.getElementById('belHutangAdd');
    if(ha) ha.addEventListener('click', () => {
      const sel = document.getElementById('belHutangSup');
      const jmlEl = document.getElementById('belHutangJml');
      const h = this.hutangSayaCache.find(x => x.ID === sel.value);
      const n = Number(String(jmlEl.value).replace(/\D/g,'')) || 0;
      if(!h){ showToast('Pilih supplier'); return; }
      if(n <= 0){ showToast('Isi jumlah'); return; }
      if(n > h.Sisa){ showToast('Melebihi sisa'); return; }
      this.bayarHutangState.push({
        hutangId: h.ID,
        nama: h.Nama,
        jumlah: n
      });
      this.renderRencana();
      this.attachHandlers();
    });

    ['belLainJml', 'belHutangJml'].forEach(id => {
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('input', () => {
        const n = Number(String(el.value).replace(/\D/g,'')) || 0;
        el.value = n ? n.toLocaleString('id-ID') : '';
      });
    });

    const cl = document.getElementById('checklistBel');
    if(cl){
      cl.addEventListener('click', e => {
        const t = e.target.closest('[data-action="toggle"]');
        if(t){
          const idx = Number(t.dataset.idx);
          if(isNaN(idx)) return;
          this.state[idx].checked = !this.state[idx].checked;
          if(!this.state[idx].checked){
            this.state[idx].qty = '';
          }
          this.saveLocalState();
          this.renderRencana();
          this.renderAktual();
          this.attachHandlers();
        }
      });
      cl.addEventListener('input', e => {
        const idx = Number(e.target.dataset.idx);
        if(isNaN(idx)) return;
        if(e.target.classList.contains('qty-inp')){
          this.state[idx].qty = e.target.value.replace(/[^\d.]/g, '');
          this.saveLocalState();
          this.updateRencanaLive();
        }
        if(e.target.classList.contains('harga-inp')){
          const n = Number(String(e.target.value).replace(/\D/g,'')) || 0;
          this.state[idx].hargaBeli = n;
          e.target.value = n ? n.toLocaleString('id-ID') : '';
          this.state[idx].hargaJual = this.hitungHargaJual(n);
          this.saveLocalState();
          this.updateRencanaLive();
        }
      });
    }

    this.bindSearch('belSearch', 'belSearchDrop', 'rencana');
    this.bindSearch('belSearchAktual', 'belSearchDropAktual', 'aktual');

    /* Expand/collapse rincian item di Aktual (PORT) */
    document.querySelectorAll('#tabBelAktual .item-card .nm[data-expand]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.expand;
        if(this.expandedItems.has(id)) this.expandedItems.delete(id);
        else this.expandedItems.add(id);
        this.renderAktual();
        this.attachHandlers();
      });
    });

    /* Aktual: item card inputs */
    document.querySelectorAll('#tabBelAktual .item-card input').forEach(inp => {
      inp.addEventListener('input', () => {
        const id = inp.dataset.id;
        const field = inp.dataset.field;
        const item = this.state.find(x => x.id === id);
        if(!item) return;
        if(field === 'qty'){
          item.qty = inp.value.replace(/[^\d.]/g, '');
        } else if(field === 'hargaBeli'){
          const n = Number(String(inp.value).replace(/\D/g,'')) || 0;
          inp.value = n ? n.toLocaleString('id-ID') : '';
          item.hargaBeli = n;
          item.hargaJual = this.hitungHargaJual(n);
        } else if(field === 'hargaJual'){
          const n = Number(String(inp.value).replace(/\D/g,'')) || 0;
          inp.value = n ? n.toLocaleString('id-ID') : '';
          item.hargaJual = n;
        } else if(field === 'supplier'){
          item.supplier = inp.value;
        }
        this.saveLocalState();
      });
      inp.addEventListener('focus', () => setTimeout(() => {
        try{ inp.select(); }catch(e){}
      }, 20));
    });

    document.querySelectorAll('#tabBelAktual [data-nanti]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.nanti;
        const item = this.state.find(x => x.id === id);
        if(!item) return;
        item.bayarNanti = !item.bayarNanti;
        if(!item.bayarNanti) item.supplier = '';
        this.saveLocalState();
        this.renderAktual();
        this.attachHandlers();
      });
    });

    document.querySelectorAll('#tabBelAktual .item-card .del').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.del;
        const item = this.state.find(x => x.id === id);
        if(!item) return;
        item.checked = false;
        item.qty = '';
        item.bayarNanti = false;
        item.supplier = '';
        this.saveLocalState();
        this.renderRencana();
        this.renderAktual();
        this.attachHandlers();
      });
    });

    document.querySelectorAll('#tabBelRencana .del[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.idx);
        const type = btn.dataset.type;
        if(type === 'lain'){
          this.pengeluaran.lain.splice(idx, 1);
          this.savePengeluaran();
        } else if(type === 'bayarHutang'){
          this.bayarHutangState.splice(idx, 1);
        }
        this.renderRencana();
        this.attachHandlers();
      });
    });

    const sb = document.getElementById('belSiapBelanja');
    if(sb) sb.addEventListener('click', () => {
      const items = this.daftarItems();
      if(!items.length){ showToast('Ceklis dulu minimal 1 barang'); return; }
      const btn = document.querySelector('.subtabs-bel button[data-beltab="aktual"]');
      if(btn) btn.click();
    });

    const ts = document.getElementById('belTambahSaldo');
    if(ts) ts.addEventListener('click', () => this.openSaldoModal());
    const us = document.getElementById('belUbahSaldo');
    if(us) us.addEventListener('click', () => this.openSaldoModal());

    const tsa = document.getElementById('belTambahSaldoAktual');
    if(tsa) tsa.addEventListener('click', () => this.openSaldoModal());
    const usa = document.getElementById('belUbahSaldoAktual');
    if(usa) usa.addEventListener('click', () => this.openSaldoModal());

    const shrB = document.getElementById('belShareBeli');
    if(shrB) shrB.addEventListener('click', () => this.shareDaftar('beli'));
    const shrJ = document.getElementById('belShareJual');
    if(shrJ) shrJ.addEventListener('click', () => this.shareDaftar('jual'));

    const sb2 = document.getElementById('belSimpan');
    if(sb2) sb2.addEventListener('click', () => this.simpanBelanja());
  },

  bindMoney(id, setter){
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', () => {
      const n = Number(String(el.value).replace(/\D/g,'')) || 0;
      el.value = n ? n.toLocaleString('id-ID') : '';
      setter(n);
      this.updateRencanaLive();
    });
  },

  bindSearch(inputId, dropId, mode){
    const inp = document.getElementById(inputId);
    const drop = document.getElementById(dropId);
    if(!inp || !drop) return;

    inp.addEventListener('input', () => {
      const q = inp.value.trim().toLowerCase();
      if(!q){ drop.classList.remove('show'); drop.innerHTML = ''; return; }
      const matches = this.state.filter(x =>
        x.nama.toLowerCase().includes(q)).slice(0, 8);
      let html = '';
      if(matches.length){
        html = matches.map(m => `
          <div class="ac-item" data-id="${m.id}">
            <div class="ac-nm">${escHtml(m.nama)} <span class="ac-sat">· ${escHtml(m.satuan)}</span></div>
            <div class="ac-price">${rupiah(m.hargaBeli)}</div>
          </div>`).join('');
      }
      const existsExact = this.state.some(x => x.nama.toLowerCase() === q);
      if(!existsExact){
        html += `<div class="ac-new-btn-bel" data-new="${escHtml(inp.value.trim())}">
          + Tambah "${escHtml(inp.value.trim())}" ke master
        </div>`;
      }
      if(!html) html = '<div class="ac-empty">Tidak ada cocok</div>';
      drop.innerHTML = html;
      drop.classList.add('show');

      drop.querySelectorAll('.ac-item').forEach(el => {
        el.addEventListener('pointerdown', e => {
          e.preventDefault();
          const id = el.dataset.id;
          const item = this.state.find(x => x.id === id);
          if(!item) return;
          if(!item.checked){
            item.checked = true;
            if(!item.qty) item.qty = '1';
          }
          inp.value = '';
          drop.classList.remove('show');
          this.saveLocalState();
          this.renderRencana();
          this.renderAktual();
          this.attachHandlers();
        });
      });
      const newBtn = drop.querySelector('.ac-new-btn-bel');
      if(newBtn) newBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        const nama = newBtn.dataset.new;
        inp.value = '';
        drop.classList.remove('show');
        this.tambahBarangBaru(nama);
      });
    });

    inp.addEventListener('focus', () => {
      if(inp.value.trim()) inp.dispatchEvent(new Event('input'));
    });

    inp.addEventListener('blur', () => {
      setTimeout(() => drop.classList.remove('show'), 180);
    });
  },

  tambahBarangBaru(nama){
    const n = window.prompt('Nama barang:', nama);
    if(!n) return;
    const s = window.prompt('Satuan (kg/ikat/pcs):', 'kg') || 'kg';
    const h = Number(String(window.prompt('Harga beli (Rp):', '0')).replace(/\D/g,'')) || 0;
    if(h <= 0){ showToast('Harga tidak valid'); return; }
    const id = 'new-' + Date.now();
    this.state.push({
      id, nama: n, satuan: s,
      hargaBeli: h,
      hargaJual: this.hitungHargaJual(h),
      qty: '1', checked: true,
      bayarNanti: false, supplier: '',
      tersimpan: false,
      dariPesananID: null, dariPesananItemID: null
    });
    this.saveLocalState();
    this.renderRencana();
    this.renderAktual();
    this.attachHandlers();
    showToast('Barang ditambahkan');
  },

  updateRencanaLive(){
    const k = this.getKonteks();
    const b = this.hitungBatas();
    const total = this.totalBelanjaTunai();
    const bStatus = this.cekStatusBatas(total);
    const checked = this.state.filter(x => x.checked && !x.bayarNanti).length;
    const sisa = (k.omzetKotor - k.pengeluaranPagi - total - this.totalBiayaBelanja() + this.tambahDariSaldo);
    const status = this.statusSisa();

    const banner = document.getElementById('batasBanner');
    if(banner){
      banner.className = 'batas-banner toggle ' + bStatus.kode + (this.infoOpen ? ' open' : '');
      banner.querySelector('.lbl').innerHTML = `Batas aman: <strong>${rupiah(b.batasAman)}</strong>`;
      banner.querySelector('.amt').textContent = bStatus.label;
      const ht = document.getElementById('handleText');
      if(ht) ht.textContent = this.infoOpen ? 'Tutup' : 'Edit & detail';
    }

    const sc = document.getElementById('belSumCount');
    if(sc) sc.textContent = `(${checked} item)`;
    const sb = document.getElementById('belSumBelanja');
    if(sb) sb.textContent = rupiah(total + this.totalBiayaBelanja());
    const sn = document.getElementById('belSumNanti');
    if(sn) sn.textContent = rupiah(this.totalNanti());
    const rn = document.getElementById('belRowNanti');
    if(rn) rn.style.display = this.totalNanti() > 0 ? '' : 'none';
    const sl = document.getElementById('belSumLaba');
    if(sl) sl.textContent = rupiah(sisa);
    const st = document.getElementById('belStatusLine');
    if(st){
      st.className = 'status-line ' + status.kode;
      st.innerHTML = `<strong>${status.label}.</strong> ${status.detail}`;
    }

    document.querySelectorAll('#checklistBel .check-row').forEach(row => {
      const idx = Number(row.dataset.idx);
      const item = this.state[idx];
      if(!item) return;
      const qty = this.parseQty(item.qty);
      const sub = qty * item.hargaBeli;
      const subEl = row.querySelector('.sub');
      if(subEl) subEl.textContent = sub > 0 ? rupiah(sub) : '—';
    });

    const biayaTotal = document.querySelector('.biaya-head .total');
    if(biayaTotal) biayaTotal.textContent = rupiah(this.totalBiayaBelanja());
  },

  shareDaftar(jenis){
    const items = this.daftarItems();
    if(!items.length){ showToast('Daftar masih kosong'); return; }
    const isBeli = jenis === 'beli';
    const tgl = new Date().toLocaleDateString('id-ID',
      {weekday:'short', day:'numeric', month:'short', year:'numeric'});

    let body = '';
    if(isBeli){
      body = items.map((it, i) => {
        return `${i+1}. ${it.nama} - ${it.qty} ${it.satuan}` +
          (it.bayarNanti ? ` (bayar nanti${it.supplier ? ': ' + it.supplier : ''})` : '');
      }).join('\n');
    } else {
      body = items.map(it => `• ${it.nama} - ${it.hargaJual.toLocaleString('id-ID')}/${it.satuan}`).join('\n');
    }
    const text = `${tgl}\n\n${body}`;

    if(navigator.share){
      navigator.share({text})
        .then(() => showToast(`${isBeli ? 'Catatan Beli' : 'Catatan Jual'} dibagikan`))
        .catch(err => {
          if(err.name !== 'AbortError'){
            navigator.clipboard.writeText(text)
              .then(() => showToast('Disalin'))
              .catch(() => showToast('Gagal'));
          }
        });
    } else {
      navigator.clipboard.writeText(text)
        .then(() => showToast('Disalin'))
        .catch(() => showToast('Gagal'));
    }
  },

  async simpanBelanja(){
    const items = this.daftarItems();
    if(!items.length){ showToast('Daftar masih kosong'); return; }

    const draft = items.filter(x => !x.tersimpan);
    if(!draft.length && this.tambahDariSaldo <= 0){
      showToast('Semua sudah tersimpan');
      return;
    }

    if(!confirm(`Simpan ${draft.length} item belanja?\n\nData akan dikirim ke server.`)) return;

    const btn = document.getElementById('belSimpan');
    if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan…'; }

    let okCount = 0;

    try{
      for(const item of draft){
        const payload = {
          id: 'b-' + item.id + '-' + Date.now(),
          tanggal: this.tanggal,
          namaBarang: item.nama,
          qty: item.qty,
          satuan: item.satuan,
          hargaBeli: item.hargaBeli,
          metode: item.bayarNanti ? 'Cash' : 'Cash'
        };

        if(item.bayarNanti && item.supplier){
          await SayurStorage.post('addHutang', {
            id: 'ht-' + item.id + '-' + Date.now(),
            tipe: 'HutangSaya',
            nama: item.supplier,
            jumlah: this.parseQty(item.qty) * item.hargaBeli,
            catatan: item.nama + ' ' + item.qty + ' ' + item.satuan,
            sumber: 'Supplier',
            tanggal: this.tanggal
          });
        } else {
          await SayurStorage.post('addBelanja', payload);
        }
        item.tersimpan = true;
        okCount++;
      }

      await SayurStorage.post('setBiayaOperasional', {
        operasionalBelanja: this.pengeluaran.opsPasar,
        operasionalMetode: 'Cash',
        bensin: this.pengeluaran.bensin,
        bensinMetode: 'Cash',
        konsumsi: 0, konsumsiMetode: 'Cash',
        pagiKresek: 0, pagiKonsumsi: 0, pagiIuran: 0, pagiLain: 0,
        tanggal: this.tanggal
      });

      if(this.tambahDariSaldo > 0){
        await SayurStorage.post('tambahMutasi', {
          id: 'm-saldo-' + Date.now(),
          tipe: 'Tarik',
          metode: this.tambahDariSaldoMetode,
          jumlah: this.tambahDariSaldo,
          tujuan: 'Modal',
          catatan: 'Tambah modal belanja',
          sumber: 'Modal',
          tanggal: this.tanggal
        });
      }

      for(const bh of this.bayarHutangState){
        await SayurStorage.post('addPembayaranHutang', {
          id: 'ph-' + bh.hutangId + '-' + Date.now(),
          hutangId: bh.hutangId,
          jumlah: bh.jumlah,
          metode: 'Cash',
          tanggal: this.tanggal
        });
      }

      this.saveLocalState();
      this.tambahDariSaldo = 0;
      this.bayarHutangState = [];

      const totalModal = items.reduce((s,x) =>
        s + this.parseQty(x.qty) * x.hargaBeli, 0);
      this.pengeluaran.modalBelanja = totalModal;
      this.savePengeluaran();

      try{ localStorage.removeItem(this._saldoKey(this.tanggal)); }catch(e){}

      showToast(`✓ ${okCount} item tersimpan (antrian)`);
      this.renderRencana();
      this.renderAktual();
      this.updateSubtabCounts();
      this.attachHandlers();

    }catch(e){
      showToast('Gagal: ' + (e.message || 'Unknown'));
    }finally{
      if(btn){ btn.disabled = false; btn.textContent = 'Simpan Belanja'; }
    }
  },

  updateSubtabCounts(){
    const checked = this.state.filter(x => x.checked && this.parseQty(x.qty) > 0).length;
    const cA = document.getElementById('cntAktual');
    if(cA){
      cA.textContent = checked;
      cA.style.display = checked > 0 ? '' : 'none';
    }
  }
};
/* ==========================================================
   MODUL: PESANAN
   ========================================================== */
const Pesanan = {
  list: [],
  currentId: null,
  riwayatOpen: false,
  masterLoaded: false,
  masterBarang: [],
  piutangList: [],
  _notaOpsi: { tampilHP: true, tampilCatatan: true },

  async load(){
    await this.loadMaster();
    await this.loadList();
    await this.loadPiutang();
    this.render();
  },

  async loadMaster(){
    if(this.masterLoaded) return;
    try{
      const harga = await SayurStorage.get('getHargaMaster').catch(() => []);
      this.masterBarang = (harga || []).map(h => ({
        nama: h.NamaBarang,
        satuan: h.Satuan || 'kg',
        hargaBeli: Number(h.HargaBeli) || 0,
        hargaJual: Number(h.HargaJual) || 0
      }));
      if(this.masterBarang.length === 0){
        const names = await SayurStorage.get('getNamaBarangMaster').catch(() => []);
        this.masterBarang = (names || []).map(n => ({
          nama: n, satuan: 'kg', hargaBeli: 0, hargaJual: 0
        }));
      }
    }catch(e){
      this.masterBarang = [];
    }
    this.masterLoaded = true;
  },

  async loadList(){
    try{
      const list = await SayurStorage.get('getPesanan');
      this.list = list || [];
    }catch(e){
      this.list = [];
    }
  },

  async loadPiutang(){
    try{
      const list = await SayurStorage.get('getHutang',
        {tipe:'PiutangSaya', sumber:'Pesanan'});
      this.piutangList = (list || []).filter(h => h.Status !== 'Lunas');
    }catch(e){
      this.piutangList = [];
    }
  },

  /* ---------- RENDER ---------- */
  render(){
    const el = document.getElementById('tabBelPesanan');
    if(!el) return;

    if(this.currentId){
      el.innerHTML = this.renderDetail();
    } else {
      el.innerHTML = this.renderList();
    }
    this.attachHandlers();
    this.updateCount();
  },

  renderList(){
    const aktif = this.list.filter(p => p.Status !== 'selesai');
    const selesai = this.list.filter(p => p.Status === 'selesai');

    let html = this.bannerPiutangHtml();
    html += `
      <div class="pesanan-actions">
        <button class="btn-pesanan-baru" id="btnPesananBaru">
          + Pesanan Baru
        </button>
      </div>`;

    if(aktif.length){
      html += `<div class="section-head-pesanan">
        <span>Pesanan Aktif</span><span>${aktif.length}</span>
      </div>`;
      html += aktif.map(p => this.renderKartu(p)).join('');
    } else {
      html += `<div class="empty-box">Tidak ada pesanan aktif.</div>`;
    }

    if(selesai.length){
      html += `
        <button class="riwayat-toggle ${this.riwayatOpen ? 'open' : ''}" id="btnRiwayat">
          <span class="left">Riwayat <span class="cnt">${selesai.length}</span></span>
          <span class="arrow">▼</span>
        </button>`;
      if(this.riwayatOpen){
        html += selesai.map(p => this.renderKartu(p)).join('');
      }
    }

    return html;
  },

  /* ---------- BARU: banner piutang ---------- */
  bannerPiutangHtml(){
    const list = this.piutangList || [];
    if(!list.length) return '';
    const totalSisa = list.reduce((s,h) => s + (Number(h.Sisa) || 0), 0);
    return `
      <div class="banner-piutang">
        <div class="bp-head">
          <span style="font-size:14px;">💰</span>
          <span class="bp-title">Piutang Pesanan: ${rupiah(totalSisa)}</span>
        </div>
        ${list.map(h => `
          <div class="bp-item">
            <div style="min-width:0;flex:1;">
              <div class="bp-nama">${escHtml(h.Nama)}</div>
              <div class="bp-detail">Sisa ${rupiah(h.Sisa)} · ${this.fmtTanggal(h.Tanggal)}</div>
            </div>
          </div>
        `).join('')}
      </div>`;
  },

  renderKartu(p){
    const st = this.statusPesanan(p);
    const sisa = Number(p.Sisa) || 0;
    const total = Number(p.Total) || 0;
    const dibayar = Number(p.Dibayar) || 0;
    const items = p.Items || [];

    const lewat = !p.SudahBelanja ? this.selisihHari(p.Tanggal) : 0;
    const overdue = !p.SudahBelanja && lewat > 0;

    const metaParts = [
      `<span>${this.fmtTanggal(p.Tanggal)}</span>`,
      `<span>${items.length} barang</span>`
    ];
    if(overdue){
      metaParts.push(`<span style="color:var(--rust-600);font-weight:600;">⚠️ ${lewat} hari</span>`);
    }
    if(p.NoHP){
      metaParts.push(`<span class="meta-item">
        <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.5-1.5a2 2 0 0 1 2.1-.4c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.8 2z"/></svg>
        ${escHtml(p.NoHP)}</span>`);
    }

    return `
      <div class="order-card ${p.Status === 'selesai' ? 'done' : ''} ${overdue ? 'overdue' : ''}"
           data-id="${p.ID}">
        <div class="order-head">
          <div style="min-width:0;flex:1;">
            <div class="order-name">${escHtml(p.Nama)}</div>
            <div class="order-meta">${metaParts.join('<span>·</span>')}</div>
          </div>
          <span class="order-badge ${st.kode}">${st.label}</span>
        </div>
        ${p.Keterangan ? `<div class="order-ket">${escHtml(p.Keterangan)}</div>` : ''}
        <div class="order-summary">
          <div>${rupiah(total)}${dibayar > 0 && sisa > 0 ? ` · dp ${rupiah(dibayar)}` : ''}</div>
          <div class="amount ${sisa <= 0 ? 'paid' : ''}">
            ${sisa <= 0 ? '✓ Lunas' : 'Sisa ' + rupiah(sisa)}
          </div>
        </div>
      </div>`;
  },

  renderDetail(){
    const p = this.list.find(x => x.ID === this.currentId);
    if(!p){
      this.currentId = null;
      return this.renderList();
    }

    const st = this.statusPesanan(p);
    const total = Number(p.Total) || 0;
    const dibayar = Number(p.Dibayar) || 0;
    const sisa = Number(p.Sisa) || 0;
    const lunas = sisa <= 0;
    const items = p.Items || [];

    let html = '';

    html += `
      <div class="detail-head-pesanan">
        <button class="btn-back-pesanan" id="btnPesananBack">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div style="flex:1;min-width:0;">
          <div class="detail-title-pesanan">${escHtml(p.Nama)}</div>
          <div class="detail-sub-pesanan">${this.fmtTanggal(p.Tanggal)}</div>
        </div>
        <span class="order-badge ${st.kode}">${st.label}</span>
      </div>`;

    html += `
      <div class="pemesan-card">
        <button class="btn-edit-info" id="btnEditInfoPesanan">✎</button>
        <div class="row">
          <svg class="icn" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="lbl">Nama</span>
          <span class="val">${escHtml(p.Nama)}</span>
        </div>
        <div class="row">
          <svg class="icn" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.5-1.5a2 2 0 0 1 2.1-.4c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.8 2z"/></svg>
          <span class="lbl">No HP</span>
          <span class="val">${p.NoHP ? `<a href="tel:${escHtml(p.NoHP)}" style="color:var(--blue-600);text-decoration:none;">${escHtml(p.NoHP)}</a>` : '—'}</span>
        </div>
        ${p.Keterangan ? `
        <div class="row">
          <svg class="icn" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="lbl">Keterangan</span>
          <span class="val ket">${escHtml(p.Keterangan)}</span>
        </div>` : ''}
      </div>`;

    html += `
      <div class="status-card ${p.Status === 'selesai' ? 'done' : ''}">
        <div class="row"><span class="lbl">Total pesanan</span><span class="amt">${rupiah(total)}</span></div>
        <div class="row"><span class="lbl">Dibayar</span><span class="amt pos">${rupiah(dibayar)}</span></div>
        ${!lunas ? `<div class="row"><span class="lbl">Sisa</span><span class="amt neg">${rupiah(sisa)}</span></div>` : ''}
        <div class="row total">
          <span class="lbl">${lunas ? 'Status' : 'Kurang bayar'}</span>
          <span class="amt">${lunas ? '✓ Lunas' : rupiah(sisa)}</span>
        </div>
      </div>`;

    html += `<div class="item-list-pesanan">`;
    if(items.length){
      html += items.map(it => `
        <div class="item-row-pesanan">
          <div class="item-body-pesanan">
            <div class="item-name-pesanan">${escHtml(it.NamaBarang)}</div>
            <div class="item-detail-pesanan">
              <span>${escHtml(it.Qty)} ${escHtml(it.Satuan)}</span>
              <span>·</span>
              <span class="price-edit" data-item-id="${it.ID}">${rupiah(it.HargaJual)}</span>
            </div>
          </div>
          <div class="item-subtotal-pesanan">${rupiah(it.Subtotal)}</div>
          <button class="item-del-pesanan" data-item-id="${it.ID}">×</button>
        </div>
      `).join('');
    } else {
      html += `<div style="padding:20px;text-align:center;color:var(--ink-400);font-size:12.5px;">
        Belum ada barang
      </div>`;
    }
    html += `</div>`;

    html += `<button class="btn-add-item" id="btnAddItemPesanan">Tambah Barang</button>`;

    const pembayaran = p.Pembayaran || [];
    html += `
      <div class="payment-history">
        <div class="payment-title">Riwayat Pembayaran</div>
        ${pembayaran.length ? pembayaran.map(pm => `
          <div class="payment-row">
            <span class="lbl">${this.fmtTanggal(pm.Tanggal)} · ${escHtml(pm.Metode)}</span>
            <span class="amt">${rupiah(pm.Jumlah)}</span>
          </div>`).join('') :
          '<div class="payment-empty">Belum ada pembayaran</div>'}
      </div>`;

    if(st.kode === 'perlu_belanja' && items.length){
      html += `<button class="btn-selesai-pesanan primary" id="btnMulaiBelanja">
        🛒 Mulai Belanja
      </button>`;
    }
    if(st.kode === 'siap_serah'){
      html += `<button class="btn-selesai-pesanan primary" id="btnTandaiSerah">
        📦 Tandai Sudah Diserahkan
      </button>`;
    }

    html += `
      <div class="detail-actions-pesanan">
        <button class="btn-pay-pesanan" id="btnBayarPesanan" ${lunas ? 'disabled' : ''}>
          ${lunas ? '✓ Sudah Lunas' : 'Catat Pembayaran'}
        </button>
        <button class="btn-nota-pesanan" id="btnNotaPesanan">Kirim Nota</button>
      </div>`;

    html += `<button class="btn-delete-pesanan" id="btnHapusPesanan">Hapus Pesanan</button>`;

    return html;
  },

  statusPesanan(p){
    const lunas = (Number(p.Sisa) || 0) <= 0;
    if(p.SudahSerah && lunas) return {kode: 'selesai', label: 'Selesai'};
    if(p.SudahSerah && !lunas) return {kode: 'belum_lunas', label: 'Belum Lunas'};
    if(p.SudahBelanja) return {kode: 'siap_serah', label: 'Siap Diserahkan'};
    return {kode: 'perlu_belanja', label: 'Perlu Dibelanjakan'};
  },

  selisihHari(ymd){
    if(!ymd) return 0;
    const [y,m,d] = ymd.split('-').map(Number);
    const target = new Date(y, m-1, d);
    const now = new Date();
    now.setHours(0,0,0,0);
    return Math.floor((now - target) / (1000*60*60*24));
  },

  fmtTanggal(ymd){
    if(!ymd) return '';
    const [y,m,d] = ymd.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString('id-ID',
      {day:'numeric', month:'short', year:'numeric'});
  },

  updateCount(){
    const aktif = this.list.filter(p => p.Status !== 'selesai').length;
    const c = document.getElementById('cntPesanan');
    if(c){
      c.textContent = aktif;
      c.style.display = aktif > 0 ? '' : 'none';
    }
  },

  /* ---------- HANDLERS ---------- */
  attachHandlers(){
    const btnBaru = document.getElementById('btnPesananBaru');
    if(btnBaru) btnBaru.addEventListener('click', () => this.openModalBaru());

    const btnRiwayat = document.getElementById('btnRiwayat');
    if(btnRiwayat) btnRiwayat.addEventListener('click', () => {
      this.riwayatOpen = !this.riwayatOpen;
      this.render();
    });

    document.querySelectorAll('#tabBelPesanan .order-card').forEach(card => {
      card.addEventListener('click', () => {
        this.currentId = card.dataset.id;
        this.render();
      });
    });

    const btnBack = document.getElementById('btnPesananBack');
    if(btnBack) btnBack.addEventListener('click', () => {
      this.currentId = null;
      this.render();
    });

    const btnEdit = document.getElementById('btnEditInfoPesanan');
    if(btnEdit) btnEdit.addEventListener('click', () => this.openModalEditInfo());

    document.querySelectorAll('#tabBelPesanan .price-edit').forEach(el => {
      el.addEventListener('click', () => this.openModalEditItem(el.dataset.itemId));
    });

    document.querySelectorAll('#tabBelPesanan .item-del-pesanan').forEach(el => {
      el.addEventListener('click', () => this.hapusItem(el.dataset.itemId));
    });

    const btnAddItem = document.getElementById('btnAddItemPesanan');
    if(btnAddItem) btnAddItem.addEventListener('click', () => this.openModalTambahItem());

    const btnMulai = document.getElementById('btnMulaiBelanja');
    if(btnMulai) btnMulai.addEventListener('click', () => this.openModalSumberSaldo());

    const btnSerah = document.getElementById('btnTandaiSerah');
    if(btnSerah) btnSerah.addEventListener('click', () => this.tandaiSerah());

    const btnBayar = document.getElementById('btnBayarPesanan');
    if(btnBayar && !btnBayar.disabled) btnBayar.addEventListener('click', () => this.openModalBayar());

    const btnNota = document.getElementById('btnNotaPesanan');
    if(btnNota) btnNota.addEventListener('click', () => this.openModalNota());

    const btnHapus = document.getElementById('btnHapusPesanan');
    if(btnHapus) btnHapus.addEventListener('click', () => this.hapusPesanan());
  },

  /* ---------- BARU: konfirmasi generik ---------- */
  konfirmasiAksi({judul, pesan, labelA, labelB, danger, onA, onB}){
    return this._buatModal({
      title: judul,
      body: `<p style="margin:0;font-size:13px;line-height:1.55;
              color:var(--ink-900);">${pesan}</p>`,
      confirmLabel: labelA,
      cancelLabel: labelB || 'Batal',
      onConfirm: () => { if(onA) onA(); return true; },
      onCancel: () => { if(onB) onB(); }
    });
  },

  openModalBaru(){
    const ov = this._buatModal({
      title: 'Pesanan Baru',
      body: `
        <div class="field-pes">
          <label>Nama Pemesan</label>
          <input type="text" id="np_nama" placeholder="mis. Bu Sari">
        </div>
        <div class="field-pes">
          <label>No HP (opsional)</label>
          <input type="tel" id="np_hp" placeholder="08xx xxxx xxxx" inputmode="tel">
        </div>
        <div class="field-pes">
          <label>Tanggal</label>
          <input type="date" id="np_tgl" value="${todayYmd()}">
        </div>
        <div class="field-pes">
          <label>Keterangan (opsional)</label>
          <textarea id="np_ket" placeholder="Catatan pengantaran / pengambilan"></textarea>
        </div>`,
      confirmLabel: 'Buat Pesanan',
      onConfirm: async () => {
        const nama = document.getElementById('np_nama').value.trim();
        const noHP = document.getElementById('np_hp').value.trim();
        const tanggal = document.getElementById('np_tgl').value || todayYmd();
        const keterangan = document.getElementById('np_ket').value.trim();
        if(!nama){ showToast('Nama wajib diisi'); return false; }

        const id = 'p-' + Date.now();
        try{
          await SayurStorage.post('addPesanan', {
            id, nama, noHP, keterangan, tanggal
          });
          showToast('✓ Pesanan dibuat');
          ov.remove();
          await this.loadList();
          this.currentId = id;
          this.render();
        }catch(e){
          showToast('Gagal: ' + e.message);
          return false;
        }
      }
    });
    setTimeout(() => {
      const inp = document.getElementById('np_nama');
      if(inp) inp.focus();
    }, 100);
  },

  openModalEditInfo(){
    const p = this.list.find(x => x.ID === this.currentId);
    if(!p) return;
    const ov = this._buatModal({
      title: 'Ubah Info Pemesan',
      body: `
        <div class="field-pes">
          <label>Nama</label>
          <input type="text" id="ei_nama" value="${escHtml(p.Nama)}">
        </div>
        <div class="field-pes">
          <label>No HP</label>
          <input type="tel" id="ei_hp" value="${escHtml(p.NoHP || '')}">
        </div>
        <div class="field-pes">
          <label>Tanggal</label>
          <input type="date" id="ei_tgl" value="${p.Tanggal}">
        </div>
        <div class="field-pes">
          <label>Keterangan</label>
          <textarea id="ei_ket">${escHtml(p.Keterangan || '')}</textarea>
        </div>`,
      confirmLabel: 'Simpan',
      onConfirm: async () => {
        const nama = document.getElementById('ei_nama').value.trim();
        if(!nama){ showToast('Nama wajib'); return false; }
        try{
          await SayurStorage.post('updatePesanan', {
            id: p.ID,
            nama,
            noHP: document.getElementById('ei_hp').value.trim(),
            tanggal: document.getElementById('ei_tgl').value,
            keterangan: document.getElementById('ei_ket').value.trim()
          });
          showToast('✓ Tersimpan');
          ov.remove();
          await this.loadList();
          this.render();
        }catch(e){
          showToast('Gagal: ' + e.message);
          return false;
        }
      }
    });
  },

  openModalTambahItem(){
    const ov = this._buatModal({
      title: 'Tambah Barang',
      body: `
        <div class="field-pes">
          <label>Nama Barang</label>
          <div class="ac-wrap-pes">
            <input type="text" class="ac-input-pes" id="ti_nama"
                   placeholder="Cari atau ketik barang"
                   autocomplete="off" autocorrect="off" spellcheck="false">
            <div class="ac-drop-pes" id="ti_ac"></div>
          </div>
        </div>
        <div class="field-row-pes">
          <div class="field-pes">
            <label>Jumlah</label>
            <input type="text" id="ti_qty" inputmode="decimal" placeholder="0">
          </div>
          <div class="field-pes">
            <label>Satuan</label>
            <input type="text" id="ti_satuan" placeholder="kg, ikat, pcs">
          </div>
        </div>
        <div class="field-pes">
          <label>Harga Jual</label>
          <input type="text" class="money" id="ti_harga" inputmode="numeric" placeholder="0">
        </div>

          <label>Harga Beli (opsional)</label>
          <input type="text" class="money" id="ti_hargabeli" inputmode="numeric"

        </div>`,
      confirmLabel: 'Tambah',
      onConfirm: async () => {
        const nama = document.getElementById('ti_nama').value.trim();
        const qty = Number(String(document.getElementById('ti_qty').value).replace(/[^\d.]/g,'')) || 0;
        const satuan = document.getElementById('ti_satuan').value.trim() || 'kg';
        const harga = Number(String(document.getElementById('ti_harga').value).replace(/\D/g,'')) || 0;
        const hargabeli = Number(String(document.getElementById('ti_hargabeli').value).replace(/\D/g,'')) || 0;

        if(!nama){ showToast('Nama wajib'); return false; }
        if(qty <= 0){ showToast('Jumlah wajib'); return false; }
        if(harga <= 0){ showToast('Harga jual wajib'); return false; }

        try{
          await SayurStorage.post('addItemPesanan', {
            id: 'ip-' + Date.now(),
            pesananId: this.currentId,
            namaBarang: nama,
            qty, satuan, hargaJual: harga,
            hargaBeli: hargabeli > 0 ? hargabeli : 0
          });
          showToast('✓ Ditambahkan');
          ov.remove();
          await this.loadList();
          this.render();
        }catch(e){
          showToast('Gagal: ' + e.message);
          return false;
        }
      },
      afterRender: () => {
        this._bindAutocomplete();
        this._bindMoney('ti_harga');
        this._bindMoney('ti_hargabeli');
        setTimeout(() => {
          const inp = document.getElementById('ti_nama');
          if(inp) inp.focus();
        }, 100);
      }
    });
  },

  openModalEditItem(itemId){
    const p = this.list.find(x => x.ID === this.currentId);
    if(!p) return;
    const item = (p.Items || []).find(x => x.ID === itemId);
    if(!item) return;

    const ov = this._buatModal({
      title: 'Edit Barang',
      body: `
        <div class="field-pes">
          <label>Harga Jual</label>
          <input type="text" class="money" id="ei_harga"
                 value="${(Number(item.HargaJual)||0).toLocaleString('id-ID')}">
        </div>
        <div class="field-pes">
          <label>Harga Beli</label>
          <input type="text" class="money" id="ei_hargabeli"
                 value="${item.HargaBeli ? Number(item.HargaBeli).toLocaleString('id-ID') : ''}"
                 placeholder="—">
        </div>
        <div class="field-pes">
          <label>Jumlah</label>
          <input type="text" id="ei_qty" inputmode="decimal"
                 value="${escHtml(item.Qty)}">
        </div>`,
      confirmLabel: 'Simpan',
      onConfirm: async () => {
        const harga = Number(String(document.getElementById('ei_harga').value).replace(/\D/g,'')) || 0;
        const hargabeli = Number(String(document.getElementById('ei_hargabeli').value).replace(/\D/g,'')) || 0;
        const qty = document.getElementById('ei_qty').value.trim();
        if(harga <= 0){ showToast('Harga jual wajib'); return false; }
        try{
          await SayurStorage.post('updateItemPesanan', {
            id: itemId,
            qty, hargaJual: harga,
            hargaBeli: hargabeli
          });
          showToast('✓ Tersimpan');
          ov.remove();
          await this.loadList();
          this.render();
        }catch(e){
          showToast('Gagal: ' + e.message);
          return false;
        }
      },
      afterRender: () => {
        this._bindMoney('ei_harga');
        this._bindMoney('ei_hargabeli');
      }
    });
  },

  async hapusItem(itemId){
    if(!confirm('Hapus barang ini?')) return;
    try{
      await SayurStorage.post('deleteItemPesanan', {id: itemId});
      showToast('✓ Dihapus');
      await this.loadList();
      this.render();
    }catch(e){
      showToast('Gagal: ' + e.message);
    }
  },

    let pilih = p.SumberSaldo || 'Cash';

    const ov = this._buatModal({
      title: 'Sumber Dana Belanja',
      subtitle: `Untuk pesanan ${escHtml(p.Nama)}, ambil uang dari saldo mana?`,

        <div class="field-pes">
          <div style="display:flex;gap:6px;">

              💵 Saldo Cash

            <button type="button" class="pil-sumber" data-metode="QRIS"
              style="flex:1;padding:12px;border:1.5px solid var(--line);

              background:${pilih==='QRIS'?'var(--blue-100)':'var(--card)'};
              color:${pilih==='QRIS'?'var(--blue-600)':'var(--ink-700)'};

  pindahKeRencana(p){
    const items = p.Items || [];
    items.forEach(it => {
      let target = Belanja.state.find(b =>
        b.nama.toLowerCase() === it.NamaBarang.toLowerCase());
      if(!target){
        const newId = 'pes-' + it.ID;
        target = {
          id: newId,
          nama: it.NamaBarang,
          satuan: it.Satuan,
          hargaBeli: Number(it.HargaBeli) || 0,
          hargaJual: Number(it.HargaJual) || 0,
          qty: String(it.Qty),
          checked: true,
          bayarNanti: false,
          supplier: '',
          tersimpan: false,
          dariPesananID: p.ID,
          dariPesananItemID: it.ID
        };
        Belanja.state.push(target);
      } else {
        target.checked = true;
        target.qty = String(it.Qty);
        target.dariPesananID = p.ID;
        target.dariPesananItemID = it.ID;
      }
    });
    Belanja.saveLocalState();
    Belanja.renderRencana();
    Belanja.renderAktual();
    Belanja.updateSubtabCounts();
    Belanja.attachHandlers();
  },

                  await this.loadPiutang();

                  await this.loadPiutang();

        if(kurang > TOLERANSI_SELISIH){

                await this.loadList();
                await this.loadPiutang();

                await simpanPembayaran(jumlah, catatan || 'DP');
                showToast(`DP ${rupiah(jumlah)} dicatat`);
                await this.loadList();
                await this.loadPiutang();
                this.render();
              }catch(e){ showToast('Gagal: ' + e.message); }

        this._bindMoney('pm_jml');

        /* Live hint */
        const inp = document.getElementById('pm_jml');
        const info = document.getElementById('pm_info');
        const updateInfo = () => {
          const n = Number(String(inp.value).replace(/\D/g,'')) || 0;
          info.className = 'pm-info';
          if(n <= 0) return;
          if(n === sisa){
            info.textContent = '✓ Sesuai sisa';
            info.classList.add('ok','show');
          } else if(n > sisa){
            const sel = n - sisa;
            if(sel > TOLERANSI_SELISIH){
              info.textContent = `⚠ Kelebihan ${rupiah(sel)} — maksimal ${rupiah(TOLERANSI_SELISIH)}`;
              info.classList.add('danger','show');
            } else {
              info.textContent = `Lebih ${rupiah(sel)} — nanti ditanya kembalian?`;
              info.classList.add('warn','show');
            }
          } else {
            const sel = sisa - n;
            if(sel > TOLERANSI_SELISIH){
              info.textContent = `DP — sisa ${rupiah(sel)}`;
              info.classList.add('info','show');
            } else {
              info.textContent = `Kurang ${rupiah(sel)} — nanti ditanya lunas / DP?`;

        };
        if(inp){

  /* ---------- UPDATED: buildNotaText dengan opsi ---------- */
  buildNotaText(p){
    const total = Number(p.Total) || 0;
    const dibayar = Number(p.Dibayar) || 0;
    const sisa = Number(p.Sisa) || 0;
    const lunas = sisa <= 0;
    const items = p.Items || [];
    const opsi = this._notaOpsi || {tampilHP: true, tampilCatatan: true};

    const lines = [];
    lines.push(App.pengaturan.NamaLapak || 'H. Mawih Sayur');
    const noHP = App.pengaturan.NoHP || '';
    if(noHP) lines.push('HP: ' + noHP);
    lines.push('');
    lines.push('Nota Pesanan');
    lines.push('─────────────────────────────');
    lines.push('Nama    : ' + p.Nama);
    if(opsi.tampilHP && p.NoHP) lines.push('HP      : ' + p.NoHP);
    const [y,m,d] = (p.Tanggal||'').split('-').map(Number);
    const tglPanjang = p.Tanggal ?
      new Date(y, m-1, d).toLocaleDateString('id-ID',
        {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : '';
    lines.push('Tanggal : ' + tglPanjang);
    if(opsi.tampilCatatan && p.Keterangan) lines.push('Catatan : ' + p.Keterangan);
    lines.push('');

    const maxNama = Math.max(...items.map(it => (it.NamaBarang||'').length), 6);
    items.forEach(it => {
      const nm = String(it.NamaBarang).padEnd(maxNama, ' ');
      const qty = `${it.Qty} ${it.Satuan}`.padEnd(10, ' ');
      const hrg = `×${Number(it.HargaJual).toLocaleString('id-ID')}`.padStart(9, ' ');
      const sub = `=${Number(it.Subtotal).toLocaleString('id-ID')}`.padStart(10, ' ');
      lines.push(`${nm}  ${qty} ${hrg}  ${sub}`);
    });

    lines.push('─────────────────────────────');
    lines.push('Total   : Rp ' + total.toLocaleString('id-ID'));
    lines.push('Dibayar : Rp ' + dibayar.toLocaleString('id-ID'));
    if(!lunas) lines.push('Sisa    : Rp ' + sisa.toLocaleString('id-ID'));
    else lines.push('Status  : LUNAS');
    lines.push('');
    lines.push('Terima kasih');

    return lines.join('\n');
  },

  _shareText(text){
    if(navigator.share){
      navigator.share({text})
        .then(() => showToast('✓ Dikirim'))
        .catch(err => {
          if(err.name !== 'AbortError'){
            navigator.clipboard.writeText(text)
              .then(() => showToast('Disalin'))
              .catch(() => showToast('Gagal'));
          }
        });
    } else {
      navigator.clipboard.writeText(text)
        .then(() => showToast('Disalin'))
        .catch(() => showToast('Gagal'));
    }
  },
