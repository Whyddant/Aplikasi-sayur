  if(dark) document.documentElement.classList.add('dark');
})();

<style data-page="beranda" media="not all">

  --accent:#2F5233; --accent-tint:#E1EDE0;
  --pos:#2E7D32; --warn:#8A5A00; --warn-bg:#FFF3D1; --warn-bar:#C98A00;
  --danger:#B42318; --danger-solid:#B42318; --danger-bg:#FDE7E3;
  --info:#2563A0; --info-tint:#E1EDF6;
  --plum:#6B2C4A; --plum-tint:#F5E6EE;
  --bar-omzet:#C3D1BF; --bar-laba:#2F5233;
  --r:16px; --r-sm:12px;

  color-scheme:light;
}

  --bg:#0E120E; --surface:#171C16; --line:#2A3228; --line-soft:#20261F;
  --text:#EDF0E8; --text-2:#BCC4B5; --text-3:#9BA494;
  --brand:#2F5233; --appbar:#1B261B;
  --accent:#8CC792; --accent-tint:#223325;
  --pos:#6FCF7A; --warn:#E6C16A; --warn-bg:#2A2415; --warn-bar:#E6B450;
  --danger:#FF8F80; --danger-solid:#B42318; --danger-bg:#3A1D18;
  --info:#7FB2E6; --info-tint:#17293A;
  --plum:#D18AAE; --plum-tint:#2A1B24;
  --bar-omzet:#38483A; --bar-laba:#8CC792;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{

  overscroll-behavior-y:contain;touch-action:manipulation;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
}

h1,h2,p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font-family:inherit}
.num{font-variant-numeric:tabular-nums lining-nums}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.appbar{
  position:sticky;top:0;z-index:50;

  padding:calc(10px + env(safe-area-inset-top,0px)) 8px 10px 16px;
  display:flex;align-items:center;gap:8px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;
  background:rgba(255,255,255,.12)}
.brand-text{min-width:0}
.brand h1{font-size:var(--fs-md);font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:var(--fs-xs);color:#D5E2D1;line-height:1.3}
.sync-chip{
  display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;
  border-radius:999px;background:rgba(255,255,255,.14);
  font-size:var(--fs-xs);font-weight:600;white-space:nowrap;
}
.sync-chip:active{background:rgba(255,255,255,.26)}
.sync-chip.online{width:40px;padding:0;justify-content:center}
.sync-chip.online #syncChipTxt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sync-chip .dot{width:8px;height:8px;border-radius:50%;background:#8FD18A;flex:none}
.sync-chip.pending .dot{background:#F2C14E;animation:pulse 1.6s ease-in-out infinite}
.sync-chip.offline .dot{background:#C9CFC4}
.sync-chip.failed .dot{background:#FF8F80}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.appbar .icon-btn:active{background:rgba(255,255,255,.2)}
@keyframes pulse{50%{opacity:.35}}
.screen{max-width:520px;margin:0 auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.notice{
  display:flex;align-items:center;gap:12px;width:100%;min-height:56px;
  padding:10px 14px;border-radius:var(--r);
  background:var(--warn-bg);color:var(--warn);
}
.notice[hidden]{display:none}
.notice.failed{background:var(--danger-bg);color:var(--danger)}
.notice .ic{flex:none}
.notice b{display:block;font-size:var(--fs-sm);font-weight:600}
.notice span.sub{display:block;font-size:var(--fs-xs);color:var(--text-2)}
.notice .body{flex:1;min-width:0}
.hero{padding:20px 20px 0}
.hero-label{font-size:var(--fs-sm);font-weight:500;color:var(--text-2)}
.hero-value{margin-top:4px;font-size:var(--fs-xl);font-weight:700;
  line-height:1.1;letter-spacing:-.02em}
.hero-value .cur{font-size:var(--fs-md);font-weight:600;color:var(--text-2);
  margin-right:4px;letter-spacing:0}
.hero.neg .hero-value{color:var(--danger)}
.meter{height:8px;margin-top:16px;border-radius:999px;
  background:var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;
  background:var(--pos);transition:width .6s ease}
.meter.hampir i{background:var(--warn-bar)}
.meter.jauh i{background:var(--danger)}
.meter-text{display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-top:8px;font-size:var(--fs-sm);color:var(--text-2)}
.meter-text>*{white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;
  font-weight:600;color:var(--pos)}
.status .ic{width:16px;height:16px}
.status.hampir{color:var(--warn)}
.status.jauh{color:var(--danger)}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;
  border-top:1px solid var(--line-soft)}
.hero-stats>div{padding:14px 0}
.hero-stats>div+div{padding-left:16px;border-left:1px solid var(--line-soft)}
.hero-stats span{display:block;font-size:var(--fs-sm);color:var(--text-2)}
.hero-stats b{display:block;margin-top:2px;font-size:var(--fs-lg);font-weight:700}
.hero-empty{padding:20px}
.hero-empty h2{font-size:var(--fs-lg);font-weight:700}
.hero-empty p{margin-top:6px;font-size:var(--fs-sm);color:var(--text-2)}
.empty-cta{
  display:block;width:100%;min-height:48px;margin-top:16px;padding:0 16px;
  border:0;border-radius:var(--r-sm);background:var(--accent);color:var(--bg);
  font-family:inherit;font-size:var(--fs-md);font-weight:600;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.empty-cta:active{filter:brightness(.92)}
.empty-cta:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shortcuts{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
  margin:4px 0 8px;
}
.shortcut{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:6px 0;min-width:0;background:none;border:0;border-radius:var(--r-sm);
  font-family:inherit;font-size:var(--fs-xs);font-weight:600;color:var(--text);
  text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.shortcut .tile{
  width:48px;height:48px;border-radius:14px;
  display:grid;place-items:center;
  background:var(--accent-tint);color:var(--accent);
  transition:transform .12s ease,filter .12s ease;
}
.shortcut .tile .ic{width:22px;height:22px}
.shortcut:active .tile{transform:scale(.94);filter:brightness(.95)}
.shortcut:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shortcut>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-card{overflow:hidden}
.row-btn{
  display:flex;align-items:center;gap:12px;width:100%;
  min-height:56px;padding:10px 16px;
}
.row-btn:active{background:var(--line-soft)}
.row-btn .badge{width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;background:var(--warn-bg);color:var(--warn);
  flex:none;font-size:14px}
.row-btn .body{flex:1;min-width:0}
.row-btn .t{display:block;font-size:var(--fs-sm);font-weight:600}
.row-btn .s{display:block;font-size:var(--fs-xs);color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-btn .chev{color:var(--text-3);flex:none;width:18px;height:18px}
.saldo{display:block;width:100%;padding:16px;border:0;background:none;
  text-align:left;cursor:pointer;font-family:inherit;color:inherit}
.saldo:active{background:var(--line-soft)}
.saldo-top{display:flex;align-items:center;justify-content:space-between}
.saldo-top span{font-size:var(--fs-sm);font-weight:500;color:var(--text-2)}
.saldo-top .chev{color:var(--text-3);width:18px;height:18px}
.saldo-v{margin-top:2px;font-size:24px;font-weight:700;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}
.saldo-v .cur{font-size:var(--fs-sm);font-weight:600;color:var(--text-2);
  margin-right:4px}
.split{display:flex;height:8px;margin-top:14px;border-radius:999px;
  overflow:hidden;gap:2px;background:var(--line-soft)}
.split i{display:block;height:100%}
.split .tunai{background:var(--pos)}
.split .qris{background:var(--info)}
.legend{display:flex;gap:20px;margin-top:10px;font-size:var(--fs-sm);
  flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--text-2)}
.legend b{color:var(--text);font-weight:600}
.legend .sw{width:10px;height:10px;border-radius:3px}
.debt{border-top:1px solid var(--line-soft)}
.debt .t{font-weight:500}
.debt .v{font-size:var(--fs-sm);font-weight:700;
  font-variant-numeric:tabular-nums}
.debt .v.bad{color:var(--danger)}
.chart{padding:16px;position:relative}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chart-head h2{font-size:var(--fs-md);font-weight:700}
.chart-head span{font-size:var(--fs-xs);color:var(--text-2)}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;
  margin:14px 0 12px;padding:12px;border-radius:var(--r-sm);
  background:var(--bg);min-height:92px;align-content:start}
.dd-date{grid-column:1/-1;font-size:var(--fs-sm);font-weight:600}
.dd-empty{grid-column:1/-1;font-size:var(--fs-sm);color:var(--text-2)}
.dd-item span{display:block;font-size:var(--fs-xs);color:var(--text-2)}
.dd-item b{display:block;font-size:var(--fs-md);font-weight:700}
.dd-item b.pos{color:var(--pos)}
.dd-item b.neg{color:var(--danger)}
.dd-sub{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;
  margin-top:4px;font-size:var(--fs-xs);color:var(--text-2)}
.chart-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:6px 0;border-radius:var(--r-sm)}
.chart-col[aria-pressed="true"]{background:var(--line-soft)}
.bars{width:100%;height:112px;display:flex;align-items:flex-end;
  justify-content:center;gap:3px;border-bottom:1px solid var(--line)}
.bar{width:12px;min-height:2px;border-radius:4px 4px 0 0}
.bar.omzet{background:var(--bar-omzet)}
.bar.laba{background:var(--bar-laba)}
.chart-col.neg .bar.laba{background:var(--danger)}
.chart-col .lbl{font-size:var(--fs-xs);color:var(--text-2);font-weight:500}
.chart-col.today .lbl{color:var(--accent);font-weight:700}
.chart-legend{display:flex;gap:16px;margin-top:8px;
  font-size:var(--fs-xs);color:var(--text-2)}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{width:10px;height:10px;border-radius:3px;display:block}
.chart-legend .o{background:var(--bar-omzet)}
.chart-legend .l{background:var(--bar-laba)}
.chart-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin:16px 0 4px}
.sum{padding:12px;border-radius:var(--r-sm);background:var(--bg)}
.sum span{display:block;font-size:var(--fs-xs);color:var(--text-2)}
.sum b{display:block;margin-top:2px;font-size:var(--fs-md);font-weight:700}
.sum b.pos{color:var(--pos)}
.sum small{display:block;margin-top:2px;font-size:var(--fs-xs);color:var(--text-2)}
.chart-empty{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:28px 12px 20px;text-align:center;color:var(--text-2);
  font-size:var(--fs-sm)}
.chart-empty .ic{width:32px;height:32px;color:var(--text-3)}
.chart-empty b{color:var(--text);font-weight:600}
.navbar{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
}
.navbar button{display:flex;flex-direction:column;align-items:center;gap:4px;
  min-height:56px;font-size:var(--fs-xs);font-weight:500;color:var(--text-3)}
.navbar .pill{width:60px;height:30px;border-radius:999px;
  display:grid;place-items:center;transition:background .15s}
.navbar .ic{width:22px;height:22px}
.navbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.navbar button[aria-current="page"] .pill{background:var(--accent-tint)}
.navbar button:active .pill{background:var(--line-soft)}
.sheet-ov{position:fixed;inset:0;z-index:100;display:none;
  align-items:flex-end;justify-content:center;background:rgba(8,12,8,.5)}
.sheet-ov.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:88dvh;
  display:flex;flex-direction:column;background:var(--surface);
  border-radius:20px 20px 0 0;outline:none;animation:sheetUp .22s ease-out}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--line);
  margin:8px auto 0;flex:none}
.sheet-head{padding:12px 20px 0;flex:none}
.sheet-head h2{font-size:var(--fs-lg);font-weight:700}
.sheet-sub{margin-top:4px;font-size:var(--fs-sm);color:var(--text-2)}
.sheet-body{padding:12px 20px;overflow-y:auto;flex:1}
.sheet-actions{display:flex;flex-direction:column;gap:8px;flex:none;
  padding:8px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.btn{min-height:48px;padding:0 16px;border-radius:var(--r-sm);
  border:1px solid transparent;font-size:var(--fs-md);font-weight:600;
  text-align:center}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:active{filter:brightness(1.15)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:active{background:var(--line-soft)}
.btn-danger{background:var(--danger-solid);color:#fff}
.menu-list{padding:8px 12px}
.menu-item{display:flex;align-items:center;gap:16px;width:100%;
  min-height:52px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--fs-md)}
.menu-item:active{background:var(--line-soft)}
.menu-item .ic{color:var(--text-2);width:22px;height:22px}
.menu-item .label{flex:1;min-width:0;text-align:left}
.menu-div{height:1px;background:var(--line-soft);margin:6px 8px}
.switch{position:relative;width:44px;height:26px;border-radius:999px;
  background:var(--line);transition:background .2s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(18px)}
.day-list{display:flex;flex-direction:column;gap:8px}
.day-item{display:flex;align-items:center;justify-content:space-between;
  gap:12px;min-height:56px;padding:8px 16px;
  border:1px solid var(--line);border-radius:var(--r-sm)}
.day-item:active{background:var(--line-soft)}
.day-item b{display:block;font-size:var(--fs-sm);font-weight:600}
.day-item small{display:block;font-size:var(--fs-xs);color:var(--text-2)}
.day-item .chev{color:var(--text-3);width:18px;height:18px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.chip{min-height:48px;padding:0 12px;border:1.5px solid var(--line);
  border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:500;
  text-align:center;background:transparent}
.chip.on{border-color:var(--accent);background:var(--accent-tint);
  color:var(--accent);font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:var(--fs-xs);font-weight:600;
  color:var(--text-2);margin-bottom:6px}
.field input{width:100%;padding:11px 14px;border:1.5px solid var(--line);
  border-radius:var(--r-sm);background:var(--bg);color:var(--text);
  font-size:var(--fs-sm);font-weight:500;outline:none}
.field input:focus{border-color:var(--accent);background:var(--surface)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;z-index:200;max-width:calc(100% - 32px);
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(8px);
  background:var(--text);color:var(--bg);padding:12px 20px;
  border-radius:999px;font-size:var(--fs-sm);font-weight:500;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.sheet-open .toast{bottom:auto;top:calc(68px + 8px)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>

.btn-ghost:active{background:var(--line-soft)}
.sum-list{background:var(--bg);border-radius:var(--r-sm);padding:4px 12px;margin-bottom:12px}
.sum-line{
  display:flex;justify-content:space-between;gap:12px;
  min-height:44px;font-size:var(--fs-sm);font-weight:600;color:var(--text-2);
  align-items:center;
}
.sum-line + .sum-line{border-top:1px solid var(--line-soft)}
.sum-line b{color:var(--text);font-weight:700;text-align:right}
.sum-line.warn b{color:var(--warn)}
.sum-line.err b{color:var(--danger)}
.seg{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  padding:4px;background:var(--bg);border-radius:var(--r-sm);margin-bottom:12px;
}
.seg button{
  height:40px;border:0;border-radius:var(--r-sm);background:transparent;
  font-size:var(--fs-sm);font-weight:700;color:var(--text-3);cursor:pointer;
}
.seg button.on{background:var(--surface);color:var(--accent);
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
.opt{
  display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:4px;
  font-size:var(--fs-sm);font-weight:600;color:var(--text);cursor:pointer;user-select:none;
}
.preview{
  background:var(--bg);border-radius:var(--r-sm);padding:12px;
  font-size:var(--fs-xs);line-height:1.55;color:var(--text);
  white-space:pre-wrap;word-break:break-word;
  min-height:96px;max-height:36vh;overflow:auto;
}
.preview.empty{color:var(--text-3);font-weight:500}
.sheet-warn{
  background:var(--warn-bg);border:1px solid color-mix(in srgb, var(--warn) 30%, transparent);
  color:var(--warn);
  border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px;
  font-size:var(--fs-xs);font-weight:600;line-height:1.4;
}
.sheet-warn[hidden],.opt[hidden]{display:none}
.menu-list{padding:8px 12px}
.menu-item{
  display:flex;align-items:center;gap:16px;width:100%;min-height:52px;
  padding:0 8px;border-radius:var(--r-sm);font-size:var(--fs-md);
}
.menu-item:active{background:var(--line-soft)}
.menu-item .ic{color:var(--text-2);width:22px;height:22px}
.menu-item .label{flex:1;min-width:0;text-align:left}
.menu-div{height:1px;background:var(--line-soft);margin:6px 8px}
.menu-item.danger{color:var(--danger)}
.menu-item.danger .ic{color:var(--danger)}
.switch{
  position:relative;width:44px;height:26px;border-radius:999px;
  background:var(--line);transition:background .2s;flex:none;
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;
}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(18px)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.keypad{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  background:color-mix(in srgb, var(--line) 50%, var(--bg));
  border-radius:16px 16px 0 0;
  box-shadow:0 -8px 24px rgba(0,0,0,.18);
  padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);visibility:hidden;
  transition:transform .22s ease, visibility 0s linear .22s;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.keypad.show{
  transform:translateY(0);visibility:visible;
  transition:transform .22s ease, visibility 0s;
}
.kp-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;height:44px;padding:0 4px;
}
.kp-title{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.kp-name{
  font-size:var(--fs-sm);font-weight:700;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.kp-field{font-size:var(--fs-xs);font-weight:600;color:var(--text-3)}
.kp-close{
  width:44px;height:44px;margin-right:-8px;border:0;background:transparent;
  color:var(--text-3);display:grid;place-items:center;cursor:pointer;
}
.kp-close svg{
  width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
}
.kp-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(4,52px);gap:8px;
}
.kp-key{
  border:0;border-radius:10px;background:var(--surface);color:var(--text);
  font-size:21px;font-weight:600;padding:0;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.1);
  display:grid;place-items:center;touch-action:manipulation;
}
.kp-key:active{background:var(--line-soft)}
.kp-key.alt{background:var(--line);font-size:17px;font-weight:700}
.kp-key.alt:active{background:var(--line-soft)}
.kp-key.act{
  background:var(--accent);color:#fff;font-size:16px;font-weight:700;
  grid-column:4;grid-row:3 / span 2;box-shadow:none;
}
.kp-key.act:active{filter:brightness(1.15)}
.kp-key:disabled{opacity:.3;pointer-events:none}
.kp-key svg{
  width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}
.kp-fresh{background:color-mix(in srgb, var(--accent) 20%, transparent) !important;border-radius:4px}
.item-detail input,.settings-content input{
  -webkit-user-select:none;user-select:none;caret-color:transparent;
}
.qty-stepper.kp-on,.rp-field.kp-on{
  border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.app-footer.kp-edit .summary,
.app-footer.kp-edit .navbar{display:none}
.toast{
  position:fixed;left:50%;z-index:200;max-width:calc(100% - 32px);
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(8px);
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;
  font-size:var(--fs-sm);font-weight:500;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.sheet-open .toast{bottom:auto;top:calc(68px + 8px)}
@keyframes fieldPulse {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
  70%  { box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 0%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); }
}
.rp-field.field-highlight {
  animation: fieldPulse 1.2s ease-out 2;
  border-color: var(--accent);
  background: var(--surface);
}
/* ==========================================================
   BELANJA SUB-TABS (baru — Pesanan & Nota)
   ========================================================== */
.bel-subtabs{
  position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:38;
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:6px 8px;
}
.bel-subtabs button{
  padding:8px 6px;border:none;border-radius:var(--r-sm);
  background:transparent;color:var(--text-3);
  font-size:var(--fs-sm);font-weight:600;cursor:pointer;
  min-height:40px;display:flex;align-items:center;justify-content:center;gap:4px;
  white-space:nowrap;transition:background .15s, color .15s;
}
.bel-subtabs button.on{
  background:var(--accent-tint);color:var(--accent);font-weight:700;
}
.bel-tab{display:none}
.bel-tab.on{display:block}
#tabRencana .search-sticky{top:calc(112px + env(safe-area-inset-top,0px));}
body[data-beltab="pesanan"] .app-footer .safe-bar,
body[data-beltab="pesanan"] .app-footer .footer-handle,
body[data-beltab="pesanan"] .app-footer .settings-panel,
body[data-beltab="pesanan"] .app-footer .summary,
body[data-beltab="nota"]   .app-footer .safe-bar,
body[data-beltab="nota"]   .app-footer .footer-handle,
body[data-beltab="nota"]   .app-footer .settings-panel,
body[data-beltab="nota"]   .app-footer .summary{display:none}
body[data-beltab="pesanan"] .fab,
body[data-beltab="nota"]   .fab{display:none !important}
body[data-beltab="pesanan"],
body[data-beltab="nota"]{
  padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));
}
/* PESANAN */
.pesanan-actions{padding:12px 16px 8px;display:flex;gap:8px}
.btn-pesanan-baru{
  flex:1;padding:12px 14px;border:none;border-radius:var(--r-sm);
  background:var(--brand);color:#fff;
  font-size:var(--fs-sm);font-weight:700;cursor:pointer;
}
.btn-pesanan-baru:active{filter:brightness(1.15)}
.pesanan-list{padding:0 16px 16px}
.order-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;
  transition:background .12s;
}
.order-card:active{background:var(--line-soft)}
.order-card.done{opacity:.6}
.order-card.overdue{
  border-color:color-mix(in srgb,var(--danger) 40%,transparent);
  background:linear-gradient(160deg,var(--danger-bg),var(--surface));
}
.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.order-name{font-size:var(--fs-sm);font-weight:700}
.order-meta{font-size:var(--fs-xs);color:var(--text-3);margin-top:2px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.order-badge{
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;white-space:nowrap;
}
.order-badge.perlu_belanja{background:var(--warn-bg);color:var(--warn)}
.order-badge.siap_serah{background:var(--info-tint);color:var(--info)}
.order-badge.belum_lunas{background:var(--danger-bg);color:var(--danger)}
.order-badge.selesai{background:var(--accent-tint);color:var(--accent)}
.order-summary{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:var(--fs-xs);color:var(--text-2);padding-top:8px;
  border-top:1px dashed var(--line-soft);margin-top:8px;
}
.order-summary b{font-size:var(--fs-sm);color:var(--text)}
.order-summary b.paid{color:var(--pos)}
.banner-piutang{
  margin:12px 16px 0;
  background:var(--warn-bg);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  border-radius:var(--r);padding:12px 14px;
}
.bp-title{font-size:var(--fs-sm);font-weight:700;color:var(--warn);margin-bottom:6px}
.bp-item{font-size:var(--fs-xs);color:var(--text-2);
  display:flex;justify-content:space-between;padding:3px 0}
.bp-item b{color:var(--text);font-weight:700}
.section-head-pesanan{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px 6px;font-size:var(--fs-xs);font-weight:700;
  color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;
}
.riwayat-toggle{
  margin:8px 16px;padding:12px 14px;background:var(--surface);
  border:1px dashed var(--line);border-radius:var(--r-sm);
  color:var(--text-2);font-size:var(--fs-sm);font-weight:600;
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  width:calc(100% - 32px);
}
.riwayat-toggle.open{background:var(--line-soft);border-style:solid}
.riwayat-toggle .cnt{
  display:inline-block;padding:1px 8px;background:var(--line-soft);
  color:var(--text-3);font-size:10px;border-radius:999px;
  font-weight:700;margin-left:6px;
}
.pesanan-empty{
  text-align:center;padding:40px 20px;color:var(--text-3);
  font-size:var(--fs-sm);line-height:1.6;
}
.detail-head-pesanan{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);margin:0 0 12px;
}
.btn-back-pesanan{
  width:36px;height:36px;border-radius:50%;background:var(--line-soft);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex:none;color:var(--text-2);
}
.btn-back-pesanan svg{width:18px;height:18px;stroke:currentColor;fill:none;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.detail-title-pesanan{flex:1;min-width:0;font-size:var(--fs-md);font-weight:700}
.detail-sub-pesanan{font-size:var(--fs-xs);color:var(--text-3);margin-top:1px}
.pesanan-detail-body{padding:0 16px 16px}
.pemesan-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative;
}
.pemesan-card .row{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:var(--fs-sm)}
.pemesan-card .row .lbl{color:var(--text-3);width:70px;flex-shrink:0;font-size:var(--fs-xs);padding-top:2px}
.pemesan-card .row .val{flex:1;color:var(--text);font-weight:500;word-break:break-word}
.pemesan-card .row .val.ket{
  padding:6px 10px;background:var(--bg);border-radius:6px;
  border-left:2px solid var(--warn);font-weight:400;font-size:var(--fs-xs);line-height:1.5;
}
.btn-edit-info{
  position:absolute;top:10px;right:12px;background:none;border:none;
  color:var(--text-3);font-size:16px;cursor:pointer;padding:4px 8px;
}
.status-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:12px;
}
.status-card.done{
  background:linear-gradient(150deg,var(--accent-tint),var(--surface));
  border-color:color-mix(in srgb,var(--accent) 25%,transparent);
}
.status-card .row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:var(--fs-sm)}
.status-card .row .lbl{color:var(--text-2)}
.status-card .row .amt{font-weight:700}
.status-card .row .amt.neg{color:var(--danger)}
.status-card .row .amt.pos{color:var(--pos)}
.status-card .row.total{border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.status-card .row.total .lbl{font-weight:700;color:var(--text)}
.status-card .row.total .amt{font-size:var(--fs-md)}
.item-list-pesanan{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin-bottom:12px;
}
.item-row-pesanan{
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line-soft);
}
.item-row-pesanan:last-child{border-bottom:none}
.item-body-pesanan{flex:1;min-width:0}
.item-name-pesanan{font-size:var(--fs-sm);font-weight:600}
.item-detail-pesanan{
  font-size:var(--fs-xs);color:var(--text-3);margin-top:2px;
  display:flex;gap:6px;flex-wrap:wrap;
}
.item-detail-pesanan .price-edit{color:var(--accent);text-decoration:underline;
  cursor:pointer;font-weight:600}
.item-subtotal-pesanan{font-weight:700;font-size:var(--fs-sm);flex-shrink:0}
.item-del-pesanan{
  background:none;border:none;color:var(--text-3);
  font-size:18px;padding:0 2px;cursor:pointer;line-height:1;flex-shrink:0;
}
.btn-add-item{
  width:100%;padding:12px;background:var(--surface);
  border:1.5px dashed var(--line);border-radius:var(--r);
  color:var(--accent);font-size:var(--fs-sm);font-weight:600;
  cursor:pointer;margin-bottom:12px;
}
.payment-history{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:12px;
}
.payment-title{
  font-size:var(--fs-xs);font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;
}
.payment-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:6px 0;font-size:var(--fs-sm);
}
.payment-row:not(:last-child){border-bottom:1px solid var(--line-soft)}
.payment-row .lbl{color:var(--text-2);font-size:var(--fs-xs)}
.payment-row .amt{font-weight:700;color:var(--pos)}
.payment-empty{font-size:var(--fs-xs);color:var(--text-3);text-align:center;padding:8px 0}
.btn-selesai-pesanan{
  width:100%;padding:14px;border-radius:var(--r-sm);border:none;
  font-size:var(--fs-sm);font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;
}
.btn-selesai-pesanan.primary{background:var(--brand);color:#fff}
.detail-actions-pesanan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.detail-actions-pesanan button{
  padding:12px;border-radius:var(--r-sm);border:none;
  font-size:var(--fs-sm);font-weight:600;cursor:pointer;
}
.btn-pay-pesanan{background:var(--brand);color:#fff}
.btn-pay-pesanan:disabled{opacity:.5;cursor:not-allowed}
.btn-nota-pesanan{background:var(--surface);border:1.5px solid var(--accent)!important;color:var(--accent)}
.btn-delete-pesanan{
  width:100%;padding:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--danger);font-size:var(--fs-sm);font-weight:600;cursor:pointer;
}
.field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field-row-2 .field{margin-bottom:0}
.nota-preview{
  background:var(--bg);border-radius:var(--r-sm);padding:14px;
  font-family:'Courier New',monospace;font-size:12px;
  line-height:1.6;color:var(--text);
  white-space:pre-wrap;word-break:break-word;
  max-height:340px;overflow-y:auto;
  border:1px solid var(--line-soft);
}
/* === PESANAN: Bayar & Konfirmasi === */
.bayar-info-box{
  background:var(--bg);border-radius:var(--r-sm);
  padding:10px 12px;margin-bottom:14px;font-size:var(--fs-sm);
}
.bayar-info-box .row{
  display:flex;justify-content:space-between;padding:3px 0;
}
.bayar-info-box .row .lbl{color:var(--text-2)}
.bayar-info-box .row .amt{
  font-weight:700;font-variant-numeric:tabular-nums;
}
.bayar-info-box .row.total{
  padding:6px 0 2px;border-top:1px dashed var(--line);margin-top:4px;
}
.btn-lunas-cepat{
  width:100%;padding:14px;border-radius:var(--r-sm);border:none;
  background:var(--brand);color:#fff;
  font-size:var(--fs-sm);font-weight:700;cursor:pointer;margin-bottom:14px;
}
.btn-lunas-cepat:active{filter:brightness(1.15)}
.divider-atau{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;
}
.divider-atau .line{flex:1;height:1px;background:var(--line)}
.divider-atau .txt{
  font-size:10.5px;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.5px;font-weight:600;
}
.pm-info{
  display:none;font-size:11.5px;margin-top:6px;
  padding:7px 10px;border-radius:6px;line-height:1.4;
}
.pm-info.show{display:block}
.pm-info.ok{background:var(--accent-tint);color:var(--accent)}
.pm-info.warn{background:var(--warn-bg);color:var(--warn)}
.pm-info.info{background:var(--info-tint);color:var(--info)}
.pm-info.danger{background:var(--danger-bg);color:var(--danger)}

/* === PESANAN: Nota (opsi toggle & preview) === */
.opsi-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;background:var(--bg);border-radius:var(--r-sm);
  margin-bottom:8px;cursor:pointer;
}
.opsi-row .lbl{
  font-size:var(--fs-sm);color:var(--text-2);
  display:flex;flex-direction:column;gap:2px;
}
.opsi-row .lbl small{
  font-size:10.5px;color:var(--text-3);font-weight:400;
}
.opsi-row .sw{
  width:38px;height:22px;background:var(--line);
  border-radius:22px;position:relative;flex-shrink:0;
  transition:background .2s;
}
.opsi-row .sw::after{
  content:'';position:absolute;top:2px;left:2px;
  width:18px;height:18px;background:#fff;border-radius:50%;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.opsi-row.on .sw{background:var(--accent)}
.opsi-row.on .sw::after{transform:translateX(16px)}
.kirim-opsi-pes{display:flex;gap:8px;margin-bottom:10px}
.kirim-opsi-pes button{
  flex:1;padding:12px 8px;border:1.5px solid var(--line);
  border-radius:var(--r-sm);background:var(--surface);
  font-size:var(--fs-sm);font-weight:600;color:var(--text-2);
  cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:4px;
}
.kirim-opsi-pes button:active{background:var(--line-soft)}
.kirim-opsi-pes button .icn{font-size:20px}
.nota-preview-pes{
  background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:14px 16px;

body.kp-open .sheet-actions{transform:translateY(-310px);transition:transform .22s ease}
body.kp-open .sheet-body{padding-bottom:280px}
.toast{
  position:fixed;left:50%;z-index:200;max-width:calc(100% - 32px);
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(8px);
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;
  font-size:var(--fs-sm);font-weight:500;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.sheet-open .toast{bottom:auto;top:calc(68px + 8px)}
.empty{
  padding:40px 20px;text-align:center;
  color:var(--text-3);font-size:var(--fs-sm);line-height:1.5;
}
.empty svg{
  width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;color:var(--text-3);
  opacity:.5;margin-bottom:10px;display:inline-block;
}
.empty b{color:var(--text);font-weight:600;display:block;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* Pita asal data (server / cache HP) */
.srv-note{font-size:var(--fs-xs);line-height:1.45;padding:9px 12px;margin-bottom:12px;
  border-radius:var(--r-sm);background:var(--warn-bg);color:var(--warn)}
.srv-note.info{background:var(--info-tint);color:var(--info)}
.more-btn{display:block;width:100%;min-height:44px;margin-top:8px;border:1px dashed var(--line);
  border-radius:var(--r-sm);color:var(--text-2);font-weight:600;font-size:var(--fs-sm);text-align:center}
.more-btn:active{background:var(--line-soft)}
.skel{height:14px;border-radius:7px;background:var(--line-soft);margin:10px 0;animation:skel 1.2s ease-in-out infinite}
@keyframes skel{50%{opacity:.45}}

/* Riwayat: rekap, hari kosong, detail */
.rekap-card{position:relative}
.rekap-share{
  position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;border:0;cursor:pointer;z-index:2;
}
.rekap-card .k{padding-right:46px}
.rekap-share:active{background:rgba(255,255,255,.3)}
.rekap-note{font-size:var(--fs-xs);margin-top:10px;padding:8px 10px;border-radius:8px;
  background:rgba(255,255,255,.14);line-height:1.4}
.rekap-warn{font-size:var(--fs-xs);color:var(--warn);background:var(--warn-bg);
  border-radius:var(--r-sm);padding:9px 12px;margin-bottom:10px;line-height:1.4}
.isi-btn{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--warn);
  background:transparent;color:var(--warn);font-weight:700;font-size:var(--fs-xs);cursor:pointer}
.isi-btn:active{background:rgba(0,0,0,.05)}
.badge-small.draft{background:var(--warn-bg);color:var(--warn);margin-left:6px}
.day-status{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.day-status.final{background:var(--accent-tint);color:var(--accent)}
.day-status.draft{background:var(--warn-bg);color:var(--warn)}
.sum-line.sub{font-size:var(--fs-xs);color:var(--text-3);padding-left:12px}
.sum-line.sub b{font-weight:600;color:var(--text-2)}
.day-note{font-size:var(--fs-xs);line-height:1.45;padding:10px 12px;border-radius:var(--r-sm);margin-top:10px}
.day-note.warn{background:var(--warn-bg);color:var(--warn)}
.day-info{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
.rekap-preview{font:12.5px/1.55 'Courier New',monospace;white-space:pre-wrap;word-break:break-word;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
</style>
<style id="shared-style">
/* ==========================================================
   GAYA BERSAMA (semua halaman) — di bawah gaya halaman agar menang
   ========================================================== */
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn-secondary{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn-secondary:active{background:var(--line-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Ikon sinkron: lingkaran 40px berisi awan, lencana angka di pojok */
.appbar .sync-chip{
  position:relative;display:grid;place-items:center;flex:none;
  width:40px;height:40px;padding:0;gap:0;border-radius:50%;
  background:rgba(255,255,255,.14);color:#fff;
}
.appbar .sync-chip:active{background:rgba(255,255,255,.26)}
.appbar .sync-chip .ic{width:22px;height:22px;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.appbar .sync-chip.online .ic{opacity:.72}
.appbar .sync-chip.offline .ic{opacity:.9}
.appbar .sync-chip.pending .arrow{animation:syncBob 1.4s ease-in-out infinite}
@keyframes syncBob{50%{transform:translateY(-2px)}}
.sync-badge{
  position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;font-size:11px;font-weight:700;line-height:17px;text-align:center;
  background:#F2C14E;color:#2A2100;border:2px solid var(--brand,#2F5233);box-sizing:content-box;
}
.sync-chip.failed .sync-badge{background:#FF8F80;color:#3A0A04}
.sync-chip.offline .sync-badge{background:#E3E7DF;color:#222}

/* Ikon di app bar: jarak seragam */
.appbar .icon-btn.is-off{opacity:.45}

.appbar .icon-btn{flex:none}
.appbar .app-actions{display:flex;align-items:center;gap:2px;flex:none}

/* Sheet sinkron */
.sync-head{display:flex;gap:14px;align-items:center;padding-bottom:4px}
.sync-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--line-soft);color:var(--text-2)}
.sync-ic .ic{width:24px;height:24px;stroke-linecap:round;stroke-linejoin:round}
.sync-ic.online{background:color-mix(in srgb,var(--accent,#3F7A45) 16%,transparent);color:var(--accent,#3F7A45)}
.sync-ic.pending{background:rgba(242,193,78,.22);color:#9A6B00}
.sync-ic.failed{background:rgba(214,69,50,.14);color:var(--danger,#C0392B)}
.sync-rows .sum-line{display:flex;justify-content:space-between;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line-soft);font-size:var(--fs-sm)}
.sync-rows .sum-line:last-child{border-bottom:0}
.sync-rows .sum-line.warn b{color:var(--danger,#C0392B)}
.sync-rows .sum-line span{color:var(--text-2)}

/* Sheet Cetak */
.pk-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);margin:14px 0 6px}
.pk-label:first-child{margin-top:2px}
.pk-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--line-soft);border-radius:var(--r-sm)}
.pk-seg button{min-height:40px;text-align:center;border:0;border-radius:calc(var(--r-sm) - 2px);background:transparent;
  font-weight:600;font-size:var(--fs-sm);font-family:inherit;color:var(--text-2);cursor:pointer}
.pk-seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pk-opts{display:flex;flex-direction:column;gap:6px}
.pk-opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:11px 14px;min-height:56px;
  border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text);
  font-family:inherit;cursor:pointer}
.pk-opt b{font-size:var(--fs-sm);font-weight:700}
.pk-opt small{font-size:var(--fs-xs);color:var(--text-3);line-height:1.35}
.pk-opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.pk-opt:disabled{opacity:.55;cursor:not-allowed}
.pk-printer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;
  font-size:var(--fs-xs);color:var(--text-2);line-height:1.4}
.pk-link{flex:none;min-height:36px;padding:0 14px;border:1.5px solid var(--accent);border-radius:999px;
  background:transparent;color:var(--accent);font-weight:700;font-size:var(--fs-xs);font-family:inherit;cursor:pointer}
.pk-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.pk-preview{margin:0;padding:12px 14px;font:12px/1.4 'Courier New',monospace;color:#111;white-space:pre;min-width:max-content}
#pkPrintArea{display:none}
@media print{
  body.pk-printing > *:not(#pkPrintArea){display:none!important}
  body.pk-printing #pkPrintArea{display:block;white-space:pre;font:12px/1.3 'Courier New',monospace;
    color:#000;background:#fff;padding:2mm;box-sizing:border-box}
}
</style>
</head>

<script src="./storage.js"></script>
<script>
(function(){
  if(typeof window.SayurStorage === 'undefined'){
    window.SayurStorage = {
      init: function(){}, get: function(){ return Promise.resolve(null); },
      post: function(){ return Promise.resolve(null); },
      cache: { load: function(){ return null; }, save: function(){} },
      queue: { list: function(){ return []; }, remove: function(){}, resetFailed: function(){}, failedCount: function(){ return 0; } },
      processQueue: function(){ return Promise.resolve({skipped:true}); },
      discardFailed: function(){},
      pengaturan: { get: function(){ return Promise.resolve({}); } }
    };
  }
  try{
    var S = window.SayurStorage, origInit = S.init, done = false;
    S.init = function(){ if(done) return; done = true; return origInit && origInit.apply(S, arguments); };
  }catch(e){}
})();

var Pages = {};
var Router = (function(){
  var routes = {beranda:1, belanja:1, tutup:1, laporan:1};
  var cur = {name:null, query:''};
  var view = document.getElementById('view');
  var tracked = [];
  var shellNodes = [];
  var wAdd = window.addEventListener.bind(window);
  var dAdd = document.addEventListener.bind(document);

  window.addEventListener = function(t, f, o){ tracked.push({t:window, type:t, fn:f, o:o}); return wAdd(t, f, o); };
  document.addEventListener = function(t, f, o){ tracked.push({t:document, type:t, fn:f, o:o}); return dAdd(t, f, o); };

  function styleOf(n){ return document.querySelector('style[data-page="' + n + '"]'); }

  function unmount(){
    tracked.forEach(function(x){ try{ x.t.removeEventListener(x.type, x.fn, x.o); }catch(e){} });
    tracked = [];
    view.innerHTML = '';
    Array.prototype.slice.call(document.body.children).forEach(function(n){
      if(shellNodes.indexOf(n) === -1) n.remove();
    });
    document.body.className = '';
    document.body.removeAttribute('data-beltab');
    if(cur.name){ var st = styleOf(cur.name); if(st) st.media = 'not all'; }
  }

  function mount(name, query){
    unmount();
    cur = {name:name, query:query || ''};
    var st = styleOf(name); if(st) st.media = 'all';
    document.title = Pages[name].title;
    view.appendChild(document.getElementById('tpl-' + name).content.cloneNode(true));
    window.scrollTo(0, 0);
    try{ Pages[name].run(); }catch(e){ console.error('[' + name + ']', e); }
  }

  function parse(){
    var h = location.hash.replace(/^#\/?/, '');
    var i = h.indexOf('?');
    var name = i < 0 ? h : h.slice(0, i);
    var query = i < 0 ? '' : h.slice(i + 1);
    if(!routes[name]){
      name = 'beranda'; query = '';
      try{ history.replaceState(null, '', location.pathname + location.search + '#/beranda'); }catch(e){}
    }
    return {name:name, query:query};
  }
  function render(){ var p = parse(); mount(p.name, p.query); }

  function go(name, query){
    var h = '#/' + name + (query ? '?' + query : '');
    if(location.hash === h) render(); else location.hash = h;
  }
  function goUrl(u){
    var m = String(u).match(/^\.?\/?([\w-]+)\.html(?:\?(.*))?$/);
    if(m){
      var n = m[1];
      if(n === 'beranda-baru' || n === 'index') n = 'beranda';
      if(routes[n]){ go(n, m[2] || ''); return; }
    }
    location.href = u;
  }
  function search(){
    var p = new URLSearchParams(location.search);
    new URLSearchParams(cur.query).forEach(function(v, k){ p.set(k, v); });
    var s = p.toString();
    return s ? '?' + s : '';
  }
  function clearParam(k){
    var q = new URLSearchParams(cur.query); q.delete(k);
    cur.query = q.toString();
    history.replaceState(null, '', location.pathname + location.search +
      '#/' + cur.name + (cur.query ? '?' + cur.query : ''));
  }
  function tabParam(){
    var t = new URLSearchParams(cur.query).get('tab');
    return (t === 'saldo' || t === 'hutang' || t === 'riwayat') ? t : 'saldo';
  }
  function start(){
    shellNodes = Array.prototype.slice.call(document.body.children);
    wAdd('hashchange', render);
    render();
  }
  if(document.readyState === 'loading') dAdd('DOMContentLoaded', start); else start();

  return {go:go, goUrl:goUrl, search:search, clearParam:clearParam, tabParam:tabParam};
})();

/* ==========================================================
   SHARED — dipakai semua halaman (sheet, toast, ikon sinkron)
   ========================================================== */
var Shared = (function(){
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function toast(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function copyText(text, done){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){}
      ta.remove();
      if(done) done(ok);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ if(done) done(true); }, fallback);
    } else fallback();
  }
  function lock(){
    document.body.classList.toggle('sheet-open', !!document.querySelector('.sheet-ov.show'));
  }
  function open(ov){
    ov._ret = document.activeElement;
    ov.classList.add('show');
    lock();
    var s = ov.querySelector('.sheet');
    if(s) s.focus({preventScroll: true});
  }
  function close(ov){
    if(!ov) return;
    ov.classList.remove('show');
    lock();
    try{ if(ov._ret && ov._ret.focus) ov._ret.focus({preventScroll: true}); }catch(e){}
    if(ov._onClose) try{ ov._onClose(); }catch(e){}
    if(ov.dataset.temp) setTimeout(function(){ if(!ov.classList.contains('show')) ov.remove(); }, 250);
  }
  /* Buat sheet sementara. html = isi di dalam .sheet (setelah grip). */
  function sheet(id, html){
    var old = document.getElementById(id);
    if(old) old.remove();
    var ov = document.createElement('div');
    ov.className = 'sheet-ov';
    ov.id = id;
    ov.dataset.temp = '1';
    ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + id + 'T" tabindex="-1">' +
      '<div class="sheet-grip"></div>' + html + '</div>';
    ov.addEventListener('click', function(e){
      if(e.target === ov || (e.target.closest && e.target.closest('[data-close]'))) close(ov);
    });
    ov.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(ov); });
    document.body.appendChild(ov);
    return ov;
  }
  return {esc: esc, toast: toast, copyText: copyText, open: open, close: close, sheet: sheet};
})();

/* ==========================================================
   SYNCUI — ikon awan status sinkron (app bar)
   ========================================================== */
var SyncUI = (function(){
  var CLOUD = 'M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z';
  var ICON = {
    online:  '<path d="' + CLOUD + '"/><path d="M8.5 14.5l2.2 2.2L15 12"/>',
    pending: '<path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/><g class="arrow"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/></g>',
    offline: '<path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/><line x1="1" y1="1" x2="23" y2="23"/>',
    failed:  '<path d="' + CLOUD + '"/><path d="M11 11.5v3.2M11 17.2h.01"/>'
  };
  var LABEL = {online: 'Tersinkron', pending: 'Menunggu dikirim', offline: 'Offline', failed: 'Gagal dikirim'};

  function snapshot(){
    var total = 0, failed = 0, S = window.SayurStorage;
    try{ var l = S && S.queue && S.queue.list && S.queue.list(); total = (l && l.length) || 0; }catch(e){}
    try{ failed = (S && S.queue && S.queue.failedCount && S.queue.failedCount()) || 0; }catch(e){}
    if(failed > total) total = failed;
    var waiting = Math.max(0, total - failed);
    var kind = 'online';
    if(failed > 0) kind = 'failed';
    else if(!navigator.onLine) kind = 'offline';
    else if(waiting > 0) kind = 'pending';
    return {kind: kind, total: total, waiting: waiting, failed: failed, online: navigator.onLine};
  }
  function headline(s){
    if(s.kind === 'failed') return s.failed + ' data gagal dikirim';
    if(s.kind === 'offline') return s.total > 0 ? 'Offline · ' + s.total + ' data menunggu' : 'Offline';
    if(s.kind === 'pending') return s.waiting + ' data menunggu dikirim';
    return 'Tersinkron';
  }
  function paint(){
    var chip = document.getElementById('syncChip');
    if(!chip) return null;
    var s = snapshot();
    var count = s.kind === 'failed' ? s.failed : s.total;
    var badge = (s.kind !== 'online' && count > 0)
      ? '<span class="sync-badge">' + (count > 9 ? '9+' : count) + '</span>' : '';
    chip.className = 'sync-chip ' + s.kind;
    chip.innerHTML =
      '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + ICON[s.kind] + '</svg>' + badge +
      '<span id="syncChipTxt" class="sr-only">' + Shared.esc(headline(s)) + '</span>';
    chip.setAttribute('aria-label', 'Status sinkron: ' + headline(s));
    var ov = document.getElementById('syncSheet');
    if(ov && ov.classList.contains('show')) fillSheet(ov, s);
    return s;
  }
  function fillSheet(ov, s){
    var sub = {
      online: 'Semua data sudah aman di server.',
      pending: 'Data tersimpan di HP dan sedang menunggu dikirim ke server.',
      offline: 'Tidak ada internet. Data tetap aman di HP dan dikirim otomatis saat online.',
      failed: 'Sebagian data belum berhasil dikirim. Data masih aman di HP, coba kirim ulang.'
    }[s.kind];
    ov.querySelector('.sync-ic').className = 'sync-ic ' + s.kind;
    ov.querySelector('.sync-ic').innerHTML = '<svg class="ic" viewBox="0 0 24 24">' + ICON[s.kind] + '</svg>';
    ov.querySelector('#syncSheetT').textContent = headline(s);
    ov.querySelector('.sheet-sub').textContent = sub;
    var rows = '';
    if(s.waiting) rows += '<div class="sum-line"><span>Menunggu dikirim</span><b>' + s.waiting + '</b></div>';
    if(s.failed) rows += '<div class="sum-line warn"><span>Gagal dikirim</span><b>' + s.failed + '</b></div>';
    rows += '<div class="sum-line"><span>Koneksi</span><b>' + (s.online ? 'Online' : 'Offline') + '</b></div>';
    ov.querySelector('.sync-rows').innerHTML = rows;
    var go = ov.querySelector('#syncGo');
    go.hidden = s.total === 0;
    go.disabled = !s.online || ov._busy;
    go.textContent = ov._busy ? 'Mengirim…' : (s.failed ? 'Coba kirim lagi' : 'Kirim sekarang');
  }
  async function kirim(ov){
    var S = window.SayurStorage;
    if(ov._busy) return;
    if(!(S && S.processQueue)){ Shared.toast('Pengiriman belum tersedia'); return; }
    ov._busy = true; paint();
    try{
      try{ if(S.queue && S.queue.resetFailed) S.queue.resetFailed(); }catch(e){}
      await S.processQueue();
      Shared.toast('Selesai dikirim');
    }catch(e){
      Shared.toast('Gagal mengirim, coba lagi nanti');
    }
    ov._busy = false;
    paint();
    try{ window.dispatchEvent(new Event('sayur:sync')); }catch(e){}
  }
  function openSheet(){
    var ov = Shared.sheet('syncSheet',
      '<div class="sheet-head sync-head"><span class="sync-ic online"></span>' +
        '<div><h2 id="syncSheetT"></h2><p class="sheet-sub"></p></div></div>' +
      '<div class="sheet-body"><div class="sum-list sync-rows"></div></div>' +
      '<div class="sheet-actions">' +
        '<button type="button" class="btn btn-primary" id="syncGo">Kirim sekarang</button>' +
        '<button type="button" class="btn btn-ghost" data-close>Tutup</button>' +
      '</div>');
    ov.querySelector('#syncGo').addEventListener('click', function(){ kirim(ov); });
    fillSheet(ov, snapshot());
    Shared.open(ov);
  }
  /* Panggil dari updateStatus() halaman mana pun: aman dipanggil berulang. */
  function bind(){
    var chip = document.getElementById('syncChip');
    if(!chip) return;
    if(!chip._bound){
      chip._bound = true;
      chip.addEventListener('click', openSheet);
      window.addEventListener('online', paint);
      window.addEventListener('offline', paint);
      window.addEventListener('storage', paint);
      window.addEventListener('sayur:sync', paint);
      window.addEventListener('pageshow', paint);
      document.addEventListener('visibilitychange', paint);
      var t = setInterval(function(){
        if(!document.body.contains(chip)){ clearInterval(t); return; }
        paint();
      }, 5000);
    }
    paint();
  }
  return {bind: bind, paint: paint, snapshot: snapshot, open: openSheet};
})();

/* ==========================================================
   PRINTKIT — cetak struk ke printer termal 58 / 80 mm
   Tiga jalur: Bluetooth langsung (BLE), RawBT, dialog cetak browser.
   Dipakai oleh Nota (Pesanan, Nota mandiri) dan Riwayat.
   ========================================================== */
var PrintKit = (function(){
  var KEY = 'sayur_print_v1';
  var COLS = {58: 32, 80: 48};
  var cfg = {lebar: 58, metode: '', devName: '', devId: ''};
  try{
    var raw = JSON.parse(localStorage.getItem(KEY) || '{}');
    if(raw.lebar === 80) cfg.lebar = 80;
    if(raw.metode === 'ble' || raw.metode === 'rawbt' || raw.metode === 'browser') cfg.metode = raw.metode;
    cfg.devName = String(raw.devName || '');
    cfg.devId = String(raw.devId || '');
  }catch(e){}
  function saveCfg(){ try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} }

  function hasBle(){ return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); }
  function metode(){
    if(cfg.metode === 'ble' && !hasBle()) return 'rawbt';
    return cfg.metode || (hasBle() ? 'ble' : 'rawbt');
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function fail(code, msg){ var e = new Error(msg || code); e.code = code; return e; }

  /* ---------- Teks struk (hanya ASCII, aman untuk semua printer) ---------- */
  function ascii(s){
    return String(s == null ? '' : s)
      .replace(/[×✕]/g, 'x').replace(/[−–—─]/g, '-').replace(/[•·●]/g, '-')
      .replace(/…/g, '...').replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^\x20-\x7E]/g, '').replace(/\s+/g, ' ').trim();
  }
  function rep(ch, n){ var s = ''; while(s.length < n) s += ch; return s.slice(0, n); }
  function indent(s){ return /^ */.exec(String(s))[0]; }
  function angka(n){
    n = Math.round(Number(n) || 0);
    return (n < 0 ? '-' : '') + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function rp(n){ return (Number(n) < 0 ? '-' : '') + 'Rp ' + angka(Math.abs(Number(n) || 0)); }
  function wrap(s, cols){
    var out = [], cur = '';
    String(s).split(' ').forEach(function(w){
      while(w.length > cols){
        if(cur){ out.push(cur); cur = ''; }
        out.push(w.slice(0, cols)); w = w.slice(cols);
      }
      if(!w) return;
      if(!cur) cur = w;
      else if((cur + ' ' + w).length <= cols) cur += ' ' + w;
      else { out.push(cur); cur = w; }
    });
    if(cur) out.push(cur);
    return out.length ? out : [''];
  }
  /* kiri ... kanan dalam satu baris; kalau tidak muat, kanan pindah ke baris sendiri */
  function lr(l, r, cols){
    var ind = indent(l);
    l = ind + ascii(l); r = ascii(r);
    var gap = cols - l.length - r.length;
    if(gap >= 1) return [l + rep(' ', gap) + r];
    var res = wrap(ascii(l), cols - ind.length).map(function(x){ return ind + x; });
    res.push(rep(' ', Math.max(0, cols - r.length)) + r);
    return res;
  }
  function Doc(cols){
    var L = [];
    return {
      lines: L,
      raw: function(t, b){ L.push({t: t, b: !!b}); },
      text: function(t, b){
        var ind = indent(t);
        wrap(ascii(t), cols - ind.length).forEach(function(x){ L.push({t: ind + x, b: !!b}); });
      },
      center: function(t, b){
        wrap(ascii(t), cols).forEach(function(x){
          L.push({t: rep(' ', Math.floor((cols - x.length) / 2)) + x, b: !!b});
        });
      },
      lr: function(l, r, b){ lr(l, r, cols).forEach(function(x){ L.push({t: x, b: !!b}); }); },
      kv: function(k, v){
        var lab = k; while(lab.length < 8) lab += ' ';
        var pre = lab + ': ', w = Math.max(8, cols - pre.length);
        wrap(ascii(v), w).forEach(function(x, i){ L.push({t: (i ? rep(' ', pre.length) : pre) + x, b: false}); });
      },
      sep: function(){ L.push({t: rep('-', cols), b: false}); },
      blank: function(){ L.push({t: '', b: false}); }
    };
  }

  function buildNota(n, opsi, meta, cols){
    opsi = opsi || {}; meta = meta || {};
    var d = Doc(cols);
    d.center(String(meta.toko || 'H. Mawih Sayur').toUpperCase(), true);
    if(meta.hp) d.center('HP: ' + meta.hp);
    d.sep();
    d.text(n.judul || 'Nota', true);
    if(n.nama) d.kv('Nama', n.nama);
    if(opsi.tampilHP !== false && n.noHP) d.kv('HP', n.noHP);
    d.kv('Tanggal', meta.tanggal || n.tanggal || '');
    if(opsi.tampilCatatan !== false && n.ket) d.kv('Catatan', n.ket);
    d.sep();
    (n.items || []).forEach(function(it){
      d.text(it.nama);
      d.lr('  ' + it.qty + (it.satuan ? ' ' + it.satuan : '') + ' x ' + angka(it.harga), angka(it.sub));
    });
    d.sep();
    d.lr('Total', rp(n.total), true);
    d.lr('Dibayar', rp(n.dibayar));
    if(n.lunas) d.center('** LUNAS **', true);
    else d.lr('Sisa', rp(n.sisa), true);
    d.sep();
    d.center('Terima kasih');
    return d.lines;
  }

  function tglPendek(ymd){
    try{
      return new Date(Number(ymd.slice(0, 4)), Number(ymd.slice(5, 7)) - 1, Number(ymd.slice(8, 10)))
        .toLocaleDateString('id-ID', {weekday: 'short', day: 'numeric', month: 'short'});
    }catch(e){ return String(ymd); }
  }
  function buildRekap(r, rincian, cols){
    var st = r.st || {};
    var d = Doc(cols);
    d.center('REKAP LABA', true);
    d.center(r.periode || '');
    d.center(r.toko || '');
    d.sep();
    d.lr('Total laba', rp(st.laba), true);
    d.lr('Omzet', rp(st.omzet));
    d.lr('Hari tutup', st.hariTutup + (st.draft ? ' (+' + st.draft + ' draft)' : ''));
    if(st.libur) d.lr('Hari libur', String(st.libur));
    if(st.kosong) d.lr('Belum dicatat', st.kosong + ' hari');
    if(st.belumLengkap) d.lr('Belum lengkap', st.belumLengkap + ' hari');
    if(rincian && r.hari && r.hari.length){
      d.sep();
      d.text('Rincian harian', true);
      r.hari.forEach(function(h){
        var tg = tglPendek(h.tgl);
        if(h.libur){ d.lr(tg, 'libur'); return; }
        var laba = h.laba == null ? 'blm lengkap' : angka(h.laba);
        var kiri = tg + (h.draft ? ' (draft)' : '') + '  omzet ' + angka(h.omzet), kanan = 'laba ' + laba;
        if(kiri.length + kanan.length + 1 <= cols) d.lr(kiri, kanan);
        else { d.lr(tg + (h.draft ? ' (draft)' : ''), laba); d.text('  omzet ' + angka(h.omzet)); }
      });
    } else if(!rincian){
      d.sep();
      d.text('Pilih satu bulan untuk rincian harian.');
    }
    d.sep();
    var now = new Date();
    d.center('Dicetak ' + now.toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'}) +
      ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'));
    return d.lines;
  }

  function buildHari(h, cols){
    var d = Doc(cols);
    d.center('LAPORAN HARIAN', true);
    d.center(h.tanggalText || '');
    d.center(h.toko || '');
    d.sep();
    d.lr('Omzet', rp(h.omzet), true);
    d.lr('  Tunai', rp(h.cash));
    d.lr('  QRIS', rp(h.qris));
    if(h.lengkap){
      d.sep();
      d.text('Biaya', true);
      d.lr('Modal belanja', rp(h.biaya.modal));
      d.lr('Operasional', rp(h.biaya.opsPasar));
      d.lr('Bensin', rp(h.biaya.bensin));
      d.lr('Lain-lain', rp(h.biaya.lainBelanja));
      if(h.biaya.biayaUsaha) d.lr('Biaya usaha lain', rp(h.biaya.biayaUsaha));
      d.sep();
      d.lr('Laba bersih', rp(h.laba), true);
    } else {
      d.sep();
      d.text('Biaya belanja hari ini belum lengkap, laba tidak dihitung.');
    }
    if(h.biaya.pagi) d.lr('Pengeluaran pagi', rp(h.biaya.pagi));
    if(h.bon) d.lr('Bon pelanggan', rp(h.bon));
    if(!h.final) d.center('(draft, belum tersimpan ke database)');
    d.sep();
    var now = new Date();
    d.center('Dicetak ' + now.toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'}) +
      ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'));
    return d.lines;
  }

  /* ---------- ESC/POS ---------- */
  function encode(lines){
    var o = [0x1B, 0x40];                       /* ESC @ : reset */
    lines.forEach(function(l){
      if(l.b) o.push(0x1B, 0x45, 1);            /* tebal */
      for(var i = 0; i < l.t.length; i++) o.push(l.t.charCodeAt(i) & 0x7F);
      if(l.b) o.push(0x1B, 0x45, 0);
      o.push(0x0A);
    });
    o.push(0x1B, 0x64, 4);                      /* maju 4 baris agar struk bisa disobek */
    return new Uint8Array(o);
  }
  function toText(lines){ return lines.map(function(l){ return l.t; }).join('\n'); }

  /* ---------- Bluetooth langsung (BLE) ---------- */
  var BLE_SERVICES = [
    '000018f0-0000-1000-8000-00805f9b34fb',
    'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
    '49535343-fe7d-4ae5-8fa9-9fafd205e455',
    '0000ffe0-0000-1000-8000-00805f9b34fb',
    '0000ff00-0000-1000-8000-00805f9b34fb',
    '0000fff0-0000-1000-8000-00805f9b34fb',
    '0000ae30-0000-1000-8000-00805f9b34fb',
    '0000fee7-0000-1000-8000-00805f9b34fb'
  ];
  var ble = {dev: null, ch: null};

  function rememberDevice(dev){
    ble.dev = dev;
    cfg.devName = dev.name || 'Printer';
    cfg.devId = dev.id || '';
    saveCfg();
    try{ dev.addEventListener('gattserverdisconnected', function(){ ble.ch = null; }); }catch(e){}
  }
  async function findWritable(server){
    var services = await server.getPrimaryServices();
    for(var i = 0; i < services.length; i++){
      var chars = [];
      try{ chars = await services[i].getCharacteristics(); }catch(e){ continue; }
      for(var j = 0; j < chars.length; j++){
        var p = chars[j].properties || {};
        if(p.write || p.writeWithoutResponse) return chars[j];
      }
    }
    throw fail('nochar', 'Karakteristik tulis tidak ditemukan');
  }
  async function bleConnect(pilihBaru){
    if(!hasBle()) throw fail('nobt', 'Bluetooth tidak tersedia');
    if(!pilihBaru && ble.ch && ble.dev && ble.dev.gatt && ble.dev.gatt.connected) return ble.ch;
    var dev = pilihBaru ? null : ble.dev;
    if(!dev && !pilihBaru && cfg.devId && navigator.bluetooth.getDevices){
      try{
        var known = await navigator.bluetooth.getDevices();
        dev = known.filter(function(x){ return x.id === cfg.devId; })[0] || null;
        if(dev) rememberDevice(dev);
      }catch(e){ dev = null; }
    }
    if(!dev){
      dev = await navigator.bluetooth.requestDevice({acceptAllDevices: true, optionalServices: BLE_SERVICES});
      rememberDevice(dev);
    }
    var server = await dev.gatt.connect();
    ble.ch = await findWritable(server);
    return ble.ch;
  }
  async function bleWrite(ch, bytes){
    var chunk = 100, i = 0, p = ch.properties || {};
    var noResp = !!(p.writeWithoutResponse && ch.writeValueWithoutResponse);
    while(i < bytes.length){
      var part = bytes.slice(i, i + chunk);
      try{
        if(noResp) await ch.writeValueWithoutResponse(part); else await ch.writeValue(part);
      }catch(e){
        if(chunk > 20){ chunk = 20; continue; }  /* ulangi dengan potongan kecil */
        throw e;
      }
      i += part.length;
      await sleep(chunk > 20 ? 12 : 25);
    }
  }
  async function printBle(bytes){
    var ch = await bleConnect(false);
    try{ await bleWrite(ch, bytes); }
    catch(e){
      if(e && e.code) throw e;
      ble.ch = null;                             /* koneksi terputus: sambung ulang sekali */
      ch = await bleConnect(false);
      await bleWrite(ch, bytes);
    }
  }

  /* ---------- RawBT (Android) ---------- */
  function printRawbt(bytes){
    var bin = '';
    for(var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    window.location.href = 'intent:base64,' + btoa(bin) +
      '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
  }

  /* ---------- Dialog cetak browser ---------- */
  function printBrowser(lines){
    var area = document.getElementById('pkPrintArea');
    if(!area){ area = document.createElement('div'); area.id = 'pkPrintArea'; document.body.appendChild(area); }
    area.innerHTML = lines.map(function(l){
      var t = Shared.esc(l.t);
      return l.b ? '<b>' + t + '</b>' : t;
    }).join('\n');
    var st = document.getElementById('pkPageStyle');
    if(!st){ st = document.createElement('style'); st.id = 'pkPageStyle'; document.head.appendChild(st); }
    st.textContent = '@page{size:' + cfg.lebar + 'mm auto;margin:0}';
    document.body.classList.add('pk-printing');
    function done(){
      document.body.classList.remove('pk-printing');
      window.removeEventListener('afterprint', done);
    }
    window.addEventListener('afterprint', done);
    setTimeout(function(){ window.print(); }, 60);
  }

  function errMsg(e){
    var n = e && e.name, c = e && e.code;
    if(n === 'NotFoundError' || n === 'AbortError') return 'Pemilihan printer dibatalkan';
    if(c === 'nochar') return 'Printer ini belum didukung langsung. Coba cara RawBT';
    if(c === 'nobt') return 'Bluetooth tidak tersedia di browser ini';
    if(n === 'SecurityError') return 'Bluetooth butuh alamat https';
    if(n === 'NetworkError') return 'Tidak bisa tersambung. Pastikan printer menyala dan dekat';
    return 'Gagal mencetak' + (e && e.message ? ': ' + e.message : '');
  }

  /* ---------- Sheet Cetak ---------- */
  function openSheet(job){
    var ov = Shared.sheet('printSheet',
      '<div class="sheet-head"><h2 id="printSheetT">Cetak</h2><p class="sheet-sub">' + Shared.esc(job.sub || '') + '</p></div>' +
      '<div class="sheet-body">' +
        '<div class="pk-label">Lebar kertas</div>' +
        '<div class="pk-seg" id="pkLebar" role="radiogroup" aria-label="Lebar kertas">' +
          '<button type="button" role="radio" data-w="58">58 mm</button>' +
          '<button type="button" role="radio" data-w="80">80 mm</button></div>' +
        '<div class="pk-label">Cara cetak</div>' +
        '<div class="pk-opts" id="pkMetode" role="radiogroup" aria-label="Cara cetak">' +
          '<button type="button" class="pk-opt" role="radio" data-m="ble"><b>Bluetooth langsung</b>' +
            '<small>Printer BLE, lewat Chrome Android</small></button>' +
          '<button type="button" class="pk-opt" role="radio" data-m="rawbt"><b>Lewat RawBT</b>' +
            '<small>Untuk printer Bluetooth biasa. Perlu aplikasi RawBT</small></button>' +
          '<button type="button" class="pk-opt" role="radio" data-m="browser"><b>Dialog cetak HP</b>' +
            '<small>Pilih printer dari layanan cetak Android</small></button>' +
        '</div>' +
        '<div class="pk-printer" id="pkPrinter"></div>' +
        '<div class="pk-label">Pratinjau</div>' +
        '<div class="pk-scroll"><pre class="pk-preview" id="pkPreview"></pre></div>' +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button type="button" class="btn btn-primary" id="pkGo">Cetak sekarang</button>' +
        '<button type="button" class="btn btn-ghost" data-close>Tutup</button>' +
      '</div>');

    function q(s){ return ov.querySelector(s); }
    function paint(){
      Array.prototype.forEach.call(ov.querySelectorAll('#pkLebar button'), function(b){
        var on = Number(b.dataset.w) === cfg.lebar;
        b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
      var m = metode();
      Array.prototype.forEach.call(ov.querySelectorAll('#pkMetode .pk-opt'), function(b){
        var on = b.dataset.m === m, off = b.dataset.m === 'ble' && !hasBle();
        b.classList.toggle('on', on); b.disabled = off;
        b.setAttribute('aria-checked', on ? 'true' : 'false');
        if(b.dataset.m === 'ble') b.querySelector('small').textContent = off
          ? 'Tidak tersedia di browser ini (butuh Chrome Android dan alamat https)'
          : 'Printer BLE, lewat Chrome Android';
      });
      var pr = q('#pkPrinter');
      if(m === 'ble'){
        pr.innerHTML = '<span>Printer: <b>' + Shared.esc(cfg.devName || 'belum dipilih') + '</b></span>' +
          '<button type="button" class="pk-link" id="pkPick">' + (cfg.devName ? 'Ganti' : 'Pilih printer') + '</button>';
        q('#pkPick').addEventListener('click', pick);
      } else if(m === 'rawbt'){
        pr.innerHTML = '<span>Pasang RawBT, lalu pilih printer dan lebar kertas di dalam aplikasinya (sekali saja).</span>';
      } else {
        pr.innerHTML = '<span>Dialog cetak Android akan terbuka. Pilih printer termal Anda di sana.</span>';
      }
      q('#pkPreview').textContent = toText(job.build(COLS[cfg.lebar]));
    }
    async function pick(){
      try{ await bleConnect(true); toast2('Tersambung ke ' + cfg.devName); }
      catch(e){ toast2(errMsg(e)); }
      paint();
    }
    function toast2(m){ Shared.toast(m); }

    q('#pkLebar').addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      cfg.lebar = Number(b.dataset.w) === 80 ? 80 : 58; saveCfg(); paint();
    });
    q('#pkMetode').addEventListener('click', function(e){
      var b = e.target.closest('.pk-opt'); if(!b || b.disabled) return;
      cfg.metode = b.dataset.m; saveCfg(); paint();
    });
    q('#pkGo').addEventListener('click', async function(){
      var btn = this, m = metode();
      var lines = job.build(COLS[cfg.lebar]);
      btn.disabled = true; btn.textContent = m === 'ble' ? 'Mengirim…' : 'Membuka…';
      try{
        if(m === 'ble'){ await printBle(encode(lines)); toast2('Terkirim ke printer'); paint(); }
        else if(m === 'rawbt'){ printRawbt(encode(lines)); }
        else { printBrowser(lines); }
      }catch(e){ toast2(errMsg(e)); paint(); }
      btn.disabled = false; btn.textContent = 'Cetak sekarang';
    });
    paint();

    var subJual = d.qty * d.jual;
    var marginKotor = subJual - subBeli;
    var susut = Math.round(marginKotor * SUSUT_RATE);
    var marginBersih = marginKotor - susut;
    var minJual = hitungHargaMinimum(d.beli, d.jual);

    var rowKotor = el.querySelector('[data-mg="kotor"]');
    var rowBersih = el.querySelector('[data-mg="bersih"]');
    var rowMin = el.querySelector('[data-mg="min"]');

    rowKotor.querySelector('b').textContent =
      (marginKotor >= 0 ? '+' : '−') + rp(marginKotor);
    el.querySelector('[data-mg="susut"] b').textContent = '−' + rp(susut);
    rowBersih.querySelector('b').textContent =
      (marginBersih >= 0 ? '' : '−') + rp(marginBersih);

    rowKotor.classList.toggle('pos', marginKotor >= 0);
    rowKotor.classList.toggle('neg', marginKotor < 0);
    rowBersih.classList.toggle('neg', marginBersih < 0);

    if(minJual > 0){
      rowMin.querySelector('b').textContent = rp(minJual);
      rowMin.classList.remove('hidden');
    } else {
      rowMin.classList.add('hidden');
    }

    var sumEl = el.querySelector('[data-mg="sum"]');
    var mgInfo = el.querySelector('.margin-info');
    if(sumEl){
      sumEl.textContent = (marginBersih >= 0 ? '+' : '−') + rp(marginBersih);
      sumEl.classList.toggle('neg', marginBersih < 0);
    }
    if(mgInfo){
      var isOpen = mgOpen.has(nama);
      mgInfo.classList.toggle('expanded', isOpen);
      var btn = mgInfo.querySelector('.mg-summary');
      if(btn) btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
  }

  function ensureVisible(el){
    setTimeout(function(){
      var topLimit = (document.querySelector('.bel-tab.on .search-sticky') || document.querySelector('.bel-subtabs')).getBoundingClientRect().bottom + 8;
      var bottomLimit = (kpEl ? $('keypad') : $('appFooter')).getBoundingClientRect().top - 8;
      var r = el.getBoundingClientRect();
      if(r.bottom > bottomLimit){
        window.scrollBy({top: r.bottom - bottomLimit, behavior: 'smooth'});

  function render(){
    itemListEl.innerHTML = '';
    allNames().forEach(function(n){ itemListEl.appendChild(createItemEl(n)); });
    applyFilter();
    updateFooter();

  function updateFooter(){
    var tItem = 0, count = 0;
    allNames().forEach(function(n){
      var d = state.items[n];
      if(!d || !d.chk) return;
      count++;
      if(!d.nanti) tItem += d.qty * d.beli;
    });
    var s = state.set;
    var biaya = s.ops + s.biayaBensin + s.biayaLain + s.bayarHutang;
    var keluar = tItem + biaya;
    var avail = bacaLaporan();
    var modal = avail.tersedia + (s.tambahModal || 0);

    $('itemCount').textContent = count + ' item';
    var ft = $('footerTotal');
    ft.textContent = rp(keluar);
    var over = modal > 0 && keluar > modal;
    ft.classList.toggle('over', over);

    var note = $('footerNote');
    if(modal <= 0){
      note.innerHTML = 'Total belanja';
    } else if(over){
      note.innerHTML = 'Total · <span class="neg">Lebih ' + rp(keluar - modal) + '</span>';
    } else {
      note.innerHTML = 'Total · <span class="pos">Sisa ' + rp(modal - keluar) + '</span>';
    }

    var pct = modal > 0 ? Math.min(100, (keluar / modal) * 100) : 0;
    var fill = $('safeFill');
    fill.style.width = pct + '%';
    fill.style.background = over ? 'var(--danger)'
      : (pct >= 75 ? 'var(--warn-bar)' : 'var(--accent)');

    syncSelectAll();
    updateShareBtn();
  }

  function applyFilter(){
    var q = searchInput.value.trim().toLowerCase();
    var any = false, exact = false;
    Array.prototype.forEach.call(itemListEl.children, function(el){
      var n = el.dataset.nama.toLowerCase();
      var show = !q || n.indexOf(q) !== -1;
      el.hidden = !show;
      if(show) any = true;
      if(n === q) exact = true;
    });
    searchClear.hidden = !q;
    addBtn.hidden = !q || exact;
    emptyMsg.hidden = any || !q;
  }

    var nama = el.dataset.nama;
    var d = getItem(nama);
    var m = masterOf(nama);

    if(e.target.classList.contains('chk')){
      d.chk = e.target.checked;
      if(d.chk){
        if(!d.qty && m.defQty) d.qty = parseQty(m.defQty);
        if(!d.qty) d.qty = 1;
        if(!d.beli && m.beli) d.beli = m.beli;
        if(!d.jual && m.jual) d.jual = m.jual;
        el.querySelector('.qty').value = fmtQty(d.qty);
        el.querySelector('.harga-beli').value = fmtNum(d.beli);
        el.querySelector('.harga-jual').value = fmtNum(d.jual);
        setOpen(nama);
        ensureVisible(el);

  });

    var d = getItem(el.dataset.nama);
    var t = e.target;
    if(t.classList.contains('qty')){
      d.qty = parseQty(t.value);
    } else if(t.classList.contains('harga-beli')){

      masterOf(el.dataset.nama).beli = d.beli;
    } else if(t.classList.contains('harga-jual')){
      d.jual = digits(t.value);
      t.value = fmtNum(d.jual);
      /* Rencana adalah acuan: harga jual yang diubah di sini langsung jadi harga master */
      masterOf(el.dataset.nama).jual = d.jual;
    } else if(t.classList.contains('supplier')){
