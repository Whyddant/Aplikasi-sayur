    openModalBayar(){
      const p = this.list.find(x => x.ID === this.currentId);
      if(!p) return;
      const sisa = Number(p.Sisa) || 0;
      const total = Number(p.Total) || 0;
      const dibayar = Number(p.Dibayar) || 0;

      const simpanPembayaran = async (jumlah, catatan) => {
        const metode = document.getElementById('pm_metode')?.value || 'Cash';
        const tanggal = document.getElementById('pm_tgl')?.value || todayYmd();
        await SayurStorage.post('addPembayaranPesanan', {
          id: 'pp-' + Date.now(),
          pesananId: p.ID,
          jumlah, metode,
          catatan: catatan || '',
          tanggal
        });
        if(p.Status === 'belum_lunas'){
          await SayurStorage.post('tambahMutasi', {
            id: 'm-pes-' + Date.now(),
            tipe: 'Setor', metode, jumlah,
            tujuan: 'Pesanan',
            catatan: `Pembayaran pesanan: ${p.Nama}`,
            sumber: 'Pesanan',
            referensi: p.ID,
            tanggal
          });
        }
      };

      const ov = this._buatModal({
        title: 'Catat Pembayaran',
        body: `
          <div class="bayar-info-box">
            <div class="row"><span class="lbl">Total pesanan</span><span class="amt">${rupiah(total)}</span></div>
            <div class="row"><span class="lbl">Sudah dibayar</span><span class="amt" style="color:var(--green-700);">${rupiah(dibayar)}</span></div>
            <div class="row total"><span class="lbl">Sisa</span><span class="amt" style="color:var(--rust-600);">${rupiah(sisa)}</span></div>
          </div>
          <button type="button" class="btn-lunas-cepat" id="pm_lunas">
            ✓ LUNAS — ${rupiah(sisa)}
          </button>
          <div class="divider-atau">
            <div class="line"></div><span class="txt">atau sebagian</span><div class="line"></div>
          </div>
          <div class="field-pes">
            <label>Jumlah Dibayar</label>
            <input type="text" class="money" id="pm_jml" inputmode="numeric" placeholder="0">
            <div class="pm-info" id="pm_info"></div>
          </div>
          <div class="field-pes">
            <label>Tanggal</label>
            <input type="date" id="pm_tgl" value="${todayYmd()}">
          </div>
          <div class="field-pes">
            <label>Metode</label>
            <select id="pm_metode">
              <option value="Cash">Cash</option>
              <option value="QRIS">QRIS</option>
            </select>
          </div>
          <div class="field-pes">
            <label>Catatan (opsional)</label>
            <input type="text" id="pm_ket" placeholder="mis. bayar sebagian">
          </div>`,
        confirmLabel: 'Simpan',
        onConfirm: async () => {
          const jumlah = Number(String(document.getElementById('pm_jml').value).replace(/\D/g,'')) || 0;
          if(jumlah <= 0){ showToast('Isi jumlah'); return false; }
          const catatan = document.getElementById('pm_ket').value.trim();

          if(jumlah === sisa){
            try{
              await simpanPembayaran(jumlah, catatan || 'Lunas');
              showToast('✓ Pembayaran dicatat');
              ov.remove();
              await this.loadList();
              await this.loadPiutang();
              this.render();
            }catch(e){ showToast('Gagal: ' + e.message); return false; }
            return true;
          }

          if(jumlah > sisa){
            const sel = jumlah - sisa;
            if(sel > TOLERANSI_SELISIH){
              showToast(`Kelebihan ${rupiah(sel)} terlalu besar`);
              return false;
            }
            ov.remove();
            setTimeout(() => {
              this.konfirmasiAksi({
                judul: 'Bayar Lebih',
                pesan: `Bayar ${rupiah(jumlah)}, sisa ${rupiah(sisa)}. Lebih <strong>${rupiah(sel)}</strong>.`,
                labelA: `Lunas (kembalian ${rupiah(sel)})`,
                labelB: `Simpan ${rupiah(jumlah)}`,
                onA: async () => {
                  try{
                    await simpanPembayaran(sisa, 'Lunas');
                    showToast(`Lunas — kembalian ${rupiah(sel)}`);
                    await this.loadList();
                    await this.loadPiutang();
                    this.render();
                  }catch(e){ showToast('Gagal: ' + e.message); }
                },
                onB: async () => {
                  try{
                    await simpanPembayaran(jumlah, catatan || 'Kelebihan');
                    showToast(`Tersimpan ${rupiah(jumlah)}`);
                    await this.loadList();
                    await this.loadPiutang();
                    this.render();
                  }catch(e){ showToast('Gagal: ' + e.message); }
                }
              });
            }, 120);
            return true;
          }

          const kurang = sisa - jumlah;
          if(kurang > TOLERANSI_SELISIH){
            try{
              await simpanPembayaran(jumlah, catatan || 'DP');
              showToast(`DP ${rupiah(jumlah)} dicatat`);
              ov.remove();
              await this.loadList();
              await this.loadPiutang();
              this.render();
            }catch(e){ showToast('Gagal: ' + e.message); return false; }
            return true;
          }
          ov.remove();
          setTimeout(() => {
            this.konfirmasiAksi({
              judul: 'Bayar Kurang',
              pesan: `Bayar ${rupiah(jumlah)}, sisa ${rupiah(sisa)}. Kurang <strong>${rupiah(kurang)}</strong>.`,
              labelA: `Lunas (kurang ${rupiah(kurang)} diikhlaskan)`,
              labelB: `Simpan DP (sisa ${rupiah(kurang)})`,
              onA: async () => {
                try{
                  await simpanPembayaran(sisa, 'Lunas (kurang diikhlaskan)');
                  showToast(`Lunas — kurang ${rupiah(kurang)} diikhlaskan`);
                  await this.loadList();
                  await this.loadPiutang();
                  this.render();
                }catch(e){ showToast('Gagal: ' + e.message); }
              },
              onB: async () => {
                try{
                  await simpanPembayaran(jumlah, catatan || 'DP');
                  showToast(`DP ${rupiah(jumlah)} dicatat`);
                  await this.loadList();
                  await this.loadPiutang();
                  this.render();
                }catch(e){ showToast('Gagal: ' + e.message); }
              }
            });
          }, 120);
          return true;
        },
        afterRender: () => {
          this._bindMoney('pm_jml');
          const inp = document.getElementById('pm_jml');
          const info = document.getElementById('pm_info');
          const updateInfo = () => {
            const n = Number(String(inp.value).replace(/\D/g,'')) || 0;
            info.className = 'pm-info';
            if(n <= 0) return;
            if(n === sisa){
              info.textContent = '✓ Sesuai sisa';
              info.classList.add('ok','show');
            } else if(n > sisa){
              const sel = n - sisa;
              if(sel > TOLERANSI_SELISIH){
                info.textContent = `⚠ Kelebihan ${rupiah(sel)} — maksimal ${rupiah(TOLERANSI_SELISIH)}`;
                info.classList.add('danger','show');
              } else {
                info.textContent = `Lebih ${rupiah(sel)} — nanti ditanya kembalian?`;
                info.classList.add('warn','show');
              }
            } else {
              const sel = sisa - n;
              if(sel > TOLERANSI_SELISIH){
                info.textContent = `DP — sisa ${rupiah(sel)}`;
                info.classList.add('info','show');
              } else {
                info.textContent = `Kurang ${rupiah(sel)} — nanti ditanya lunas / DP?`;
                info.classList.add('warn','show');
              }
            }
          };
          if(inp){
            inp.addEventListener('input', updateInfo);
            setTimeout(() => { inp.focus(); inp.select(); }, 80);
          }
          const btnLunas = document.getElementById('pm_lunas');
          if(btnLunas) btnLunas.addEventListener('click', async () => {
            try{
              await simpanPembayaran(sisa, 'Lunas');
              showToast(`✓ Lunas — ${rupiah(sisa)}`);
              ov.remove();
              await this.loadList();
              await this.loadPiutang();
              this.render();
            }catch(e){
              showToast('Gagal: ' + e.message);
            }
          });
        }
      });
    },

    buildNotaText(p){
      const total = Number(p.Total) || 0;
      const dibayar = Number(p.Dibayar) || 0;
      const sisa = Number(p.Sisa) || 0;
      const lunas = sisa <= 0;
      const items = p.Items || [];
      const opsi = this._notaOpsi || {tampilHP: true, tampilCatatan: true};
      const lines = [];
      lines.push(App.pengaturan.NamaLapak || 'H. Mawih Sayur');
      const noHP = App.pengaturan.NoHP || '';
      if(noHP) lines.push('HP: ' + noHP);
      lines.push('');
      lines.push('Nota Pesanan');
      lines.push('─────────────────────────────');
      lines.push('Nama    : ' + p.Nama);
      if(opsi.tampilHP && p.NoHP) lines.push('HP      : ' + p.NoHP);
      const [y,m,d] = (p.Tanggal||'').split('-').map(Number);
      const tglPanjang = p.Tanggal ?
        new Date(y, m-1, d).toLocaleDateString('id-ID',
          {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : '';
      lines.push('Tanggal : ' + tglPanjang);
      if(opsi.tampilCatatan && p.Keterangan) lines.push('Catatan : ' + p.Keterangan);
      lines.push('');
      const maxNama = Math.max(...items.map(it => (it.NamaBarang||'').length), 6);
      items.forEach(it => {
        const nm = String(it.NamaBarang).padEnd(maxNama, ' ');
        const qty = `${it.Qty} ${it.Satuan}`.padEnd(10, ' ');
        const hrg = `×${Number(it.HargaJual).toLocaleString('id-ID')}`.padStart(9, ' ');
        const sub = `=${Number(it.Subtotal).toLocaleString('id-ID')}`.padStart(10, ' ');
        lines.push(`${nm}  ${qty} ${hrg}  ${sub}`);
      });
      lines.push('─────────────────────────────');
      lines.push('Total   : Rp ' + total.toLocaleString('id-ID'));
      lines.push('Dibayar : Rp ' + dibayar.toLocaleString('id-ID'));
      if(!lunas) lines.push('Sisa    : Rp ' + sisa.toLocaleString('id-ID'));
      else lines.push('Status  : LUNAS');
      lines.push('');
      lines.push('Terima kasih');
      return lines.join('\n');
    },

    _shareText(text){
      if(navigator.share){
        navigator.share({text})
          .then(() => showToast('✓ Dikirim'))
          .catch(err => {
            if(err.name !== 'AbortError'){
              navigator.clipboard.writeText(text)
                .then(() => showToast('Disalin'))
                .catch(() => showToast('Gagal'));
            }
          });
      } else {
        navigator.clipboard.writeText(text)
          .then(() => showToast('Disalin'))
          .catch(() => showToast('Gagal'));
      }
    },

    async hapusPesanan(){
      const p = this.list.find(x => x.ID === this.currentId);
      if(!p) return;
      if((p.Pembayaran || []).length > 0){
        showToast('Tidak bisa hapus: ada pembayaran');
        return;
      }
      if(!confirm(`Hapus pesanan ${p.Nama}?`)) return;
      try{
        await SayurStorage.post('deletePesanan', {id: p.ID});
        showToast('✓ Dihapus');
        this.currentId = null;
        await this.loadList();
        this.render();
      }catch(e){
        showToast('Gagal: ' + e.message);
      }
    },

    _buatModal(opt){
      const ov = document.createElement('div');
      ov.className = 'modal-ov-pes center';
      const cancelLabel = opt.cancelLabel || 'Batal';
      const confirmLabel = opt.confirmLabel;
      ov.innerHTML = `
        <div class="modal-box-pes ${opt.wide ? 'wide' : ''}">
          <div class="modal-head-pes">
            <h3>${escHtml(opt.title)}</h3>
          </div>
          ${opt.subtitle ? `<div style="padding:0 18px 8px;font-size:12px;
            color:var(--ink-600);line-height:1.5;">${opt.subtitle}</div>` : ''}
          <div class="modal-body-pes">${opt.body || ''}</div>
          <div class="modal-actions-pes">
            <button class="btn-cancel" type="button">${cancelLabel}</button>
            ${confirmLabel ? `<button class="btn-confirm" type="button">${confirmLabel}</button>` : ''}
          </div>
        </div>`;
      document.body.appendChild(ov);

      ov.querySelector('.btn-cancel').addEventListener('click', () => {
        if(opt.onCancel){ try{ opt.onCancel(); }catch(e){} }
        ov.remove();
      });
      ov.addEventListener('click', e => { if(e.target === ov) ov.remove(); });

      if(confirmLabel){
        ov.querySelector('.btn-confirm').addEventListener('click', async () => {
          const btn = ov.querySelector('.btn-confirm');
          btn.disabled = true;
          btn.textContent = '…';
          try{
            const result = await opt.onConfirm();
            if(result === false){
              btn.disabled = false;
              btn.textContent = confirmLabel;
            }
          }catch(e){
            btn.disabled = false;
            btn.textContent = confirmLabel;
          }
        });
      }
      if(opt.afterRender) setTimeout(opt.afterRender, 60);
      return ov;
    },

    _bindMoney(id){
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('input', () => {
        const n = Number(String(el.value).replace(/\D/g,'')) || 0;
        el.value = n ? n.toLocaleString('id-ID') : '';
      });

    _bindAutocomplete(){
      const inp = document.getElementById('ti_nama');
      const drop = document.getElementById('ti_ac');
      if(!inp || !drop) return;
      inp.addEventListener('input', () => {
        const q = inp.value.trim().toLowerCase();
        if(!q){ drop.classList.remove('show'); drop.innerHTML = ''; return; }
        const matches = this.masterBarang.filter(m =>
          m.nama.toLowerCase().includes(q)).slice(0, 8);
        let html = '';
        if(matches.length){
          html = matches.map(m => {
            const hj = m.hargaJual || Belanja.hitungHargaJual(m.hargaBeli);
            return `<div class="ac-item-pes" data-nama="${escHtml(m.nama)}"
                         data-satuan="${escHtml(m.satuan)}"
                         data-hj="${hj}" data-hb="${m.hargaBeli}">
              <div class="ac-nm">${escHtml(m.nama)}
                <span class="ac-sat">· ${escHtml(m.satuan)}</span></div>
              <div class="ac-price">${rupiah(hj)}</div>
            </div>`;
          }).join('');
        } else {
          html = `<div class="ac-empty-pes">Barang belum terdaftar</div>`;
        }
        drop.innerHTML = html;
        drop.classList.add('show');
        drop.querySelectorAll('.ac-item-pes').forEach(el => {
          el.addEventListener('pointerdown', e => {
            e.preventDefault();
            inp.value = el.dataset.nama;
            document.getElementById('ti_satuan').value = el.dataset.satuan;
            document.getElementById('ti_harga').value =
              Number(el.dataset.hj).toLocaleString('id-ID');
            if(Number(el.dataset.hb) > 0){
              document.getElementById('ti_hargabeli').value =
                Number(el.dataset.hb).toLocaleString('id-ID');
            }
            drop.classList.remove('show');
            document.getElementById('ti_qty').focus();

        });
      });
      inp.addEventListener('blur', () => {
        setTimeout(() => drop.classList.remove('show'), 180);
      });
    }

  /* ==========================================================
     MODUL: TUTUP HARI
     ========================================================== */
  const Tutup = {
    tanggal: todayYmd(),
    state: null,
    pengeluaran: null,
    mode: 'baru',
    modeBackdate: false,

    _draftKey(tgl){ return 'sayur_tutup_draft_' + tgl; },
    _finalKey(tgl){ return 'sayur_tutup_final_' + tgl; },
    _biayaKey(tgl){ return 'sayur_belanja_biaya_' + tgl; },

    _cek: {},

    async load(){
      this.loadLocal();
      this.render();
      if(this.mode === 'baru'){
        const tgl = this.tanggal;
        const n = Date.now();
        if(n - (this._cek[tgl] || 0) >= 60000){
          this._cek[tgl] = n;
          if(await this.loadFromServer()) this.render();
        }
      }
    },

    async setTanggal(ymd, modeBackdate){
      this.tanggal = ymd;
      this.modeBackdate = !!modeBackdate;
      this.loadLocal();
      this.render();
      if(this.mode === 'baru'){
        this._cek[ymd] = Date.now();
        const dimuat = await this.loadFromServer();
        if(dimuat && this.tanggal === ymd){
          this.render();
          showToast('Data dimuat dari server');
        }
      }
      if(this.tanggal !== ymd) return;   /* user sudah pindah tanggal */
      await Belanja.setTanggal(ymd, modeBackdate);
    },

    /* Isi form dari server kalau data lokal tanggal ini tidak ada.
       Data lokal (draft/final) selalu menang. */
    async loadFromServer(){
      const tgl = this.tanggal;
      if(this.mode !== 'baru') return false;
      const d = await ServerHari.ambil(tgl);

      /* Batal kalau user pindah tanggal / sudah mulai mengisi selama menunggu */
      if(!d || tgl !== this.tanggal || this.mode !== 'baru') return false;
      if(this.totalPendapatanKotor() > 0 ||
         (this.pengeluaran.lain || []).length > 0) return false;

      if(ServerHari.tutupTersimpan(d)){
        try{
          localStorage.setItem(this._finalKey(tgl),
            JSON.stringify(ServerHari.stateTutup(d)));
        }catch(e){ return false; }
        ServerHari.tulisPengeluaran(tgl, d, true);
      } else if(ServerHari.adaData(d)){
        ServerHari.tulisPengeluaran(tgl, d, false);
      } else {
        return false;
      }
      this.loadLocal();
      return true;
    },

    loadLocal(){
      let draft = null, final = null;
      try{
        const rd = localStorage.getItem(this._draftKey(this.tanggal));
        if(rd) draft = JSON.parse(rd);
        const rf = localStorage.getItem(this._finalKey(this.tanggal));
        if(rf) final = JSON.parse(rf);
      }catch(e){}

      if(final){
        this.state = this.normalizeState(final);
        this.mode = 'final';
      } else if(draft){
        this.state = this.normalizeState(draft);
        this.mode = 'draft';
      } else {
        this.state = this.emptyState();
        this.mode = 'baru';
      }

      try{
        const rb = localStorage.getItem(this._biayaKey(this.tanggal));
        if(rb){
          const b = JSON.parse(rb);
          this.pengeluaran = {
            modalBelanja: Number(b.modalBelanja) || 0,
            opsPasar: Number(b.opsPasar) || 100000,
            bensin: Number(b.bensin) || 50000,
            lain: Array.isArray(b.lain) ? b.lain : [],
            bayarHutang: Number(b.bayarHutang) || 0
          };
        } else {
          this.pengeluaran = this.emptyPengeluaran();
        }
      }catch(e){
        this.pengeluaran = this.emptyPengeluaran();
      }
    },

    emptyState(){
      return {
        tanggal: this.tanggal,
        omzetCash: 0, omzetQris: 0,
        bon: [],
        pagi: { kantongKaret: 0, iuran: 0, lain: [] }
      };
    },

    emptyPengeluaran(){
      return {
        modalBelanja: 0,
        opsPasar: Number((App.pengaturan||{}).OperasionalBelanja) || 100000,
        bensin: Number((App.pengaturan||{}).Bensin) || 50000,
        lain: [], bayarHutang: 0
      };
    },

    normalizeState(s){
      const out = this.emptyState();
      out.tanggal = this.tanggal;
      out.omzetCash = Number(s.omzetCash) || 0;
      out.omzetQris = Number(s.omzetQris) || 0;
      out.bon = Array.isArray(s.bon) ? s.bon.map(b => ({
        id: b.id || 'bon-' + Date.now(),
        nama: String(b.nama || ''),
        jumlah: Number(b.jumlah) || 0
      })) : [];
      const p = s.pagi || {};
      if(p.kresek !== undefined || p.konsumsi !== undefined){
        out.pagi.kantongKaret = Number(p.kresek) || 0;
        out.pagi.iuran = Number(p.iuran) || 0;
        out.pagi.lain = [];
        if(Number(p.konsumsi) > 0){
          out.pagi.lain.push({id:'lama-k', ket:'Konsumsi', jumlah: Number(p.konsumsi)});
        }
        if(Number(p.lain) > 0){
          out.pagi.lain.push({id:'lama-l', ket:'Tak Terduga', jumlah: Number(p.lain)});
        }
      } else {
        out.pagi.kantongKaret = Number(p.kantongKaret) || 0;
        out.pagi.iuran = Number(p.iuran) || 0;
        out.pagi.lain = Array.isArray(p.lain) ? p.lain.map(x => ({
          id: x.id || 'pl-' + Date.now(),
          ket: String(x.ket || ''),
          jumlah: Number(x.jumlah) || 0
        })) : [];
      }
      return out;
    },

    totalPagiLain(){
      return (this.state.pagi.lain || []).reduce((s,x) => s + Number(x.jumlah || 0), 0);
    },
    totalPagi(){
      return Number(this.state.pagi.kantongKaret || 0) +
             Number(this.state.pagi.iuran || 0) +
             this.totalPagiLain();
    },
    totalBon(){
      return (this.state.bon || []).reduce((s,x) => s + Number(x.jumlah || 0), 0);
    },
    totalPendapatanKotor(){
      return Number(this.state.omzetCash || 0) +
             Number(this.state.omzetQris || 0) +
             this.totalPagi() + this.totalBon();
    },
    totalLain(){
      return (this.pengeluaran.lain || []).reduce((s,x) => s + Number(x.jumlah || 0), 0);
    },
    totalPengeluaran(){
      return Number(this.pengeluaran.modalBelanja || 0) +
             Number(this.pengeluaran.opsPasar || 0) +
             Number(this.pengeluaran.bensin || 0) +
             this.totalLain() +
             Number(this.pengeluaran.bayarHutang || 0);
    },
    labaBersih(){
      return this.totalPendapatanKotor() - this.totalPengeluaran();
    },

    saveDraft(){
      try{
        localStorage.setItem(this._draftKey(this.tanggal),
          JSON.stringify(this.state));
        return true;
      }catch(e){ return false; }
    },
    saveFinal(){
      try{
        localStorage.setItem(this._finalKey(this.tanggal),
          JSON.stringify(this.state));
        return true;
      }catch(e){ return false; }
    },
    savePengeluaran(){
      try{
        localStorage.setItem(this._biayaKey(this.tanggal),
          JSON.stringify(this.pengeluaran));
        return true;
      }catch(e){ return false; }
    },

          <div id="tutupLainList">${this.renderLainList(isLocked)}</div>
          ${!isLocked ? `
          <div class="tutup-add-row">
            <input type="text" class="nm" id="tutupLainKet"
                   placeholder="Keterangan (mis. Konsumsi)" autocomplete="off">
            <input type="text" class="jml" id="tutupLainJml"
                   inputmode="numeric" placeholder="0">
            <button type="button" id="tutupLainAdd">+</button>
          </div>` : ''}

          ${this.pengeluaran.bayarHutang > 0 ? `
          <div class="tutup-row" style="margin-top:6px;">
            <span class="lbl">
              Bayar Hutang
              <small>dari tab Belanja</small>
            </span>
            <span class="amt-display muted">${rupiah(this.pengeluaran.bayarHutang)}</span>
          </div>` : ''}

          <div class="grand-total-tutup rust">
            <span class="lbl">Total Pengeluaran</span>
            <span class="amt" id="tutupGrandPengeluaran">
              ${rupiah(this.totalPengeluaran())}
            </span>
          </div>
        </div>`;

      const laba = this.labaBersih();
      const labaKelas = laba >= 0 ? '' : 'neg';
      html += `
        <div class="tutup-card tutup-summary-card">
          <div class="tutup-card-head head">
            <h2>📊 Laba Bersih Hari Ini</h2>
          </div>
          <div class="laba-amt ${labaKelas}" id="tutupLabaAmt">
            ${rupiah(laba)}
          </div>
          <div class="laba-sub" id="tutupLabaSub">
            ${laba >= 0 ?
              'Dari pendapatan kotor ' + rupiah(this.totalPendapatanKotor()) :
              'Rugi — periksa pengeluaran'}
          </div>
        </div>`;

      html += `
        <button class="btn-save-tutup ${isLocked ? 'edit-mode' : ''}" id="tutupBtnSave">
          ${isLocked ? '✏️ Edit' : '💾 Simpan'}
        </button>`;

      el.innerHTML = html;
      this.attachHandlers();
    },

    renderPagiLainList(isLocked){
      const list = this.state.pagi.lain || [];
      if(!list.length) return '';
      return list.map((x,i) => `
        <div class="tutup-list-item">
          <span class="nm">${escHtml(x.ket)}</span>
          <span class="amt">${rupiah(x.jumlah)}</span>
          ${!isLocked ? `<button class="del" data-type="pagiLain" data-idx="${i}" type="button">×</button>` : ''}
        </div>
      `).join('');
    },

    renderBonList(isLocked){
      const list = this.state.bon || [];
      if(!list.length) return '';
      return list.map((b,i) => `
        <div class="tutup-list-item">
          <span class="nm">${escHtml(b.nama)}</span>
          <span class="amt">${rupiah(b.jumlah)}</span>
          ${!isLocked ? `<button class="del" data-type="bon" data-idx="${i}" type="button">×</button>` : ''}
        </div>
      `).join('');
    },

    renderLainList(isLocked){
      const list = this.pengeluaran.lain || [];
      if(!list.length) return '';
      return list.map((x,i) => `
        <div class="tutup-list-item">
          <span class="nm">${escHtml(x.ket)}</span>
          <span class="amt">${rupiah(x.jumlah)}</span>
          ${!isLocked ? `<button class="del" data-type="lain" data-idx="${i}" type="button">×</button>` : ''}
        </div>
      `).join('');
    },

    attachHandlers(){
      const isLocked = this.mode === 'final';

      const btnKembali = document.getElementById('tutupKembaliHariIni');
      if(btnKembali) btnKembali.addEventListener('click', async () => {
        await this.setTanggal(todayYmd(), false);
        showToast('Kembali ke hari ini');
      });

      const inpTanggal = document.getElementById('tutupTanggal');
      if(inpTanggal){
        inpTanggal.addEventListener('change', async () => {
          if(!inpTanggal.value) return;
          const val = inpTanggal.value;
          if(val > todayYmd()){
            showToast('Tidak bisa isi tanggal masa depan');
            inpTanggal.value = this.tanggal;
            return;
          }
          const back = selisihHari(val, todayYmd());
          if(back > 30){
            if(!confirm(`Yakin isi data ${back} hari lalu?`)){
              inpTanggal.value = this.tanggal;
              return;
            }
          }
          await this.setTanggal(val, val !== todayYmd());
        });
      }

      const btnInputBelanja = document.getElementById('tutupInputBelanja');
      if(btnInputBelanja) btnInputBelanja.addEventListener('click', async () => {
        goTab('belanja');
        await Belanja.setTanggal(this.tanggal, this.modeBackdate);
        showToast(`→ Input belanja ${fmtTanggalPendek(this.tanggal)}`);
      });

      this._bindMoney('tutupCash', v => { this.state.omzetCash = v; });
      this._bindMoney('tutupQris', v => { this.state.omzetQris = v; });
      this._bindMoney('tutupPagiKK', v => { this.state.pagi.kantongKaret = v; });
      this._bindMoney('tutupPagiIuran', v => { this.state.pagi.iuran = v; });
      this._bindMoney('tutupOps', v => {
        this.pengeluaran.opsPasar = v;
        this.savePengeluaran();
      });
      this._bindMoney('tutupBensin', v => {
        this.pengeluaran.bensin = v;
        this.savePengeluaran();
      });

      /* Tombol Edit/Simpan harus aktif juga saat form terkunci */
      const btnSave = document.getElementById('tutupBtnSave');
      if(btnSave) btnSave.addEventListener('click', () => {
        if(this.mode === 'final'){
          this.mode = 'draft';
          this.saveDraft();
          try{ localStorage.removeItem(this._finalKey(this.tanggal)); }catch(e){}
          showToast('Mode edit: silakan ubah, lalu Simpan');
          this.render();
          return;
        }
        this.openSheetSimpan();
      });

      if(isLocked) return;

      const plAdd = document.getElementById('tutupPagiLainAdd');
      if(plAdd) plAdd.addEventListener('click', () => {
        const ket = document.getElementById('tutupPagiLainKet').value.trim();
        const jml = this._parseMoney(document.getElementById('tutupPagiLainJml').value);
        if(!ket){ showToast('Isi keterangan'); return; }
        if(jml <= 0){ showToast('Isi jumlah'); return; }
        this.state.pagi.lain.push({id: 'pl-' + Date.now(), ket, jumlah: jml});
        this.render();
      });

      const bonAdd = document.getElementById('tutupBonAdd');
      if(bonAdd) bonAdd.addEventListener('click', () => {
        const nama = document.getElementById('tutupBonNama').value.trim();
        const jml = this._parseMoney(document.getElementById('tutupBonJml').value);
        if(!nama){ showToast('Isi nama'); return; }
        if(jml <= 0){ showToast('Isi jumlah'); return; }
        this.state.bon.push({id: 'bon-' + Date.now(), nama, jumlah: jml});
        this.render();
      });

      const lainAdd = document.getElementById('tutupLainAdd');
      if(lainAdd) lainAdd.addEventListener('click', () => {
        const ket = document.getElementById('tutupLainKet').value.trim();
        const jml = this._parseMoney(document.getElementById('tutupLainJml').value);
        if(!ket){ showToast('Isi keterangan'); return; }
        if(jml <= 0){ showToast('Isi jumlah'); return; }
        this.pengeluaran.lain.push({id: 'lain-' + Date.now(), ket, jumlah: jml});
        this.savePengeluaran();
        this.render();
      });

      this._chainEnter('tutupPagiLainKet', 'tutupPagiLainJml', 'tutupPagiLainAdd');
      this._chainEnter('tutupBonNama', 'tutupBonJml', 'tutupBonAdd');
      this._chainEnter('tutupLainKet', 'tutupLainJml', 'tutupLainAdd');

      ['tutupPagiLainJml', 'tutupBonJml', 'tutupLainJml'].forEach(id => {
        const el = document.getElementById(id);
        if(!el) return;
        el.addEventListener('input', () => {
          const n = this._parseMoney(el.value);
          el.value = n ? n.toLocaleString('id-ID') : '';
        });
      });

      document.querySelectorAll('#tutupContent .del').forEach(btn => {
        btn.addEventListener('click', () => {
          const type = btn.dataset.type;
          const idx = Number(btn.dataset.idx);
          if(type === 'pagiLain') this.state.pagi.lain.splice(idx, 1);
          if(type === 'bon') this.state.bon.splice(idx, 1);
          if(type === 'lain'){
            this.pengeluaran.lain.splice(idx, 1);
            this.savePengeluaran();
          }
          this.render();
        });
      });
    },

    _bindMoney(id, setter){
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('input', () => {
        const n = this._parseMoney(el.value);
        el.value = n ? n.toLocaleString('id-ID') : '';
        setter(n);
        this.updateLive();
      });
    },

    _parseMoney(v){
      return Number(String(v || '').replace(/[^\d]/g,'')) || 0;
    },

    _chainEnter(idInput, idJml, idBtn){
      const a = document.getElementById(idInput);
      const b = document.getElementById(idJml);
      const c = document.getElementById(idBtn);
      if(a && b) a.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); b.focus(); }
      });
      if(b && c) b.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); c.click(); }
      });
    },

    updateLive(){
      const totalPendapatan = this.totalPendapatanKotor();
      const totalPengeluaran = this.totalPengeluaran();
      const laba = this.labaBersih();
      const elPendapatan = document.getElementById('tutupTotalPendapatan');
      const elGrandP = document.getElementById('tutupGrandPendapatan');
      const elPlusPagi = document.getElementById('tutupPlusPagi');
      const elPengeluaran = document.getElementById('tutupTotalPengeluaran');
      const elGrandPeng = document.getElementById('tutupGrandPengeluaran');
      const elLabaAmt = document.getElementById('tutupLabaAmt');
      const elLabaSub = document.getElementById('tutupLabaSub');

      if(elPendapatan) elPendapatan.textContent = rupiah(totalPendapatan);
      if(elGrandP) elGrandP.textContent = rupiah(totalPendapatan);
      if(elPlusPagi) elPlusPagi.textContent = '+ ' + rupiah(this.totalPagi());
      if(elPengeluaran) elPengeluaran.textContent = rupiah(totalPengeluaran);
      if(elGrandPeng) elGrandPeng.textContent = rupiah(totalPengeluaran);
      if(elLabaAmt){
        elLabaAmt.textContent = rupiah(laba);
        elLabaAmt.classList.toggle('neg', laba < 0);
      }
      if(elLabaSub){
        elLabaSub.textContent = laba >= 0 ?
          'Dari pendapatan kotor ' + rupiah(totalPendapatan) :
          'Rugi — periksa pengeluaran';
      }
    },

    openSheetSimpan(){
      const ov = document.createElement('div');
      ov.className = 'sheet-ov';
      ov.innerHTML = `
        <div class="sheet">
          <h3>Simpan Data</h3>
          <div class="sub">Untuk <strong>${fmtTanggalPanjang(this.tanggal)}</strong></div>

          <div class="opt draft" data-aksi="draft">
            <div class="icn">💾</div>
            <div class="txt">
              <div class="ttl">Simpan Sementara</div>
              <div class="desc">Tersimpan di HP saja. Bisa diubah kapan saja.</div>
            </div>
            <span class="arrow">›</span>
          </div>

          <div class="opt final" data-aksi="final">
            <div class="icn">✅</div>
            <div class="txt">
              <div class="ttl">Simpan Database</div>
              <div class="desc">Kirim ke server. Diubah lewat mode Edit.</div>
            </div>
            <span class="arrow">›</span>
          </div>

          <button class="cancel" type="button">Batal</button>
        </div>`;
      document.body.appendChild(ov);

      ov.addEventListener('click', e => { if(e.target === ov) ov.remove(); });
      ov.querySelector('.cancel').addEventListener('click', () => ov.remove());

      ov.querySelectorAll('.opt').forEach(opt => {
        opt.addEventListener('click', () => {
          const aksi = opt.dataset.aksi;
          ov.remove();
          if(aksi === 'draft') this.aksiSimpanDraft();
          if(aksi === 'final') this.aksiSimpanFinal();
        });
      });
    },

    aksiSimpanDraft(){
      if(this.saveDraft()){
        this.mode = 'draft';
        showToast('Tersimpan sementara di HP');
        this.render();
      }
    },

    async aksiSimpanFinal(){
      if(this.totalPendapatanKotor() <= 0 && this.totalPengeluaran() <= 0){
        showToast('Isi data dulu');
        return;
      }
      if(!confirm('Simpan ke Database untuk ' +
          fmtTanggalPanjang(this.tanggal) +
          '?\n\nSetelah ini hanya bisa diubah dengan mode "Edit".')) return;

      try{
        await SayurStorage.post('setOmzet', {
          tanggal: this.tanggal,
          cash: Number(this.state.omzetCash) || 0,
          qris: Number(this.state.omzetQris) || 0
        });

        await SayurStorage.post('setBiayaOperasional', {
          tanggal: this.tanggal,
          operasionalBelanja: Number(this.pengeluaran.opsPasar) || 0,
          operasionalMetode: 'Cash',
          bensin: Number(this.pengeluaran.bensin) || 0,
          bensinMetode: 'Cash',
          konsumsi: 0, konsumsiMetode: 'Cash',
          pagiKresek: Number(this.state.pagi.kantongKaret) || 0,
          pagiKonsumsi: 0,
          pagiIuran: Number(this.state.pagi.iuran) || 0,
          pagiLain: this.totalPagiLain()
        });

        const bonTerkunci = await this._sinkronLainBon();
        if(bonTerkunci > 0){
          showToast(bonTerkunci + ' bon sudah ada pembayaran, tidak diubah');
        }

        this.saveFinal();
        this.savePengeluaran();
        this.mode = 'final';

        try{
          localStorage.setItem('sayur_last_sync', new Date().toISOString());
        }catch(e){}

        showToast('✓ Tersimpan ke database (antrian)');
        this.render();

        if(this.modeBackdate){
          setTimeout(() => this.tawarkanLanjut(), 400);
        }

        if(App.currentTab === 'beranda') loadBeranda();
      }catch(e){
        showToast('Gagal: ' + (e.message || 'Unknown'));
      }
    },

    /* Samakan lain-lain & bon di server dengan isi form:
       - item baru → ditambah
       - item berubah / dihapus → hapus dulu (lalu tambah ulang kalau berubah)
       Bon yang sudah ada pembayarannya tidak disentuh.
       Return: jumlah bon yang dilewati. */
    async _sinkronLainBon(){
      const tgl = this.tanggal;
      const n = v => Number(v) || 0;

      /* Pastikan antrean kosong & ambil kondisi server terbaru */
      if(navigator.onLine){ try{ await SayurStorage.processQueue(); }catch(e){} }
      const d = await ServerHari.ambil(tgl);
      const srvLain = d ? ServerHari.lainDari(d) : [];
      const srvBon  = d ? ServerHari.bonRaw(d) : [];

      /* ---- Lain-lain ---- */
      const lokalLain = this.pengeluaran.lain || [];
      lokalLain.forEach(x => {
        if(!x.id) x.id = 'lain-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
      });
      const srvLainById = new Map(srvLain.map(x => [x.id, x]));
      const lokalLainById = new Map(lokalLain.map(x => [x.id, x]));
      const bedaLain = (a, b) =>
        String(a.ket || '') !== String(b.ket || '') || n(a.jumlah) !== n(b.jumlah);

      for(const s of srvLain){
        const l = lokalLainById.get(s.id);
        if(!l || bedaLain(l, s)){
          await SayurStorage.post('deleteLainLain', {id: s.id},
            'del-' + s.id + '-' + Date.now());
        }
      }
      for(const l of lokalLain){
        const s = srvLainById.get(l.id);
        if(!s || bedaLain(l, s)){
          await SayurStorage.post('addLainLain', {
            id: l.id, tanggal: tgl, keterangan: l.ket,
            jumlah: l.jumlah, metode: 'Cash'
          });
        }
      }

      /* ---- Bon ---- */
      const lokalBon = this.state.bon || [];
      lokalBon.forEach(b => {
        if(!b.id) b.id = 'bon-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
      });
      const srvBonById = new Map(srvBon.map(h => [h.ID, h]));
      const lokalBonById = new Map(lokalBon.map(b => [b.id, b]));
      const hapusBon = new Set();
      let terkunci = 0;

      for(const h of srvBon){
        const l = lokalBonById.get(h.ID);
        const berubah = !l || String(l.nama || '') !== String(h.Nama || '') ||
                        n(l.jumlah) !== n(h.JumlahAwal);
        if(!berubah) continue;
        if(n(h.JumlahDibayar) > 0){ terkunci++; continue; }
        hapusBon.add(h.ID);
        await SayurStorage.post('hapusHutang', {id: h.ID},
          'delh-' + h.ID + '-' + Date.now());
      }
      for(const b of lokalBon){
        const h = srvBonById.get(b.id);
        if(h && !hapusBon.has(b.id)) continue;   /* sudah ada & tidak berubah / terkunci */
        await SayurStorage.post('addHutang', {
          id: b.id, tipe: 'PiutangSaya', nama: b.nama, jumlah: b.jumlah,
          catatan: 'Bon lisan', sumber: 'Bon', tanggal: tgl
        });
      }
      return terkunci;
    },

    tawarkanLanjut(){
      const bolong = cariHariBolong();
      if(!bolong.length) return;
      const lebihTua = bolong.filter(b => b < this.tanggal);
      if(!lebihTua.length) return;
      const nextTgl = lebihTua[lebihTua.length - 1];
      const sisa = lebihTua.length;

      const ov = Pesanan._buatModal({
        title: 'Lanjut Isi?',
        body: `
          <p style="margin:0 0 12px;font-size:13px;line-height:1.55;">
            Tersimpan ✓. Masih ada <strong>${sisa} hari</strong> belum dicatat.
          </p>
          <div style="padding:10px 12px;background:var(--paper);
               border-radius:var(--r-sm);font-size:13px;">
            Berikutnya: <strong>${fmtTanggalPanjang(nextTgl)}</strong>
          </div>`,
        confirmLabel: 'Lanjut Isi',
        cancelLabel: 'Nanti Saja',
        onConfirm: async () => {
          ov.remove();
          await this.setTanggal(nextTgl, true);
          showToast(`→ ${fmtTanggalPendek(nextTgl)}`);
          return true;
        },
        onCancel: async () => {
          await this.setTanggal(todayYmd(), false);
        }
      });
    }
  };

  /* ==========================================================
     MODUL: LAPORAN
     ========================================================== */
  const Laporan = {
    currentTab: 'aruskas',
    currentPeriod: 'today',
    customDari: '',
    customSampai: '',
    filterMutasi: 'semua',
    filterBulanRiwayat: 'all',
    aruskasData: null,
    saldoData: null,
    mutasiData: [],
    hutangData: [],
    ringkasanHutang: null,
    riwayatData: [],
    apiPesanan: [],
    apiMutasi: [],
    apiHutang: [],

    async load(){
      this.renderAll();
      this._updateSubtabUI();
      this.attachSubtabs();
      await this.loadCurrentTab();
    },

    _updateSubtabUI(){
      document.querySelectorAll('.subtabs-lap button[data-laptab]').forEach(b =>
        b.classList.toggle('active', b.dataset.laptab === this.currentTab));
      document.querySelectorAll('.tab-lap').forEach(t => t.classList.remove('active'));
      const el = document.getElementById('tabLap' +
        this.currentTab.charAt(0).toUpperCase() + this.currentTab.slice(1));
      if(el) el.classList.add('active');
    },

    attachSubtabs(){
      document.querySelectorAll('.subtabs-lap button[data-laptab]').forEach(btn => {
        btn.addEventListener('click', () => {
          this.currentTab = btn.dataset.laptab;
          document.querySelectorAll('.subtabs-lap button').forEach(b =>
            b.classList.toggle('active', b === btn));
          document.querySelectorAll('.tab-lap').forEach(t => t.classList.remove('active'));
          const el = document.getElementById('tabLap' +
            this.currentTab.charAt(0).toUpperCase() + this.currentTab.slice(1));
          if(el) el.classList.add('active');
          this.loadCurrentTab();
        });
      });
    },

    renderAll(){
      this.renderArusKas();
      this.renderSaldo();
      this.renderHutang();
      this.renderRiwayat();
    },

    async loadCurrentTab(){
      if(this.currentTab === 'aruskas') await this.loadArusKas();
      if(this.currentTab === 'saldo') await this.loadSaldo();
      if(this.currentTab === 'hutang') await this.loadHutang();
      if(this.currentTab === 'riwayat') await this.loadRiwayat();
    },

    periodRange(p){
      const today = todayYmd();
      if(p === 'today') return {dari: today, sampai: today};
      if(p === '7d'){
        const d = new Date(); d.setDate(d.getDate() - 6);
        return {dari: this._ymd(d), sampai: today};
      }
      if(p === '30d'){
        const d = new Date(); d.setDate(d.getDate() - 29);
        return {dari: this._ymd(d), sampai: today};
      }
      if(p === 'month'){
        const d = new Date();
        return {
          dari: d.getFullYear() + '-' +
            String(d.getMonth()+1).padStart(2,'0') + '-01',
          sampai: today
        };
      }
      if(p === 'custom'){
        return {
          dari: this.customDari || today,
          sampai: this.customSampai || today
        };
      }
      return {dari: today, sampai: today};
    },

    _ymd(d){
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
    },

    periodLabel(p){
      return {
        today: 'Hari Ini', '7d': '7 Hari', '30d': '30 Hari',
        month: 'Bulan Ini', custom: 'Custom'
      }[p] || '';
    },

    async loadArusKas(){
      const range = this.periodRange(this.currentPeriod);
      try{
        const data = await SayurStorage.get('getArusKas', range);
        this.aruskasData = data;
      }catch(e){
        this.aruskasData = null;
      }
      this.renderArusKas();
    },

    renderArusKas(){
      const el = document.getElementById('tabLapAruskas');
      if(!el) return;
      let html = '';

      html += `<div class="period-tabs">
        <button class="period-tab ${this.currentPeriod==='today'?'active':''}" data-period="today">Hari Ini</button>
        <button class="period-tab ${this.currentPeriod==='7d'?'active':''}" data-period="7d">7 Hari</button>
        <button class="period-tab ${this.currentPeriod==='30d'?'active':''}" data-period="30d">30 Hari</button>
        <button class="period-tab ${this.currentPeriod==='month'?'active':''}" data-period="month">Bulan Ini</button>
        <button class="period-tab ${this.currentPeriod==='custom'?'active':''}" data-period="custom">Custom</button>
      </div>`;

      if(this.currentPeriod === 'custom'){
        html += `
          <div class="custom-range">
            <div class="row-input">
              <label>Dari</label>
              <input type="date" id="lapCustomDari" value="${this.customDari}">
            </div>
            <div class="row-input">
              <label>Sampai</label>
              <input type="date" id="lapCustomSampai" value="${this.customSampai}">
            </div>
            <button type="button" id="lapCustomTerapkan">Terapkan</button>
          </div>`;
      }

      const d = this.aruskasData;
      if(!d){
        html += `<div class="daftar-empty">Memuat atau tidak ada data…</div>`;
        el.innerHTML = html;
        this.attachArusKasHandlers();
        return;
      }

      const cash = d.cash || {masuk:0,keluar:0,saldo:0,hutangSaya:0,piutangSaya:0};
      const qris = d.qris || {masuk:0,keluar:0,fee:0,saldo:0,hutangSaya:0,piutangSaya:0};
      const tot = d.total || {masuk:0,keluar:0,saldo:0,hutangSaya:0,piutangSaya:0,fee:0};
      const label = this.periodLabel(this.currentPeriod);

      html += `
        <div class="flow-card cash">
          <div class="flow-head cash">
            <div class="title">💵 Tunai</div>
            <div class="sub">${label}</div>
          </div>
          <div class="flow-row"><span>Masuk</span><span class="amt">${rupiah(cash.masuk)}</span></div>
          ${cash.piutangSaya > 0 ? `<div class="flow-row extra"><span>+ Piutang cair</span><span class="amt">+ ${rupiah(cash.piutangSaya)}</span></div>` : ''}
          <div class="flow-row"><span>Keluar</span><span class="amt">${rupiah(cash.keluar)}</span></div>
          ${cash.hutangSaya > 0 ? `<div class="flow-row extra"><span>− Bayar hutang</span><span class="amt">${rupiah(cash.hutangSaya)}</span></div>` : ''}
          <div class="flow-div"></div>
          <div class="flow-row total"><span>Saldo</span><span class="amt">${rupiah(cash.saldo)}</span></div>
        </div>`;

      html += `
        <div class="flow-card qris">
          <div class="flow-head qris">
            <div class="title">📱 QRIS</div>
            <div class="sub">${label}</div>
          </div>
          <div class="flow-row"><span>Masuk</span><span class="amt">${rupiah(qris.masuk)}</span></div>
          ${qris.fee > 0 ? `<div class="flow-row fee"><span>Fee 0.7%</span><span class="amt">− ${rupiah(qris.fee)}</span></div>` : ''}
          ${qris.piutangSaya > 0 ? `<div class="flow-row extra"><span>+ Piutang cair</span><span class="amt">+ ${rupiah(qris.piutangSaya)}</span></div>` : ''}
          <div class="flow-row"><span>Keluar</span><span class="amt">${rupiah(qris.keluar)}</span></div>
          ${qris.hutangSaya > 0 ? `<div class="flow-row extra"><span>− Bayar hutang</span><span class="amt">${rupiah(qris.hutangSaya)}</span></div>` : ''}
          <div class="flow-div"></div>
          <div class="flow-row total"><span>Saldo</span><span class="amt">${rupiah(qris.saldo)}</span></div>
        </div>`;

      html += `
        <div class="flow-card gabungan">
          <div class="flow-head gabungan">
            <div class="title">📊 Gabungan</div>
            <div class="sub">Tunai + QRIS</div>
          </div>
          <div class="flow-row"><span>Total masuk</span><span class="amt">${rupiah(tot.masuk)}</span></div>
          <div class="flow-row"><span>Total keluar</span><span class="amt">${rupiah(tot.keluar)}</span></div>
          ${tot.fee > 0 ? `<div class="flow-row fee"><span>Fee QRIS</span><span class="amt">− ${rupiah(tot.fee)}</span></div>` : ''}
          <div class="flow-div"></div>
          <div class="flow-row total"><span>Selisih</span><span class="amt">${rupiah(tot.saldo)}</span></div>
        </div>`;

      html += `
        <div class="share-row-lap">
          <button class="btn-share-lap" id="lapBagikan">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
            Bagikan Ringkasan
          </button>
        </div>`;

      el.innerHTML = html;
      this.attachArusKasHandlers();
    },

    attachArusKasHandlers(){
      document.querySelectorAll('.period-tab[data-period]').forEach(btn => {
        btn.addEventListener('click', () => {
          this.currentPeriod = btn.dataset.period;
          if(this.currentPeriod === 'custom' && !this.customDari){
            this.customDari = todayYmd();
            this.customSampai = todayYmd();
          }
          this.loadArusKas();
        });
      });
      const inpD = document.getElementById('lapCustomDari');
      const inpS = document.getElementById('lapCustomSampai');
      if(inpD) inpD.addEventListener('change', () => { this.customDari = inpD.value; });
      if(inpS) inpS.addEventListener('change', () => { this.customSampai = inpS.value; });
      const btn = document.getElementById('lapCustomTerapkan');
      if(btn) btn.addEventListener('click', () => {
        if(!this.customDari || !this.customSampai){
          showToast('Isi kedua tanggal');
          return;
        }
        this.loadArusKas();
      });
      const shareBtn = document.getElementById('lapBagikan');
      if(shareBtn) shareBtn.addEventListener('click', () => this.bagikanArusKas());
    },

    bagikanArusKas(){
      const d = this.aruskasData;
      if(!d){ showToast('Belum ada data'); return; }
      const c = d.cash || {}, q = d.qris || {}, t = d.total || {};
      let text = `*Arus Kas* — ${this.periodLabel(this.currentPeriod)}\n\n`;
      text += `💵 Tunai\nMasuk: ${rupiah(c.masuk)}\nKeluar: ${rupiah(c.keluar)}\nSaldo: ${rupiah(c.saldo)}\n\n`;
      text += `📱 QRIS\nMasuk: ${rupiah(q.masuk)}\nFee: −${rupiah(q.fee)}\nKeluar: ${rupiah(q.keluar)}\nSaldo: ${rupiah(q.saldo)}\n\n`;
      text += `📊 Gabungan\nMasuk: ${rupiah(t.masuk)}\nKeluar: ${rupiah(t.keluar)}\nSelisih: ${rupiah(t.saldo)}`;
      if(navigator.share){
        navigator.share({text})
          .then(() => showToast('✓ Dikirim'))
          .catch(err => {
            if(err.name !== 'AbortError'){
              navigator.clipboard.writeText(text)
                .then(() => showToast('Disalin'))
                .catch(() => showToast('Gagal'));
            }
          });
      } else {
        navigator.clipboard.writeText(text)
          .then(() => showToast('Disalin'))
          .catch(() => showToast('Gagal'));
      }
    },

    /* SALDO — cache + refresh */
    async loadSaldo(){
      try{
        const cacheSaldo = JSON.parse(localStorage.getItem('sayur_cache_saldo') || 'null');
        const cacheMutasi = JSON.parse(localStorage.getItem('sayur_cache_mutasi') || 'null');
        if(cacheSaldo) this.saldoData = cacheSaldo;
        if(cacheMutasi) this.mutasiData = cacheMutasi;
        if(cacheSaldo || cacheMutasi) this.renderSaldo();
      }catch(e){}

      if(!navigator.onLine){
        if(!this.saldoData){
          this.saldoData = {saldoCash:0, saldoQris:0, total:0};
          this.mutasiData = [];
        }
        this.renderSaldo();
        return;
      }

      try{
        const [saldo, mutasi] = await Promise.all([
          SayurStorage.get('getSaldoSekarang').catch(() => null),
          SayurStorage.get('getMutasiSaldo', {limit: 200}).catch(() => null)
        ]);
        if(saldo){
          this.saldoData = saldo;
          try{ localStorage.setItem('sayur_cache_saldo', JSON.stringify(saldo)); }catch(e){}
        }
        if(mutasi){
          this.mutasiData = mutasi;
          try{ localStorage.setItem('sayur_cache_mutasi', JSON.stringify(mutasi)); }catch(e){}
        }
        this.renderSaldo();
      }catch(e){
        if(!this.saldoData){
          this.saldoData = {saldoCash:0, saldoQris:0, total:0};
          this.mutasiData = [];
        }
        this.renderSaldo();
      }
    },

    renderSaldo(){
      const el = document.getElementById('tabLapSaldo');
      if(!el) return;
      const s = this.saldoData || {saldoCash:0, saldoQris:0, total:0};
      let html = '';

      html += `
        <div class="saldo-total-lap">
          <div class="k">Total Saldo</div>
          <div class="v">${rupiah(s.total)}</div>
          <div class="s">
            <span><span class="dot cash"></span>Tunai ${rupiah(s.saldoCash)}</span>
            <span><span class="dot qris"></span>QRIS ${rupiah(s.saldoQris)}</span>
          </div>
        </div>`;

      html += `
        <div class="saldo-grid-lap">
          <div class="saldo-card-lap cash">
            <div class="k">💵 Saldo Tunai</div>
            <div class="v">${rupiah(s.saldoCash)}</div>
            <div class="actions">
              <button data-aksi="tarik" data-metode="Cash">⬇ Tarik</button>
              <button data-aksi="setor" data-metode="Cash">⬆ Setor</button>
            </div>
          </div>
          <div class="saldo-card-lap qris">
            <div class="k">📱 Saldo QRIS</div>
            <div class="v">${rupiah(s.saldoQris)}</div>
            <div class="fee-hint">Sudah dipotong fee 0.7%</div>
            <div class="actions">
              <button data-aksi="tarik" data-metode="QRIS">⬇ Tarik</button>
              <button data-aksi="setor" data-metode="QRIS">⬆ Setor</button>
            </div>
          </div>
        </div>`;

      html += `<div class="section-title-lap">
        <span>Riwayat Mutasi</span>
        <span>${this.mutasiData.length}</span>
      </div>`;

      html += `<div class="mutasi-filters">
        <button class="mutasi-filter ${this.filterMutasi==='semua'?'active':''}" data-filter="semua">Semua</button>
        <button class="mutasi-filter ${this.filterMutasi==='manual'?'active':''}" data-filter="manual">Manual</button>
        <button class="mutasi-filter ${this.filterMutasi==='pesanan'?'active':''}" data-filter="pesanan">Pesanan</button>
        <button class="mutasi-filter ${this.filterMutasi==='modal'?'active':''}" data-filter="modal">Modal</button>
      </div>`;

      const filtered = (this.filterMutasi === 'semua')
        ? this.mutasiData
        : this.mutasiData.filter(m =>
            (m.Sumber || 'Manual').toLowerCase() === this.filterMutasi);

      if(!filtered.length){
        html += `<div class="daftar-empty">Belum ada mutasi</div>`;
      } else {
        html += filtered.map(m => this.renderMutasiItem(m)).join('');
      }

      el.innerHTML = html;
      this.attachSaldoHandlers();
    },

    renderMutasiItem(m){
      const isTarik = m.Tipe === 'Tarik';
      const sign = isTarik ? '−' : '+';
      const cls = isTarik ? 'tarik' : 'setor';
      const icon = isTarik ? '↑' : '↓';
      const sumber = (m.Sumber || 'Manual').toLowerCase();
      const tagLabel = m.Sumber || 'Manual';
      const tagClass = sumber === 'pesanan' ? 'pesanan' :
                       sumber === 'modal' ? 'modal' : 'manual';
      const tglFmt = fmtTanggalPendek(m.Tanggal);
      const optimistic = m._optimistic ? ' <span style="font-size:9.5px;opacity:.6;">(menunggu)</span>' : '';

      return `
        <div class="mutasi-item">
          <div class="mutasi-icon ${cls}">${icon}</div>
          <div class="mutasi-body">
            <div class="t">
              ${escHtml(m.Tipe)} ${escHtml(m.Metode)}${optimistic}
              <span class="tag ${tagClass}">${escHtml(tagLabel)}</span>
            </div>
            <div class="d">${escHtml(tglFmt)}${m.Catatan ? ' · ' + escHtml(m.Catatan) : ''}</div>
          </div>
          <div class="mutasi-amt ${cls}">${sign} ${rupiah(m.Jumlah)}</div>
        </div>`;
    },

    attachSaldoHandlers(){
      document.querySelectorAll('.mutasi-filter').forEach(btn => {
        btn.addEventListener('click', () => {
          this.filterMutasi = btn.dataset.filter;
          this.renderSaldo();
        });
      });
      document.querySelectorAll('#tabLapSaldo .saldo-card-lap .actions button').forEach(btn => {
        btn.addEventListener('click', () => {
          this.openMutasiModal(btn.dataset.aksi, btn.dataset.metode);
        });
      });
    },

    openMutasiModal(tipe, metode){
      /* data-aksi berupa huruf kecil → samakan dengan 'Tarik' / 'Setor' */
      tipe = String(tipe).toLowerCase() === 'tarik' ? 'Tarik' : 'Setor';
      const s = this.saldoData || {saldoCash:0, saldoQris:0};
      const saldo = metode === 'QRIS' ? s.saldoQris : s.saldoCash;

      const ov = Pesanan._buatModal({
        title: (tipe === 'Tarik' ? 'Tarik' : 'Setor') + ' Saldo ' + metode,
        body: `
          <div style="font-size:12.5px;color:var(--ink-600);margin-bottom:10px;">
            Saldo saat ini: <strong style="color:var(--ink-900);">${rupiah(saldo)}</strong>
          </div>
          <div class="field-pes">
            <label>Jumlah</label>
            <input type="text" class="money" id="lmJml" inputmode="numeric" placeholder="0">
          </div>
          <div class="field-pes">
            <label>Tujuan</label>
            <select id="lmTujuan">
              <option value="Modal">Tambah Modal</option>
              <option value="Pribadi">Kebutuhan Pribadi</option>
              <option value="Darurat">Darurat</option>
              <option value="Lain-lain">Lain-lain</option>
            </select>
          </div>
          <div class="field-pes">
            <label>Catatan (opsional)</label>
            <input type="text" id="lmCatatan" placeholder="mis. tambah cabe">
          </div>`,
        confirmLabel: 'Simpan',
        onConfirm: async () => {
          const jumlah = Number(String(document.getElementById('lmJml').value).replace(/\D/g,'')) || 0;
          if(jumlah <= 0){ showToast('Isi jumlah'); return false; }
          const tujuan = document.getElementById('lmTujuan').value;
          const catatan = document.getElementById('lmCatatan').value.trim();
          const tanggal = todayYmd();

          /* Optimistic */
          const optimistic = {
            ID: 'm-opt-' + Date.now(),
            Tanggal: tanggal, Tipe: tipe, Metode: metode,
            Jumlah: jumlah, Tujuan: tujuan, Catatan: catatan,
            Sumber: 'Manual', Referensi: '', _optimistic: true
          };
          this.mutasiData = [optimistic, ...this.mutasiData];
          if(this.saldoData){
            const delta = tipe === 'Tarik' ? -jumlah : jumlah;
            if(metode === 'QRIS'){
              this.saldoData.saldoQris = (this.saldoData.saldoQris || 0) + delta;
            } else {
              this.saldoData.saldoCash = (this.saldoData.saldoCash || 0) + delta;
            }
            this.saldoData.total =
              (this.saldoData.saldoCash || 0) + (this.saldoData.saldoQris || 0);
          }
          this.renderSaldo();
          ov.remove();

          try{
            await SayurStorage.post('tambahMutasi', {
              id: 'm-' + Date.now(),
              tipe: tipe, metode: metode, jumlah: jumlah,
              tujuan: tujuan, catatan: catatan,
              sumber: 'Manual', tanggal: tanggal
            });
            showToast('✓ Mutasi tersimpan');
            setTimeout(() => this.loadSaldo(), 1500);
          }catch(e){
            showToast('Gagal: ' + e.message);
            this.mutasiData = this.mutasiData.filter(m => m.ID !== optimistic.ID);
            this.renderSaldo();
            return false;
          }
        },
        afterRender: () => {
          Pesanan._bindMoney('lmJml');
          setTimeout(() => {
            const inp = document.getElementById('lmJml');
            if(inp) inp.focus();
          }, 100);
        }
      });
    },

    async loadHutang(){
      try{
        const [list, ringkasan] = await Promise.all([
          SayurStorage.get('getHutang').catch(() => []),
          SayurStorage.get('getRingkasanHutang').catch(() => ({}))
        ]);
        this.hutangData = list || [];
        this.ringkasanHutang = ringkasan || {};
      }catch(e){
        this.hutangData = [];
        this.ringkasanHutang = {};
      }
      this.renderHutang();
    },

    renderHutang(){
      const el = document.getElementById('tabLapHutang');
      if(!el) return;

      const piutang = this.hutangData.filter(h => h.Tipe === 'PiutangSaya');
      const hutang = this.hutangData.filter(h => h.Tipe === 'HutangSaya');
      const piutangBon = piutang.filter(h => h.Sumber === 'Bon' || !h.Sumber);
      const piutangPesanan = piutang.filter(h => h.Sumber === 'Pesanan');
      const hutangSupplier = hutang.filter(h => h.Sumber === 'Supplier' || !h.Sumber);

      const totalBelum = list => list.filter(h => h.Status !== 'Lunas')
        .reduce((s,h) => s + (Number(h.Sisa) || 0), 0);
      const countBelum = list => list.filter(h => h.Status !== 'Lunas').length;

      const totalPiutang = totalBelum(piutang);
      const totalHutang = totalBelum(hutang);

      let html = '';
      html += `
        <div class="hutang-section-lap">
          <div class="hutang-total-box">
            <div>
              <div class="lbl blue">💰 Piutang Saya</div>
              <div class="amt" style="color:var(--blue-600);">${rupiah(totalPiutang)}</div>
            </div>
            <div class="sub">${countBelum(piutang)} belum lunas</div>
          </div>`;

      if(piutangBon.length){
        html += this.renderHutangSection('📝 Bon Lisan', piutangBon, 'blue');
      }
      if(piutangPesanan.length){
        html += this.renderHutangSection('📦 Pesanan', piutangPesanan, 'blue');
      }
      html += `</div>`;

      html += `
        <div class="hutang-section-lap">
          <div class="hutang-total-box rust">
            <div>
              <div class="lbl rust">💸 Hutang Saya</div>
              <div class="amt" style="color:var(--rust-700);">${rupiah(totalHutang)}</div>
            </div>
            <div class="sub">${countBelum(hutang)} belum lunas</div>
          </div>`;

      if(hutangSupplier.length){
        html += this.renderHutangSection('🏪 Supplier', hutangSupplier, 'rust');
      }
      html += `</div>`;

      el.innerHTML = html;
      this.attachHutangHandlers();
    },

    renderHutangSection(title, list, colorClass){
      const total = list.filter(h => h.Status !== 'Lunas')
        .reduce((s,h) => s + (Number(h.Sisa) || 0), 0);
      return `
        <div class="hutang-section-head">
          <span class="ttl">${title}</span>
          <span class="total ${colorClass}">${rupiah(total)}</span>
        </div>
        ${list.map(h => this.renderHutangCard(h)).join('')}`;

    renderHutangCard(h){

      return `
        <div class="hutang-card-lap ${isPiutang ? 'piutang' : ''} ${isLunas ? 'lunas' : ''}"
             data-id="${escHtml(h.ID)}">
          <div class="head">
            <div style="min-width:0;flex:1;">
              <div class="nm">${escHtml(h.Nama)}</div>
              <div class="tgl">${escHtml(tglFmt)}</div>
            </div>
            <span class="badge ${badgeCls}">${badgeLabel}</span>
            <span class="arrow">›</span>
          </div>
          <div class="row">
            <span>Total: <strong>${rupiah(h.JumlahAwal)}</strong></span>
            <span>Dibayar: <strong>${rupiah(h.JumlahDibayar)}</strong></span>
          </div>
          <div class="sisa-row">
            <span class="lbl">${isLunas ? 'Status' : 'Sisa'}</span>
            <span class="val" style="${isLunas?'color:var(--green-700);':''}">
              ${isLunas ? '✓ Lunas' : rupiah(sisa)}
            </span>
          </div>
        </div>`;
    },

    attachHutangHandlers(){
      document.querySelectorAll('#tabLapHutang .hutang-card-lap').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          const h = this.hutangData.find(x => x.ID === id);
          if(h) this.openHutangDetail(h);

      });
    },

    openHutangDetail(h){

      const sisa = Number(h.Sisa) || 0;
      const isLunas = h.Status === 'Lunas';

        <div style="background:var(--paper);border-radius:var(--r-sm);
