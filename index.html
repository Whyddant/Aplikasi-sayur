      if(!p) return;
      var sisa = Number(p.Sisa) || 0;
      var total = Number(p.Total) || 0;
      var dibayar = Number(p.Dibayar) || 0;

      var ov = openDynamicSheet({
        title: 'Catat Pembayaran',
        body:
          '<div class="bayar-info-box">' +
            '<div class="row"><span class="lbl">Total</span>' +
              '<span class="amt">' + rp(total) + '</span></div>' +
            '<div class="row"><span class="lbl">Dibayar</span>' +
              '<span class="amt" style="color:var(--pos)">' + rp(dibayar) + '</span></div>' +
            '<div class="row total"><span class="lbl">Sisa</span>' +
              '<span class="amt" style="color:var(--danger)">' + rp(sisa) + '</span></div>' +
          '</div>' +
          '<button type="button" class="btn-lunas-cepat" id="pm_lunas">' +
            '✓ LUNAS — ' + rp(sisa) + '</button>' +
          '<div class="divider-atau"><span class="line"></span>' +
            '<span class="txt">atau sebagian</span><span class="line"></span></div>' +
          '<div class="field"><label>Jumlah Dibayar</label>' +
            rpFieldHtml('pm_jml') + '</div>' +
          '<div class="pm-info" id="pm_info"></div>' +
          '<div class="field"><label>Metode</label>' +
            '<select id="pm_metode">' +
              '<option value="Cash">Cash</option><option value="QRIS">QRIS</option>' +
            '</select></div>' +
          '<div class="field"><label>Tanggal</label>' +
            '<input type="date" id="pm_tgl" value="' + todayYmd() + '"></div>' +
          '<div class="field"><label>Catatan</label>' +
            '<input type="text" id="pm_ket" placeholder="Tambahkan catatan"></div>',
        actions:
          '<button class="btn btn-primary" id="pm_save">Simpan</button>' +
          '<button class="btn btn-ghost" data-close>Batal</button>',
        afterRender: function(){
          bindMoneyInput('pm_jml');
          var inp = $('pm_jml');
          if(inp) inp.addEventListener('input', updateInfo);
        }
      });

      function updateInfo(){
        var info = $('pm_info');
        if(!info) return;
        var n = digits($('pm_jml').value);
        if(n <= 0){ info.className = 'pm-info'; info.textContent = ''; return; }
        if(n === sisa){
          info.className = 'pm-info ok show'; info.textContent = '✓ Sesuai sisa';
        } else if(n > sisa){
          var sel = n - sisa;
          if(sel > self.TOLERANSI_SELISIH){
            info.className = 'pm-info danger show';
            info.textContent = '⚠ Kelebihan ' + rp(sel) +
              ' — maksimal ' + rp(sisa + self.TOLERANSI_SELISIH);
          } else {
            info.className = 'pm-info warn show';
            info.textContent = 'Lebih ' + rp(sel) + ' — nanti ditanya kembalian?';
          }
        } else {
          var kurang = sisa - n;
          if(kurang > self.TOLERANSI_SELISIH){
            info.className = 'pm-info info show';
            info.textContent = 'DP — sisa ' + rp(kurang);
          } else {
            info.className = 'pm-info warn show';
            info.textContent = 'Kurang ' + rp(kurang) + ' — nanti ditanya lunas / DP?';
          }
        }
      }

      async function simpan(jumlah, catatan){
        try{
          await SayurStorage.post('addPembayaranPesanan', {
            id: 'pp-' + Date.now(), pesananId: p.ID, jumlah: jumlah,
            metode: $('pm_metode').value, catatan: catatan || '',
            tanggal: $('pm_tgl').value || todayYmd()
          });
          if(p.Status !== 'selesai'){
            await SayurStorage.post('tambahMutasi', {
              id: 'm-pes-' + Date.now(),
              tipe: 'Setor', metode: $('pm_metode').value, jumlah: jumlah,
              tujuan: 'Pesanan',
              catatan: 'Pembayaran pesanan: ' + p.Nama,
              sumber: 'Pesanan', referensi: p.ID,
              tanggal: $('pm_tgl').value || todayYmd()
            });
          }
          toast('✓ Tersimpan');
          closeDynamicSheet(ov);
          await self.loadList();
          await self.loadPiutang();
          self.render();
        }catch(e){ toast('Gagal: ' + e.message); }
      }

      function konfirmasiAksi(opts){
        closeDynamicSheet(ov);
        setTimeout(function(){
          var sub = openDynamicSheet({
            title: opts.judul,
            sub: opts.pesan,
            body: '',
            actions:
              '<button class="btn btn-primary" id="ka_a">' + opts.labelA + '</button>' +
              '<button class="btn btn-secondary" id="ka_b">' + opts.labelB + '</button>' +
              '<button class="btn btn-ghost" data-close>Batal</button>'
          });
          $('ka_a').addEventListener('click', function(){
            closeDynamicSheet(sub); opts.onA();
          });
          $('ka_b').addEventListener('click', function(){
            closeDynamicSheet(sub); opts.onB();
          });
        }, 120);
      }

      $('pm_lunas').addEventListener('click', function(){ simpan(sisa, 'Lunas'); });
      $('pm_save').addEventListener('click', function(){
        var n = digits($('pm_jml').value);
        if(n <= 0){ toast('Isi jumlah'); return; }
        var catatan = $('pm_ket').value.trim();

        if(n === sisa){ simpan(n, catatan || 'Lunas'); return; }
        if(n > sisa){
          var sel = n - sisa;
          if(sel > self.TOLERANSI_SELISIH){
            toast('Kelebihan terlalu besar (maks ' +
              rp(self.TOLERANSI_SELISIH) + ')'); return;
          }
          konfirmasiAksi({
            judul: 'Bayar Lebih',
            pesan: 'Jumlah melebihi sisa ' + rp(sel) +
              '. Bagaimana mencatatnya?',
            labelA: 'Lunas (kembalian ' + rp(sel) + ')',
            labelB: 'Simpan ' + rp(n),
            onA: function(){ simpan(sisa, catatan || 'Lunas'); },
            onB: function(){ simpan(n, catatan || 'Kelebihan'); }
          });
          return;
        }
        var kurang = sisa - n;
        if(kurang > self.TOLERANSI_SELISIH){
          simpan(n, catatan || 'DP'); return;
        }
        konfirmasiAksi({
          judul: 'Bayar Kurang',
          pesan: 'Jumlah kurang ' + rp(kurang) +
            ' dari sisa. Bagaimana mencatatnya?',
          labelA: 'Lunas (kurang ' + rp(kurang) + ' diikhlaskan)',
          labelB: 'Simpan DP (sisa ' + rp(kurang) + ')',
          onA: function(){ simpan(sisa, catatan || 'Lunas (kurang diikhlaskan)'); },
          onB: function(){ simpan(n, catatan || 'DP'); }
        });
      });
    },

    openNotaSheet(){
      var self = this;
      var p = this.list.find(function(x){ return x.ID === self.currentId; });
      if(p) NotaKit.open(NotaKit.fromPesanan(p));
    },

    async hapusPesanan(){
      var self = this;
      var p = this.list.find(function(x){ return x.ID === self.currentId; });
      if(!p) return;
      if((p.Pembayaran || []).length > 0){
        toast('Tidak bisa hapus: ada pembayaran'); return;
      }
      if(!confirm('Hapus pesanan ' + p.Nama + '?')) return;
      try{
        await SayurStorage.post('deletePesanan', {id: p.ID});
        toast('✓ Dihapus');
        this.currentId = null;
        await this.loadList();
        this.render();
      }catch(e){ toast('Gagal: ' + e.message); }
    }
  };

  /* ==========================================================
     NOTA MODULE
     ========================================================== */
  function emptyNotaDraft(){ return {tanggal: todayYmd(), nama: '', noHP: '', dibayar: 0, items: []}; }

  var NotaModule = {
    list: [],
    view: 'list',
    filterRiwayat: 'all', openIdx: -1, q: '',
    masterBarang: [],
    draft: emptyNotaDraft(),

    async load(){
      await this.loadMaster();
      await this.loadList();
      if(!this.draft || !this.draft.items.length){
        this.view = 'list';
      }
      this.render();
    },

    async loadMaster(){
      /* Satu sumber harga: baca langsung dari MASTER (dikelola di tab Rencana),
         bukan fetch terpisah dan bukan cache sendiri, supaya pencarian barang
         selalu pakai harga beli/jual terbaru. */
      try{
        this.masterBarang = Object.keys(MASTER).map(function(n){
          var m = MASTER[n] || {};
          return {
            nama: n, satuan: m.satuan || 'kg',
            hargaBeli: Number(m.beli) || 0, hargaJual: Number(m.jual) || 0
          };
        }).sort(function(a, b){ return a.nama.localeCompare(b.nama, 'id'); });
      }catch(e){ this.masterBarang = []; }
    },

    async loadList(){
      try{
        var list = await SayurStorage.get('getNotaList', {limit: 100});
        this.list = list || [];
      }catch(e){ this.list = []; }
    },

    hitungHargaJual(modal){
      if(!modal || modal <= 0) return 0;
      var rate;
      if(modal <= 5000) rate = 1.00;
      else if(modal <= 10000) rate = 1.00 + (0.50 - 1.00) * ((modal - 5000) / 5000);
      else if(modal <= 30000) rate = 0.50 + (0.30 - 0.50) * ((modal - 10000) / 20000);
      else if(modal <= 100000) rate = 0.30 + (0.15 - 0.30) * ((modal - 30000) / 70000);
      else rate = 0.15;
      var raw = modal * (1 + rate);
      if(modal <= 30000) return Math.round(raw / 1000) * 1000;
      return Math.ceil(raw / 5000) * 5000;
    },

    parseQty: function(q){
      return Number(String(q || '').replace(/[^\d.]/g, '')) || 0;
    },

    totalDraft(){
      var self = this;
      return this.draft.items.reduce(function(s, it){
        return s + self.parseQty(it.qty) * (Number(it.hargaJual) || 0);
      }, 0);
    },

    statusNota(n){
      var total = Number(n.Total) || 0;
      if(!total && (n.Items || []).length){
        total = (n.Items || []).reduce(function(s, it){
          return s + (Number(it.Subtotal) ||
            (Number(it.Qty) * Number(it.HargaJual)));
        }, 0);
      }
      var dibayar = Number(n.Dibayar) || 0;
      var sisa = Math.max(0, total - dibayar);
      return { total: total, dibayar: dibayar, sisa: sisa, lunas: sisa <= 0 };
    },

    render(){
      kpClose();
      var el = $('tabNota');
      if(!el) return;
      el.innerHTML = (this.view === 'form')
        ? this.renderForm()
        : this.renderList();
      this.attachHandlers();
    },

    renderList(){
      var self = this;
      var html = FormKit.searchBar('nlSearch', 'Cari nota', '+ Nota', true);

      html += '<div class="fk-chips">';
      [['all','Semua'],['kurang','Kurang'],['lunas','Lunas']].forEach(function(f){
        var on = self.filterRiwayat === f[0];
        html += '<button class="fbtn ' + (on ? 'on' : '') +
          '" data-nota-filter="' + f[0] + '">' + f[1] + '</button>';
      });
      html += '</div>';

      var filtered = this.list;
      if(this.filterRiwayat === 'kurang'){
        filtered = this.list.filter(function(n){ return n.Status !== 'Lunas'; });
      } else if(this.filterRiwayat === 'lunas'){
        filtered = this.list.filter(function(n){ return n.Status === 'Lunas'; });
      }

      if(!filtered.length){
        html += '<div class="nota-kosong">' +
          '<b>Belum ada nota</b>' +
          'Nota mandiri tidak butuh pesanan. Tekan + Nota untuk membuat langsung.</div>';
        return html;
      }

      var sorted = filtered.slice().sort(function(a, b){
        return String(b.Tanggal).localeCompare(String(a.Tanggal));
      });

      html += '<div class="pesanan-list">';
      html += sorted.map(function(n){ return self.renderKartu(n); }).join('');
      html += '</div>';
      return html;
    },

    renderKartu(n){
      var st = this.statusNota(n);
      var items = n.Items || [];
      var nmDisplay = n.Nama
        ? escHtml(n.Nama)
        : '<span style="color:var(--text-3);font-style:italic;">Tanpa nama</span>';
      var preview = items.map(function(it){ return it.NamaBarang; })
        .slice(0, 2).join(', ') + (items.length > 2 ? '…' : '');

      return '<div class="order-card" data-nota-id="' + escHtml(n.ID) + '" data-q="' +
        escHtml((String(n.Nama || '') + ' ' + String(n.NoHP || '') + ' ' +
          items.map(function(it){ return it.NamaBarang; }).join(' ')).toLowerCase()) + '">' +
        '<div class="order-head">' +
          '<div style="min-width:0;flex:1;">' +
            '<div class="order-name">' + nmDisplay + '</div>' +
            '<div class="order-meta">' +
              '<span>' + escHtml(fmtTglPendek(n.Tanggal)) + '</span>' +
              '<span>·</span>' +
              '<span>' + items.length + ' item</span>' +
              (n.NoHP ? '<span>·</span><span>📱 ' +
                escHtml(n.NoHP) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<span class="order-badge ' +
            (st.lunas ? 'selesai' : 'belum_lunas') + '">' +
            (st.lunas ? '✓ Lunas' : 'Kurang') + '</span>' +
        '</div>' +
        (preview ? '<div style="font-size:var(--fs-xs);color:var(--text-3);' +
          'margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;' +
          'white-space:nowrap;">' + escHtml(preview) + '</div>' : '') +
        '<div class="order-summary">' +
          '<span>Total ' + rp(st.total) + '</span>' +
          '<span class="os-right"><b class="' + (st.lunas ? 'paid' : '') + '">' +
            (st.lunas ? '✓ Lunas' : 'Sisa ' + rp(st.sisa)) + '</b>' + SHARE_BTN + '</span>' +
        '</div>' +
      '</div>';
    },

    renderForm(){
      var d = this.draft;
      var total = this.totalDraft();
      var sisa = Math.max(0, total - d.dibayar);
      var lunas = sisa <= 0 && total > 0;

      var html = FormKit.formHead('btnNotaFormBack', 'Buat Nota Baru', 'Nota mandiri') +
        FormKit.pemesanCard(d, 'nf', {}) +
        FormKit.searchBar('nfSearch', 'Cari barang', '+ Tambah') +
        '<div class="item-list fk-items" id="nfItems">' + FormKit.itemsHtml(d.items, this.openIdx, false) + '</div>';

      if(d.items.length){
        html += '<div class="fk-page">' +
          '<div class="fm-card">' +
            '<div class="nf-sum-row"><span style="color:var(--text-2);">Total</span>' +
              '<span class="v" id="notaTotal">' + rp(total) + '</span></div>' +
            '<div class="df" style="margin-top:10px;">' +
              '<span class="df-label">Dibayar</span>' +
              '<div class="rp-field lg"><span class="rp-pre">Rp</span>' +
                '<input type="text" inputmode="none" readonly data-kp="1" id="notaDibayar" value="' +
                  (d.dibayar ? d.dibayar.toLocaleString('id-ID') : '') + '" placeholder="0"></div>' +
            '</div>' +
            '<div class="nf-quick">' +
              '<button type="button" data-quick-dibayar="full">Lunas</button>' +
              '<button type="button" data-quick-dibayar="half">Setengah</button>' +
              '<button type="button" data-quick-dibayar="kosong">Kosongkan</button>' +
            '</div>' +
            '<div class="nf-sum-row" style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);">' +
              '<span id="notaStatusLbl" style="font-weight:600;color:var(--text-2);">' +
                (lunas ? 'Status' : 'Kurang') + '</span>' +
              '<span class="v" id="notaStatusVal" style="color:' +
                (lunas ? 'var(--pos)' : 'var(--danger)') + ';">' +
                (lunas ? '✓ Lunas' : rp(sisa)) + '</span>' +
            '</div>' +
          '</div>' +
          '<button class="btn btn-primary" id="btnNotaSimpan" type="button">Simpan</button>' +
          '<button class="btn btn-ghost" id="btnNotaReset" type="button">Kosongkan Form</button>' +
        '</div>';
      }
      return html;
    },

    refreshForm(){
      var total = this.totalDraft();
      var sisa = Math.max(0, total - this.draft.dibayar);
      var lunas = sisa <= 0 && total > 0;
      var t = $('notaTotal'); if(t) t.textContent = rp(total);
      var l = $('notaStatusLbl'); if(l) l.textContent = lunas ? 'Status' : 'Kurang';
      var v = $('notaStatusVal');
      if(v){
        v.textContent = lunas ? '✓ Lunas' : rp(sisa);
        v.style.color = lunas ? 'var(--pos)' : 'var(--danger)';
      }
    },

    attachHandlers(){
      var self = this;
      if(this.view === 'form'){ this.attachForm(); return; }

      FormKit.bindSearch('nlSearch', {
        initial: this.q,
        onFilter: function(q){
          self.q = q;
          document.querySelectorAll('#tabNota .order-card[data-q]').forEach(function(c){
            c.hidden = !!q && c.dataset.q.indexOf(q) === -1;
          });
        },
        onAdd: function(){
          self.view = 'form';
          self.draft = emptyNotaDraft();
          self.openIdx = -1;
          self.render();
          window.scrollTo(0, 0);
        }
      });
      document.querySelectorAll('#tabNota [data-nota-filter]').forEach(function(b){
        b.addEventListener('click', function(){
          self.filterRiwayat = b.dataset.notaFilter;
          self.render();
        });
      });
      document.querySelectorAll('#tabNota .oc-share').forEach(function(btn){
        btn.addEventListener('click', function(ev){
          ev.stopPropagation();
          var id = btn.closest('.order-card').dataset.notaId;
          var n = self.list.find(function(x){ return String(x.ID) === String(id); });
          if(n) NotaKit.open(NotaKit.fromNota(n));
        });
      });
      document.querySelectorAll('#tabNota [data-nota-id]').forEach(function(card){
        card.addEventListener('click', function(){
          self.openDetail(card.dataset.notaId);
        });
      });
    },

    attachForm(){
      var self = this, d = this.draft;
      $('btnNotaFormBack').addEventListener('click', function(){
        if(d.items.length > 0){
          if(!confirm('Ada nota yang belum disimpan. Keluar?')) return;
        }
        self.view = 'list';
        self.draft = emptyNotaDraft();
        self.render();
      });
      FormKit.bindPemesan('nf', d, {});
      FormKit.bindSearch('nfSearch', {
        source: function(){ return self.masterBarang; },
        hargaDefault: function(m){ return self.hitungHargaJual(m.hargaBeli); },
        onPick: function(m){
          var ada = d.items.findIndex(function(it){ return it.namaBarang.toLowerCase() === m.nama.toLowerCase(); });
          if(ada !== -1){ self.openIdx = ada; self.render(); toast(m.nama + ' sudah ada, ubah qty'); return; }
          d.items.push({namaBarang: m.nama, satuan: m.satuan, qty: '1',
            hargaJual: m.hargaJual || self.hitungHargaJual(m.hargaBeli)});
          self.openIdx = d.items.length - 1;
          self.render();
          toast(m.nama + ' ditambahkan');
        },
        onNew: function(nama){
          FormKit.openItemSheet({
            title: 'Tambah Barang Baru', withBeli: false, prefill: {nama: nama}, saveLabel: 'Tambah',
            onSave: function(it){
              self.masterBarang.push({nama: it.namaBarang, satuan: it.satuan,
                hargaBeli: 0, hargaJual: it.hargaJual});
              d.items.push({namaBarang: it.namaBarang, satuan: it.satuan,
                qty: String(it.qty), hargaJual: it.hargaJual});
              self.openIdx = -1;
              self.render();
              toast(it.namaBarang + ' ditambahkan');
            }
          });
        }
      });
      var root = $('nfItems');
      FormKit.bindItems(root, d.items, {
        onChange: function(){ self.refreshForm(); },
        onDelete: function(i){ d.items.splice(i, 1); self.openIdx = -1; self.render(); },
        onToggle: function(i){
          self.openIdx = (self.openIdx === i) ? -1 : i;
          FormKit.applyOpen(root, self.openIdx);
        }
      });

      var inpDibayar = $('notaDibayar');
      if(inpDibayar){
        inpDibayar.addEventListener('input', function(){
          var n = digits(inpDibayar.value);
          d.dibayar = n;
          inpDibayar.value = n ? n.toLocaleString('id-ID') : '';
          self.refreshForm();
        });
      }
      document.querySelectorAll('#tabNota [data-quick-dibayar]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var q = btn.dataset.quickDibayar;
          var total = self.totalDraft();
          if(q === 'full') d.dibayar = total;
          if(q === 'half') d.dibayar = Math.round(total / 2);
          if(q === 'kosong') d.dibayar = 0;
          self.render();
        });
      });
      var btnSimpan = $('btnNotaSimpan');
      if(btnSimpan) btnSimpan.addEventListener('click', function(){ self.simpan(); });
      var btnReset = $('btnNotaReset');
      if(btnReset) btnReset.addEventListener('click', function(){
        if(!confirm('Kosongkan form nota?')) return;
        self.draft = emptyNotaDraft();
        self.openIdx = -1;
        self.render();
      });
    },

    async simpan(){
      var self = this;
      if(!this.draft.items.length){ toast('Tambah barang dulu'); return; }

      var notaId = 'n-' + Date.now();
      var total = this.totalDraft();
      var sisa = Math.max(0, total - this.draft.dibayar);

      var payload = {
        id: notaId,
        tanggal: this.draft.tanggal || todayYmd(),
        nama: this.draft.nama || '',
        noHP: this.draft.noHP || '',
        dibayar: this.draft.dibayar,
        items: this.draft.items.map(function(it){
          return {
            namaBarang: it.namaBarang,
            qty: it.qty,
            satuan: it.satuan,
            hargaJual: Number(it.hargaJual) || 0
          };
        })
      };

      try{
        await SayurStorage.post('addNota', payload);
      }catch(e){ console.warn('Gagal kirim nota:', e); }

      var nota = {
        ID: notaId,
        Tanggal: this.draft.tanggal || todayYmd(),
        Nama: this.draft.nama || '',
        NoHP: this.draft.noHP || '',
        Total: total,
        Dibayar: this.draft.dibayar,
        Sisa: sisa,
        Status: sisa <= 0 ? 'Lunas' : 'Kurang',
        Items: this.draft.items.map(function(it){
          return {
            NamaBarang: it.namaBarang,
            Qty: it.qty, Satuan: it.satuan,
            HargaJual: Number(it.hargaJual),
            Subtotal: self.parseQty(it.qty) * (Number(it.hargaJual) || 0)
          };
        })
      };

      this.draft = emptyNotaDraft();
      this.view = 'list';
      await this.loadList();
      this.render();
      this.openShareModal(nota);
    },

    openShareModal(nota){
      NotaKit.open(NotaKit.fromNota(nota), {saved: true});
    },

    async openDetail(id){
      var self = this;
      var nota = this.list.find(function(x){ return x.ID === id; });
      if(!nota){
        try{ nota = await SayurStorage.get('getNota', {id: id}); }
        catch(e){}
      }
      if(!nota){ toast('Nota tidak ditemukan'); return; }

      var st = this.statusNota(nota);
      var items = nota.Items || [];
      var itemsHtml = items.map(function(it){
        return '<div style="display:flex;justify-content:space-between;' +
          'padding:7px 0;border-bottom:1px solid var(--line-soft);' +
          'font-size:var(--fs-sm);">' +
          '<div style="min-width:0;flex:1;">' +
            '<div style="font-weight:600;">' + escHtml(it.NamaBarang) + '</div>' +
            '<div style="font-size:var(--fs-xs);color:var(--text-2);' +
              'margin-top:2px;">' +
              escHtml(it.Qty) + ' ' + escHtml(it.Satuan) +
              ' × ' + rp(it.HargaJual) + '</div>' +
          '</div>' +
          '<div style="font-weight:700;">' +
            rp(it.Subtotal || (it.Qty * it.HargaJual)) + '</div>' +
        '</div>';
      }).join('');

      var ov = openDynamicSheet({
        title: 'Detail Nota',
        sub: nota.Nama ? escHtml(nota.Nama) : 'Tanpa nama',
        body:
          '<div style="background:var(--bg);border-radius:var(--r-sm);' +
            'padding:12px 14px;margin-bottom:12px;font-size:var(--fs-sm);">' +
            '<div style="display:flex;justify-content:space-between;' +
              'padding:2px 0;"><span style="color:var(--text-2);">Tanggal</span>' +
              '<span style="font-weight:600;">' +
                escHtml(fmtTglPendek(nota.Tanggal)) + '</span></div>' +
            (nota.NoHP ? '<div style="display:flex;justify-content:space-between;' +
              'padding:2px 0;"><span style="color:var(--text-2);">No HP</span>' +
              '<span style="font-weight:600;">' + escHtml(nota.NoHP) +
              '</span></div>' : '') +
          '</div>' +
          '<div style="font-size:11px;font-weight:700;color:var(--text-3);' +
            'text-transform:uppercase;letter-spacing:.5px;' +
            'margin-bottom:6px;">Barang</div>' +
          '<div style="margin-bottom:14px;">' + itemsHtml + '</div>' +
          '<div style="background:var(--bg);border-radius:var(--r-sm);' +
            'padding:12px 14px;font-size:var(--fs-sm);">' +
            '<div style="display:flex;justify-content:space-between;' +
              'padding:3px 0;"><span style="color:var(--text-2);">Total</span>' +
              '<span style="font-weight:700;">' + rp(st.total) + '</span></div>' +
            '<div style="display:flex;justify-content:space-between;' +
              'padding:3px 0;"><span style="color:var(--text-2);">Dibayar</span>' +
              '<span style="font-weight:700;color:var(--pos);">' +
              rp(st.dibayar) + '</span></div>' +
            '<div style="display:flex;justify-content:space-between;' +
              'padding:6px 0 2px;border-top:1px dashed var(--line);' +
              'margin-top:6px;"><span style="font-weight:700;">' +
              (st.lunas ? 'Status' : 'Sisa') + '</span>' +
              '<span style="font-weight:700;font-size:var(--fs-md);' +
              'color:' + (st.lunas ? 'var(--pos)' : 'var(--danger)') + ';">' +
              (st.lunas ? '✓ Lunas' : rp(st.sisa)) + '</span></div>' +
          '</div>' +
          '',
        actions:
          '<button class="btn btn-primary" id="notaDetailShare">Bagikan Nota</button>' +
          (st.lunas ? '' :
            '<button class="btn btn-secondary" id="notaTandaiLunas">' +
            'Tandai Lunas</button>') +
          '<button class="btn btn-ghost" data-close>Tutup</button>',
        afterRender: function(){
          var btnShare = $('notaDetailShare');
          if(btnShare) btnShare.addEventListener('click', function(){
            NotaKit.open(NotaKit.fromNota(nota));
          });
          var btnLunas = $('notaTandaiLunas');
          if(btnLunas) btnLunas.addEventListener('click', async function(){
            try{
              await SayurStorage.post('tandaiLunasNota', {id: id});
              toast('✓ Nota ditandai lunas');
              closeDynamicSheet(ov);
              await self.loadList();
              self.render();
            }catch(e){ toast('Gagal: ' + e.message); }
          });
        }
      });
    }
  };

  /* ==========================================================
     SUB-TAB SWITCHER
     ========================================================== */
  var currentSubTab = 'rencana';
  function switchSubTab(tab){
    if(!tab) tab = 'rencana';
    currentSubTab = tab;

    var subtabsEl = $('belSubtabs');
    if(subtabsEl){
      Array.prototype.forEach.call(subtabsEl.querySelectorAll('button'), function(btn){
        btn.classList.toggle('on', btn.dataset.beltab === tab);
      });
    }
    document.body.dataset.beltab = tab;

    var rc = $('tabRencana'), ps = $('tabPesanan'), nt = $('tabNota');
    if(rc) rc.classList.toggle('on', tab === 'rencana');
    if(ps) ps.classList.toggle('on', tab === 'pesanan');
    if(nt) nt.classList.toggle('on', tab === 'nota');

    updateShareBtn();
    if(tab === 'pesanan') PesananModule.load();
    else if(tab === 'nota') NotaModule.load();

    window.scrollTo(0, 0);
  }

  /* ==========================================================
     INIT
     ========================================================== */
  function init(){
    try{
      $('topbarDate').textContent = new Date().toLocaleDateString('id-ID',
        {weekday: 'long', day: 'numeric', month: 'long'});
    }catch(e){}

    SayurStorage.pengaturan.get().then(function(set){
      if(set) SETTINGS = Object.assign(SETTINGS, set);
      if(SETTINGS.NamaLapak) $('topbarTitle').textContent = SETTINGS.NamaLapak;
      if(set && set.SusutRate) SUSUT_RATE = Number(set.SusutRate) || 0.30;
    }).catch(function(){});

    applyDarkMode(document.documentElement.classList.contains('dark'), false);
    updateStatus();

    /* Sub-tab handler */
    var subtabsEl = $('belSubtabs');
    if(subtabsEl){
      Array.prototype.forEach.call(subtabsEl.querySelectorAll('button'), function(btn){
        btn.addEventListener('click', function(){
          switchSubTab(btn.dataset.beltab);
        });
      });
    }
    document.body.dataset.beltab = 'rencana';

    loadMaster().then(function(){
      load();
      /* Barang yang tidak dicentang tidak menyimpan nilai lama; default diambil ulang dari belanja terakhir */
      Object.keys(state.items).forEach(function(n){
        var d = state.items[n];
        if(!d.chk){ d.qty = 0; d.beli = 0; d.jual = 0; }
      });
      SET_KEYS.forEach(function(k){ $(k).value = fmtNum(state.set[k]); });
      render();
      updateFab();
      renderAvail();
      applyFocusFromUrl();

      /* Baca ?tab=pesanan / ?tab=nota dari URL */
      try{
        var qs = new URLSearchParams(Router.search());
        var tab = qs.get('tab');
        if(tab === 'pesanan' || tab === 'nota'){
          switchSubTab(tab);
        }
      }catch(e){}
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

}};

Pages.tutup = {title: 'Tutup Hari — H. Mawih Sayur', run: function(){

(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  var HAS_SERVER = (typeof window.SayurStorage !== 'undefined');
  if(!HAS_SERVER){
    window.SayurStorage = {
      init: function(){},
      get: function(){ return Promise.resolve(null); },
      post: function(){ return Promise.resolve(null); },
      cache: { load: function(){ return null; }, save: function(){} },
      queue: { list: function(){ return []; }, remove: function(){}, resetFailed: function(){}, failedCount: function(){ return 0; } },
      processQueue: function(){ return Promise.resolve({skipped:true}); },
      discardFailed: function(){},
      pengaturan: { get: function(){ return Promise.resolve({}); } }
    };
  } else {
    try{ SayurStorage.init(); }catch(e){}
  }

  var STORE_FINAL    = 'sayur_tutup_final_';
  var STORE_DRAFT    = 'sayur_tutup_draft_';
  var STORE_LAPORAN  = 'mawih_laporan_v2';
  var STORE_BELANJA  = 'mawih_belanja_v2';
  var STORE_BELANJA_OLD = 'sayur_belanja_biaya_';

  function rp(n){ return 'Rp' + Math.abs(Math.round(n || 0)).toLocaleString('id-ID'); }
  function digits(s){ return parseInt(String(s || '').replace(/\D/g, ''), 10) || 0; }
  function fmtNum(n){ return n ? n.toLocaleString('id-ID') : ''; }
  function ymd(d){
    var p = function(x){ return String(x).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function todayYmd(){ return ymd(new Date()); }
  function fmtTglPendek(ymdStr){
    if(!ymdStr) return '';
    var p = ymdStr.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('id-ID',
      { day: 'numeric', month: 'short' });
  }
  function escHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  var state = {
    tanggal: todayYmd(),
    mode: 'baru',
    omzetCash: 0,
    omzetQris: 0,
    pagi: { kk: 0, iuran: 0, konsumsi: 0 },
    bon: [],
    opsPasar: 0,
    bensin: 0,
    lainBelanja: 0,
    modalBelanja: 0,
    savedCosts: false,
    biayaUsaha: []
  };

  function totalPagi(){ return state.pagi.kk + state.pagi.iuran + state.pagi.konsumsi; }
  function totalBon(){ return state.bon.reduce(function(s, b){ return s + (Number(b.jumlah) || 0); }, 0); }
  function totalPendapatanKotor(){ return state.omzetCash + state.omzetQris + totalPagi() + totalBon(); }
  function totalPendapatanDiterima(){ return state.omzetCash + state.omzetQris; }
  function totalOperasionalBelanja(){
    return state.modalBelanja + state.opsPasar + state.bensin + state.lainBelanja;
  }
  function totalBiayaUsaha(){
    return state.biayaUsaha.reduce(function(s, x){ return s + (Number(x.jumlah) || 0); }, 0);
  }
  function totalBiayaKeseluruhan(){ return totalOperasionalBelanja() + totalBiayaUsaha(); }
  function labaBersih(){ return totalPendapatanDiterima() - totalBiayaKeseluruhan(); }

  function bacaBelanja(tgl){
    try{
      var raw = localStorage.getItem(STORE_BELANJA);
      if(raw){
        var s = JSON.parse(raw);
        var items = s.items || {};
        var modal = 0;
        Object.keys(items).forEach(function(n){
          var d = items[n];
          if(!d || !d.chk) return;
          if(d.nanti) return;
          var qty = parseFloat(String(d.qty || '0').replace(',', '.')) || 0;
          modal += qty * (Number(d.beli) || 0);
        });
        return {
          modalBelanja: modal,
          opsPasar: Number(s.set && s.set.ops) || 0,
          bensin: Number(s.set && s.set.biayaBensin) || 0,
          lainBelanja: Number(s.set && s.set.biayaLain) || 0,
          sumber: 'belanja-v2'
        };
      }
    }catch(e){}
    try{
      var raw2 = localStorage.getItem(STORE_BELANJA_OLD + tgl);
      if(raw2){
        var b = JSON.parse(raw2);
        return {
          modalBelanja: Number(b.modalBelanja) || 0,
          opsPasar: Number(b.opsPasar) || 0,
          bensin: Number(b.bensin) || 0,
          lainBelanja: Number(b.konsumsiPasar) || 0,
          sumber: 'belanja-v1'
        };
      }
    }catch(e){}
    return { modalBelanja: 0, opsPasar: 0, bensin: 0, lainBelanja: 0, sumber: 'kosong' };
  }

  function refreshFromBelanja(){
    /* Biaya belanja yang sudah tersimpan di catatan hari itu tidak ditimpa rencana belanja hari ini */
    if(state.savedCosts && (state.mode === 'final' || state.tanggal !== todayYmd())) return;
    var bel = bacaBelanja(state.tanggal);
    state.modalBelanja = bel.modalBelanja;
    state.opsPasar = bel.opsPasar;
    state.bensin = bel.bensin;
    state.lainBelanja = bel.lainBelanja;
  }

  function bacaLaporan(){
    try{
      var raw = localStorage.getItem(STORE_LAPORAN);
      if(raw){
        var L = JSON.parse(raw);
        return { tunai: Number(L.tunai) || 0, qris: Number(L.qris) || 0 };
      }
    }catch(e){}
    return { tunai: 0, qris: 0 };
  }

  function readJSON(key){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function loadLocal(){
    state.savedCosts = false;
    var final = readJSON(STORE_FINAL + state.tanggal);
    if(final){
      normalize(final);
      state.mode = 'final';
      refreshFromBelanja();
      return;
    }
    var draft = readJSON(STORE_DRAFT + state.tanggal);
    if(draft){
      normalize(draft);
      state.mode = 'draft';
      refreshFromBelanja();
      return;
    }
    state.mode = 'baru';
    var lap = bacaLaporan();
    if(!lap.tunai && !lap.qris){
      state.omzetCash = 2480000;
      state.omzetQris = 0;
      state.pagi.kk = 100000;
      state.pagi.iuran = 50000;
      state.pagi.konsumsi = 0;
    } else {
      state.omzetCash = lap.tunai;
      state.omzetQris = lap.qris;
    }
    refreshFromBelanja();
  }

  function normalize(s){
    if(Number(s._v) >= 2){
      state.savedCosts = true;
      state.modalBelanja = Number(s.modalBelanja) || 0;
      state.opsPasar = Number(s.opsPasar) || 0;
      state.bensin = Number(s.bensin) || 0;
      state.lainBelanja = Number(s.lainBelanja) || 0;
    }
    state.omzetCash = Number(s.omzetCash) || 0;
    state.omzetQris = Number(s.omzetQris) || 0;
    var p = s.pagi || {};
    state.pagi.kk = Number(p.kk != null ? p.kk : p.kantongKaret) || 0;
    state.pagi.iuran = Number(p.iuran) || 0;
    if(Array.isArray(p.lain) && p.lain.length){
      state.pagi.konsumsi = Number(p.lain[0].jumlah) || 0;
    } else {
      state.pagi.konsumsi = Number(p.konsumsi) || 0;
    }
    state.bon = Array.isArray(s.bon) ? s.bon.map(function(b){
      return { id: b.id || ('bon-' + Date.now()), nama: String(b.nama || ''), jumlah: Number(b.jumlah) || 0 };
    }) : [];
    state.biayaUsaha = Array.isArray(s.biayaUsaha) ? s.biayaUsaha.map(function(x){
      return { id: x.id || ('bu-' + Date.now()), ket: String(x.ket || ''), jumlah: Number(x.jumlah) || 0 };
    }) : [];
  }

  function serialize(){
    return {
      omzetCash: state.omzetCash,
      omzetQris: state.omzetQris,
      pagi: { kk: state.pagi.kk, iuran: state.pagi.iuran, konsumsi: state.pagi.konsumsi },
      bon: state.bon,
      biayaUsaha: state.biayaUsaha,
      /* v2: biaya belanja ikut disimpan agar Riwayat/Laporan menghitung laba yang sama */
      _v: 2,
      modalBelanja: state.modalBelanja,
      opsPasar: state.opsPasar,
      bensin: state.bensin,
      lainBelanja: state.lainBelanja,
      _savedAt: new Date().toISOString()
    };
  }

  function saveDraft(){
    try{ localStorage.setItem(STORE_DRAFT + state.tanggal, JSON.stringify(serialize())); return true; }
    catch(e){ return false; }
  }
  function saveFinal(){
    try{ localStorage.setItem(STORE_FINAL + state.tanggal, JSON.stringify(serialize())); return true; }
    catch(e){ return false; }
  }

  function render(){
    refreshFromBelanja();
    var el = $('page');
    var isLocked = state.mode === 'final';
    var html = '';

    html += '<div class="date-row">' +
      '<label>Tanggal</label>' +
      '<input type="date" id="inpTanggal" value="' + state.tanggal + '" max="' + todayYmd() + '"' +
      (isLocked ? ' disabled' : '') + '>' +
      '</div>';

    if(state.mode === 'final'){
      html += '<div class="badge-status final"><span class="d"></span>Tersimpan Database</div>';
    } else if(state.mode === 'draft'){
      html += '<div class="badge-status draft"><span class="d"></span>Draft — Belum Database</div>';
    }

    if(!isLocked && state.modalBelanja <= 0){
      html += '<button type="button" class="empty-action" id="btnInputBelanja">' +
        '<span class="ico">🛒</span>' +
        '<span class="txt"><strong>Belum ada belanja</strong>Ketuk untuk input belanja ' + fmtTglPendek(state.tanggal) + '</span>' +
        '<span class="arrow">›</span>' +
        '</button>';
    }

    html += renderCardPendapatan(isLocked);
    html += renderCardOperasional();
    html += renderCardBiayaUsaha(isLocked);
    html += renderCardLabaBersih();

    el.innerHTML = html;
    attachHandlers();
    updateFooter();
    updateFab();
    updateStatus();
  }

  function renderCardPendapatan(isLocked){
    var diterima = totalPendapatanDiterima();
    var kotor = totalPendapatanKotor();
    var h = '';
    h += '<div class="card card-pendapatan">';
    h += '<div class="card-head">' +
      '<h2><svg class="ic" viewBox="0 0 24 24"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Pendapatan</h2>' +
      '<span class="total">' + rp(diterima) + '</span>' +
      '</div>';
    h += moneyRow('Tunai', 'inpCash', state.omzetCash, isLocked);
    h += moneyRow('QRIS', 'inpQris', state.omzetQris, isLocked);
    h += '<div class="subhead"><span>Pengeluaran Pagi</span><span class="plus">+ ' + rp(totalPagi()) + '</span></div>';
    h += '<div class="info-tiny">Uang yang <strong>sudah keluar</strong> pagi sebelum jualan. Ditambahkan kembali ke pendapatan kotor.</div>';
    h += moneyRow('Kantong & Karet', 'inpKK', state.pagi.kk, isLocked);
    h += moneyRow('Iuran Kebersihan', 'inpIuran', state.pagi.iuran, isLocked);
    h += moneyRow('Konsumsi', 'inpKonsumsi', state.pagi.konsumsi, isLocked);
    h += '<div class="subhead"><span>Bon Hari Ini</span></div>';
    h += '<div class="info-tiny">Uang yang <strong>belum diterima</strong>. Otomatis jadi piutang.</div>';
    h += renderListBon(isLocked);
    if(!isLocked){
      h += '<div class="add-row">' +
        '<input type="text" class="nm" id="addBonNama" placeholder="Nama pelanggan" autocomplete="off">' +
        '<input type="text" class="jml" id="addBonJml" inputmode="none" readonly placeholder="0">' +
        '<button type="button" id="addBonBtn">+</button>' +
        '</div>';
    }
    h += '<div class="total-row">' +
      '<span class="k">Pendapatan Kotor</span>' +
      '<span class="v">' + rp(kotor) + '</span>' +
      '</div>';
    h += '<div class="total-row" style="border-top:none;padding-top:4px;margin-top:0">' +
      '<span class="k" style="font-size:11px;color:var(--text-3);font-weight:500">' +
      'Diterima (Tunai + QRIS)</span>' +
      '<span class="v" style="font-size:15px">' + rp(diterima) + '</span>' +
      '</div>';
    h += '</div>';
    return h;
  }

  function renderCardOperasional(){
    var subtotal = totalOperasionalBelanja();
    var h = '';
    h += '<div class="card card-operasional">';
    h += '<div class="card-head">' +
      '<h2><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="20" r="1.4" fill="currentColor" stroke="none"/><path d="M2 3h3l2.6 12.4a2 2 0 002 1.6h8a2 2 0 002-1.8L21 8H6"/></svg>Belanja & Operasional</h2>' +
      '<span class="total">' + rp(subtotal) + '</span>' +
      '</div>';
    h += '<div class="crow">' +
      '<span class="lbl">Total Belanja<small>' +
      (state.modalBelanja > 0 ? 'otomatis dari tab Belanja' : 'belum ada belanja tersimpan') +
      '</small></span>' +
      '<span class="val muted">' + rp(state.modalBelanja) + '</span>' +
      '</div>';
    h += readOnlyRow('Operasional Pasar', '', state.opsPasar, 'ops');
    h += readOnlyRow('Bensin', '', state.bensin, 'biayaBensin');
    h += readOnlyRow('Lain-lain', 'parkir, kuli angkut, retribusi', state.lainBelanja, 'biayaLain');
    h += '<div class="total-row">' +
      '<span class="k">Subtotal</span>' +
      '<span class="v">' + rp(subtotal) + '</span>' +
      '</div>';
    h += '</div>';
    return h;
  }

  function readOnlyRow(label, hint, value, focusKey){
    return '<button type="button" class="crow-btn" data-focus="' + focusKey + '">' +
      '<span class="lbl">' + label + (hint ? '<small>' + hint + '</small>' : '') + '</span>' +
      '<span class="val">' + rp(value) + '</span>' +
      '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>' +
      '</button>';
  }

  function renderCardBiayaUsaha(isLocked){
    var total = totalBiayaUsaha();
    var h = '';
    h += '<div class="card card-biaya">';
    h += '<div class="card-head">' +
      '<h2><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Biaya Usaha Lain</h2>' +
      '<span class="total">' + rp(total) + '</span>' +
      '</div>';
    h += '<div class="info-tiny">' +
      'Di luar belanja pasar — <strong>gaji</strong>, listrik, sewa, transport. ' +
      'Mengurangi <strong>laba bersih</strong>.' +
      '</div>';
    if(!state.biayaUsaha.length){
      h += '<div class="info-tiny" style="font-style:italic;text-align:center;padding:14px 0">' +
        'Belum ada biaya usaha lain hari ini.' +
        '</div>';
    } else {
      h += state.biayaUsaha.map(function(x, i){
        return '<div class="item-row">' +
          '<span class="nm">' + escHtml(x.ket) + '</span>' +
          '<span class="amt">' + rp(x.jumlah) + '</span>' +
          (isLocked ? '' : '<button class="del" data-type="biayaUsaha" data-idx="' + i + '" type="button">×</button>') +
          '</div>';
      }).join('');
    }
    if(!isLocked){
      h += '<div class="add-row">' +
        '<input type="text" class="nm" id="addBiayaKet" placeholder="Keterangan biaya" autocomplete="off">' +
        '<input type="text" class="jml" id="addBiayaJml" inputmode="none" readonly placeholder="0">' +
        '<button type="button" id="addBiayaBtn">+</button>' +
        '</div>';
    }
    h += '<div class="total-row">' +
      '<span class="k">Subtotal</span>' +
      '<span class="v">' + rp(total) + '</span>' +
      '</div>';
    h += '</div>';
    return h;
  }

  function renderCardLabaBersih(){
    var diterima = totalPendapatanDiterima();
    var kotor = totalPendapatanKotor();
    var ops = totalOperasionalBelanja();
    var lain = totalBiayaUsaha();
    var totalBiaya = ops + lain;
    var laba = diterima - totalBiaya;
    var labaK = kotor - totalBiaya;
    var neg = laba < 0;

        if(!inpTanggal.value) return;

          inpTanggal.value = state.tanggal;

      });

      btnBelanja.addEventListener('click', function(){

      });
    }

    bindMoney('inpQris',     function(v){ state.omzetQris = v; });

    bindMoney('inpIuran',    function(v){ state.pagi.iuran = v; });
    bindMoney('inpKonsumsi', function(v){ state.pagi.konsumsi = v; });

      });

  document.addEventListener('click', function(e){

    var url = './belanja.html?focus=' + encodeURIComponent(focus) +
      '&tanggal=' + encodeURIComponent(state.tanggal);

  });

  function bindMoney(id, setter){
    var el = $(id);
    if(!el) return;
    el.addEventListener('input', function(){
      var n = digits(el.value);
      el.value = fmtNum(n);
      setter(n);
      saveDraft();
      render();
    });
  }

  function bindAddInline(idJml, idBtn, onAdd, idKet, fieldName){
    var jmlEl = $(idJml);
    var btn = $(idBtn);
    var ketEl = $(idKet);
    if(!jmlEl || !btn || !ketEl) return;
    btn.addEventListener('click', function(){
      var ket = ketEl.value.trim();
      var jml = digits(jmlEl.value);
      if(!ket){ toast('Isi ' + (fieldName || 'keterangan')); ketEl.focus(); return; }
      if(jml <= 0){ toast('Isi jumlah'); return; }
      onAdd(ket, jml);
    });
    [ketEl, jmlEl].forEach(function(el){
      el.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); btn.click(); }
      });
    });
  }

  function resetStateForNewDate(){
    state.mode = 'baru';
    state.omzetCash = 0; state.omzetQris = 0;
    state.pagi = { kk: 0, iuran: 0, konsumsi: 0 };
    state.bon = [];
    state.opsPasar = 0; state.bensin = 0; state.lainBelanja = 0;
    state.modalBelanja = 0; state.savedCosts = false;

  }

  var keypad = $('keypad');
  var kpEl = null;
  var kpWrapEl = null;
  var kpFresh = false;

  function kpActivate(el, wrap){
    if(kpEl && kpEl !== el){
      if(kpWrapEl) kpWrapEl.classList.remove('kp-on');
      kpEl.classList.remove('kp-fresh');
    }
    kpEl = el; kpWrapEl = wrap; kpFresh = true;
    if(wrap) wrap.classList.add('kp-on');
    var map = {
      inpCash: 'Tunai', inpQris: 'QRIS',
      inpKK: 'Kantong & Karet', inpIuran: 'Iuran Kebersihan', inpKonsumsi: 'Konsumsi',
      addBonJml: 'Bon Pelanggan', addBiayaJml: 'Biaya Usaha Lain'
    };
    $('kpName').textContent = 'Tutup Hari';
    $('kpField').textContent = map[el.id] || 'Jumlah';
    keypad.classList.add('show');
    keypad.setAttribute('aria-hidden', 'false');
    document.body.classList.add('kp-open');
    updateFab();
    kpSync();
    setTimeout(function(){ kpEnsureVisible(); }, 320);
  }

  function kpClose(){
    if(kpEl){
      if(kpWrapEl) kpWrapEl.classList.remove('kp-on');
      kpEl.classList.remove('kp-fresh');
    }
    kpEl = null; kpWrapEl = null;
    keypad.classList.remove('show');
    keypad.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('kp-open');
    updateFab();
  }

  function kpSync(){
    if(!kpEl) return;
    kpEl.classList.toggle('kp-fresh', kpFresh && kpEl.value !== '');
  }

  function kpPress(k){
    if(!kpEl) return;
    if(k === 'next'){ kpClose(); return; }
    var raw = String(digits(kpEl.value) || '');
    if(kpFresh) raw = '';
    if(k === 'back' || k === 'back2'){
      raw = kpFresh ? '' : raw.slice(0, -1);
    } else {
      if(raw === '' && /^0+$/.test(k)) return;
      if((raw + k).length > 10) return;
      raw = raw + k;
    }
    kpFresh = false;
    kpEl.value = raw ? Number(raw).toLocaleString('id-ID') : '';
    kpEl.dispatchEvent(new Event('input', {bubbles: true}));
    kpSync();
  }

  keypad.addEventListener('click', function(e){
    var b = e.target.closest('[data-k]');
    if(b) kpPress(b.getAttribute('data-k'));
  });
  $('kpClose').addEventListener('click', kpClose);
  document.addEventListener('click', function(e){
    if(!kpEl) return;
    if(keypad.contains(e.target)) return;
    if(e.target === kpEl) return;
    kpClose();
  });

  function kpEnsureVisible(){
    if(!kpEl) return;
    var footer = $('appFooter');
    var topLimit = footer.getBoundingClientRect().top - keypad.offsetHeight - 8;
    var r = kpEl.getBoundingClientRect();
    if(r.bottom > topLimit){
      window.scrollBy({ top: r.bottom - topLimit, behavior: 'smooth' });
    }
  }

  function lockScroll(){
    document.body.classList.toggle('sheet-open',
      !!document.querySelector('.sheet-ov.show'));
  }
  function bukaSheet(ov){
    ov._ret = document.activeElement;
    ov.classList.add('show');
    lockScroll();
    var s = ov.querySelector('.sheet');
    if(s) s.focus({preventScroll: true});
  }
  function tutupSheet(ov){
    if(!ov) return;
    ov.classList.remove('show');
    lockScroll();
    if(ov._ret && ov._ret.focus){
      try{ ov._ret.focus({preventScroll: true}); }catch(e){}
    }
  }
  document.addEventListener('click', function(e){
    var ov = e.target.closest ? e.target.closest('.sheet-ov') : null;
    if(!ov) return;
    if(e.target === ov || e.target.closest('[data-close]')) tutupSheet(ov);
  });
  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    var all = document.querySelectorAll('.sheet-ov.show');
    if(all.length) tutupSheet(all[all.length - 1]);
  });

  var fab = $('fab');
  var fabTxt = $('fabTxt');

  function updateFab(){
    if(!fab) return;
    var isFinal = state.mode === 'final';
    var hasData = totalPendapatanKotor() > 0 || totalBiayaKeseluruhan() > 0;
    var show = (hasData || isFinal) &&
               !document.querySelector('.sheet-ov.show') &&
               !document.body.classList.contains('kp-open');
    fab.classList.toggle('show', show);
    fab.classList.toggle('edit-mode', isFinal);
    fabTxt.textContent = isFinal ? 'Edit' : 'Simpan';
  }

  function updateStatus(){ SyncUI.bind(); }

  fab.addEventListener('click', function(){
    if(state.mode === 'final'){
      state.mode = 'draft';
      try{ localStorage.removeItem(STORE_FINAL + state.tanggal); }catch(e){}
      saveDraft();
      render();
      toast('Mode edit: ubah lalu simpan lagi');
      return;
    }
    bukaSheet($('saveSheet'));
  });

  var menuSheet = $('menuSheet');
  function tutupMenu(){ tutupSheet(menuSheet); }

  $('btnKebab').addEventListener('click', function(){ bukaSheet(menuSheet); });
  $('menuPengaturan').addEventListener('click', function(){ tutupMenu(); Router.goUrl('./pengaturan.html'); });
  $('menuPanduan').addEventListener('click', function(){ tutupMenu(); Router.goUrl('./panduan.html'); });
  $('menuBagikan').addEventListener('click', async function(){
    tutupMenu();
    var text = 'Coba aplikasi Sayur App — pencatatan usaha sayur.\n' + window.location.href;
    if(navigator.share){
      try{ await navigator.share({text: text}); return; }catch(e){}
    }
    try{
      await navigator.clipboard.writeText(text);
      toast('Tautan disalin');
    }catch(e){ toast('Tidak bisa membagikan'); }
  });
  $('menuDark').addEventListener('click', function(){ toggleDarkMode(); });
  $('menuTentang').addEventListener('click', function(){ tutupMenu(); Router.goUrl('./tentang.html'); });
  $('menuBantuan').addEventListener('click', function(){ tutupMenu(); Router.goUrl('./bantuan.html'); });

  var isDev = false;
  try{ isDev = new URLSearchParams(Router.search()).has('dev'); }catch(e){}
  if(isDev){
    $('devSection').hidden = false;
    $('menuSeed').addEventListener('click', function(){
      tutupMenu(); seedDummy();
    });
    $('menuReset').addEventListener('click', function(){
      if(!confirm('Reset data hari ini?')) return;
      tutupMenu();
      try{
        localStorage.removeItem(STORE_DRAFT + state.tanggal);
        localStorage.removeItem(STORE_FINAL + state.tanggal);
      }catch(e){}
      resetStateForNewDate();
      render();
      toast('Data direset');
    });
  }

  function applyDarkMode(on, simpan){
    document.documentElement.classList.toggle('dark', on);
    var sw = $('darkSwitch');
    if(sw) sw.classList.toggle('on', on);
    var menu = $('menuDark');
    if(menu) menu.setAttribute('aria-checked', on ? 'true' : 'false');
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.content = on ? '#1B261B' : '#2F5233';
    if(simpan){
      try{ localStorage.setItem('sayur_dark', on ? '1' : '0'); }catch(e){}
    }
  }
  function toggleDarkMode(){
    applyDarkMode(!document.documentElement.classList.contains('dark'), true);
  }

  var PAGES = {
    beranda: './beranda-baru.html',
    belanja: './belanja.html',
    laporan: './laporan.html'
  };
  function initNavbar(){
    document.querySelectorAll('.navbar button').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.dataset.tab;
        if(k === 'tutup'){ window.scrollTo({top: 0, behavior: 'smooth'}); return; }
        if(PAGES[k]) Router.goUrl(PAGES[k]);
      });
    });
  }

  $('saveSheet').addEventListener('click', function(e){
    var b = e.target.closest('.opt-save');
    if(!b) return;
    var act = b.dataset.act;
    if(act === 'draft'){
      tutupSheet($('saveSheet'));
      saveDraft();
      state.mode = 'draft';
      toast('Tersimpan sementara di HP');
      render();

      tutupSheet($('saveSheet'));
      openConfirmSheet();

  });

  function openConfirmSheet(){
    $('cfPendapatan').textContent = rp(totalPendapatanDiterima());
    $('cfOps').textContent = rp(totalOperasionalBelanja());
    $('cfBiayaLain').textContent = rp(totalBiayaUsaha());
    $('cfLaba').textContent = rp(labaBersih());
    bukaSheet($('confirmSheet'));
  }

  $('cfGo').addEventListener('click', function(){
    tutupSheet($('confirmSheet'));
    doSend();
  });

  function doSend(){
    fab.classList.add('busy');
    var jobs = [];
    jobs.push({
      action: 'setOmzet',
      data: { tanggal: state.tanggal, cash: state.omzetCash, qris: state.omzetQris }
    });
    jobs.push({
      action: 'setBiayaOperasional',
      data: {
        tanggal: state.tanggal,
        operasionalBelanja: state.opsPasar,
        operasionalMetode: 'Cash',
        bensin: state.bensin,
        bensinMetode: 'Cash',
        konsumsi: state.lainBelanja,
        konsumsiMetode: 'Cash',
        pagiKresek: state.pagi.kk,
        pagiIuran: state.pagi.iuran,
        pagiKonsumsi: state.pagi.konsumsi,
        pagiLain: 0
      }
    });
    state.biayaUsaha.forEach(function(x){
      jobs.push({
        action: 'addLainLain',
        data: {
          id: x.id, tanggal: state.tanggal,
          keterangan: x.ket, jumlah: x.jumlah,
          metode: 'Cash', kategori: 'BiayaUsaha'
        }
      });
    });
    state.bon.forEach(function(b){
      jobs.push({
        action: 'addHutang',
        data: {
          id: b.id, tipe: 'PiutangSaya', nama: b.nama, jumlah: b.jumlah,
          catatan: 'Bon lisan', sumber: 'Bon', tanggal: state.tanggal
        }
      });
    });

    saveFinal();
    state.mode = 'final';

    var idx = 0;
    function next(){
      if(idx >= jobs.length){
        fab.classList.remove('busy');
        updateLaporanSummary();
        toast('✓ Tersimpan ke database');
        render();
        return;
      }
      var job = jobs[idx++];
      SayurStorage.post(job.action, job.data)
        .then(next)
        .catch(function(){ next(); });
    }
    next();
  }

  function updateLaporanSummary(){
    try{
      var L = JSON.parse(localStorage.getItem(STORE_LAPORAN) || '{}');
      L.tunai = state.omzetCash;
      L.qris = state.omzetQris;
      L.pagi = totalPagi();
      L.bonTotal = totalBon();
      L.biayaUsaha = totalBiayaUsaha();
      L._updatedAt = new Date().toISOString();
      localStorage.setItem(STORE_LAPORAN, JSON.stringify(L));
    }catch(e){}
  }

  function seedDummy(){
    state.mode = 'draft';
    state.omzetCash = 2480000;
    state.omzetQris = 850000;
    state.pagi = { kk: 100000, iuran: 50000, konsumsi: 35000 };
    state.bon = [
      { id: 'bon-1', nama: 'Bu Sari', jumlah: 85000 },
      { id: 'bon-2', nama: 'Pak Tani', jumlah: 120000 }
    ];
    state.biayaUsaha = [{ id: 'bu-1', ket: 'Gaji Ucup', jumlah: 150000 }];
    saveDraft();
    render();
    toast('Data contoh diisi');
  }

  async function init(){
    try{
      $('topbarDate').textContent = new Date().toLocaleDateString('id-ID',
        {weekday: 'long', day: 'numeric', month: 'long'});
    }catch(e){}

    try{
      var set = await SayurStorage.pengaturan.get();
      if(set && set.NamaLapak) $('topbarTitle').textContent = set.NamaLapak;
    }catch(e){}

    try{
      var url = new URLSearchParams(Router.search());
      var t = url.get('tanggal');
      if(t && /^\d{4}-\d{2}-\d{2}$/.test(t) && t <= todayYmd()){
        state.tanggal = t;
      }
    }catch(e){}

    try{
      if(!localStorage.getItem('sayur_first_use')){
        localStorage.setItem('sayur_first_use', todayYmd());
      }
    }catch(e){}

    applyDarkMode(document.documentElement.classList.contains('dark'), false);
    initNavbar();
    loadLocal();
    render();
  }

  window.addEventListener('pageshow', function(){
    if(state.tanggal){
      refreshFromBelanja();
      render();
    }
  });

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

}};

  function fmtTglPendek(ymdStr){
    if(!ymdStr) return '';
    var p = ymdStr.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('id-ID',
      { day: 'numeric', month: 'short' });
  }
  function fmtTglMedium(ymdStr){
    if(!ymdStr) return '';
    var p = ymdStr.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('id-ID',
      { day: 'numeric', month: 'short', year: '2-digit' });
  }
  function escHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function readJSON(key){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  var App = {
    tab: 'saldo',
    periode: 'today',
    filterMutasi: 'semua',
    filterBulan: 'all',
    bulanDipilih: false,
    mutasiMaks: 50,
    mutasi: [],
    hutang: [],
    riwayat: [],
    /* asal data tiap tab: 'server' (baru diambil), 'cache' (salinan terakhir di HP), 'kosong' */
    src: { mutasi: 'kosong', hutang: 'kosong', riwayat: 'kosong' },
    memuat: { mutasi: false, hutang: false, riwayat: false },
    loadSeq: 0,
    riwayatSrv: null
  };

  /* ==========================================================
     LAPISAN DATA — satu-satunya tempat Laporan bicara ke server

     Prinsip:
     1. Server = sumber kebenaran. Setiap buka tab, data diambil dari server.
     2. Hasil terakhir disalin ke localStorage (cache) supaya tetap tampil saat offline.
     3. Perubahan (tarik/setor, bayar hutang) dikirim ke server dengan ID dari HP.
        Selama belum terbukti ada di server, perubahan disimpan di daftar "pending"
        dan ditampilkan di atas data server, lalu dikirim ulang otomatis bila gagal.
     4. Backend wajib menolak ID ganda (idempoten), sehingga kirim ulang aman.
     ========================================================== */
  var MUTASI_CACHE_KEY = 'mawih_mutasi_srv_v2';
  var HUTANG_CACHE_KEY = 'mawih_hutang_srv_v2';
  var PENDING_KEY = 'mawih_laporan_pending_v2';
  var PENDING_MAX_UMUR = 3 * 24 * 3600 * 1000;   // 3 hari
  var KIRIM_ULANG_MAKS = 5;

  function unwrapList(r){
    if(Array.isArray(r)) return r;
    if(r && Array.isArray(r.data)) return r.data;
    if(r && Array.isArray(r.rows)) return r.rows;
    return null;                                  // null = gagal / bukan daftar
  }
  var RE_YMD_ISO = /^\d{4}-\d{2}-\d{2}$/;
  /* Apps Script sering mengembalikan tanggal sebagai ISO UTC ("2026-10-18T17:00:00.000Z").
     Ubah ke YYYY-MM-DD menurut zona waktu HP supaya tidak bergeser sehari. */
  function tglKeYmd(v){
    if(v == null || v === '') return '';
    var t = String(v);
    if(RE_YMD_ISO.test(t)) return t;
    var d = new Date(v);
    return isNaN(d.getTime()) ? '' : ymd(d);
  }
  function rapikanTanggal(list){
    list.forEach(function(x){ if(x) x.Tanggal = tglKeYmd(x.Tanggal) || x.Tanggal; });
    return list;
  }
  function cacheRead(key){
    var v = readJSON(key);
    return Array.isArray(v) ? v : null;
  }
  function cacheWrite(key, v){
    try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){}
  }
  function pendingRead(){
    var p = readJSON(PENDING_KEY) || {};
    return {
      mutasi: Array.isArray(p.mutasi) ? p.mutasi : [],
      bayar: Array.isArray(p.bayar) ? p.bayar : []
    };
  }
  function pendingWrite(p){
    try{ localStorage.setItem(PENDING_KEY, JSON.stringify(p)); }catch(e){}
  }
  function umurOk(x){ return Date.now() - (Number(x._at) || 0) < PENDING_MAX_UMUR; }

  async function serverList(action, params){
    try{
      return unwrapList(await SayurStorage.get(action, params || {}));
    }catch(e){ return null; }
  }

  /* Kirim satu perubahan. true = server menerima, false = gagal (tetap pending). */
  async function kirimServer(action, data){
    try{
      var r = await SayurStorage.post(action, data);
      if(r && r.queued) return false;          /* masuk antrean HP, belum sampai server */
      if(r && r.success === false) return false;
      if(r && r.error) return false;
      return true;
    }catch(e){ return false; }
  }

  function payloadMutasi(m){
    return {
      id: m.ID, tanggal: m.Tanggal, tipe: m.Tipe, metode: m.Metode,
      jumlah: Number(m.Jumlah) || 0, tujuan: m.Tujuan || '',
      catatan: m.Catatan || '', sumber: m.Sumber || 'Manual', referensi: m.Referensi || ''
    };
  }
  function payloadBayar(b){
    return {
      id: b.id, hutangId: b.hutangId, jumlah: Number(b.jumlah) || 0,
      metode: b.metode || 'Cash', tanggal: b.tanggal, catatan: b.catatan || ''
    };
  }

  /* Kirim ulang semua yang tadinya gagal. Dipanggil tiap Laporan dimuat. */
  async function kirimUlangPending(){
    var p = pendingRead(), berubah = false;
    for(var i = 0; i < p.mutasi.length; i++){
      var m = p.mutasi[i];
      if(!m._belumTerkirim) continue;
      if((m._coba || 0) >= KIRIM_ULANG_MAKS) continue;
      m._coba = (m._coba || 0) + 1; berubah = true;
      if(await kirimServer(API.addMutasi, payloadMutasi(m))) m._belumTerkirim = false;
    }
    for(var j = 0; j < p.bayar.length; j++){
      var b = p.bayar[j];
      if(!b._belumTerkirim) continue;
      if((b._coba || 0) >= KIRIM_ULANG_MAKS) continue;
      b._coba = (b._coba || 0) + 1; berubah = true;
      if(await kirimServer(API.bayarHutang, payloadBayar(b))) b._belumTerkirim = false;
    }
    if(berubah) pendingWrite(p);
  }

  function jumlahBelumTerkirim(){
    var p = pendingRead();
    return p.mutasi.filter(function(x){ return x._belumTerkirim; }).length +
           p.bayar.filter(function(x){ return x._belumTerkirim; }).length;
  }

  /* Gabungkan data server dengan perubahan pending. serverOk=false berarti pakai cache. */
  function gabungMutasi(base, serverOk){
    var p = pendingRead();
    var ids = {};
    base.forEach(function(x){ ids[x.ID] = true; });
    if(serverOk){
      /* yang sudah ada di server, atau sudah terlalu lama, dibuang dari pending */
      p.mutasi = p.mutasi.filter(function(m){ return !ids[m.ID] && umurOk(m); });
      pendingWrite(p);
    }
    var extra = p.mutasi.filter(function(m){ return !ids[m.ID]; });
    return extra.concat(base);
  }

  function hitungStatusHutang(h){
    var sisa = Math.max(0, (Number(h.JumlahAwal) || 0) - (Number(h.JumlahDibayar) || 0));
    h.Sisa = sisa;
    h.Status = sisa <= 0 ? 'Lunas' : ((Number(h.JumlahDibayar) || 0) > 0 ? 'Sebagian' : 'Belum');
    return h;
  }
  function gabungHutang(base, serverOk){
    var p = pendingRead();
    var byId = {};
    base.forEach(function(h){ byId[h.ID] = h; });
    if(serverOk){
      /* pembayaran dianggap sudah masuk server bila total dibayar di server >= target */
      p.bayar = p.bayar.filter(function(b){
        var h = byId[b.hutangId];
        if(!umurOk(b)) return false;
        if(h && (Number(h.JumlahDibayar) || 0) >= b.targetDibayar) return false;
        return true;
      });
      pendingWrite(p);
    }
    var hasil = base.map(function(h){ return Object.assign({}, h); });
    var map2 = {};
    hasil.forEach(function(h){ map2[h.ID] = h; });
    p.bayar.forEach(function(b){
      var h = map2[b.hutangId];
      if(!h) return;
      if((Number(h.JumlahDibayar) || 0) < b.targetDibayar){
        h.JumlahDibayar = b.targetDibayar;
        h._pending = true;
      }
    });
    return hasil.map(hitungStatusHutang);
  }

  /* ---------- Muat dari server (dengan cadangan cache HP) ---------- */
  async function muatMutasi(){
    App.memuat.mutasi = true;
    var srv = await serverList(API.getMutasi, {});
    var base, ok = !!srv;
    if(srv){ rapikanTanggal(srv); cacheWrite(MUTASI_CACHE_KEY, srv); base = srv; App.src.mutasi = 'server'; }
    else {
      var c = cacheRead(MUTASI_CACHE_KEY);
      base = c || [];
      App.src.mutasi = c ? 'cache' : 'kosong';
    }
    App.mutasi = gabungMutasi(base, ok);
    App.memuat.mutasi = false;
  }
  async function muatHutang(){
    App.memuat.hutang = true;
    var srv = await serverList(API.getHutang, {});
    var base, ok = !!srv;
    if(srv){ rapikanTanggal(srv); cacheWrite(HUTANG_CACHE_KEY, srv); base = srv; App.src.hutang = 'server'; }
    else {
      var c = cacheRead(HUTANG_CACHE_KEY);
      base = c || [];
      App.src.hutang = c ? 'cache' : 'kosong';
    }
    App.hutang = gabungHutang(base, ok);
    App.memuat.hutang = false;
  }

  /* Pita info di atas tab: jujur soal asal data. Kosong bila data baru dari server. */
  function pitaSumber(tab){
    var s = App.src[tab];
    var n = jumlahBelumTerkirim();
    var teks = '';
    if(App.memuat[tab] && s !== 'server') teks = 'Memuat data dari server…';
    else if(s === 'cache') teks = 'Server belum bisa dihubungi. Menampilkan data terakhir yang tersimpan di HP.';
    else if(s === 'kosong') teks = 'Server belum bisa dihubungi dan belum ada data tersimpan di HP.';
    if(n > 0) teks += (teks ? ' ' : '') + n + ' perubahan menunggu dikirim ke server.';
    if(!teks) return '';
    var cls = (s === 'server' && !App.memuat[tab]) ? 'srv-note info' : 'srv-note';
    return '<div class="' + cls + '" role="status">' + escHtml(teks) + '</div>';
  }

  function buatDummyRiwayat(){
    var today = new Date();
    var pola = [
      { omzet:2480000, laba:748000, hariLalu:0 },
      { omzet:2250000, laba:652000, hariLalu:1 },

    ];

                 lainBelanja:25000, pagi:150000, biayaUsaha:0 }

  var RIWAYAT_MAKS_HARI = 400;
  var RE_YMD = /^\d{4}-\d{2}-\d{2}$/;

  function hitungHari(y, rec, isFinal){
    var omzetC = Number(rec.omzetCash) || 0;
    var omzetQ = Number(rec.omzetQris) || 0;
    var omzet = omzetC + omzetQ;
    var pg = rec.pagi || {};
    var pagiTotal = (Number(pg.kk != null ? pg.kk : pg.kantongKaret) || 0) + (Number(pg.iuran) || 0) +
      ((Array.isArray(pg.lain) && pg.lain.length) ? (Number(pg.lain[0].jumlah) || 0) : (Number(pg.konsumsi) || 0));
    var bon = Array.isArray(rec.bon)
      ? rec.bon.reduce(function(t, b){ return t + (Number(b.jumlah) || 0); }, 0) : 0;
    var biayaUsaha = Array.isArray(rec.biayaUsaha)
      ? rec.biayaUsaha.reduce(function(t, x){ return t + (Number(x.jumlah) || 0); }, 0) : 0;

    /* Biaya belanja: v2 disimpan di catatan Tutup; catatan lama dicari di penyimpanan lama per tanggal */
    var modal = 0, opsPasar = 0, bensin = 0, lainBelanja = 0, lengkap = false;
    if(Number(rec._v) >= 2){
      modal = Number(rec.modalBelanja) || 0; opsPasar = Number(rec.opsPasar) || 0;
      bensin = Number(rec.bensin) || 0; lainBelanja = Number(rec.lainBelanja) || 0;
      lengkap = true;
    } else {
      var v1 = readJSON('sayur_belanja_biaya_' + y);
      if(v1){
        modal = Number(v1.modalBelanja) || 0; opsPasar = Number(v1.opsPasar) || 0;
        bensin = Number(v1.bensin) || 0; lainBelanja = Number(v1.konsumsiPasar) || 0;
        lengkap = true;
      }
    }
    var laba = lengkap ? omzet - (modal + opsPasar + bensin + lainBelanja + biayaUsaha) : null;
    return {
      Tanggal: y, TotalOmzet: omzet, LabaBersih: laba, OmzetCash: omzetC, OmzetQris: omzetQ,
      adaData: true, lengkap: lengkap, final: !!isFinal, bon: bon,
      biaya: { modal: modal, opsPasar: opsPasar, bensin: bensin, lainBelanja: lainBelanja,
               pagi: pagiTotal, biayaUsaha: biayaUsaha }
    };
  }

  function boolServer(v){ return v === true || v === 1 || v === '1' || String(v).toLowerCase() === 'true'; }

  /* Baris riwayat dari server (satu baris = satu hari yang sudah "Simpan Database" di Tutup).
     Kolom yang dibaca (PascalCase atau camelCase):
       Tanggal, OmzetCash, OmzetQris, ModalBelanja, OpsPasar, Bensin, LainBelanja,
       BiayaUsaha, Pagi, Bon, Lengkap (opsional). Tanpa ModalBelanja dianggap belum lengkap. */
  function normalisasiRiwayatServer(r){
    if(!r) return null;
    var g = function(n){
      var c = n.charAt(0).toLowerCase() + n.slice(1);
      return r[n] != null ? r[n] : r[c];
    };
    var tgl = tglKeYmd(g('Tanggal'));
    if(!RE_YMD.test(tgl)) return null;
    var cash = Number(g('OmzetCash')) || 0, qris = Number(g('OmzetQris')) || 0;
    var omzet = cash + qris;
    var modal = Number(g('ModalBelanja')) || 0, ops = Number(g('OpsPasar')) || 0;
    var bensin = Number(g('Bensin')) || 0, lain = Number(g('LainBelanja')) || 0;
    var usaha = Number(g('BiayaUsaha')) || 0;
    var lengkapRaw = g('Lengkap');
    var lengkap = lengkapRaw != null ? boolServer(lengkapRaw) : (g('ModalBelanja') != null);
    return {
      Tanggal: tgl, TotalOmzet: omzet, OmzetCash: cash, OmzetQris: qris,
      LabaBersih: lengkap ? omzet - (modal + ops + bensin + lain + usaha) : null,
      adaData: true, lengkap: lengkap, final: true, bon: Number(g('Bon')) || 0, dariServer: true,
      biaya: { modal: modal, opsPasar: ops, bensin: bensin, lainBelanja: lain,
               pagi: Number(g('Pagi')) || 0, biayaUsaha: usaha }
    };
  }

  function antreanTerisi(){
    try{ return SyncUI.snapshot().total > 0; }catch(e){ return false; }
  }

  /* Susun daftar hari dari: server (utama) + catatan Tutup di HP (draft / belum terkirim) */
  function bacaRiwayat(){
    var today = new Date(), todayY = ymd(today);
    var srvRows = (App.riwayatSrv && App.riwayatSrv.rows) || {};
    var libur = getHariLibur();
    var liburSrv = (App.riwayatSrv && App.riwayatSrv.libur) || {};
    Object.keys(liburSrv).forEach(function(y){ if(!libur[y]) libur[y] = liburSrv[y]; });

    var minY = todayY, adaRecord = false;
    function lihat(y){
      if(y && RE_YMD.test(y) && y <= todayY){ adaRecord = true; if(y < minY) minY = y; }
    }
    try{
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k) continue;
        if(k.indexOf(TUTUP_FINAL_PREFIX) === 0) lihat(k.slice(TUTUP_FINAL_PREFIX.length));
        else if(k.indexOf(TUTUP_DRAFT_PREFIX) === 0) lihat(k.slice(TUTUP_DRAFT_PREFIX.length));
      }
    }catch(e){}
    Object.keys(srvRows).forEach(lihat);
    Object.keys(libur).forEach(lihat);
    try{
      var fu = localStorage.getItem('sayur_first_use');
      if(fu && RE_YMD.test(fu) && fu < minY) minY = fu;
    }catch(e){}
    var cap = new Date(today); cap.setDate(cap.getDate() - RIWAYAT_MAKS_HARI);
    if(minY < ymd(cap)) minY = ymd(cap);

    if(!adaRecord && DEMO_MODE) return buatDummyRiwayat();

    var kirimPending = antreanTerisi();
    var list = [], d = new Date(today);
    for(var n = 0; n <= RIWAYAT_MAKS_HARI; n++){
      var yy = ymd(d);
      if(yy < minY) break;
      if(libur[yy]){
        list.push({ Tanggal: yy, libur: true, alasan: libur[yy], adaData: false });
      } else {
        var fin = readJSON(TUTUP_FINAL_PREFIX + yy);
        var srv = srvRows[yy] || null;
        var item = null;
        /* Final di HP menang hanya bila masih ada yang belum terkirim (bisa lebih baru dari server) */
        if(fin && (kirimPending || !srv)) item = hitungHari(yy, fin, true);
        else if(srv) item = srv;
        else {
          var drf = readJSON(TUTUP_DRAFT_PREFIX + yy);
          if(drf) item = hitungHari(yy, drf, false);
        }
        list.push(item || { Tanggal: yy, adaData: false });
      }
      d.setDate(d.getDate() - 1);
    }
    return list;
  }

  /* Ambil riwayat + hari libur dari server; simpan salinan di HP */
  async function muatRiwayat(){
    App.memuat.riwayat = true;
    var sampai = ymd(new Date());
    var dd = new Date(); dd.setDate(dd.getDate() - RIWAYAT_HARI_SERVER);
    var hasil = await Promise.all([
      serverList(API.getRiwayat, { dari: ymd(dd), sampai: sampai }),
      serverList(API.getLibur, {})
    ]);
    var rows = hasil[0], liburList = hasil[1];
    var cache = readJSON(RIWAYAT_SRV_KEY) || {};
    var baru = { rows: cache.rows || {}, libur: cache.libur || {} };

    if(rows){
      baru.rows = {};
      rows.forEach(function(r){
        var n = normalisasiRiwayatServer(r);
        if(n) baru.rows[n.Tanggal] = n;
      });
    }
    if(liburList){
      baru.libur = {};
      liburList.forEach(function(l){
        var y = tglKeYmd(l.Tanggal || l.tanggal);
        if(y) baru.libur[y] = l.Alasan || l.alasan || 'Libur';
      });
      /* catat juga ke HP agar Beranda ("hari belum dicatat") ikut tahu */
      Object.keys(baru.libur).forEach(function(y){
        try{
          if(!localStorage.getItem(LIBUR_PREFIX + y)){
            localStorage.setItem(LIBUR_PREFIX + y, JSON.stringify({
              tanggal: y, alasan: baru.libur[y], dicatatPada: new Date().toISOString()
            }));
          }
        }catch(e){}
      });
    }
    if(rows || liburList){
      try{ localStorage.setItem(RIWAYAT_SRV_KEY, JSON.stringify(baru)); }catch(e){}
    }
    App.riwayatSrv = baru;
    App.riwayat = bacaRiwayat();
    var adaIsi = App.riwayat.some(function(x){ return x.adaData || x.libur; });
    App.src.riwayat = rows ? 'server' : (adaIsi ? 'cache' : 'kosong');
    App.memuat.riwayat = false;
  }

  function getHariLibur(){
    var set = {};
    try{
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(LIBUR_PREFIX) === 0){
          var y = k.replace(LIBUR_PREFIX, '');
          var item = readJSON(k);
          set[y] = item ? item.alasan : 'Libur';
        }
      }
    }catch(e){}
    return set;
  }

  function hitungSaldo(){
    var cash = 0, qris = 0;
    App.mutasi.forEach(function(m){
      var sign = m.Tipe === 'Tarik' ? -1 : 1;
      if(m.Metode === 'QRIS') qris += sign * (Number(m.Jumlah) || 0);
      else cash += sign * (Number(m.Jumlah) || 0);
    });
    return { cash: cash, qris: qris, total: cash + qris };
  }

  function rangePeriode(){
    var today = new Date();
    var sampai = ymd(today);
    var dari = sampai;
    if(App.periode === '7d'){
      var d = new Date(today); d.setDate(d.getDate() - 6); dari = ymd(d);
    } else if(App.periode === '30d'){
      var d2 = new Date(today); d2.setDate(d2.getDate() - 29); dari = ymd(d2);
    } else if(App.periode === 'month'){
      dari = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-01';
    }
    return { dari: dari, sampai: sampai };
  }
  function hitungArusKas(){
    var r = rangePeriode();
    var rows = App.riwayat.filter(function(x){
      return x.Tanggal >= r.dari && x.Tanggal <= r.sampai;
    });
    var cashMasuk = 0, cashKeluar = 0, qrisMasuk = 0, feeQris = 0;
    rows.forEach(function(x){
      var bi = x.biaya || {};
      cashMasuk += (Number(x.OmzetCash) || 0);
      qrisMasuk += (Number(x.OmzetQris) || 0);
      cashKeluar += (Number(bi.opsPasar) || 0) + (Number(bi.bensin) || 0) +
                    (Number(bi.lainBelanja) || 0) + (Number(bi.modal) || 0) +
                    (Number(bi.biayaUsaha) || 0);
      feeQris += Math.round((Number(x.OmzetQris) || 0) * 0.007);
    });
    return {
      cash: { masuk: cashMasuk, keluar: cashKeluar, saldo: cashMasuk - cashKeluar },
      qris: { masuk: qrisMasuk, fee: feeQris, saldo: qrisMasuk - feeQris },

    };
  }

  function labelBulan(b){
    var p = b.split('-').map(Number);
    return new Date(p[0], p[1] - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  }

  function statistikRiwayat(rows){
    var st = { laba: 0, omzet: 0, hariTutup: 0, draft: 0, belumLengkap: 0, kosong: 0, libur: 0 };
    var todayY = todayYmd();
    rows.forEach(function(x){
      if(x.libur){ st.libur++; return; }
      if(!x.adaData){ if(x.Tanggal !== todayY) st.kosong++; return; }
      st.omzet += Number(x.TotalOmzet) || 0;
      if(x.final === false) st.draft++; else st.hariTutup++;
      if(x.lengkap === false) st.belumLengkap++;
      else st.laba += Number(x.LabaBersih) || 0;
    });
    return st;
  }

  function renderRiwayat(){
    var el = $('panel-riwayat');
    var list = App.riwayat.slice().sort(function(a, b){
      return String(b.Tanggal).localeCompare(String(a.Tanggal));
    });

    var bulanSet = {};
    list.forEach(function(x){ if(x.Tanggal) bulanSet[x.Tanggal.slice(0, 7)] = true; });
    var bulanList = Object.keys(bulanSet).sort().reverse();
    if(!App.bulanDipilih){
      var bulanIni = todayYmd().slice(0, 7);
      App.filterBulan = bulanSet[bulanIni] ? bulanIni : 'all';

    if(App.filterBulan !== 'all' && !bulanSet[App.filterBulan]) App.filterBulan = 'all';

    var filtered = App.filterBulan === 'all' ? list : list.filter(function(x){
      return x.Tanggal && x.Tanggal.indexOf(App.filterBulan) === 0;

      bulanList.forEach(function(b){
        var p = b.split('-').map(Number);

              '<div><div class="tgl">' + escHtml(fmtTglPanjang(x.Tanggal)) + '</div>' +

      });

    if(bs) bs.addEventListener('click', function(){ bukaRekap(filtered, st, judulPeriode); });
