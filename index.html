<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayur App</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2F5233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sayur App">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#1B2E1C; --green-800:#243E27; --green-700:#2F5233;
  --green-500:#4A7A4E; --green-100:#E4EBDD;
  --rust-600:#BF4E30; --rust-700:#973B24;
  --paper:#F6F5EF; --card:#FFFEFB;
  --ink-900:#1F2019; --ink-700:#3F4038; --ink-600:#5B5C50; --ink-400:#8A8B7E;
  --line:#E5E2D6; --line-soft:#EFEDE2;
  --amber-600:#B8860B; --amber-100:#FFF4D6; --amber-700:#8A5D00;
  --blue-600:#2563A0; --blue-100:#DCEAF6;
  --fs-xs:11px; --fs-sm:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:28px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-full:999px;
  --shadow-md:0 2px 8px rgba(31,32,25,.06);
  color-scheme:light;
}
body.dark{
  --paper:#161A15; --card:#1F241E;
  --ink-900:#F2F0E9; --ink-700:#C9C7BD; --ink-600:#9B998F; --ink-400:#6E6C64;
  --line:#33382E; --line-soft:#252A21;
  --green-100:#26332A; --green-500:#6F9673;
  --blue-100:#1A2733;
  --amber-100:#2A2415; --amber-700:#C9B775;
  color-scheme:dark;
}
body.dark .topbar{background:#1F2A1F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--paper);color:var(--ink-900);
  font-family:'Work Sans',sans-serif;font-size:var(--fs-md);
  line-height:1.45;min-height:100vh;
  transition:background .2s, color .2s;
}
h1,h2,h3{font-family:'Zilla Slab',serif;margin:0;font-weight:700;letter-spacing:-.2px}

/* TOPBAR */
.topbar{
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px 11px;
  background:var(--green-700);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.topbar-brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.topbar-logo{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex:none;overflow:hidden;
}
.topbar-logo img{
  width:100%;height:100%;
  object-fit:cover;      /* ← cover, bukan contain */
  display:block;
}
.topbar h1{font-size:16px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:#fff}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.topbar-date{font-size:10.5px;color:#D9E3CE;white-space:nowrap;margin-right:4px}
.conn-dot{width:9px;height:9px;border-radius:50%;
  background:#7FAF54;flex:none;transition:background .2s;position:relative}
.conn-dot.pending{background:#E8B838}
.conn-dot.offline{background:#E85B38}
.conn-dot.failed{background:#D6402A}
.conn-dot.pending::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1px solid #E8B838;opacity:.6;
  animation:ping 1.6s ease-out infinite;
}
@keyframes ping{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.icon-btn{
  background:rgba(255,255,255,.12);border:none;color:#fff;
  width:30px;height:30px;border-radius:50%;font-size:15px;
  cursor:pointer;line-height:1;display:flex;
  align-items:center;justify-content:center;flex:none;
}
.icon-btn:active{background:rgba(255,255,255,.25)}

/* SCREENS */
.screen{display:none;padding:12px 12px 96px;max-width:520px;margin:0 auto}
.screen.active{display:block}
.section{margin-bottom:12px}

/* CONNECTION BANNER */
.conn-banner{
  display:none;padding:8px 12px;margin-bottom:10px;
  border-radius:var(--r-sm);font-size:11.5px;
  align-items:center;gap:8px;
  background:var(--amber-100);color:var(--amber-700);
}
.conn-banner.show{display:flex}
.conn-banner.offline{background:#FFE3DA;color:var(--rust-700)}
.conn-banner .ic{font-size:14px;flex-shrink:0}
.conn-banner .txt{flex:1;line-height:1.4}
.conn-banner .btn-sync{
  background:var(--card);border:1px solid currentColor;
  color:inherit;border-radius:var(--r-full);
  padding:4px 10px;font:600 11px 'Work Sans',sans-serif;
  cursor:pointer;flex-shrink:0;
}

/* HERO */
.hero{
  background:linear-gradient(150deg,var(--green-700),var(--green-900));
  color:#fff;border-radius:var(--r-lg);padding:18px 18px 15px;
  box-shadow:var(--shadow-md);margin-bottom:12px;
  position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;right:-55px;top:-60px;
  width:165px;height:165px;border-radius:50%;
  background:rgba(255,255,255,.045);pointer-events:none;
}
.hero-main{position:relative;z-index:1}
.hero-k{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
  opacity:.7;font-weight:600}
.hero-v{font-family:'Zilla Slab',serif;font-size:32px;font-weight:700;
  letter-spacing:-.9px;margin-top:2px;line-height:1.1}
.hero-pct{font-size:12px;font-weight:600;letter-spacing:.3px;margin-top:7px}
.hero-pct.aman{color:#B8E39B}
.hero-pct.hampir{color:#FFD97A}
.hero-pct.jauh{color:#FFB29E}
.hero.neg{background:linear-gradient(150deg,var(--rust-600),var(--rust-700))}
.flow{
  margin-top:15px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.14);
  display:grid;grid-template-columns:1fr 1fr;gap:0;
}
.flow-item{padding:0 12px}
.flow-item:first-child{padding-left:0;border-right:1px solid rgba(255,255,255,.1)}
.flow-item:last-child{padding-right:0}
.flow-k{font-size:9.5px;opacity:.65;text-transform:uppercase;
  letter-spacing:.7px;font-weight:600}
.flow-v{font-family:'Zilla Slab',serif;font-size:18px;font-weight:700;
  margin-top:3px;letter-spacing:-.35px}
.flow-sub{font-size:10.5px;opacity:.6;margin-top:4px;line-height:1.35}
.hero-empty{
  background:linear-gradient(150deg,#F0F7E8,#E4EBDD);
  color:var(--ink-900);border:1px dashed #B8CCA3;
  padding:20px 18px 18px;
}
body.dark .hero-empty{background:linear-gradient(150deg,#1E2818,#26332A)}
.hero-empty::after{display:none}
.hero-empty .hero-k{color:var(--green-700);opacity:1}
body.dark .hero-empty .hero-k{color:#B8E39B}
.hero-empty .hero-v{color:var(--ink-700);font-size:18px;line-height:1.4;
  font-weight:600;margin-top:8px;letter-spacing:-.3px}
.hero-empty-cta{display:flex;gap:8px;margin-top:16px}
.hero-empty-cta button{
  flex:1;padding:12px;border-radius:var(--r-sm);
  font:600 13.5px 'Work Sans',sans-serif;cursor:pointer;
  border:1px solid transparent;
}
.hero-empty-cta button.primary{background:var(--green-700);color:#fff}
.hero-empty-cta button.ghost{
  background:transparent;color:var(--green-700);
  border-color:var(--green-700);
}

/* BANNER HARI BOLONG */
.bolong-banner{
  background:linear-gradient(135deg,var(--amber-100),var(--card));
  border:1px solid #E8C87A;border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:12px;
}
body.dark .bolong-banner{background:linear-gradient(135deg,#2A2415,var(--card))}
.bolong-banner .bb-head{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.bolong-banner .bb-icon{font-size:18px}
.bolong-banner .bb-title{
  font-size:13px;font-weight:700;color:var(--amber-700);
}
.bolong-banner .bb-list{
  font-size:11.5px;color:var(--ink-600);margin-bottom:10px;line-height:1.5;
}
.bolong-banner .bb-list strong{color:var(--ink-900)}
.bolong-banner .bb-actions{
  display:flex;gap:8px;
}
.bolong-banner .bb-actions button{
  flex:1;padding:9px 12px;border-radius:var(--r-sm);
  font:600 12.5px 'Work Sans',sans-serif;cursor:pointer;
  border:none;
}
.bolong-banner .bb-actions .bb-primary{
  background:var(--green-700);color:#fff;
}
.bolong-banner .bb-actions .bb-ghost{
  background:var(--card);color:var(--amber-700);
  border:1.5px solid var(--amber-600) !important;
}

/* KARTU UANG */
.uang-stack{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;
  box-shadow:var(--shadow-md);margin-bottom:12px;
}
.saldo-zone{
  display:block;width:100%;padding:14px 16px 13px;
  background:none;border:none;text-align:left;
  cursor:pointer;font-family:inherit;color:inherit;
  transition:background .12s;
}
.saldo-zone:active{background:var(--paper)}
.saldo-k{font-size:10.5px;color:var(--ink-600);font-weight:600;
  text-transform:uppercase;letter-spacing:.7px}
.saldo-v{font-family:'Zilla Slab',serif;font-size:22px;font-weight:700;
  margin-top:4px;letter-spacing:-.5px;color:var(--ink-900)}
.saldo-sub{font-size:11px;color:var(--ink-600);margin-top:5px;
  display:flex;gap:12px;flex-wrap:wrap}
.saldo-sub .item{display:flex;align-items:center;gap:4px}
.saldo-sub .dot{width:6px;height:6px;border-radius:50%;flex:none}
.saldo-sub .dot.cash{background:var(--green-500)}
.saldo-sub .dot.qris{background:var(--blue-600)}
.debt-zone{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:11px 16px;
  background:linear-gradient(135deg,var(--amber-100),var(--card));
  border:none;border-top:1px solid #E8C87A;
  cursor:pointer;text-align:left;font-family:inherit;
  transition:background .12s;
}
.debt-icon{width:22px;height:22px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex:none}
body.dark .debt-icon{background:#2A2415}
.debt-body{min-width:0;flex:1}
.debt-title{display:block;font-size:12px;font-weight:700;
  color:var(--amber-700);margin-bottom:3px}
.debt-detail{display:block;font-size:11px;color:var(--ink-700);
  line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.debt-detail strong{font-family:'Zilla Slab',serif;font-weight:700;
  color:var(--amber-700)}
.debt-arrow{color:var(--amber-700);opacity:.55;font-size:18px;flex:none}

/* CHART */
.chart-card{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);padding:15px 15px 13px}
.chart-head{display:flex;justify-content:space-between;
  align-items:baseline;margin-bottom:4px}
.chart-head .title{font-family:'Zilla Slab',serif;font-size:16px;font-weight:700}
.chart-head .sub{font-size:10.5px;color:var(--ink-600)}
.chart-hero{display:flex;align-items:baseline;gap:6px;
  padding:6px 0 12px;margin-bottom:10px;
  border-bottom:1px dashed var(--line-soft)}
.chart-hero .k{font-size:11px;color:var(--ink-600);font-weight:600}
.chart-hero .v{font-family:'Zilla Slab',serif;font-size:19px;
  font-weight:700;color:var(--green-700);letter-spacing:-.4px}
.chart-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
  align-items:end;height:112px;margin-bottom:5px;padding:0 2px;
  border-bottom:1px solid var(--line-soft)}
.chart-col{display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;height:100%}
.bar-wrap{width:100%;height:100%;display:flex;align-items:flex-end;
  justify-content:center;gap:2px;padding:0 3px}
.bar{flex:1;border-radius:3px 3px 0 0;min-height:2px;max-width:13px}
.bar.omzet{background:#CBD6BE}
.bar.laba{background:var(--green-700)}
.chart-col.today .bar.omzet{background:#AFC398}
.chart-col.today .bar.laba{background:var(--green-900)}
.chart-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
  padding:5px 2px 0}
.chart-labels span{font-size:10px;color:var(--ink-600);
  text-align:center;font-weight:500}
.chart-labels span.today{color:var(--green-700);font-weight:700}
.chart-legend{display:flex;gap:15px;margin-top:12px;
  font-size:10.5px;color:var(--ink-600)}
.chart-legend .item{display:flex;align-items:center;gap:5px}
.chart-legend .dot{width:9px;height:9px;border-radius:2px}
.chart-legend .dot.omzet{background:#CBD6BE}
.chart-legend .dot.laba{background:var(--green-700)}
.chart-summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;
  margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
/* === Tooltip Grafik Batang === */
.chart-bars{position:relative;}
.chart-col{cursor:pointer;transition:opacity .12s;}
.chart-col:active{opacity:.7;}
.chart-tooltip{
  position:absolute;transform:translateX(-50%);
  background:var(--ink-900);color:var(--card);
  padding:8px 12px;border-radius:8px;
  font-size:11px;z-index:20;
  box-shadow:0 4px 14px rgba(0,0,0,.22);
  pointer-events:auto;min-width:150px;
  animation:fadeIn .15s;
}
.chart-tooltip::after{
  content:'';position:absolute;bottom:-5px;left:50%;
  transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--ink-900);
}
.chart-tooltip .ct-date{
  font-weight:700;margin-bottom:5px;font-size:11.5px;
  padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.15);
}
.chart-tooltip .ct-row{
  display:flex;justify-content:space-between;gap:12px;padding:2px 0;
}
.chart-tooltip .ct-row span{opacity:.75;}
.chart-tooltip .ct-row b{font-family:'Zilla Slab',serif;font-weight:700;}
body.dark .chart-tooltip{background:#E8E5DB;color:#1A1D17;}
body.dark .chart-tooltip::after{border-top-color:#E8E5DB;}
body.dark .chart-tooltip .ct-date{border-bottom-color:rgba(0,0,0,.15);}

/* Summary sub-text */
.summary-sub{
  font-size:9.5px;color:var(--ink-600);margin-top:2px;line-height:1.25;
}
.summary-v.warn{color:var(--rust-600) !important;}
.summary-item{background:var(--paper);border-radius:var(--r-sm);
  padding:9px 10px;min-height:56px}
.summary-k{font-size:9.5px;color:var(--ink-600);
  text-transform:uppercase;letter-spacing:.4px;font-weight:600;
  line-height:1.25}
.summary-v{font-family:'Zilla Slab',serif;font-size:15px;
  font-weight:700;margin-top:4px;color:var(--ink-900)}
.summary-v.positive{color:var(--green-700)}
.chart-empty{
  text-align:center;padding:30px 20px;color:var(--ink-400);
  font-size:13px;grid-column:1 / -1;line-height:1.5;
}
.chart-empty::before{
  content:'📊';display:block;font-size:32px;opacity:.35;margin-bottom:10px;
}

/* NAVBAR */
.navbar{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);background:var(--card);
  padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));
  position:fixed;bottom:0;left:0;right:0;
  max-width:520px;margin:0 auto;z-index:40;
}
.navbar button{
  background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  color:var(--ink-400);padding:6px 0;
  font-family:inherit;font-size:10px;font-weight:500;
  min-height:52px;position:relative;
}
.navbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbar button.active{color:var(--green-700)}
.navbar button.active span{font-weight:600}

/* MENU KEBAB */
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);
  z-index:60;display:none}
.menu-overlay.show{display:block}
.menu-panel{
  position:fixed;top:calc(56px + env(safe-area-inset-top,0px));
  right:12px;background:var(--card);
  border-radius:var(--r-md);
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  min-width:220px;z-index:61;padding:6px;
  display:none;border:1px solid var(--line);
}
.menu-panel.show{display:block}
.menu-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:var(--r-sm);
  font-size:14px;color:var(--ink-900);cursor:pointer;
  background:none;border:none;width:100%;text-align:left;
  font-family:inherit;
}
.menu-item:active{background:var(--green-100)}
.menu-item svg{width:16px;height:16px;stroke:currentColor;fill:none;
  stroke-width:1.8;flex-shrink:0}
.menu-item .label{flex:1}
.menu-item .switch{
  position:relative;width:36px;height:20px;
  background:var(--line);border-radius:20px;
  transition:background .2s;flex-shrink:0;
}
.menu-item .switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:16px;height:16px;background:#fff;border-radius:50%;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.menu-item .switch.on{background:var(--green-700)}
.menu-item .switch.on::after{transform:translateX(16px)}
.menu-divider{height:1px;background:var(--line-soft);margin:4px 6px}

/* PLACEHOLDER & TOAST */
.placeholder{text-align:center;padding:60px 20px;
  color:var(--ink-400);font-size:13px}
.placeholder .em{font-size:40px;opacity:.35;display:block;margin-bottom:12px}
.toast{position:fixed;left:50%;
  transform:translateX(-50%) translateY(10px);
  bottom:calc(90px + env(safe-area-inset-bottom,0px));
  background:var(--ink-900);color:var(--card);
  padding:10px 18px;border-radius:var(--r-full);
  font-size:12.5px;font-weight:500;opacity:0;
  transition:opacity .2s, transform .2s;
  pointer-events:none;z-index:200;
  max-width:calc(100% - 32px);text-align:center;
}
body.dark .toast{background:#E8E5DB;color:#1A1D17}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* BELANJA — sub-tab */
.subtabs-bel{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--card);border-bottom:1px solid var(--line);
  margin:-12px -12px 12px;
  position:sticky;top:calc(52px + env(safe-area-inset-top,0px));
  z-index:5;
}
.subtabs-bel button{
  padding:13px 6px 12px;background:none;border:none;
  font:600 12.5px 'Work Sans',sans-serif;color:var(--ink-600);
  cursor:pointer;position:relative;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.subtabs-bel button.active{color:var(--green-700)}
.subtabs-bel button.active::after{
  content:'';position:absolute;bottom:-1px;left:15%;right:15%;
  height:2.5px;background:var(--green-700);border-radius:2px 2px 0 0;
}
.subtabs-bel button .cnt{
  display:inline-block;margin-left:5px;padding:1px 6px;
  background:var(--line-soft);color:var(--ink-600);font-size:10px;
  border-radius:var(--r-full);font-weight:600;
}
.subtabs-bel button.active .cnt{background:var(--green-100);color:var(--green-700)}
.tab-bel{display:none}
.tab-bel.active{display:block}

/* BACKDATE BANNER */
.backdate-banner{
  background:linear-gradient(135deg,var(--amber-100),var(--card));
  border:1.5px solid var(--amber-600);border-radius:var(--r-sm);
  padding:9px 12px;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--amber-700);font-weight:600;
}
body.dark .backdate-banner{background:linear-gradient(135deg,#2A2415,var(--card))}
.backdate-banner .bd-icon{font-size:14px;flex-shrink:0}
.backdate-banner .bd-txt{flex:1;line-height:1.35}
.backdate-banner .bd-back{
  background:var(--card);border:1px solid var(--amber-600);
  color:var(--amber-700);border-radius:var(--r-full);
  padding:4px 10px;font:600 11px 'Work Sans',sans-serif;
  cursor:pointer;flex-shrink:0;
}

/* PESANAN BANNER */
.pesanan-banner{
  background:linear-gradient(135deg,var(--amber-100),var(--card));
  border:1px solid #E8C87A;border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:12px;
}
body.dark .pesanan-banner{background:linear-gradient(135deg,#2A2415,var(--card))}
.pb-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pb-title{font-size:12.5px;font-weight:700;color:var(--amber-700)}
.pb-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 11px;background:var(--card);
  border-radius:var(--r-sm);margin-top:6px;gap:8px;
}
.pb-item.overdue{border-left:3px solid var(--rust-600)}
.pb-info{min-width:0;flex:1}
.pb-nama{display:block;font-size:13px;font-weight:600;color:var(--ink-900)}
.pb-detail{display:block;font-size:10.5px;color:var(--ink-600);margin-top:1px}
.pb-detail.overdue{color:var(--rust-600);font-weight:600}
.pb-btn{
  padding:7px 14px;border:none;border-radius:var(--r-full);
  background:var(--green-700);color:#fff;
  font:600 12px 'Work Sans',sans-serif;cursor:pointer;flex-shrink:0;
}

/* BANNER PIUTANG PESANAN */
.banner-piutang{
  background:linear-gradient(135deg,#FFEDE5,var(--card));
  border:1px solid #E8BBA6;border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:12px;
}
body.dark .banner-piutang{background:linear-gradient(135deg,#3A1F18,var(--card))}
.banner-piutang .bp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.banner-piutang .bp-title{font-size:12.5px;font-weight:700;color:var(--rust-700)}
.banner-piutang .bp-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 11px;background:var(--card);
  border-radius:var(--r-sm);margin-top:6px;gap:8px;
  border-left:3px solid var(--rust-600);
}
.banner-piutang .bp-nama{font-size:13px;font-weight:600;color:var(--ink-900)}
.banner-piutang .bp-detail{font-size:10.5px;color:var(--ink-600);margin-top:1px}

/* BANNER BATAS AMAN */
.batas-banner{
  background:var(--green-100);border-radius:var(--r-sm);
  padding:9px 12px;margin-bottom:12px;font-size:11.5px;
  display:flex;justify-content:space-between;align-items:center;
}
body.dark .batas-banner{background:#26332A}
.batas-banner.hampir{background:var(--amber-100)}
body.dark .batas-banner.hampir{background:#2A2415}
.batas-banner.kikis{background:#FFE0D5}
body.dark .batas-banner.kikis{background:#2E1F14}
.batas-banner.minus{background:#FDD5C6}
body.dark .batas-banner.minus{background:#3A1F18}
.batas-banner .lbl{color:var(--ink-700)}
.batas-banner .amt{font-family:'Zilla Slab',serif;font-weight:700;font-size:13px}
.batas-banner.aman .amt{color:var(--green-700)}
.batas-banner.hampir .amt{color:var(--amber-700)}
.batas-banner.kikis .amt{color:var(--rust-600)}
.batas-banner.minus .amt{color:var(--rust-700)}
.batas-banner.toggle{cursor:pointer;user-select:none;gap:8px;
  position:relative;margin-bottom:30px;}
.banner-handle{position:absolute;left:50%;top:100%;transform:translateX(-50%);
  background:inherit;border-radius:0 0 12px 12px;
  display:flex;align-items:center;gap:5px;
  min-height:24px;padding:0 16px 1px;
  font:600 10.5px 'Work Sans',sans-serif;color:var(--ink-700);white-space:nowrap;}
.banner-handle .chev{width:14px;height:14px;stroke:var(--ink-700);fill:none;
  stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .2s;flex:none;}
.batas-banner.toggle.open .banner-handle .chev{transform:rotate(180deg);}

/* INFO PANEL */
.info-panel-bel{display:none;margin-bottom:12px}
.info-panel-bel.open{display:block}
.konteks{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);padding:10px 14px;margin-bottom:10px;
  display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;
}
.konteks .cell{min-width:0}
.konteks .cell .lbl{display:block;font-size:11px;color:var(--ink-600);line-height:1.2}
.konteks .cell .amt{display:block;font-family:'Zilla Slab',serif;
  font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap}
.konteks .cell.total .amt{color:var(--green-700)}
.konteks .cell.target .amt{color:var(--amber-700)}
.konteks .cell.minus .amt{color:var(--rust-600)}

/* BIAYA BELANJA CARD */
.biaya-card{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);padding:10px 14px 12px;margin-bottom:12px}
.biaya-head{display:flex;justify-content:space-between;
  align-items:baseline;margin-bottom:8px}
.biaya-head h2{margin:0;font-family:'Zilla Slab',serif;font-size:15px;
  font-weight:700;color:var(--ink-900);letter-spacing:-.2px}
.biaya-head .total{font-family:'Zilla Slab',serif;font-weight:700;
  font-size:14px;color:var(--rust-600)}
.biaya-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.biaya-col{min-width:0}
.biaya-row{display:flex;justify-content:space-between;
  align-items:center;margin-bottom:3px;min-height:20px}
.biaya-row .lbl{font-size:12px;font-weight:600;color:var(--ink-700)}
.biaya-row .set-default{background:none;border:none;color:var(--green-700);
  font:600 10.5px 'Work Sans',sans-serif;cursor:pointer;
  padding:2px 6px;margin-right:-6px;border-radius:var(--r-full)}
.biaya-body input{width:100%;min-width:0;height:38px;padding:0 11px;
  border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--paper);text-align:right;
  font:700 16px 'Zilla Slab',serif;color:var(--ink-900);
  font-family:'Zilla Slab',serif}
.biaya-body input:focus{outline:none;border-color:var(--green-700);
  background:var(--card)}
.sub-divider{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
.lain-bar{display:flex;justify-content:space-between;
  align-items:center;min-height:30px}
.sub-head{font-size:12px;font-weight:600;color:var(--ink-700)}
.lain-toggle{background:none;border:none;color:var(--green-700);
  font:600 12.5px 'Work Sans',sans-serif;cursor:pointer;
  padding:6px 0 6px 10px}
.lain-item-bel{display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--paper);border-radius:var(--r-sm);
  margin-top:4px;font-size:13px}
.lain-item-bel .nm{flex:1;font-weight:500;word-break:break-word}
.lain-item-bel .amt{font-family:'Zilla Slab',serif;font-weight:700}
.lain-item-bel .del{background:none;border:none;color:var(--ink-400);
  font-size:18px;padding:0 2px;cursor:pointer;line-height:1;flex-shrink:0}
.lain-add{display:none;gap:6px;margin-top:6px}
.lain-add.open{display:flex}
.lain-add input{height:38px;padding:0 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--paper);
  font:500 15px 'Work Sans',sans-serif;color:var(--ink-900);min-width:0;
  font-family:'Work Sans',sans-serif}
.lain-add input:focus{outline:none;border-color:var(--green-700);
  background:var(--card)}
.lain-add input.nm{flex:1}
.lain-add input.jml{width:96px;text-align:right;
  font-family:'Zilla Slab',serif;font-weight:600}
.lain-add button{padding:0 14px;border:none;border-radius:var(--r-sm);
  background:var(--green-700);color:#fff;
  font:600 15px 'Work Sans',sans-serif;cursor:pointer;flex-shrink:0}

/* SEARCH & CHECKLIST */
.ac-wrap-bel{position:relative;margin-bottom:12px}
.ac-input-bel{width:100%;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--card);
  font:400 15px 'Work Sans',sans-serif;color:var(--ink-900);
  font-family:'Work Sans',sans-serif}
.ac-input-bel:focus{outline:none;border-color:var(--green-700)}
.ac-drop-bel{position:absolute;top:100%;left:0;right:0;margin-top:2px;
  z-index:20;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);
  box-shadow:0 8px 30px rgba(31,32,25,.18);
  max-height:260px;overflow-y:auto;display:none}
.ac-drop-bel.show{display:block}
.ac-drop-bel .ac-item{padding:11px 14px;cursor:pointer;
  display:flex;justify-content:space-between;
  align-items:center;gap:8px;border-bottom:1px solid var(--line-soft);
  font-size:13.5px}
.ac-drop-bel .ac-item:active{background:var(--green-100)}
.ac-drop-bel .ac-nm{flex:1;min-width:0;font-weight:500;color:var(--ink-900)}
.ac-drop-bel .ac-nm .ac-sat{color:var(--ink-600);font-weight:400;font-size:11px}
.ac-drop-bel .ac-price{font-family:'Zilla Slab',serif;font-weight:600;
  font-size:13px;color:var(--blue-600);flex-shrink:0}
.ac-drop-bel .ac-empty{padding:12px 14px;font-size:12.5px;
  color:var(--ink-400);text-align:center}
.ac-new-btn-bel{padding:12px 14px;cursor:pointer;font-size:13px;
  font-weight:600;color:var(--green-700);background:var(--paper);
  border-top:1px dashed var(--line)}

/* CHECK ROW */
.checklist{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;margin-bottom:12px}
.check-row{padding:11px 12px;border-top:1px solid var(--line-soft)}
.check-row:first-child{border-top:none}
.check-row.checked{background:rgba(228,235,221,.35)}
body.dark .check-row.checked{background:rgba(38,51,42,.5)}
.check-row .r1{display:flex;align-items:flex-start;gap:10px}
.check-row .cb{width:24px;height:24px;border:1.8px solid var(--line);
  border-radius:6px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;background:var(--card);flex:none}
.check-row.checked .cb{background:var(--green-700);border-color:var(--green-700)}
.check-row .cb::after{content:'';width:6px;height:11px;
  border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.check-row.checked .cb::after{opacity:1}
.check-row .nm{flex:1;min-width:0;font-size:14px;font-weight:500;
  line-height:1.35;color:var(--ink-900);word-break:break-word;
  padding-top:2px;cursor:pointer}
.check-row .sub{flex:none;font:600 13.5px 'Zilla Slab',serif;
  color:var(--ink-900);text-align:right;white-space:nowrap;padding-top:3px}
.check-row:not(.checked) .sub{color:var(--ink-400)}
.check-row.checked .sub{color:var(--green-700)}
.check-row .r2{display:none;align-items:center;gap:8px;margin:10px 0 0 34px}
.check-row.checked .r2{display:flex}
.check-row .fld-bel{display:flex;align-items:center;gap:6px;
  height:40px;padding:0 10px;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;min-width:0}
.check-row .fld-bel.qty{width:104px;flex:none}
.check-row .fld-bel.harga{flex:1}
.check-row .fld-bel .u{font-size:11.5px;color:var(--ink-600);flex:none}
.check-row .fld-bel input{flex:1;min-width:0;width:100%;border:none;
  background:transparent;padding:0;text-align:right;
  font:600 16px 'Zilla Slab',serif;color:var(--ink-900);
  font-family:'Zilla Slab',serif}
.check-row .times{color:var(--ink-400);font-size:14px;flex:none}

/* FOOTER BAR */
.bar-bottom-bel{
  position:sticky;bottom:calc(67px + env(safe-area-inset-bottom,0px));
  z-index:30;background:var(--paper);
  padding:8px 16px;
  margin:10px -12px -12px;border-top:1px solid var(--line);
  box-shadow:0 -4px 12px rgba(31,32,25,.04);
}
.stat-row{display:flex;justify-content:space-between;
  align-items:baseline;padding:1px 0;font-size:12.5px;line-height:1.3}
.stat-row .lbl{color:var(--ink-600)}
.stat-row .amt{font-family:'Zilla Slab',serif;font-weight:700;font-size:14px}
.sum-final{display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding-top:4px;margin-top:3px;border-top:1px dashed var(--line)}
.sum-final .sum-l{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.sum-final .sum-l .lbl{font-size:12px;font-weight:700;color:var(--ink-900)}
.sum-final .sum-l .amt{font:700 18px 'Zilla Slab',serif;color:var(--green-700);
  white-space:nowrap}
.stat-row.total{padding-top:4px;margin-top:3px;
  border-top:1px dashed var(--line)}
.stat-row.total .lbl{font-weight:700;color:var(--ink-900);font-size:13.5px}
.stat-row.total .amt{font-size:17px;color:var(--green-700)}
.btn-ubah-saldo{background:none;border:none;color:var(--green-700);
  font:600 11px 'Work Sans',sans-serif;cursor:pointer;
  padding:1px 6px;margin-left:6px;border-radius:var(--r-full)}
.status-line{padding:6px 10px;border-radius:var(--r-sm);
  margin-top:6px;font-size:12.5px;line-height:1.3}
.status-line.aman{background:#E8F3D8;color:#3A6020}
body.dark .status-line.aman{background:#1E2818;color:#B8E39B}
.status-line.hampir{background:var(--amber-100);color:var(--amber-700)}
.status-line.kikis{background:var(--amber-100);color:var(--amber-700)}
.status-line.minus{background:#FFE3DA;color:var(--rust-700)}
.btn-siap-belanja{flex:none;width:auto;padding:11px 18px;border:none;
  border-radius:var(--r-sm);background:var(--green-700);color:#fff;
  font:600 14px 'Work Sans',sans-serif;cursor:pointer;margin-top:0}


/* KEYBOARD: sembunyikan footer + navbar saat mengetik di tab Rencana */
body.kb-rencana .bar-bottom-bel{display:none}
body.kb-rencana .navbar{display:none}

/* AKTUAL — item card */
.daftar-list{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;margin-bottom:12px}
.item-card{padding:10px 14px 9px;border-bottom:1px solid var(--line-soft)}
.item-card:last-child{border-bottom:none}
.line-1{display:flex;align-items:flex-start;gap:6px;margin-bottom:7px}
.line-1 .no{font-size:12px;color:var(--ink-400);font-weight:700;
  min-width:18px;flex-shrink:0;padding-top:1px}
.line-1 .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;
  line-height:1.3;color:var(--ink-900);word-break:break-word;cursor:pointer}
.line-1 .del{background:none;border:none;color:var(--ink-400);
  font-size:22px;width:30px;height:26px;margin:-3px -6px 0 0;
  cursor:pointer;line-height:1;flex-shrink:0}
.grid-3-bel{display:grid;
  grid-template-columns:minmax(0,.8fr) minmax(0,1.1fr) minmax(0,1.1fr);
  gap:6px}
.grid-3-bel .f{display:block;min-width:0}
.grid-3-bel .lbl{display:block;font-size:11px;color:var(--ink-600);
  font-weight:500;margin-bottom:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.grid-3-bel .fld-bel{display:flex;align-items:center;height:36px;
  padding:0 8px;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;min-width:0}
.grid-3-bel .fld-bel:focus-within{border-color:var(--green-700);background:var(--card)}
.grid-3-bel .f.jual .fld-bel{border-color:#B9D2E8;background:rgba(220,234,246,.4)}
body.dark .grid-3-bel .f.jual .fld-bel{background:rgba(26,39,51,.5)}
.grid-3-bel .fld-bel input{width:100%;min-width:0;border:none;
  background:transparent;padding:0;text-align:right;
  font:600 16px 'Zilla Slab',serif;color:var(--ink-900);
  font-family:'Zilla Slab',serif}
.line-2{display:flex;justify-content:space-between;
  align-items:baseline;padding-top:7px;font-size:11.5px;color:var(--ink-600)}
.line-2 .min-tag{font:700 12.5px 'Zilla Slab',serif;color:var(--rust-600)}
.line-2 .margin-tag{font:700 13.5px 'Zilla Slab',serif;color:var(--green-700)}
.line-2 .margin-tag.neg{color:var(--rust-600)}
.nanti-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.nanti-chip{flex:none;display:inline-flex;align-items:center;gap:7px;
  height:34px;padding:0 12px 0 8px;border:1px solid var(--line);
  border-radius:var(--r-full);background:var(--paper);
  color:var(--ink-600);cursor:pointer;
  font:600 12px 'Work Sans',sans-serif;white-space:nowrap}
.nanti-chip .sw{width:24px;height:14px;border-radius:14px;
  background:var(--line);position:relative;flex:none;transition:background .15s}
.nanti-chip .sw::after{content:'';position:absolute;top:2px;left:2px;
  width:10px;height:10px;border-radius:50%;background:#fff;
  transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.nanti-chip.on{background:var(--amber-100);border-color:var(--amber-600);color:var(--amber-700)}
.nanti-chip.on .sw{background:var(--amber-600)}
.nanti-chip.on .sw::after{transform:translateX(10px)}
.supplier-fld{flex:1;min-width:0;display:flex;align-items:center;
  height:34px;padding:0 10px;background:var(--paper);
  border:1px solid var(--amber-600);border-radius:8px}
.supplier-fld input{flex:1;min-width:0;width:100%;border:none;
  background:transparent;padding:0;
  font:500 15px 'Work Sans',sans-serif;color:var(--ink-900);
  font-family:'Work Sans',sans-serif}

/* PANEL RINCIAN ITEM */
.daftar-panel{
  padding:12px 14px;background:var(--paper);
  border-top:1px dashed var(--line);border-bottom:1px solid var(--line-soft);
  font-size:12px;margin:8px -14px -9px;
}
.item-card:last-child .daftar-panel{border-bottom:none;}
.daftar-panel .ttl{
  font-weight:700;font-size:12.5px;margin-bottom:8px;
  color:var(--ink-700);display:flex;justify-content:space-between;align-items:baseline;
}
.daftar-panel .ttl .qty-info{
  font-weight:400;font-size:11px;color:var(--ink-600);
  font-family:'Zilla Slab',serif;
}
.daftar-panel .line{
  display:flex;justify-content:space-between;padding:3px 0;font-size:12px;
}
.daftar-panel .line .lbl{color:var(--ink-600);}
.daftar-panel .line .amt{font-family:'Zilla Slab',serif;font-weight:600;}
.daftar-panel .line.neg .amt{color:var(--rust-600);}
.daftar-panel .line.total{
  padding-top:8px;margin-top:6px;border-top:1px dashed var(--line);
}
.daftar-panel .line.total .lbl{font-weight:600;color:var(--ink-900);}
.daftar-panel .line.total .amt{color:var(--green-700);font-size:14px;font-weight:700;}
.daftar-panel .line.total.neg .amt{color:var(--rust-600);}

.section-divider{font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;
  color:var(--amber-700);margin:6px 2px 8px;padding:0 2px}
.section-divider.saved{color:var(--ink-600)}
.saved-badge{display:inline-block;margin-left:6px;padding:1px 7px;
  border-radius:var(--r-full);background:var(--green-100);
  color:var(--green-700);font:700 9.5px 'Work Sans',sans-serif;
  letter-spacing:.3px;vertical-align:middle}
.draft-badge{display:inline-block;margin-left:6px;padding:1px 7px;
  border-radius:var(--r-full);background:var(--amber-100);
  color:var(--amber-700);font:700 9.5px 'Work Sans',sans-serif;
  letter-spacing:.3px;vertical-align:middle}
.hutang-badge{display:inline-block;margin-left:6px;padding:1px 7px;
  border-radius:var(--r-full);background:var(--amber-100);
  color:var(--amber-700);font:700 9.5px 'Work Sans',sans-serif;
  letter-spacing:.3px;vertical-align:middle}

/* RINGKASAN */
.ringkasan{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px}
.ringkasan .row{display:flex;justify-content:space-between;
  align-items:baseline;padding:4px 0;font-size:12.5px}
.ringkasan .row .lbl{color:var(--ink-600)}
.ringkasan .row .amt{font-family:'Zilla Slab',serif;font-weight:700;font-size:14px}
.bar-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar-buttons button{padding:12px;border-radius:var(--r-sm);
  font:600 13px 'Work Sans',sans-serif;cursor:pointer;border:none;
  display:flex;align-items:center;justify-content:center;gap:6px}
.btn-share-beli{background:var(--card);color:var(--ink-700);
  border:1.5px solid var(--ink-700) !important}
body.dark .btn-share-beli{color:var(--ink-900);border-color:var(--ink-900) !important}
.btn-share-jual{background:var(--card);color:var(--blue-600);
  border:1.5px solid var(--blue-600) !important}
.btn-simpan-full{grid-column:span 2;background:var(--green-700);
  color:#fff;padding:13px !important;font-size:14px !important;margin-top:2px}
.bar-buttons button svg{width:14px;height:14px;stroke:currentColor;
  fill:none;stroke-width:2}
.daftar-empty{text-align:center;padding:36px 20px;
  color:var(--ink-400);font-size:13px;background:var(--card);
  border:1px dashed var(--line);border-radius:var(--r-md);margin-bottom:12px}
.loading-bel{text-align:center;padding:40px 20px;

/* PESANAN */
.pesanan-actions{display:flex;gap:8px;margin-bottom:12px}
.btn-pesanan-baru{
  width:100%;padding:11px 14px;background:var(--green-700);color:#fff;
  border:none;border-radius:var(--r-sm);
  font:600 13px 'Work Sans',sans-serif;cursor:pointer;
}
.order-card{
  background:var(--card);border:1px solid var(--line);

}
.order-card.done{opacity:.55;background:var(--paper)}
.order-card.overdue{

}

.order-head{display:flex;justify-content:space-between;align-items:flex-start;

.order-name{font-size:15px;font-weight:700;color:var(--ink-900);

.order-meta{

}
.order-meta .meta-item{display:flex;align-items:center;gap:3px}
.order-meta svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.order-badge{

}
.order-badge.perlu_belanja{background:var(--amber-100);color:var(--amber-700)}
.order-badge.siap_serah{background:var(--blue-100);color:var(--blue-600)}
.order-badge.belum_lunas{background:#FFE3DA;color:var(--rust-700)}
.order-badge.selesai{background:var(--green-100);color:var(--green-700)}
.order-ket{
  font-size:11.5px;color:var(--ink-700);margin-top:6px;

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.order-summary{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:12.5px;color:var(--ink-600);padding-top:9px;
  border-top:1px dashed var(--line-soft);margin-top:9px;
}
.order-summary .amount{
  font-family:'Zilla Slab',serif;font-size:15px;font-weight:700;color:var(--ink-900);
}
.order-summary .amount.paid{color:var(--green-700)}
.section-head-pesanan{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;
  font-weight:700;color:var(--ink-400);margin:16px 2px 8px;
  display:flex;justify-content:space-between;align-items:center;
}
.riwayat-toggle{
  width:100%;padding:11px 14px;background:var(--card);
  border:1px dashed var(--line);border-radius:var(--r-md);
  color:var(--ink-600);font:600 12.5px 'Work Sans',sans-serif;

}
.riwayat-toggle.open{background:var(--line-soft);border-style:solid}
.riwayat-toggle .cnt{
  display:inline-block;padding:1px 8px;background:var(--line-soft);

}
.riwayat-toggle .arrow{font-size:11px;color:var(--ink-400);transition:transform .15s}
.riwayat-toggle.open .arrow{transform:rotate(180deg)}
.empty-box{
  text-align:center;padding:36px 20px;color:var(--ink-400);
  font-size:13px;background:var(--card);
  border:1px dashed var(--line);border-radius:var(--r-md);
}

/* Detail pesanan */
.detail-head-pesanan{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:12px;
}
.btn-back-pesanan{
  width:34px;height:34px;border-radius:50%;

}
.btn-back-pesanan svg{width:18px;height:18px;stroke:currentColor;
  fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.detail-title-pesanan{
  flex:1;min-width:0;font-size:15px;font-weight:700;font-family:'Zilla Slab',serif;
}
.detail-sub-pesanan{font-size:11px;color:var(--ink-600);margin-top:1px}
.pemesan-card{
  background:var(--card);border:1px solid var(--line);

}
.pemesan-card .row{

}
.pemesan-card .row .icn{

}
.pemesan-card .row .lbl{color:var(--ink-600);width:70px;flex-shrink:0}
.pemesan-card .row .val{
  flex:1;color:var(--ink-900);font-weight:500;word-break:break-word;line-height:1.4;
}
.pemesan-card .row .val.ket{
  padding:6px 9px;background:var(--paper);border-radius:6px;
  border-left:2px solid var(--amber-600);font-weight:400;font-size:12px;line-height:1.5;
}
.btn-edit-info{
  position:absolute;top:10px;right:12px;
  background:none;border:none;color:var(--ink-400);font-size:14px;
  cursor:pointer;padding:4px 8px;
}
.status-card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px;
}
.status-card.done{

}
.status-card .row{
  display:flex;justify-content:space-between;align-items:baseline;

}

.status-card .row .amt{font-family:'Zilla Slab',serif;font-weight:700;font-size:14px}

.status-card .row .amt.pos{color:var(--green-700)}
.status-card .row.total{

}
.status-card .row.total .lbl{font-weight:600;color:var(--ink-900);font-size:13px}
.status-card .row.total .amt{font-size:16px}
.item-list-pesanan{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;margin-bottom:12px;
}
.item-row-pesanan{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft);
}
.item-row-pesanan:last-child{border-bottom:none}
.item-body-pesanan{flex:1;min-width:0}
.item-name-pesanan{font-size:13.5px;font-weight:600;color:var(--ink-900)}
.item-detail-pesanan{
  font-size:11px;color:var(--ink-600);margin-top:2px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.item-detail-pesanan .price-edit{
  color:var(--green-700);text-decoration:underline;cursor:pointer;font-weight:600;
}
.item-subtotal-pesanan{
  font-family:'Zilla Slab',serif;font-weight:700;font-size:13.5px;
  color:var(--ink-900);flex-shrink:0;
}
.item-del-pesanan{
  background:none;border:none;color:var(--ink-400);
  font-size:16px;padding:0 4px;cursor:pointer;line-height:1;flex-shrink:0;
}
.btn-add-item{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:11px;background:var(--card);
  border:1.5px dashed var(--line);border-radius:var(--r-md);
  color:var(--green-700);font:600 13px 'Work Sans',sans-serif;
  cursor:pointer;margin-bottom:12px;
}
.btn-add-item::before{content:'+';font-size:15px;font-weight:700;line-height:1}
.payment-history{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;
}
.payment-title{
  font-size:11px;font-weight:700;color:var(--ink-600);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;
}
.payment-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:5px 0;font-size:12.5px;
}
.payment-row:not(:last-child){border-bottom:1px solid var(--line-soft)}
.payment-row .lbl{color:var(--ink-600)}
.payment-row .amt{font-family:'Zilla Slab',serif;font-weight:700;
  font-size:13.5px;color:var(--green-700)}
.payment-empty{font-size:12px;color:var(--ink-400);text-align:center;padding:8px 0}
.btn-selesai-pesanan{
  width:100%;padding:13px;border-radius:var(--r-sm);border:none;
  font:700 13.5px 'Work Sans',sans-serif;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;
}
.btn-selesai-pesanan.primary{background:var(--green-700);color:#fff}
.detail-actions-pesanan{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;
}
.detail-actions-pesanan button{
  padding:11px;border-radius:var(--r-sm);border:none;
  font:600 13px 'Work Sans',sans-serif;cursor:pointer;
}
.btn-pay-pesanan{background:var(--green-700);color:#fff}
.btn-pay-pesanan:disabled{opacity:.5;cursor:not-allowed}
.btn-nota-pesanan{
  background:var(--card);border:1.5px solid var(--green-700);color:var(--green-700);
}
.btn-delete-pesanan{
  background:var(--card);border:1px solid var(--line);
  color:var(--rust-600);width:100%;padding:11px;
  border-radius:var(--r-sm);font:600 13px 'Work Sans',sans-serif;cursor:pointer;
}

/* Modal generik */
.modal-ov-pes{
  position:fixed;inset:0;background:rgba(31,32,25,.55);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;animation:fadeIn .15s;
}
.modal-ov-pes.center{align-items:center;padding:20px}
.modal-box-pes{
  background:var(--card);border-radius:var(--r-lg);
  max-width:440px;width:100%;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
  animation:modalIn .18s ease-out;
}
.modal-box-pes.wide{max-width:520px}
.modal-head-pes{
  padding:16px 18px 10px;display:flex;align-items:center;
  gap:10px;border-bottom:1px solid var(--line-soft);
}
.modal-head-pes h3{
  margin:0;font-family:'Zilla Slab',serif;font-size:15px;
  font-weight:700;flex:1;text-align:left;
}
.modal-body-pes{
  padding:14px 18px;overflow-y:auto;flex:1;
}
.modal-actions-pes{
  padding:10px 16px 14px;display:flex;gap:8px;
  border-top:1px solid var(--line-soft);
}
.modal-actions-pes button{
  flex:1;padding:11px;border-radius:var(--r-sm);
  border:none;font:600 13.5px 'Work Sans',sans-serif;cursor:pointer;
}
.modal-actions-pes .btn-cancel{background:var(--line-soft);color:var(--ink-700)}
.modal-actions-pes .btn-confirm{background:var(--green-700);color:#fff}
.field-pes{margin-bottom:12px}
.field-pes label{
  display:block;font-size:11.5px;color:var(--ink-600);
  font-weight:500;margin-bottom:5px;
}
.field-pes input, .field-pes select, .field-pes textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--paper);
  font:500 15px 'Work Sans',sans-serif;color:var(--ink-900);
  font-family:'Work Sans',sans-serif;
}
.field-pes textarea{resize:vertical;min-height:64px;line-height:1.5}
.field-pes input:focus, .field-pes select:focus, .field-pes textarea:focus{
  outline:none;border-color:var(--green-700);background:var(--card);
}
.field-pes input.money{
  font-family:'Zilla Slab',serif;font-weight:700;text-align:right;font-size:16px;
}
.field-row-pes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nota-preview-pes{
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:14px 16px;
  font-family:'Courier New',monospace;font-size:11.5px;
  line-height:1.6;color:var(--ink-900);
  white-space:pre-wrap;max-height:300px;overflow-y:auto;
}
.kirim-opsi-pes{display:flex;gap:8px;margin-bottom:10px}
.kirim-opsi-pes button{
  flex:1;padding:12px 8px;border:1.5px solid var(--line);
  border-radius:var(--r-sm);background:var(--card);
  font:600 13px 'Work Sans',sans-serif;color:var(--ink-700);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.kirim-opsi-pes button .icn{font-size:20px}
.opsi-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;background:var(--paper);border-radius:var(--r-sm);
  margin-bottom:8px;cursor:pointer;
}
.opsi-row .lbl{font-size:12px;color:var(--ink-700);
  display:flex;flex-direction:column;gap:2px;}
.opsi-row .lbl small{font-size:10.5px;color:var(--ink-600);font-weight:400;}
.opsi-row .sw{width:38px;height:22px;background:var(--line);
  border-radius:22px;position:relative;flex-shrink:0;transition:background .2s;}
.opsi-row .sw::after{content:'';position:absolute;top:2px;left:2px;
  width:18px;height:18px;background:#fff;border-radius:50%;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.opsi-row.on .sw{background:var(--green-700);}
.opsi-row.on .sw::after{transform:translateX(16px);}
.pm-info{
  display:none;font-size:11.5px;margin-top:6px;
  padding:7px 10px;border-radius:6px;line-height:1.4;
}
.pm-info.show{display:block;}
.pm-info.ok{background:var(--green-100);color:var(--green-700);}
.pm-info.warn{background:var(--amber-100);color:var(--amber-700);}
.pm-info.info{background:var(--blue-100);color:var(--blue-600);}
.pm-info.danger{background:#FFE0D5;color:var(--rust-700);}
.ac-wrap-pes{position:relative}
.ac-wrap-pes .ac-input-pes{
  width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--paper);
  font:500 15px 'Work Sans',sans-serif;color:var(--ink-900);
  font-family:'Work Sans',sans-serif;
}
.ac-drop-pes{
  position:absolute;top:100%;left:0;right:0;margin-top:2px;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-sm);box-shadow:0 8px 30px rgba(31,32,25,.18);
  max-height:200px;overflow-y:auto;z-index:20;display:none;
}
.ac-drop-pes.show{display:block}
.ac-item-pes{
  padding:10px 12px;cursor:pointer;display:flex;
  justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1px solid var(--line-soft);font-size:13.5px;
}
.ac-item-pes .ac-nm{flex:1;min-width:0;font-weight:500}
.ac-item-pes .ac-nm .ac-sat{font-weight:400;color:var(--ink-600);font-size:11px;}
.ac-item-pes .ac-price{

}
.ac-empty-pes{padding:11px 12px;font-size:12.5px;
  color:var(--ink-400);text-align:center}
.bayar-info-box{
  background:var(--paper);border-radius:var(--r-sm);
  padding:10px 12px;margin-bottom:14px;font-size:12.5px;
}
.bayar-info-box .row{

}
.bayar-info-box .row .lbl{color:var(--ink-600)}
.bayar-info-box .row .amt{font-family:'Zilla Slab',serif;font-weight:700;}
.bayar-info-box .row.total{

}
.btn-lunas-cepat{
  width:100%;padding:14px;border-radius:8px;border:none;

  font:700 15px 'Work Sans',sans-serif;cursor:pointer;margin-bottom:14px;
}
.divider-atau{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.divider-atau .line{flex:1;height:1px;background:var(--line)}
.divider-atau .txt{
  font-size:10.5px;color:var(--ink-400);
  text-transform:uppercase;letter-spacing:.5px;font-weight:600;
}

/* TUTUP HARI */
.tutup-date-field{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 2px}
.tutup-date-field label{font-size:11px;color:var(--ink-600);font-weight:600;
  flex-shrink:0;text-transform:uppercase;letter-spacing:.4px}

.status-badge-tutup .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tutup-card{background:var(--card);border:1px solid var(--line);

.tutup-card-head .total.green{color:var(--green-700)}
.tutup-card-head .total.rust{color:var(--rust-600)}
.tutup-row{display:flex;align-items:center;gap:8px;padding:8px 0;

.tutup-row:last-child{border-bottom:none}
.tutup-row .lbl{flex:1;min-width:0;font-size:12.5px;

.tutup-row .money-in .rp{font-family:'Zilla Slab',serif;

.tutup-row .money-in input{flex:1;min-width:0;border:none;

.tutup-row .amt-display{font-family:'Zilla Slab',serif;

.tutup-row .amt-display.muted{color:var(--ink-600);font-size:13px}
.group-label-tutup{display:flex;justify-content:space-between;

  font-weight:700;color:var(--ink-400)}
.group-label-tutup .plus{color:var(--green-700);

.info-tiny-tutup{font-size:10px;color:var(--ink-600);

.tutup-list-item{display:flex;align-items:center;gap:8px;
  padding:7px 10px;background:var(--paper);border-radius:var(--r-sm);
  margin-top:4px;font-size:12.5px;min-width:0}
.tutup-list-item .nm{flex:1;min-width:0;font-weight:500;
  word-break:break-word;line-height:1.3}
.tutup-list-item .amt{font-family:'Zilla Slab',serif;
  font-weight:700;flex-shrink:0;white-space:nowrap}

/* LAPORAN */

  .print-modal{
    position:absolute !important;inset:0 !important;background:#fff !important;

(function(){

     Format: [nama, qty acuan, modal (harga beli/satuan), harga jual]
     Dipakai sebagai acuan selama server/kemarin belum punya data. */

    ['Wortel Lokal',10,9000,14000],['Daun Bawang',8,13000,17000],['Seledri',2,30000,39000],
